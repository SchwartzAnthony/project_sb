<title>Sturmball Workbench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f4f1e8; --card:#fffdf7; --raise:#faf7ee;
  --ink:#1b2027; --dim:#6d7684; --faint:#9aa2ae;
  --line:#ddd5c4; --hair:#e8e2d5;
  --accent:#a95c14; --accent-soft:#f0e2cf;
  --pitch:#3d6a45; --pitch-soft:#e0eade; --warn:#a33a23; --warn-soft:#f4ddd6;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12151a; --card:#191d24; --raise:#1f242d;
  --ink:#e4e8ef; --dim:#8a93a2; --faint:#646d7b;
  --line:#2b323d; --hair:#232932;
  --accent:#e0a04a; --accent-soft:#3a2d18;
  --pitch:#6aa374; --pitch-soft:#1d2c21; --warn:#e0765c; --warn-soft:#331d17;
}}
:root[data-theme="dark"]{
  --paper:#12151a; --card:#191d24; --raise:#1f242d;
  --ink:#e4e8ef; --dim:#8a93a2; --faint:#646d7b;
  --line:#2b323d; --hair:#232932;
  --accent:#e0a04a; --accent-soft:#3a2d18;
  --pitch:#6aa374; --pitch-soft:#1d2c21; --warn:#e0765c; --warn-soft:#331d17;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.lbl{font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;font-weight:600}

/* ---- shell ---- */
#shell{display:flex;flex-direction:column;height:100%}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;
  flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
#bar h1{font-family:var(--disp);font-size:24px;font-weight:700;letter-spacing:.03em;margin:0;text-transform:uppercase}
#bar h1 span{color:var(--accent)}
.grow{flex:1 1 auto;min-width:8px}
.btn{font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-weight:600;font-size:13px;
  background:var(--raise);border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.key{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.key:hover{filter:brightness(1.1);color:var(--card)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:default}

#body{flex:1 1 auto;display:flex;min-height:0}

/* ---- file rail ---- */
#rail{width:236px;flex:0 0 236px;background:var(--card);border-right:1px solid var(--line);overflow:auto;padding:12px 0 24px}
.railhead{font-size:11px;color:var(--faint);padding:6px 16px 8px}
.fitem{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:0;
  border-left:3px solid transparent;padding:7px 14px 7px 13px;cursor:pointer}
.fitem:hover{background:var(--raise)}
.fitem.on{background:var(--raise);border-left-color:var(--accent)}
.fitem .fn{flex:1 1 auto;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem.on .fn{color:var(--accent)}
.fitem .fc{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:0 0 auto}

/* ---- main ---- */
#main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
#head{padding:14px 18px 10px;border-bottom:1px solid var(--hair);background:var(--paper)}
#head h2{font-family:var(--disp);font-size:26px;margin:0;text-transform:uppercase;letter-spacing:.03em}
#what{color:var(--dim);font-size:13px;margin-top:2px;max-width:70ch}
#tools{display:flex;gap:7px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--hair)}
#wrap{flex:1 1 auto;overflow:auto;padding:0 0 30px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--line);
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-size:12px;font-weight:600;
  text-align:left;padding:8px 9px;white-space:nowrap;color:var(--dim)}
th.req{color:var(--accent)}
td{border-bottom:1px solid var(--hair);padding:0;vertical-align:top}
tr:hover td{background:var(--raise)}
td.rn{font-family:var(--mono);font-size:11px;color:var(--faint);padding:7px 8px;text-align:right;
  background:var(--card);border-right:1px solid var(--hair);font-variant-numeric:tabular-nums;white-space:nowrap}
td input,td select,td textarea{width:100%;min-width:90px;background:transparent;border:0;padding:7px 9px;
  font-family:var(--mono);font-size:12.5px;border-radius:0}
td textarea{resize:vertical;min-height:32px;height:32px;line-height:1.4;overflow:auto}
td input:focus,td select:focus,td textarea:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--card)}
td.bad input,td.bad select{background:var(--warn-soft);box-shadow:inset 3px 0 0 var(--warn)}
td select{cursor:pointer;-webkit-appearance:none;appearance:none}
.rowtools{display:flex;gap:3px;padding:5px 7px;background:var(--card);border-right:1px solid var(--hair)}
.ico{background:none;border:1px solid transparent;color:var(--faint);cursor:pointer;border-radius:3px;
  width:22px;height:22px;line-height:1;font-size:13px;padding:0}
.ico:hover{border-color:var(--line);color:var(--accent)}
.ico.del:hover{color:var(--warn)}

/* ---- problems drawer ---- */
#probs{border-top:2px solid var(--line);background:var(--card);max-height:30vh;display:flex;flex-direction:column}
#probhead{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
#probhead .lbl{font-size:14px}
#problist{overflow:auto;padding:0 18px 14px}
.prob{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--hair);font-size:13px;align-items:flex-start}
.prob b{font-family:var(--mono);font-size:11px;color:var(--faint);flex:0 0 auto;padding-top:2px}
.prob .fix{color:var(--dim);display:block;margin-top:2px;font-size:12.5px}
.tag{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:600;
  padding:1px 7px;border-radius:2px;flex:0 0 auto}
.tag.err{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--pitch-soft);color:var(--pitch)}
.jump{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;font-size:12.5px}

/* ---- panels ---- */
#veil{position:fixed;inset:0;background:rgba(10,12,16,.62);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:5px;max-width:720px;width:100%;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.panel header{padding:16px 20px 10px;border-bottom:1px solid var(--hair)}
.panel header h3{font-family:var(--disp);font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.03em}
.panel .in{padding:16px 20px;overflow:auto}
.panel footer{padding:12px 20px;border-top:1px solid var(--hair);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea.csv{width:100%;height:270px;font-family:var(--mono);font-size:12px;background:var(--paper);
  border:1px solid var(--line);border-radius:3px;padding:10px;line-height:1.5}
.drop{border:2px dashed var(--line);border-radius:5px;padding:26px;text-align:center;color:var(--dim);margin-bottom:14px}
.drop.hot{border-color:var(--accent);background:var(--accent-soft)}
.note{font-size:12.5px;color:var(--dim);margin:10px 0 0}
.kbd{font-family:var(--mono);font-size:11.5px;background:var(--raise);border:1px solid var(--line);
  border-radius:3px;padding:1px 5px}
.empty{padding:50px 24px;text-align:center;color:var(--dim);max-width:60ch;margin:0 auto}
.empty h3{font-family:var(--disp);font-size:28px;text-transform:uppercase;margin:0 0 8px;color:var(--ink)}
.help{font-size:12.5px;color:var(--dim);padding:8px 18px;background:var(--raise);border-bottom:1px solid var(--hair)}
.help code{font-family:var(--mono);font-size:11.5px;color:var(--accent)}

@media (max-width:760px){
  #body{flex-direction:column}
  #rail{width:auto;flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}
  .railhead{display:none}
  .fitem{width:auto;flex:0 0 auto;border-left:0;border-bottom:3px solid transparent;border-radius:3px;padding:6px 10px}
  .fitem.on{border-left:0;border-bottom-color:var(--accent)}
  #bar h1{font-size:19px}
}
