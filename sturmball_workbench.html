<title>Sturmball Workbench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f4f1e8; --card:#fffdf7; --raise:#faf7ee;
  --ink:#1b2027; --dim:#6d7684; --faint:#9aa2ae;
  --line:#ddd5c4; --hair:#e8e2d5;
  --accent:#a95c14; --accent-soft:#f0e2cf;
  --pitch:#3d6a45; --pitch-soft:#e0eade; --warn:#a33a23; --warn-soft:#f4ddd6;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12151a; --card:#191d24; --raise:#1f242d;
  --ink:#e4e8ef; --dim:#8a93a2; --faint:#646d7b;
  --line:#2b323d; --hair:#232932;
  --accent:#e0a04a; --accent-soft:#3a2d18;
  --pitch:#6aa374; --pitch-soft:#1d2c21; --warn:#e0765c; --warn-soft:#331d17;
}}
:root[data-theme="dark"]{
  --paper:#12151a; --card:#191d24; --raise:#1f242d;
  --ink:#e4e8ef; --dim:#8a93a2; --faint:#646d7b;
  --line:#2b323d; --hair:#232932;
  --accent:#e0a04a; --accent-soft:#3a2d18;
  --pitch:#6aa374; --pitch-soft:#1d2c21; --warn:#e0765c; --warn-soft:#331d17;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.lbl{font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;font-weight:600}

/* ---- shell ---- */
#shell{display:flex;flex-direction:column;height:100%}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;
  flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
#bar h1{font-family:var(--disp);font-size:24px;font-weight:700;letter-spacing:.03em;margin:0;text-transform:uppercase}
#bar h1 span{color:var(--accent)}
.grow{flex:1 1 auto;min-width:8px}
.btn{font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-weight:600;font-size:13px;
  background:var(--raise);border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.key{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.key:hover{filter:brightness(1.1);color:var(--card)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:default}

#body{flex:1 1 auto;display:flex;min-height:0}

/* ---- file rail ---- */
#rail{width:236px;flex:0 0 236px;background:var(--card);border-right:1px solid var(--line);overflow:auto;padding:12px 0 24px}
.railhead{font-size:11px;color:var(--faint);padding:6px 16px 8px}
.fitem{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:0;
  border-left:3px solid transparent;padding:7px 14px 7px 13px;cursor:pointer}
.fitem:hover{background:var(--raise)}
.fitem.on{background:var(--raise);border-left-color:var(--accent)}
.fitem .fn{flex:1 1 auto;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem.on .fn{color:var(--accent)}
.fitem .fc{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:0 0 auto}

/* ---- main ---- */
#main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
#head{padding:14px 18px 10px;border-bottom:1px solid var(--hair);background:var(--paper)}
#head h2{font-family:var(--disp);font-size:26px;margin:0;text-transform:uppercase;letter-spacing:.03em}
#what{color:var(--dim);font-size:13px;margin-top:2px;max-width:70ch}
#tools{display:flex;gap:7px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--hair)}
#wrap{flex:1 1 auto;overflow:auto;padding:0 0 30px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--line);
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-size:12px;font-weight:600;
  text-align:left;padding:8px 9px;white-space:nowrap;color:var(--dim)}
th.req{color:var(--accent)}
td{border-bottom:1px solid var(--hair);padding:0;vertical-align:top}
tr:hover td{background:var(--raise)}
td.rn{font-family:var(--mono);font-size:11px;color:var(--faint);padding:7px 8px;text-align:right;
  background:var(--card);border-right:1px solid var(--hair);font-variant-numeric:tabular-nums;white-space:nowrap}
td input,td select,td textarea{width:100%;min-width:90px;background:transparent;border:0;padding:7px 9px;
  font-family:var(--mono);font-size:12.5px;border-radius:0}
td textarea{resize:vertical;min-height:32px;height:32px;line-height:1.4;overflow:auto}
td input:focus,td select:focus,td textarea:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--card)}
td.bad input,td.bad select{background:var(--warn-soft);box-shadow:inset 3px 0 0 var(--warn)}
td select{cursor:pointer;-webkit-appearance:none;appearance:none}
.rowtools{display:flex;gap:3px;padding:5px 7px;background:var(--card);border-right:1px solid var(--hair)}
.ico{background:none;border:1px solid transparent;color:var(--faint);cursor:pointer;border-radius:3px;
  width:22px;height:22px;line-height:1;font-size:13px;padding:0}
.ico:hover{border-color:var(--line);color:var(--accent)}
.ico.del:hover{color:var(--warn)}

/* ---- problems drawer ---- */
#probs{border-top:2px solid var(--line);background:var(--card);max-height:30vh;display:flex;flex-direction:column}
#probhead{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
#probhead .lbl{font-size:14px}
#problist{overflow:auto;padding:0 18px 14px}
.prob{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--hair);font-size:13px;align-items:flex-start}
.prob b{font-family:var(--mono);font-size:11px;color:var(--faint);flex:0 0 auto;padding-top:2px}
.prob .fix{color:var(--dim);display:block;margin-top:2px;font-size:12.5px}
.tag{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:600;
  padding:1px 7px;border-radius:2px;flex:0 0 auto}
.tag.err{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--pitch-soft);color:var(--pitch)}
.jump{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;font-size:12.5px}

/* ---- panels ---- */
#veil{position:fixed;inset:0;background:rgba(10,12,16,.62);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:5px;max-width:720px;width:100%;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.panel header{padding:16px 20px 10px;border-bottom:1px solid var(--hair)}
.panel header h3{font-family:var(--disp);font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.03em}
.panel .in{padding:16px 20px;overflow:auto}
.panel footer{padding:12px 20px;border-top:1px solid var(--hair);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea.csv{width:100%;height:270px;font-family:var(--mono);font-size:12px;background:var(--paper);
  border:1px solid var(--line);border-radius:3px;padding:10px;line-height:1.5}
.drop{border:2px dashed var(--line);border-radius:5px;padding:26px;text-align:center;color:var(--dim);margin-bottom:14px}
.drop.hot{border-color:var(--accent);background:var(--accent-soft)}
.note{font-size:12.5px;color:var(--dim);margin:10px 0 0}
.kbd{font-family:var(--mono);font-size:11.5px;background:var(--raise);border:1px solid var(--line);
  border-radius:3px;padding:1px 5px}
.empty{padding:50px 24px;text-align:center;color:var(--dim);max-width:60ch;margin:0 auto}
.empty h3{font-family:var(--disp);font-size:28px;text-transform:uppercase;margin:0 0 8px;color:var(--ink)}
.help{font-size:12.5px;color:var(--dim);padding:8px 18px;background:var(--raise);border-bottom:1px solid var(--hair)}
.help code{font-family:var(--mono);font-size:11.5px;color:var(--accent)}

@media (max-width:760px){
  #body{flex-direction:column}
  #rail{width:auto;flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}
  .railhead{display:none}
  .fitem{width:auto;flex:0 0 auto;border-left:0;border-bottom:3px solid transparent;border-radius:3px;padding:6px 10px}
  .fitem.on{border-left:0;border-bottom-color:var(--accent)}
  #bar h1{font-size:19px}
}

/* ---- v2: the asset board and the reference sheet ---- */
#wrap .board{padding:6px 2px 30px}
.folder{background:var(--card);border:1px solid var(--line);border-radius:4px;margin:0 0 12px}
.folder > h4{margin:0;padding:11px 14px;border-bottom:1px solid var(--hair);display:flex;
  align-items:center;gap:10px;font-family:var(--mono);font-size:13.5px;font-weight:500;color:var(--accent)}
.folder > h4 .cnt{margin-left:auto;font-family:var(--sans);font-size:12px;color:var(--faint)}
.folder .blurb{padding:9px 14px;color:var(--dim);font-size:13px;border-bottom:1px solid var(--hair)}
.folder .blurb b{color:var(--ink)}
.want{display:flex;gap:10px;align-items:flex-start;padding:7px 14px;border-bottom:1px solid var(--hair);font-size:13px}
.want:last-child{border-bottom:0}
.want input[type=checkbox]{margin:3px 0 0;width:15px;height:15px;accent-color:var(--pitch);flex:0 0 auto}
.want .nm{font-family:var(--mono);font-size:13px;word-break:break-all}
.want.done .nm{text-decoration:line-through;color:var(--faint)}
.want .src{color:var(--faint);font-size:12px;margin-left:auto;text-align:right;flex:0 0 auto;padding-left:10px}
.want .why{color:var(--dim);font-size:12.5px;display:block}
.hint{background:var(--accent-soft);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:3px;padding:10px 14px;margin:0 0 14px;font-size:13px;color:var(--ink)}
.hint b{color:var(--accent)}
.cheat{background:var(--card);border:1px solid var(--line);border-radius:4px;margin:0 0 12px;overflow:hidden}
.cheat h4{margin:0;padding:11px 14px;border-bottom:1px solid var(--hair);font-family:var(--disp);
  text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--accent)}
.cheat .in{padding:12px 14px;font-size:13.3px}
.cheat table{width:100%;border-collapse:collapse}
.cheat td{padding:5px 8px 5px 0;vertical-align:top;border-bottom:1px solid var(--hair)}
.cheat td:first-child{font-family:var(--mono);font-size:12.5px;color:var(--accent);white-space:nowrap;width:1%}
.cheat tr:last-child td{border-bottom:0}
.cheat code{font-family:var(--mono);font-size:12.5px;background:var(--raise);padding:1px 5px;border-radius:3px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;align-items:start}
.fitem.special{color:var(--pitch)}
.fitem.special .fc{background:var(--pitch-soft);color:var(--pitch)}
@media (max-width:860px){ .want .src{display:none} }
</style>

<div id="shell">
  <header id="bar">
    <h1>Sturmball <span>Workbench</span></h1>
    <div class="grow"></div>
    <button class="btn" id="bNewClass">+ New class</button>
    <button class="btn" id="bLoad">Load CSVs</button>
    <button class="btn" id="bCheck">Check</button>
    <button class="btn key" id="bExport">Export</button>
    <button class="btn sm" id="bTheme" title="Light / dark">◐</button>
  </header>

  <div id="body">
    <nav id="rail">
      <div class="railhead lbl">Where things go</div>
      <div id="special"></div>
      <div class="railhead lbl">Files</div>
      <div id="files"></div>
    </nav>
    <main id="main">
      <div id="head"><h2 id="title">—</h2><div id="what"></div></div>
      <div class="help" id="help" hidden></div>
      <div id="tools"></div>
      <div id="wrap"><div class="empty" id="blank"></div></div>
    </main>
  </div>

  <section id="probs">
    <button id="probhead">
      <span class="lbl">Problems</span>
      <span id="probtag" class="tag ok">checking…</span>
      <span class="grow"></span>
      <span id="probchev" style="color:var(--faint)">▾</span>
    </button>
    <div id="problist"></div>
  </section>
</div>

<input type="file" id="pick" multiple accept=".csv" hidden>

/* ============================================================
   THE SCHEMA — what every file is, and what its columns mean.
   Adding a file here teaches the workbench about it; the editor
   itself never names a column.
   ============================================================ */
const YN = ["", "yes", "no"];
const TF = ["", "true", "false"];
const TIERS = ["", "I", "II", "III", "IV"];

/* The fourteen moments Juice.csv may answer to. Straight out of
   juice_db.gd — if you add one there, add it here. */
const MOMENTS = ["ball_received","ball_kicked","enemy_hit","enemy_died","player_hurt",
  "player_exhausted","player_healed","combo_fired","shot_struck","enemy_windup",
  "goal_scored","play_maker","star_switch","coin_exact"];
/* The seven things an Adventure breakpoint can do. Out of trait_db.gd. */
const EFFECTS = ["attack","strike","heal","stamina","revive","shield","spawn"];

const S = {
/* ---------- the rule everything obeys ---------- */
"TierPowers.csv":{what:"THE LADDER. Every tier holds one card of each power, and every screen in the game obeys this file.",
  key:"Tier", help:"Min to Max is read as the LIST OF SLOTS. Tier I is 0 to 2, so it holds one 0, one 1 and one 2 — never two the same. Keep each span three wide, or every squad in the game changes size."},

/* ---------- Adventure: the pile ---------- */
"AdventureTraits.csv":{what:"THE ICONS. What a player carries into an Adventure fight. Abilities are not read in Adventure at all — these are.",
  key:"ID", colour:["Colour"], enums:{From:["element","class","star","tier"]},
  help:"<b>From</b> says where an icon comes from. <code>element</code> reads the Element column of your unit CSV <i>and</i> of Brews.csv, so what a player drinks changes their icon. <code>class</code> reads the brewed class. <code>star</code> ignores Value entirely. <b>A player carries several icons</b> — one from their element, one from their class — and both bars move.<br><b>ONLY EIGHT ICONS GO INTO A RUN.</b> <code>adventure_trait_slots</code> in Tuning.csv says how many; the rest of this file is the shelf they are chosen from. An icon that is not in the eight does nothing at all — no bar, nothing on the pile, no breakpoints.<br><b>Requires</b> decides whether an icon is on that shelf, in the usual condition words. Blank means it is there from the first run. <code>unlocked:Frost Study</code> means it turns up once something hands that unlock out — which is how you write forty icons and let the player earn which eight they carry."},
"AdventureCombos.csv":{what:"WHAT REACHING A STACK DOES. Three Fire on the pile and every shot is worth four more — this is the file that says so.",
  key:"ID", enums:{Effect:EFFECTS, Lasts:["","held","once"]},
  help:"<b>At</b> is how many it takes. <b>Only the highest breakpoint you have reached is active</b> for a <code>held</code> effect — three Fire gives you Blaze, not Kindling <i>and</i> Blaze, which is what makes 3/4 worth chasing. A <code>once</code> effect fires as you pass it and not again until the cycle comes round.<br><b>Target</b> depends on Effect: <code>strike</code> → all / focus · <code>heal</code> and <code>stamina</code> → lowest / all / last · <code>revive</code> → how much stamina each · <code>spawn</code> → a row of AdventureSpawns.csv · <code>attack</code> and <code>shield</code> → leave it blank."},
"AdventureSpawns.csv":{what:"THE STAND-INS. A Treant that walks on to replace somebody you lost, and is a real party member from then on.",
  key:"ID", enums:{Tier:TIERS},
  help:"Leave <b>Tier</b> blank and it takes the tier of whoever it is replacing, which is almost always what you want. <b>Its Power is clamped into that tier's rungs</b> — the ladder is not broken even by a spawn, and the log says so if a number had to move."},

/* ---------- Adventure: the run ---------- */
"AdventureEnemies.csv":{what:"Who you meet in a biome. An enemy has NO TIER — it is what it hits for, and what it is made of.",
  key:"ID", enums:{Targeting:["weakest","strongest","lowest_stamina","aoe"],Boss:YN},
  help:"<b>Layers</b> is <code>Name:Amount:Soak</code> separated by <code>|</code>, outermost first — damage eats the outer layer before it reaches the next. <b>Weight</b> 0 means it never turns up randomly, which is what a boss is. <b>Buff</b> is what it gains per pass while you build your move: blank for most of them, and give it to the ones that should feel like a clock ticking."},
"Biomes.csv":{what:"The areas you explore, and how each one looks.",
  key:"ID", colour:["Sky","Grass","Grass Stripe","Edge"],
  help:"Colours are written <code>#213a26</code>. <b>Parallax</b> 0 is a still background, 1 moves with the ground. <b>Difficulty</b> is multiplied by how many times you have cleared the place, so a repeat run is genuinely tougher rather than just longer."},
"Bounties.csv":{what:"The jobs on the board. A bounty is a boss — go into that biome and kill the thing named on the paper.",
  key:"ID", enums:{Repeatable:YN},
  help:"<b>Waves</b> blank means \"as long as the biome is\". A number makes this one job shorter or longer through the same place."},
"Drops.csv":{what:"What things leave behind. A drop table is every row sharing a Table name.",
  key:null, help:"<b>Chance</b> is 0 to 1. <b>Requires</b> gates a drop — a recipe only falls once you can brew."},
"Items.csv":{what:"Everything you can pick up, spend or use. Every item is a counter in the save, so anything that tests a counter works on it.",
  key:"ID", enums:{Kind:["material","currency","recipe","kit","brew","key","token","quest"],
    Tab:["","items","resources","keys"],Target:["","ally","enemy","downed","card"]},
  help:"<b>Use</b> is what happens when it is used: <code>revive</code>, <code>heal:6</code>, <code>heal:3;all</code>, <code>hit:4</code>, or <code>brew:fire</code> to lay a row of Brews.csv over one player. Blank means it is not usable at all.<br><b>Tags</b> says WHERE it may be used \u2014 a semicolon list. <code>adventure_consume</code> during an Adventure fight, <code>match_consume</code> on a card during the match draft. <b>No tag is the normal case</b> and means it is taken at the bar before the team sets off, so a bandage with no tag is not broken, it just is not something you pull out mid-wave. Any other word you write is yours, to test with a Requires.<br><b>A brew is an ordinary item.</b> It is MADE at a building \u2014 see the Brewery row of Buildings.csv \u2014 bottled, and carried; the bottle is what you use. Nothing is conjured out of the inventory.<br><b>Tab</b> is which page of the Inventory it sits on \u2014 <code>items</code> are things you USE, <code>resources</code> things you SPEND, <code>keys</code> things you HOLD and never spend. Leave it blank and it is worked out from Kind: key/token/quest \u2192 keys, material/currency \u2192 resources, anything with a Use \u2192 items, anything else \u2192 resources."},

/* ---------- feel ---------- */
"Juice.csv":{what:"SHAKE, FLASH, POP, SLOW-MOTION AND SOUND. No feel is typed into a script — the game says what happened, and this says what that looks like.",
  key:"ID", colour:["Flash Colour"], enums:{When:MOMENTS, Who:["player","enemy","screen","ball"]},
  help:"<b>Two rows may share a When and both fire</b> — that is how one hit shakes the enemy <i>and</i> the screen with different settings. <b>Shake Scale</b> is the interesting one: 0 means every hit shakes the same, 0.9 means a big hit shakes noticeably harder, 1.4 makes a big hit an event. The game works out what \"average\" is from the hits you actually land. <b>Slowmo</b> is seconds — several rows of one moment make ONE dip, the longest asked for."},
"Audio.csv":{what:"Every sound, per moment, per condition. Volume, bus and fade all live here.",
  key:"ID", enums:{Bus:["Music","Effects","UI","Master"],Loop:TF},
  help:"<b>A blank When is legal</b> and means \"nothing fires this by itself; something asks for it by name\" — which is how a Juice.csv Sound column works. A name Audio.csv has never heard of is looked for as a file in <code>assets/audio/</code>, so you can drop a wav in and hear it without writing a row."},
"PitchSprites.csv":{what:"THE ISOMETRIC PLAYERS ON THE PITCH (round AN): which 8-direction pitch sheet a card plays in. Cards, duels and portraits keep the card's own sheet.",
  key:"Wears",
  help:"<b>Wears</b> is the card's own sheet file name (class_Normal_female_blonde.png), its card name, or its class (Normal). The file name is tried first. <b>Pitch Sheet</b> is a file in assets/players/pitch/, built from a PixelLab export with <code>tools/make_pitch_sheet.py</code>. Several separated by | = each player gets one and keeps it. A card with no row plays on its old sheet."},
"PitchAnims.csv":{what:"WHERE EACH ANIMATION IS ON A PITCH SHEET (round AN): idle, run, kick, tackle, fall, cheer.",
  key:"Animation", enums:{Loop:TF},
  help:"Each animation takes 8 rows from <b>First Row</b>: east, south-east, south, south-west, west, north-west, north, north-east. <b>PixelLab</b> is the animation's name in the PixelLab export, so the sheet builder knows what goes where. Run plays while a player moves, idle (facing the ball) while they stand, kick on a pass or shot, tackle when they win the ball, fall when they lose it, cheer after a goal."},
"Animations.csv":{what:"How a spritesheet is sliced. Leave Unit Type blank for a rule that covers every class.",
  key:null, enums:{Loop:TF},
  help:"A card with no matching row falls back to a 12 × 39 grid — which is why an unsliced sheet shows as a sliver rather than as nothing."},

/* ---------- the league ---------- */
"Abilities.csv":{what:"What a card does in a DUEL. League matches only — abilities are not read in Adventure.",
  key:"Ability ID", enums:{Scope:["duel","round","cycle","match"]},
  help:"<b>ROUND AE (phase C7).</b> New trigger <code>position_swap</code>: a card of yours has just swapped places with another of its tier during combat (fires for the one that came in; <code>swapped_was:air</code> asks what went out). Three Emblem rows: <code>EMB_VASSAGO_WIN</code>, <code>EMB_GLASYA_TOUCH</code>, <code>EMB_CAIM_SWAP</code>.<br><b>ROUND AD (phase C6).</b> The class engines: <code>cold_touch</code> (Target <code>ball</code>), <code>gravestone</code> (Target <code>field</code>), <code>mine</code>, <code>weapon</code>, <code>fuse:fire+iii</code> (a card of that kind from your BENCH fuses with it - higher power, both abilities), <code>fused</code> (\"Can be fused.\" - a word), <code>swap_from_void</code>; If words <code>touched_ball</code> / <code>touched_before_playmaker</code> (had the ball since the last PLAY MAKER), <code>mining</code> (another of your units is at a mine), <code>fused</code>.<br><b>ROUND AC (phase C5).</b> The zones in action: <code>swap_in_tier</code> on an <code>exhaust_swap</code> row (the card can swap in from the exhaust before a duel of its tier - every other row on that side with the same trigger is what it does once in), <code>send_to_exhaust</code>, <code>swap_from_exhaust</code>, <code>exhaust_other_return</code>, <code>reveal_another</code>, <code>reveal_from_exhaust</code>, <code>double_attack</code>; If words <code>swapped_was:air</code> and <code>revealed_was:fire</code>.<br><b>ROUND AB (phase C4).</b> Bending the duel: <code>switch_to_defender</code>, <code>always_defending</code>, <code>swap_power</code> (target <code>token</code> = take a token's power), <code>set_power_from_token</code> (Sven), <code>use_enemy_power</code>, <code>force_ability:attack/defend/other</code>, <code>negate_ability</code>, <code>negate_buff</code>, <code>change_priority</code>, <code>give_priority</code>, <code>uncounterable</code>, <code>power_from_count:victory</code>, <code>remove_condition</code>. The order of a duel's abilities now re-sorts as priorities change.<br><b>ROUND AA (phase C3).</b> Keeper and referee effects: <code>goalie_chance</code> (percentage points on how likely that keeper is beaten - until the next shot), <code>goalie_shield</code> / <code>remove_shields</code> (a bar that empties before stamina), <code>foul_heat</code> (segments of the referee's bar), <code>foul_chance</code> (+% to foul), <code>foul_coin_flip</code>. A new <b>Ask</b> column: <code>yes</code> = the player is asked first (Zepar's Swan); a Cost is asked anyway.<br><b>ROUND Z (phase C2).</b> A <b>Cost</b> column: <code>ore:3</code> spends three Ore from your side's pool first - not enough and the ability does not happen at all. New effects: <code>add_counter:burn</code> (a <code>-1</code> on <code>add_counter:power</code> is a power counter: the card is 1 weaker for the rest of the match), <code>remove_counter</code>, <code>gain_ore</code>, <code>create_token:rose</code>, <code>make_swan</code>. New targets: <code>side</code> (your side's pool), <code>replace:water+I</code> (which card a token replaces), <code>next_tier_ally:fire</code> (the VERY next card played - ruling R03). New If words: <code>has_counter:burn</code>, <code>has_token</code>, <code>tokens_at_least:4</code>, <code>is_swan</code>, <code>ore_this_round</code>, <code>element:water</code>... <b>Max</b> takes <code>1/round</code> and <code>2/cycle/side</code> (the whole side shares it). New moments: <code>on_counter</code>, <code>after_combat</code>. The <code>EMB_</code> rows at the bottom are the Emblems' Basic sides - an Emblems file names them in its <b>Basic Ability</b> column.<br><b>ROUND Y.</b> <b>If</b> is a new column: conditions that must all be true - <code>defending</code>, <code>in_exhaust</code>, <code>last_ally_won</code>, <code>enemy_not_element:air</code>... (Keywords.csv, family <i>ability condition</i>). <b>Max</b> also takes <code>1/cycle</code>. New targets: <code>next_ally:fire</code>, <code>next_ally:water+II</code>, <code>next_ally*2:unkengeister</code>, <code>next_enemy</code>, <code>next_self</code> (they WAIT until that card duels) and <code>ally:water+I</code> (this round's card). <b>One side per duel:</b> a card attacking uses its Attack ability, defending its Defend ability (<code>ability_uses_role_side</code>). Your cards' own abilities live in <b>CardAbilities.csv</b>, made from their text.<br><b>Max</b> (round X) is the <i>(Max 5)</i> on your cards: how many times this ability may go off for ONE card in ONE match. Blank = no limit.<br><b>add_card_chance</b> (round X) leans on the referee: Value % that a foul the OTHER side commits, once he has seen it, is a yellow instead of a free kick. For the match. Karl's ore card, <code>BERG_ORE_WHISPER</code>, is the example.<br><b>Trigger</b> is WHEN it goes off, and the list is a spreadsheet of its own now — <b>AbilityTriggers.csv</b>. A trigger marked <code>planned</code> there is legal to write: the card loads, the row is not an error, and it simply never fires until that trigger is built.<br>THE ONE PLACE THE SPREADSHEET STILL RUNS OUT is <b>Effect</b>. New effect words need code — ask for a batch of them."},
"Keywords.csv":{what:"EVERY WORD THE GAME UNDERSTANDS, and what it does. The reference you read, and the place you write a new word down so it can be built.",
  key:"Keyword", enums:{Status:["live","planned"],
    Family:["ability effect","ability target","ability scope","ability condition","ability cost","ability max","ability ask","condition","effect word","adventure effect","item tag","juice moment"]},
  help:"This is the answer to \u201cwhat can I already write?\u201d. Every effect, target, scope, condition word, Adventure effect and item tag is a row here with a plain sentence saying what it does.<br><b>Status</b> works the same way it does for triggers: <code>live</code> is built, <code>planned</code> is designed and not built yet. <b>A card written against a planned effect still loads</b> \u2014 it is not an error, it simply does nothing until the effect exists, and the Output panel says so once.<br><b>TO ASK FOR A NEW KEYWORD</b>: add a row, pick the family, set Status to <code>planned</code>, and write <b>What It Does</b> as one clear sentence. That sentence is the specification \u2014 whoever builds it works from your words rather than guessing.<br><b>Triggers are not here.</b> They have a file of their own, AbilityTriggers.csv, because the game reads that one as a list."},
"EnemyPlay.csv":{what:"HOW THE OTHER SIDE PLAYS. A list of rules read top to bottom \u2014 the first one whose When is true decides what they take this tier. This is the opposition's whole brain, and it is not an AI.",
  key:"ID", enums:{
    When:["always","you_revealed","you_hid","attacking","defending","winning","losing","level","has_ability","tier:I","tier:II","tier:III","tier:IV","round:1","round:2","round:3"],
    Pick:["random","strongest","weakest","counter","ability_first","no_ability"],
    Reveal:["never","always","if_ability","match"]},
  help:"<b>ORDER MATTERS AND IT IS THE WHOLE TRICK.</b> The rows are read from the lowest Order up, and the FIRST one whose <b>When</b> is true is used \u2014 everything below it is ignored for that tier. So a rule with <code>always</code> belongs at the bottom, and a rule you want to win an argument belongs at the top.<br><b>When</b> can also be <code>flag:name</code> or <code>!flag:name</code>, which is how one scripted match behaves differently from every other.<br><b>Do</b> runs an effect when the rule fires, in the same words as everywhere else: <code>brew:fire</code> pours a brew on the card they just took.<br><b>Style</b> is blank for \u201cevery opponent\u201d. Put a word there and only the team whose <code>Play Style</code> in Teams.csv matches will use it \u2014 that is how the side at the top of the pyramid plays differently from the one you open against.<br><b>Nothing here learns or searches.</b> It is completely readable and completely predictable, which is the point: the skill is learning to read it."},
"OutOfBounds.csv":{what:"HOW A ROUND BEGINS. A hidden roll decides who gave the ball away, he puts it over the touchline, the other side walks over and throws it back in, and THE THROWER CHOOSES attack or defend. This replaced the 1-10 coin.",
  key:"Step", enums:{Do:["roll","kick_out","walk_up","window","say","sound","wait"]},
  help:"<b>IT IS THE SAME SHAPE AS Celebration.csv</b>, on purpose - you have already learned this file. One row is one beat, read top to bottom; <b>Seconds is HOW LONG BEFORE THE NEXT ROW STARTS</b>, not how long the effect lasts; and deleting every row opens a round instantly, which is what it did before any of this existed.<br><b>WRITE <code>roll</code> FIRST.</b> The beats that follow are about the player it picks. The game will do the roll first anyway rather than kicking a ball nobody gave away, but a list with an invisible step in it is a list that gets edited wrongly.<br><b>THE WINDOW IS A TEMPLATE.</b> It shows, in order: an <b>Art</b> file if you drew one \u00b7 a row of Animations.csv played on THAT PLAYER'S OWN spritesheet (<code>lose</code> works today with art you already have) \u00b7 the caption alone. The third case is not a failure - a window with a caption is still a beat and the match keeps going.<br><b>THIS HAPPENS NINE TIMES A MATCH.</b> A second added here is nine seconds of match. <code>tools/out_of_bounds_check.gd</code> prints the total and does the multiplication for you.<br><b>WORDS FOR Text:</b> <code>{loser}</code> <code>{thrower}</code> <code>{side}</code> <code>{tier}</code> <code>{call}</code> <code>{caption}</code> <code>{keeper}</code> (round AC: <code>{call}</code> and <code>{caption}</code> come from PlayMakerStarts.csv, so one list of beats serves the throw-in, the corner and the rest).<br><b>Tuning.csv:</b> <code>out_of_bounds</code> false brings the coin back \u00b7 <code>out_of_bounds_player_chance</code> is how often it is YOUR side that gives it away, and is the dial to reach for if the game feels unfair before you touch the cards \u00b7 <code>throw_in_inset</code> and <code>throw_in_screen_margin</code> put the thrower outside the line and then keep him on the screen."},
"ShotOdds.csv":{what:"WILL IT GO IN? The curve that turns the keeper's remaining stamina and the shot's power into a percentage - and that percentage is PRINTED ON THE SCREEN before the shot and is the number that is rolled.",
  key:"Stamina Left",
  help:"<b>THE 0 ROW IS THE ONE THIS FILE EXISTS FOR.</b> It says 100, so an empty keeper is a CERTAIN goal. The old keeper saved one shot in ten at an empty net, which reads as the game cheating.<br><b>Stamina Left</b> is a percentage of the keeper's max, 0 to 100. <b>Chance</b> is the % of scoring at that stamina before power. <b>Per Power</b> is how many points each point of shot power adds THERE - keep it highest in the middle of the curve, so a big shot is worth most against a keeper who is already wobbling.<br><b>Between two rows both numbers are interpolated</b>, so six rows draw a smooth curve rather than six steps. The order you type them in does not matter; they are sorted on load.<br><b>IT MUST GET EASIER ALL THE WAY DOWN.</b> A curve that dips in the middle is a keeper who gets HARDER to beat as you hurt him, which no player will ever guess. <code>tools/scoring_balance.gd</code> answers the question you actually care about - how many goals a match has - and <code>tools/shot_odds_check.gd</code> checks for exactly that, prints the whole grid, and then plays ten thousand shots at each stamina to confirm the dice agree with the table.<br><b>The number you are shown is the number that is rolled.</b> The shot is rolled against the stamina the keeper had when you were shown the percentage, and the stamina comes off afterwards - so a shot that empties a keeper does not get the empty keeper's odds. The next one does.<br><b>Tuning.csv:</b> <code>shot_odds</code> false goes back to the two flat numbers this replaced \u00b7 <code>shot_power_shown</code> is the top end of the band shown beside a keeper on the pitch \u00b7 <code>shot_stamina_bite</code> is HOW MUCH OF A SHOT COMES OFF HIM - it used to be all of it, which emptied a keeper on the second shot of the match \u00b7 <code>keeper_chance_on_pitch</code> takes that band off."},
"Theme.csv":{what:"THE SKIN. Panels, windows, buttons and bars drawn from 9-slice images, the fonts, and the palette. ONE ROW REACHES EVERY SCREEN AT ONCE.",
  key:"Element", key2:"State", enums:{
    State:["","hover","pressed","disabled","focus","selected"],
    Tint:["","yes","no"], Repeat:["","tile"]},
  help:"<b>Repeat</b> (round X): <code>tile</code> REPEATS the four edges instead of stretching them. For a border with a pattern in it - the beer mat's lozenges - which a stretch smears into stripes. Blank = stretch.<br><b>The chrome is PixelLab art now</b>, cut by <code>tools/cut_chrome.py</code> from the sheets in <code>art_source/pixellab/</code> - see ArtOrders.csv.<br><b>THE <code>panel</code> ROW IS THE MOST IMPORTANT ONE IN THE GAME.</b> Every box the game draws - a card face, a tile, a dialog, the strip above the card row, the keeper's number, the celebration window - goes through ONE function, and this row sits in front of it. Put <code>panel_soft</code> in its Image column and every one of them changes at once.<br><b>NINE-SLICE.</b> An image is cut into nine: four corners that never stretch, four edges that stretch one way, a middle that stretches both. <b>Slice</b> is how far in the cuts are. One 48 x 48 PNG draws every window in the game at every size.<br><b>TINT - read this before drawing anything.</b> By default the image is MULTIPLIED by the colour the screen asked for, so one light grey PNG becomes every panel in the game in its own colour. The catch: multiplying by a dark panel colour DARKENS whatever you drew, so draw it light and desaturated and keep the shape in the ALPHA rather than in the brightness. <b>Tint = no</b> hands your image over untouched - one image per look instead of one for all of them, which is the right trade once you are drawing a finished frame.<br><b>Rows whose Element starts with <code>colour </code> set the palette</b>; only their Fill is read. <code>attack</code> and <code>defend</code> are the two that carry meaning rather than taste - the strip above the cards and the ATK/DEF tags on a Star both read them. <b>The Colour tab of Settings still wins</b>, because a colour-blind palette is a need and not a preference.<br><b>A state with no row falls back to that element's ordinary row, and an element with no row falls back to <code>panel</code></b>, so you can skin the whole game with one row and add detail later.<br><b>Nothing breaks while it is empty.</b> A missing image, a colour it cannot read: everything falls back to what the game looked like before this file existed. <code>tools/theme_check.gd</code> lists every row, whether its file is there, and what is sitting in assets/ui/ that nothing uses."},
"Celebration.csv":{what:"THE GOAL CELEBRATION. One row per beat, read top to bottom. Nothing in the code decides what a celebration IS \u2014 it knows how to do seven things and this file says which of them happen, in what order, and for how long.",
  key:"Step", enums:{
    Who:["you","them","both"],
    Do:["slide","swarm","confetti","window","say","sound","wait"]},
  help:"<b>SECONDS IS A WAIT, NOT A LENGTH.</b> This is the one thing worth reading twice. <code>Seconds</code> is how long the game waits BEFORE RUNNING THE NEXT ROW \u2014 it is not how long the effect lasts. So <code>confetti</code> with Seconds 0 starts the confetti and immediately moves on, and the paper carries on falling under everything below it. A <code>sound</code> with Seconds 0 starts playing and the list carries on over the top of it. A <code>wait</code> row is the only one whose whole job is the number.<br><b>Two exceptions</b>, and both are things you are meant to look at: a <code>window</code> holds for its Seconds, and a <code>say</code> clears itself when its Seconds are up. <b>Two rows of the same kind in a row replace each other with no gap</b>, so consecutive <code>window</code> rows are a slideshow inside ONE panel rather than a panel opening and shutting twice.<br><b>THE SEVEN THINGS:</b> <code>slide</code> the scorer skids along the grass away from the goal he scored in \u00b7 <code>swarm</code> his side runs in and rings him \u00b7 <code>confetti</code> \u00b7 <code>window</code> the celebration panel \u00b7 <code>say</code> the big word across the pitch \u00b7 <code>sound</code> \u00b7 <code>wait</code>.<br><b>WHAT GOES IN THE WINDOW:</b> an <b>Animation</b> (a row of Animations.csv, played on the SCORER'S OWN spritesheet \u2014 <code>win</code> is one you have already drawn) or an <b>Art</b> file shown whole. Art wins if you fill in both, because a picture you went and drew is the more deliberate of the two. <b>This is how you give one Star his own celebration.</b><br><b>WORDS FOR Text:</b> <code>{scorer}</code> <code>{team}</code> <code>{class}</code> <code>{tier}</code> <code>{score}</code>. A placeholder nothing fills in is left on screen as written, so a typo shows up instead of vanishing.<br><b>Who</b> is whose goal the beat plays for. Blank means both.<br><b>The shape numbers are in Tuning.csv</b>, not here: <code>celebration_slide_distance</code>, <code>celebration_swarm_radius</code>, <code>celebration_confetti_pieces</code>, <code>celebration_confetti_colours</code>, <code>celebration_hide_names</code>, <code>celebration_skippable</code>. <code>goal_celebration</code> false is the old behaviour.<br><b>HOW LONG IS TOO LONG?</b> Add the Seconds up. Eleven seconds reads beautifully the first time and is unbearable by the fourth goal \u2014 <code>tools/celebration_check.gd</code> does the sum and says so past twelve."},
"Stadium.csv":{what:"THE PITCH AND THE VILLAGE ROUND IT, and what is layered behind and over the grass.",
  key:"Layer", enums:{Layer:["background","crowd","pitch","lights"]}, colour:["Tint"],
  help:"<b>ROUND AN: THE WHITE LINES ARE THE EDGE OF THE PLAYER ZONES.</b> Pitch, village and crowd are all <b>2560 x 1440</b> and sit exactly on top of each other. The lines (and the zones) run <b>x 436-2124, y 288-1152</b>: the first camera view (1920 x 1080, centred) pulled in by <code>pitch_inset_x</code> and <code>pitch_inset_y</code> in Tuning.csv. Change those and run <code>tools/make_pitch.py</code> so the lines follow.<br><b>The village</b> (houses, church, farm, beer tent, clubhouse, trees, locals, the Full House fans) is built from <code>VillageGround.csv</code> by <code>tools/make_village.py</code>.<br><b>Parallax</b> is how much slower than the camera a layer drifts. Keep it 0 for the village so the houses stay next to the grass.<br><b>How much of the village the wide shot shows</b> is <code>camera_wide_ground</code> in Tuning.csv.<br><b>Requires</b> works as it does everywhere else. A row with no Image draws nothing."},
"VillageGround.csv":{what:"THE VILLAGE ROUND THE PITCH, one row per PixelLab part. tools/make_village.py turns it into stadium_back.png, stadium_crowd.png and a layered Aseprite file.",
  key:"Part", enums:{Layer:["background","crowd"],Flip:["","h"]},
  help:"<b>X and Y</b> are the top-left corner in pitch pixels (the 2560 x 1440 picture). The white lines are at x 436-2124 and y 288-1152, so keep buildings outside that box.<br><b>Scale</b> is a whole number: <b>2</b> for buildings and trees (the pitch's pixel size), <b>1</b> for people (the players' size).<br><b>Layer</b>: <code>background</code> is always there; <code>crowd</code> only once Full House is unlocked.<br><b>Rows are drawn top to bottom</b>, so the first row is the bottom layer. After any change run <code>~/.venvs/sturmball/bin/python tools/make_village.py</code>."},
"BaseSpots.csv":{what:"WHERE VISITORS STAND AT THE BASE: one row per building door, on its path.",
  key:"Spot",
  help:"<b>X and Y</b> are the centre of the visitor's card, as fractions of the screen (like Buildings.csv). <b>Building</b> is the Buildings.csv ID; while that building is not on the map its door is skipped, and blank means always there.<br>Each time the base opens, every visitor picks a free door at random - only their own building's doors if Visitors.csv gives them a Building. No rows = visitors stand at their own X and Y in Visitors.csv."},
"BaseTown.csv":{what:"THE BASE TOWN MAP, one row per PixelLab part. tools/make_base_town.py turns it into assets/base/background.png and a layered Aseprite file.",
  key:"Part", enums:{Layer:["map"],Flip:["","h"]},
  help:"<b>X and Y</b> are the top-left corner in screen pixels (1920 x 1080). <b>Scale</b> is a whole number: the ground is 640 x 360 drawn <b>3</b> times; far things (clouds, the far boat) are <b>1</b>, near things <b>2</b> or <b>3</b>.<br><b>Crop</b> (x,y,width,height in the part's own pixels) cuts a piece out of a bigger picture onto its own layer; the piece keeps its place.<br><b>Every row is its own layer</b> in art_source/aseprite/base_town.aseprite.<br><b>Rows are drawn top to bottom</b>. After any change run <code>~/.venvs/sturmball/bin/python tools/make_base_town.py</code>."},
"Recovery.csv":{what:"HOW MANY ROUNDS A PLAYER PLAYS, AND HOW LONG HE THEN RESTS, by their power. One row per power.",
  key:"Power",
  help:"<b>Plays</b> (round AN, Anthony) = how many ROUNDS he plays before he is exhausted; a round is a match or an Adventure played to the end, a Quit counts for nothing. Blank = 1. <b>Turns</b> = how many fixtures he then rests in the Dorms, where his drunk meter is empty.<br>A <b>FIXTURE</b> is anything that uses a squad \u2014 a league match, a friendly, a cup tie, or a run in Adventure. Every fixture you play knocks one off everybody's rest, so going to Adventure with four players is also how the other eight get their legs back.<br><b>The whole system is off until <code>recovery</code> in Tuning.csv is true</b>, and it should stay off until a class has roughly twice a side in it \u2014 about six per tier. With three per tier, one match puts enough of them out that you can field nothing at all. <code>tools/recovery_check.gd</code> answers that for your actual roster.<br>A power with no row falls back to <code>recovery_turns_per_power</code> multiplied by the power."},
"AbilityTriggers.csv":{what:"WHEN AN ABILITY GOES OFF, and the list of the ones still to build. This is the file to keep the trigger plan in.",
  key:"ID", enums:{Status:["live","planned"]},
  help:"<b>ID</b> is the word you write in the <code>Trigger</code> column of Abilities.csv. <b>Status</b> is the useful column: <code>live</code> means the game fires it, <code>planned</code> means you have designed it and nobody has wired it up yet.<br><b>A planned trigger is not a mistake.</b> Write the card now — it loads, it is not an error, and the Output panel says once that it is waiting on that trigger. When the trigger goes live the card starts working with no edit.<br><b>Phase</b> is just your own note of which batch it belongs to, and <b>What It Needs</b> is what has to exist first. Neither is read by the game."},
"Combos.csv":{what:"What a passing move is worth in a LEAGUE match. Adventure has its own table — AdventureCombos.csv.",
  key:"ID", enums:{When:["same_element","same_class","all_different_class","rising_power","all_four","star_last"]},
  help:"<b>Bonus</b> goes on the SHOT and never on a card. Keep these small: a team is normally all one class and most classes are all one element, so the element rules fire far more often than they look like they will."},
"Season.csv":{what:"The fixture list, and the end of a season.", key:"ID", enums:{Final:YN},
  help:"<b>Difficulty</b> is added to the opposition's SHOT, never to their cards — so the tier ladder holds."},
"Seasons.csv":{what:"The shelf of competitions, laid out like a talent tree.", key:"ID", colour:["Colour"],
  help:"<b>Row</b> and <b>Column</b> place a tile. Each row is CENTRED on screen, so Column sets the order and spacing within a row rather than an absolute position — and gaps in your numbers are kept, so a branch still looks like a branch. <b>After</b> draws the joining line."},
"Teams.csv":{what:"The sides you play in the league.", key:"ID",
  help:"<b>Cards</b> names the exact cards it fields, separated by <code>|</code>. Blank means any cards of its class."},
"MatchModes.csv":{what:"The kinds of match. Timer 0 means no clock — it ends when the rounds do.",
  key:"ID", enums:{"Records Season":YN,"Star Rotation":YN,Scene:["match","adventure"],Opponent:["team","scratch","biome","squad"]},
  help:"<b>Opponent</b> <code>team</code> takes a fixture from Season.csv. <code>scratch</code> assembles a side on the spot at roughly your own level — that is what Play a Match from the base does.<br><b>Replaces</b> (round AN) lists other modes, <code>friendly;season</code>: while this row's <b>Requires</b> is true, a button that asks for one of them plays THIS mode instead. That is how the first match of a new game comes from the ordinary Play a match button.<br><b>Squad</b> names a CSV in data/ (IntroSquad.csv) whose players take the field INSTEAD of your team.<br><b>Enemy Squad</b> does the same for the opposition (EnemyIntroSquad.csv); set Opponent to <code>squad</code>."},
"MatchMaker.csv":{what:"THE MATCH MAKER (round AN): the window the base's Play a match flag opens. One row = one button, top to bottom.", key:"ID",
  help:"<b>Mode</b> is a MatchModes.csv ID - that row says how long the match is (Timer, Cycles, Rounds, Star Rotation) and what it pays. <b>Words</b> is the button, <b>Icon</b> is <code>art|glyph</code> (an icon file in assets/icons/, and the one or two characters shown until it exists), <b>Under</b> the line under the button, <b>Requires</b> hides it until true. A match is counted in Play Maker cycles, 30 minutes each. Out of the box: Normal Match (friendly, 3 cycles), Test Match (friendly_test, 2), Quick Match (friendly_cycle, 1). A new length = a MatchModes.csv row + a row here."},
"IntroSquad.csv":{what:"A side written out row by row - the first match of a new game. Named by the Squad column of MatchModes.csv.", key:"ID",
  enums:{Tier:["I","II","III","IV"],Gender:["","m","f"],Lead:["","yes"]},
  help:"<b>ID</b>: a random player is made ONCE per save for each ID and kept - another squad sheet using the same ID gets the same player back, and he or she joins your base. <b>Name</b> blank = a random first name from Names.csv of that <b>Gender</b>; a Name with <b>Class</b> blank is that real card (a Star). <b>Lead</b> yes: that Tier stands where the Stars usually do, and that player kicks off. Three per Tier, one of each power on the ladder."},
"TutorialAdventureSquad.csv":{what:"The Tutorial's Adventure Team (round AN, the morning after): four Adventure Players, one per Tier. MatchModes.csv tutorial_adventure.", key:"ID",
  enums:{Tier:["I","II","III","IV"],Gender:["","m","f"],Lead:["","yes"]},
  help:"Same columns as TutorialSquad.csv. New IDs, so they are not the match side. Made in the Tutorial's own save and thrown away with it."},
"IntroSquad2.csv":{what:"The second match of a new game: the same players (same IDs), Koch and the three Bergmännlein Stars.", key:"ID",
  enums:{Tier:["I","II","III","IV"],Gender:["","m","f"],Lead:["","yes"]},
  help:"Same columns as IntroSquad.csv. A Name with Class blank is the real card - Belial, Valefor and Haures are the Stars from Star Players.csv."},
"EnemyIntroSquad.csv":{what:"The opposition in your first match: twelve plain players, no Stars, no brew.", key:"ID",
  enums:{Tier:["I","II","III","IV"],Gender:["","m","f"],Lead:["","yes"],Star:["","yes"]},
  help:"Same columns as IntroSquad.csv, plus <b>Star</b> (yes = a Star) and <b>Ability</b> (an Abilities.csv ID). An opposition is made fresh every match and never kept."},
"EnemyIntroSquad2.csv":{what:"The opposition in your second match: plain players and the plain Stars Bauer, Richter and Klein.", key:"ID",
  enums:{Tier:["I","II","III","IV"],Gender:["","m","f"],Lead:["","yes"],Star:["","yes"]},
  help:"<b>PLAIN_STAR_PUSH</b> (Abilities.csv): +1 to the next normal, non-elemental player of their side."},
"Guide.csv":{what:"The Head Coach explains a screen: a Dialogue.csv scene in a box over it, then a button lights up.", key:"ID",
  enums:{Screen:["base","brewery","shop","bounty","dorms"],Once:["","true"],Only:["","true"]},
  help:"A row that has played sets <code>flag:guide_done_&lt;ID&gt;</code> - the next row waits on it. <b>Highlight</b> is the words on the button to light up (WORK IT, Adventure); nothing is forced. <b>Then</b> runs Progression Do actions after the box; <code>goto:base</code> closes a window over the base; <code>goto:back</code> (round AN) closes the screen itself, including the Brewery over a match TIME OUT. Then runs BEFORE the button lights up, so a key handed over makes the machine ready.<br><b>Only</b> (round AN) = true: nothing but the lit button can be used until it is pressed (the tutorial can't be clicked through); in the Brewery its mini-game can't be lost. <code>goto:dorms</code> opens the Dorms, <code>tutorial:end</code> ends the Tutorial (round AN, the morning after)."},
"MatchTalk.csv":{what:"The Head Coach stops the match to explain: a Dialogue.csv scene in a box over the pitch. Round AN: the whole Tutorial match is rows here (Mode tutorial).", key:"ID",
  enums:{When:["kick_off","cards_shown","duel_start","duel_priority","duel_ability_1","duel_ability_2","duel_power_check","duel_result","shot_odds","shot_done","duel_won","duel_lost","shot_taken","goal_scored","goal_conceded","save_made","keeper_emptied","foul_given","card_yellow","card_red","free_kick_won","star_switch","play_maker","adv_start","adv_pickup","adv_wave","adv_boss","adv_focus","adv_draft","adv_hit","adv_down","adv_loot"],Tier:["","I","II","III","IV","STAR"],Once:["","true","false"]},
  help:"<b>Mode</b> is a MatchModes.csv ID (tutorial); blank = any match. An Adventure mode (tutorial_adventure) uses the adv_ moments: Round is then the wave and Highlight the words on a button to light up. <b>Round</b> = only at that Play Maker (1 = the first). <b>Tier</b> = only for that Tier (STAR = the star swap cards). <b>Scene</b> is a Dialogue.csv scene - its lines play while the match waits. <b>Highlight</b> = a gold box round card:first, card:last, card:Koch, cards, exhaust, keeper_chance, keeper_stamina, shot_power (ring: in front = a gold circle; several with ;). <b>Do</b> after his lines: pub:scene (TIME OUT - the scene plays over the frozen match), star:Name, ability:Name=AbilityID, announce:words. <b>Once</b> true = only the first time ever. The first row that fits a moment plays."},
"StartingTeam.csv":{what:"THE STARTING TEAM (round AN): the base after the Tutorial, or after saying No to it - twelve plain players with random names. Tuning.csv starting_team names it.", key:"ID",
  enums:{Tier:["I","II","III","IV"],Gender:["","m","f"],Lead:["","yes"],Role:["","match","adventure","new"]},
  help:"Same columns as IntroSquad.csv, plus <b>Role</b> (round AN): what he arrives as - <code>match</code> or <code>adventure</code> (blank = Tuning.csv starting_team_role). Four Adventure Players, one per Tier, so a fresh game can go on an Adventure. Once given, a role is for good until Quereinsteiger."},
"Goalies.csv":{what:"Keepers. The only thing with stamina in a league match, and not part of the tier ladder.", key:"Name"},
"ClassInfo.csv":{what:"Which classes exist, and their blurb on the class-select screen.", key:"Class", enums:{Hidden:YN},
  help:"<b>Class</b> must match the Unit Type column of your cards. A <b>Requires</b> that does not pass keeps the class off the screen entirely; <b>Hidden</b> removes it without deleting its cards."},
"ScratchNames.csv":{what:"First and second halves of a name, combined at random to christen a pick-up side.", key:null},

/* ---------- cards ---------- */
"Units Set FO1 - Lorelei.csv":{what:"YOUR CARDS. Any file with a Unit Type column and a Base Power Left column is a unit file — the name does not matter.",
  key:"Name", enums:{Tier:TIERS, "Player Type":["Normal","Star"]},
  help:"<b>Base Power Left is the tier slot</b>, not a stat you tune. See TierPowers.csv. <b>Name is the card's identity everywhere, including in old saves</b> — renaming one breaks them. <b>Element</b> is what the Adventure pile reads."},
"BasicTeam.csv":{what:"The starter side. Same columns as any unit file.",
  key:"Name", enums:{Tier:TIERS, "Player Type":["Normal","Star"]},
  help:"These ship as Unit Type = Normal and Element = None, which is why AdventureTraits.csv has a Journeyman row — without it they would put nothing on the pile at all."},

/* ---------- the base and the glue ---------- */
"CardAbilities.csv":{key:"Ability ID", what:"YOUR CARDS' ABILITIES, MADE FROM THEIR TEXT. Do not edit here - change the card and re-run the two scripts.",
  enums:{Scope:["duel","round","cycle","match"]},
  help:"<b>Written by <code>python3 tools/ability_rows.py</code></b> from the readings in AbilityAudit.csv - one row per effect, ID <code>C_&lt;card&gt;_&lt;A/D/F&gt;</code> (a sentence with two halves is two rows, <code>_A1</code> and <code>_A2</code>, each with its own Trigger; round Z adds the <b>Cost</b> column), and the ID goes into the card's Attack / Defend Ability cell. Only rows whose words the engine runs are written; each finished phase adds the next batch.<br><b>Rebuilt from scratch every time</b>, so an edit here is lost. To change what a card does: change its text (or a ruling in AbilityRulings.csv), then run <code>python3 tools/ability_audit.py</code> and <code>python3 tools/ability_rows.py</code>.<br>Your own hand-written rows stay in Abilities.csv and are never touched - and a card cell you wrote yourself is left alone."},
"AbilityAudit.csv":{key:null, what:"EVERY ABILITY TEXT IN THE GAME, READ INTO ENGINE WORDS. 276 rows: the set cards, the Stars, the Emblems.",
  help:"<b>Written by <code>python3 tools/ability_audit.py</code>.</b> Each row is one sentence broken into <b>When / If / Cost / Do / Target / Value / Scope / Max</b> - the same answers an Abilities row gives - then <b>Words Needed</b> (what the engine does not know yet), <b>Phase</b> (which build phase brings them, guides/COMBAT_PHASES.md) and <b>Status</b>.<br><b>Your Ruling</b> is yours: write in it and re-running the script keeps it. The questions themselves are grouped, once each, in AbilityRulings.csv - answer there."},
"AbilityRulings.csv":{key:"ID", what:"THE QUESTIONS THE CARD TEXT LEAVES OPEN - each asked once. Write in Your Ruling.",
  help:"<b>F1-F4 decide how every ability fires</b> (one side per duel, outside a duel, Reveal, priority). <b>R01-R17</b> are about wording: which keeper, what \u201cnext\u201d means, where Ore lives... <b>Cards</b> says how many cards each answer touches - R03 and R12 move the most.<br>Until you answer, the engine uses <b>My Reading</b>. Re-running <code>tools/ability_audit.py</code> keeps your answers."},
"RecruitBoard.csv":{key:null, what:"THE RECRUITMENT BOARD in the Club House (round AH, phase P3, your Q123). One row = one place on the board: a named plain player you can sign for coins.",
  cols:{"Slot":"num","Tier":["I","II","III","IV"],"Powers":"text","Cost":"number","Currency":"text","Requires":"text","Notes":"long"},
  help:"<b>Powers</b> is a list, <code>0 1 2</code>: one is drawn each time the board fills. Each needs a plain card at that tier and power to copy (BasicTeam.csv - <code>recruit_plain_class</code>). <b>Currency</b> is a row of Currencies.csv. <b>Requires</b> is the condition language; a place whose Requires is not met shows LOCKED with what it needs.<br><b>The board fills again after every match</b> (<code>matches_played</code>). A man you did not sign leaves and his name is free.<br><b>Beds:</b> you may hold (beds - <code>recruit_beds_kept</code>) recruits - the Dorms sell beds. <b>Tuning.csv:</b> <code>recruit_board</code> false hides it · <code>recruit_board_reroll_cost</code> coins for a new board now (0 = no button) · <code>named_recruits</code> must be on.<br>Signed recruits go to the Pub to be brewed into a class; they keep their name. <code>tools/recruit_board_check.gd</code> tries it all on a pretend save."},
"FreeKicks.csv":{key:null, what:"FREE KICKS AS A SET PIECE (round AG, phase P2, your Q075). A foul the referee sees gives the other side a free kick from WHERE THE FOUL WAS; this file says what it is worth by distance.",
  cols:{"Range":"text","Up To":"number","Shot Power":"number","Takes Ball":["yes","no"],"Call":"text","Caption":"text"},
  help:"<b>Up To</b> is how far from the goal the fouled side attacks, as a share of the pitch's length (0.25 = the quarter nearest that goal). Rows are read from the smallest; the first the spot fits is used, so the last row should say <code>1.00</code>.<br><b>Shot Power</b> is added to the fouled side's shot this round. <b>Takes Ball</b> <code>yes</code> = they take the ball and shoot this round, from the foul spot - when it is YOURS a window asks who takes it (AUTO: the strongest attacker). <code>no</code> = only the Shot Power, and only if they were shooting anyway.<br><b>Caption</b> words: <code>{metres}</code> (the pitch counts as 105 m) and <code>{taker}</code>.<br><b>Tuning.csv:</b> <code>free_kicks</code> 0 brings back the old flat <code>foul_free_kick_power</code>. A yellow or red still gives the ball (<code>foul_card_gives_possession</code>)."},
"OreShop.csv":{key:null, what:"BELIAL'S ORE SHOP (round AF, his Ultimate). While Belial's Ultimate is up, a Bergmännlein about to duel may buy ONE thing here.",
  cols:{"Item":"text","Cost":"number","Effect":["power","shield","keeper","stamina"],"Value":"number","Words":"text","Notes":"long"},
  help:"<b>One row = one thing for sale.</b> <b>Cost</b> is Ore. <b>Effect</b>: <code>power</code> = +Value power this combat · <code>shield</code> = +Value shield on your keeper · <code>keeper</code> = your keeper Value% harder to beat until the next shot · <code>stamina</code> = +Value stamina to your keeper. <b>Words</b> is what the window says.<br><b>Buying IS that card's ability this duel</b> - its own Attack / Defend text does not go off (Belial's text: 'accessing the ore shop counts as the ability trigger'). You are asked; AUTO and the AI buy the best power item they can afford."},
"Mines.csv":{key:null, what:"WHERE THE MINES ARE (round AD, phase C6, your Q091): one per zone at the side of the field. An earth unit that comes near one of its side's mines during waiting play is MINING.",
  cols:{"Mine":"text","Side":["you","them","both"],"Across":"number","Down":"number","Notes":"long"},
  help:"<b>One row = one mine.</b> <b>Across</b> runs from 0 (your goal line) to 1 (theirs); <b>Down</b> from 0 (the top touchline) to 1 (the bottom one). <b>Side</b>: <code>you</code> = your mine, <code>them</code> = theirs, <code>both</code> = each side gets one there.<br><b>A side only gets its mines if it has an earth unit</b> (<code>mines_need_earth</code>). An earth unit within <code>mine_reach</code> pixels of one of its mines during waiting play is MINING - its draft card says so and <i>If another unit is mining</i> is true. <b>Every mine worked since the last PLAY MAKER gives +1 Ore</b> (<code>mine_ore_per_round</code>, your Q055). Earth units with nothing to do drift to their mines (<code>mine_pull</code>).<br>Keep mines inside the dashed <code>edge_keep</code> lines (Down between 0.1 and 0.9) or nobody is sent to them."},
"PlayMakerStarts.csv":{key:null, what:"HOW A PLAY MAKER STARTS (round AC, your Q060): a throw-in, a corner, a goal kick, the keeper's ball, a drop ball or a storm gust - picked by where the ball is when play stops.",
  cols:{"Start":["throw_in","corner","goal_kick","keeper_claim","drop_ball","storm_gust"],"Zone":["wide","middle","any"],"Chance":"number","Restart":["chooses","attacks","race","coin"],"Call":"text","Caption":"text","Notes":"long"},
  help:"<b>ONE ROW = ONE WAY A ROUND CAN START.</b> When play stops the game looks at where the ball is (<b>wide</b> = near a touchline, see <code>play_maker_wide_band</code>; else <b>middle</b>), takes every row whose Zone is that or <b>any</b>, and draws one by <b>Chance</b> (a weight, not a percentage - 100 and 12 means the first is about eight times as likely). 0 switches a row off.<br><b>Restart</b> says who decides which way round the round is played: <code>chooses</code> = the player taking it picks ATTACK or DEFEND (the throw-in screen) · <code>attacks</code> = the side restarting attacks Tier I (your Q061) · <code>race</code> = the old clash, the winner attacks · <code>coin</code> = a random side.<br><b>Call</b> is the big word on the pitch and <b>Caption</b> the line in the little animation window: <code>{loser}</code> <code>{thrower}</code> <code>{keeper}</code>.<br><b>The beats</b> (timing, sounds, the window) are still <b>OutOfBounds.csv</b> - its say row shows <code>{call}</code> and its window row <code>{caption}</code>.<br><b>A corner</b> blames a defender near HIS OWN goal line, <b>a goal kick or a keeper's ball</b> an attacker near the goal he attacks - waiting play keeps the ball in quarters 2 and 3, so those rows are Zone <code>any</code> and happen where that player stands. To see each one: <code>SHOT_START=corner</code> on tools/combat_shot.gd."},
"Questions.csv":{key:"ID", what:"EVERYTHING CLAUDE NEEDS TO ASK YOU - as many as there are. Write in Your Answer.",
  cols:{"ID":"text","Area":"text","Question":"long","Why It Matters":"long","Options":"long","My Default (playing now)":"long","Your Answer":"long","Status":["open","answered","built","pinned"],"Round":"text"},
  help:"<b>ROUND AA.</b> One row per question. <b>My Default</b> is what the game already does, so a blank answer is never a broken game. Write in <b>Your Answer</b> - a letter from Options is enough, or words. Claude reads this file first every round, builds what you answered, and sets Status to <code>built</code>. New questions arrive at the bottom; your answers are never overwritten. Questions about one card's wording stay in AbilityRulings.csv. <code>python3 tools/questions.py</code> counts them."},
"Names.csv":{key:null, what:"EVERY PLAYER'S OWN NAME. Common German first names, and surnames for when they run out.",
  cols:{"First Name":"text","Surname":"text","Notes":"long"},
  help:"<b>Two lists in two columns</b> - they do not have to be the same length and order does not matter. A recruit gets a FIRST NAME nobody has; when those run out, a first name AND a surname (<i>Johannes Bauer</i>).<br><b>Taken means</b> any card in any unit file is called that, or any player at your base is. So a recruit is never Gremory, never M\u00fcller, and never a second Johannes.<br><b>He keeps it until he leaves the base</b> (<code>release:Johannes</code>). Drinking, turning into a Lorelei, a red card - none of those touch his name.<br>Recruit somebody with <code>recruit:I0</code> (Tier I, Power 0) or <code>recruit:I0=Johannes</code> in any Effects, Do, Action or Reward column. Nobody shows on screen until <code>named_recruits</code> in Tuning.csv is true. <code>tools/round_x_check.gd</code> hands out 300 names and checks none repeat."},
"Brews.csv":{what:"What the Pub pours. A brew changes what a card COUNTS AS — its class for the league, its icon for Adventure.",
  key:"ID", enums:{Permanent:TF},
  help:"<b>Pool</b> (round AN, plain beer): a word here takes the row off the Pub's list and puts it in a lucky dip. An item whose Use is <code>brew:pool:plain</code> picks one row of that pool at random (among those whose Requires pass) every time a bottle is opened. Plain beer rows are a good Attack Ability and its bad opposite as the Defend Ability, and take hold however sober he is.<br><b>Inspiration</b> (round AN, the drunk meter) is how much of a player's meter one pour fills, in %. A row with no Becomes and no abilities is a <b>plain beer</b> - it only fills the meter, and it is the only thing a sober player can be given. Below the <code>brews</code> level of DrunkLevels.csv no elemental or inspirational brew takes hold.<br><b>Drinks</b> (round X) makes a <b>TURNING BREW</b>: a number here means it takes that many pours on a plain card, and then the card BECOMES the class for good, at its own tier and power, keeping its name. On the last pour the Pub asks which card he becomes - one per set. A different element in between starts the count again. Blank = an ordinary brew, exactly as before. The four <code>turn_</code> rows are the examples.<br><b>Cost</b> is <code>reed:6|bog_iron:2</code> — the Pub takes those out of your counters when it pours. <b>Becomes</b> is the class it fights as. <b>Element</b> is the icon it carries in Adventure: a Lorelei who drinks a Fire Brew genuinely brings Fire to the pile."},
"Talents.csv":{what:"The talent tree. A talent can edit any Tuning number permanently.",
  key:"ID", help:"<b>Effects</b> with <code>count:tune_</code> in front of a Tuning key changes that number: <code>count:tune_press_speed+12</code>. Any row of Tuning.csv can be driven this way."},
"Referee.csv":{key:"ID", what:"THE MAN WITH THE WHISTLE. A foul is two questions now: did one happen, and did he see it.",
  cols:{"ID":"text","Name":"text","Portrait":"text","Segments":"num","Fill Per Trigger":"num","Fill Per Foul":"num","Caught When Full":"num","Caught Per Segment":"num","Caught After Yellow":"num","Red Per Yellow":"num","Caught Per Own Foul":"num","Card Per Own Foul":"num","Empties On":["card","never"],"Says Nothing":"long","Says Free Kick":"long","Says Yellow":"long","Says Red":"long"},
  help:"<b>Fouls.csv decides whether a foul HAPPENED. This file decides whether he SAW IT</b> - and if he did not, nothing happens at all: no card, no free kick, no whistle. You got away with it.<br><b>The bar.</b> Every trigger a side sets off adds <code>Fill Per Trigger</code>; every foul he MISSES adds <code>Fill Per Foul</code>, which is much bigger - getting away with one is exactly when he starts paying attention. He has <code>Segments</code> of them, which is your 1 to 5.<br><b>While it fills</b> the chance he notices is <code>Caught Per Segment</code> for each lit segment. <b>Full</b>, it is <code>Caught When Full</code> - 95 or 100, so the next foul is a card near enough every time. <b>And once you have been booked he is watching you:</b> <code>Caught After Yellow</code> replaces all of it whatever the bar says.<br><b>Red is built from yellows.</b> <code>Red Per Yellow</code> is added to the chance a yellow becomes a red, for every booking that side already has. With no yellows it adds nothing.<br><b>THE REPEAT OFFENDER</b> (round X). <code>Caught Per Own Foul</code> is added to the chance he notices, for every foul THAT MAN has already committed this match - unseen ones included. <code>Card Per Own Foul</code> is the chance a foul he does see is a yellow instead of a free kick, per earlier foul. A man on his third foul is easy to spot however quiet the bar is.<br><b>Three referees ship</b> - <code>*</code> for everyday, a lenient one and a strict one - and <code>referee_id</code> in Tuning.csv picks, so a cup final can have a stricter man than a friendly. <code>tools/referee_check.gd</code> plays ten thousand rounds against each and tells you what share of fouls he misses. <b>Around half is the shape you want:</b> over 80% and the bar is decoration, under 20% and it is the system you had before the bar existed."},

"Motion.csv":{key:"Moment", what:"HOW EVERYTHING MOVES. Buttons, windows, screens, the referee walking on.",
  cols:{"Moment":"text","Seconds":"num","Move X":"num","Move Y":"num","Scale":"num","Ease":["out","in","both","none"],"Shake":"num"},
  help:"<b>Feel is a number you change and look at.</b> A feel buried in fifteen scripts is a feel nobody ever tunes, so every movement in the game is a row here.<br><b>Move X/Y is how far it travels FROM WHERE IT ENDS UP</b>, so -2 on Y means it starts two pixels high and settles down. <b>Scale is how big it starts:</b> under 1 it GROWS into place, over 1 it SHRINKS into place - and those read completely differently. Growing is a thing arriving; shrinking is a thing being put away.<br><b>Ease</b> is the shape of the movement: <code>out</code> is fast then settling, which is how a real object behaves; <code>in</code> is slow then arriving, which is right for a press because your finger is doing the work; <code>none</code> is linear and reads as a machine.<br><b>EVERY NUMBER IN HERE IS SMALL AND FAST.</b> Two pixels, three per cent, a tenth of a second. The temptation is to make them bigger and the result is a game that feels like it is wading - a button that moves two pixels reads as pressable, one that moves ten reads as broken. <code>goal</code> is the one row allowed to be loud.<br><b>A moment with no row simply does not move</b>, so you can delete every row in this file and the game still works. It just stops feeling like anything."},

"ArtOrders.csv":{key:"ID", what:"THE WORK ORDER FOR THE ART, by phase (A1-A5, round AH), in the order to make them.",
  cols:{"Order":"num","ID":"text","Tool":"text","Width":"num","Height":"num","Elements":"text","Palette":"text","Prompt":"long","Then":"text","Goes To":"text","Status":"text","Sheet":"text","Cut":"text","Finish":["","plain","light","dark-centre","plain-button","reduce","bar-back","bar-fill","lit:button","pressed:button"],"Notes":"long","Phase":["pass 1","A1","A2","A3","A4","A5"]},
  help:"<b>ROUND AH: THE ART PHASES.</b> <b>Phase</b> says which art phase an order belongs to: A1 the pitch, title and base yard (the pitch first) · A2 the referee and the twelve emblems · A3 menu plaques and the font · A4 the unit art for every class, the Basic Team and the Stars · A5 the icons in ICONS_WANTED.csv. <code>python3 tools/art_status.py</code> says what is done, what is missing and the next order to make.<br><b>ROUND X: ORDERS 1-7 ARE DONE</b> and in the game. PixelLab's UI tool returns a whole SHEET of panels, so three columns say how a file is cut from one: <b>Sheet</b> (in <code>art_source/pixellab/</code>), <b>Cut</b> (<code>x y width height corner</code>) and <b>Finish</b>. Then run <code>python3 tools/cut_chrome.py</code>. Regenerate a sheet, save it over the old one, run it again - that is the whole loop.<br><b>Do number 1 first and do not move on until it is right.</b> Every box in the game is drawn from the panel, so it sets the look of everything - and the result is then passed as <code>style_image</code> to all thirteen below. That is what makes fourteen separate generations read as one game rather than fourteen.<br><b>Three phases.</b> 1-7 is the nine-slice chrome, which dresses every screen at once. 8-11 is the screens you see first, including the pitch. 12-14 is the referee, the twelve emblems and optionally a font.<br><b>Two numbers worth knowing.</b> The wallpaper is 480x270 because that is exactly a quarter of 1920x1080, so scaling up lands on whole pixels and stays sharp - the game already draws everything nearest-neighbour, so it reads as deliberate rather than blurry. And the pitch is the biggest single win available: the one in the project is 1000x667, the wrong shape, stretched into a 16:9 box and blown up 2.56 times.<br><b>Marcinelle in pixels.</b> Heavy 1px black outline, flat fills with no gradients, exaggerated silhouettes, a warm limited palette and ONE hot accent. All five survive at 96 pixels; a brush line does not."},

"Star Players.csv":{key:"Name", what:"THE THREE STARS OF EACH CLASS. They carry the Emblems onto the pitch.",
  cols:{"Unit Type":"text","Name":"text","Front Side":"long","Ultimate Side":"long","Element":"text","Base Power ":"num","Tier":"tier","Card Number":"num","Emblem":"text","Set":"text","Set Name":"text","Artwork":"text","Ultimate Artwork":"text","Player Type":"text"},
  help:"<b>A Star has ONE ability, not two.</b> <code>Front Side</code> is where a unit file writes Attack and Defend, and that is the design rather than a shortcut: a Star has one ability and an Ultimate; a normal unit has two abilities and no Ultimate. The loader fills both faces from Front Side.<br><b>Ultimate Side</b> is the other face. It is readable on hover at any time - earned or not, because an Ultimate you only see once you have it is one you never aimed at - and it goes live when this Star's Emblem completes its Condition. The Emblem and the Star turn over together.<br><b>Emblem</b> names the row of &lt;Class&gt; Emblems.csv this Star carries; <b>Set</b> names the set of nine that can complete it. Both default to the Star's own name, so you only fill them in when they differ - which for Gremory, whose nine are the Sitri set, they do."},

"Elements.csv":{key:"Element", what:"THE FOUR ELEMENTS. What a class shares with OTHER classes.",
  cols:{"Element":"text","Display Name":"text","Colour":"text","Icon":"text","Order":"num","Opposes":"text"},
  help:"<b>An Emblem's Basic side is fed by ELEMENT and its Condition is fulfilled by CLASS.</b> Any water unit, whatever its class, counts toward a Lorelei Emblem's Basic side; only a Lorelei can complete the Condition that turns it over.<br>So a mixed water team gets a broader engine and gives up the Ultimate, and a mono-class team gets the Ultimate and a narrower engine. That is a real choice and it costs no code - it is the <code>Basic Feeds</code> column of an Emblems file, and <code>element</code> is its default.<br>Four elements is the whole set. The plan is one class per element first, then more classes inside each element."},

"UnitActions.csv":{key:"ID", what:"THE VOCABULARY UNIT ABILITIES ARE ROLLED FROM. Triggers and effects.",
  cols:{"ID":"text","Kind":["trigger","effect"],"Keyword":"text","Text":"long","Element":"text","Class":"text","Set":"text","Tier":"text","Side":["attack","defend","both"],"Weight":"num"},
  help:"<b>Every unit ability is a TRIGGER and an EFFECT joined by a colon</b> - which is exactly how you already write them: \"If you control a token: Deal 1 damage to the enemy goalie\". That is why they can be generated, and this file is the two halves.<br><b>The placeholders.</b> <code>{token}</code> is the SET'S OWN WORD, out of the Token column of its Emblems row - Rose Unit, Swan, Song counter, burn counter, Teufel Mask. That single placeholder is what makes nine units read as a set that belongs together rather than nine units that happen to share a class. <code>{tier}</code>, <code>{element}</code>, <code>{class}</code> and <code>{n}</code> are filled from the class and the card being rolled.<br><b>Element, Class, Set and Tier narrow where a line may appear</b> - <code>*</code> means anywhere. A line with Element FIRE is never rolled for a water set, which is how a class keeps its voice while most of the vocabulary is shared. <b>Side</b> is attack, defend or both. <b>Weight</b> is how often it comes up: a weight-3 line turns up three times as often as a weight-1.<br><b>The + New class button is what uses this.</b> A roll is a first draft and every line is editable before anything is written."},

"Buildings.csv":{what:"THE DOORS ON THE TOWN MAP (seven since round AN: Team Build and Achievements moved to the top-row buttons). Each one opens a window OVER the base rather than cutting to a new scene.",
  key:"ID",
  help:"<b>Map Art</b> (round AN): a picture in <code>assets/base/map/</code>. Give a building one and it IS that picture on the town map - the picture is the button, no plaque; <b>Map Size</b> is how big it is drawn, WIDTHxHEIGHT (blank = its own size x2). Only its drawn pixels take a click, so neighbours never steal each other's clicks. <b>Name Offset</b> (x,y pixels) moves its name off the bottom middle. <b>Sound</b> is the Audio.csv row it plays when clicked, then <b>Door Sound</b> after base_door_sound_delay seconds. Blank Map Art keeps the old plaque.<br><b>Action decides what the door does.</b> <code>window:brewery</code> opens that screen over the base, dimmed, with the building still under your cursor - which is what these nine are. <code>goto:brewery</code> names the SAME screen and throws the base away instead; it still works, and it is what a Progression row should use when the base is not already open.<br><b>A BUILDING IS ALSO A RECIPE, and that has not gone anywhere.</b> <code>Requires: count:reed&gt;=20</code> with <code>Action: count:reed-20;count:coins+60</code> is a working trade with no code: Requires is the price check, Action is the trade. The base used to have four of those as worked examples - the Forge, the Still, the Reed Press and the Cold Cellar - and they were removed because they were demonstrations rather than rooms. Copy the pattern into a new row any time.<br><b>X and Y</b> are a fraction of the yard; 0.5,0.5 is the middle. <b>Requires</b> is the ordinary condition language, and a building whose Requires does not pass is drawn greyed with the reason on it rather than hidden.<br><code>tools/rooms_check.gd</code> checks that every Action actually names a screen - a door that leads nowhere looks exactly like a door that works. <br><b>A TERM THE GAME DOES NOT KNOW IS NOW SAID OUT LOUD.</b> <code>window</code>, <code>goto</code>, <code>story</code> and <code>announce</code> are the four actions that open something, so they are handed back
