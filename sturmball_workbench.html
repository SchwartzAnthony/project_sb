<title>Sturmball Workbench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f4f1e8; --card:#fffdf7; --raise:#faf7ee;
  --ink:#1b2027; --dim:#6d7684; --faint:#9aa2ae;
  --line:#ddd5c4; --hair:#e8e2d5;
  --accent:#a95c14; --accent-soft:#f0e2cf;
  --pitch:#3d6a45; --pitch-soft:#e0eade; --warn:#a33a23; --warn-soft:#f4ddd6;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12151a; --card:#191d24; --raise:#1f242d;
  --ink:#e4e8ef; --dim:#8a93a2; --faint:#646d7b;
  --line:#2b323d; --hair:#232932;
  --accent:#e0a04a; --accent-soft:#3a2d18;
  --pitch:#6aa374; --pitch-soft:#1d2c21; --warn:#e0765c; --warn-soft:#331d17;
}}
:root[data-theme="dark"]{
  --paper:#12151a; --card:#191d24; --raise:#1f242d;
  --ink:#e4e8ef; --dim:#8a93a2; --faint:#646d7b;
  --line:#2b323d; --hair:#232932;
  --accent:#e0a04a; --accent-soft:#3a2d18;
  --pitch:#6aa374; --pitch-soft:#1d2c21; --warn:#e0765c; --warn-soft:#331d17;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.lbl{font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;font-weight:600}

/* ---- shell ---- */
#shell{display:flex;flex-direction:column;height:100%}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;
  flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
#bar h1{font-family:var(--disp);font-size:24px;font-weight:700;letter-spacing:.03em;margin:0;text-transform:uppercase}
#bar h1 span{color:var(--accent)}
.grow{flex:1 1 auto;min-width:8px}
.btn{font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-weight:600;font-size:13px;
  background:var(--raise);border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.key{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.key:hover{filter:brightness(1.1);color:var(--card)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:default}

#body{flex:1 1 auto;display:flex;min-height:0}

/* ---- file rail ---- */
#rail{width:236px;flex:0 0 236px;background:var(--card);border-right:1px solid var(--line);overflow:auto;padding:12px 0 24px}
.railhead{font-size:11px;color:var(--faint);padding:6px 16px 8px}
.fitem{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:0;
  border-left:3px solid transparent;padding:7px 14px 7px 13px;cursor:pointer}
.fitem:hover{background:var(--raise)}
.fitem.on{background:var(--raise);border-left-color:var(--accent)}
.fitem .fn{flex:1 1 auto;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem.on .fn{color:var(--accent)}
.fitem .fc{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:0 0 auto}

/* ---- main ---- */
#main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
#head{padding:14px 18px 10px;border-bottom:1px solid var(--hair);background:var(--paper)}
#head h2{font-family:var(--disp);font-size:26px;margin:0;text-transform:uppercase;letter-spacing:.03em}
#what{color:var(--dim);font-size:13px;margin-top:2px;max-width:70ch}
#tools{display:flex;gap:7px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--hair)}
#wrap{flex:1 1 auto;overflow:auto;padding:0 0 30px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--line);
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.07em;font-size:12px;font-weight:600;
  text-align:left;padding:8px 9px;white-space:nowrap;color:var(--dim)}
th.req{color:var(--accent)}
td{border-bottom:1px solid var(--hair);padding:0;vertical-align:top}
tr:hover td{background:var(--raise)}
td.rn{font-family:var(--mono);font-size:11px;color:var(--faint);padding:7px 8px;text-align:right;
  background:var(--card);border-right:1px solid var(--hair);font-variant-numeric:tabular-nums;white-space:nowrap}
td input,td select,td textarea{width:100%;min-width:90px;background:transparent;border:0;padding:7px 9px;
  font-family:var(--mono);font-size:12.5px;border-radius:0}
td textarea{resize:vertical;min-height:32px;height:32px;line-height:1.4;overflow:auto}
td input:focus,td select:focus,td textarea:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--card)}
td.bad input,td.bad select{background:var(--warn-soft);box-shadow:inset 3px 0 0 var(--warn)}
td select{cursor:pointer;-webkit-appearance:none;appearance:none}
.rowtools{display:flex;gap:3px;padding:5px 7px;background:var(--card);border-right:1px solid var(--hair)}
.ico{background:none;border:1px solid transparent;color:var(--faint);cursor:pointer;border-radius:3px;
  width:22px;height:22px;line-height:1;font-size:13px;padding:0}
.ico:hover{border-color:var(--line);color:var(--accent)}
.ico.del:hover{color:var(--warn)}

/* ---- problems drawer ---- */
#probs{border-top:2px solid var(--line);background:var(--card);max-height:30vh;display:flex;flex-direction:column}
#probhead{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
#probhead .lbl{font-size:14px}
#problist{overflow:auto;padding:0 18px 14px}
.prob{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--hair);font-size:13px;align-items:flex-start}
.prob b{font-family:var(--mono);font-size:11px;color:var(--faint);flex:0 0 auto;padding-top:2px}
.prob .fix{color:var(--dim);display:block;margin-top:2px;font-size:12.5px}
.tag{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:600;
  padding:1px 7px;border-radius:2px;flex:0 0 auto}
.tag.err{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--pitch-soft);color:var(--pitch)}
.jump{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;font-size:12.5px}

/* ---- panels ---- */
#veil{position:fixed;inset:0;background:rgba(10,12,16,.62);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:5px;max-width:720px;width:100%;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.panel header{padding:16px 20px 10px;border-bottom:1px solid var(--hair)}
.panel header h3{font-family:var(--disp);font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.03em}
.panel .in{padding:16px 20px;overflow:auto}
.panel footer{padding:12px 20px;border-top:1px solid var(--hair);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea.csv{width:100%;height:270px;font-family:var(--mono);font-size:12px;background:var(--paper);
  border:1px solid var(--line);border-radius:3px;padding:10px;line-height:1.5}
.drop{border:2px dashed var(--line);border-radius:5px;padding:26px;text-align:center;color:var(--dim);margin-bottom:14px}
.drop.hot{border-color:var(--accent);background:var(--accent-soft)}
.note{font-size:12.5px;color:var(--dim);margin:10px 0 0}
.kbd{font-family:var(--mono);font-size:11.5px;background:var(--raise);border:1px solid var(--line);
  border-radius:3px;padding:1px 5px}
.empty{padding:50px 24px;text-align:center;color:var(--dim);max-width:60ch;margin:0 auto}
.empty h3{font-family:var(--disp);font-size:28px;text-transform:uppercase;margin:0 0 8px;color:var(--ink)}
.help{font-size:12.5px;color:var(--dim);padding:8px 18px;background:var(--raise);border-bottom:1px solid var(--hair)}
.help code{font-family:var(--mono);font-size:11.5px;color:var(--accent)}

@media (max-width:760px){
  #body{flex-direction:column}
  #rail{width:auto;flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}
  .railhead{display:none}
  .fitem{width:auto;flex:0 0 auto;border-left:0;border-bottom:3px solid transparent;border-radius:3px;padding:6px 10px}
  .fitem.on{border-left:0;border-bottom-color:var(--accent)}
  #bar h1{font-size:19px}
}
</style>

<div id="shell">
  <header id="bar">
    <h1>Sturmball <span>Workbench</span></h1>
    <div class="grow"></div>
    <button class="btn" id="bLoad">Load CSVs</button>
    <button class="btn" id="bCheck">Check</button>
    <button class="btn key" id="bExport">Export</button>
    <button class="btn sm" id="bTheme" title="Light / dark">◐</button>
  </header>

  <div id="body">
    <nav id="rail"><div class="railhead lbl">Files</div><div id="files"></div></nav>
    <main id="main">
      <div id="head"><h2 id="title">—</h2><div id="what"></div></div>
      <div class="help" id="help" hidden></div>
      <div id="tools"></div>
      <div id="wrap"><div class="empty" id="blank"></div></div>
    </main>
  </div>

  <section id="probs">
    <button id="probhead">
      <span class="lbl">Problems</span>
      <span id="probtag" class="tag ok">checking…</span>
      <span class="grow"></span>
      <span id="probchev" style="color:var(--faint)">▾</span>
    </button>
    <div id="problist"></div>
  </section>
</div>

<input type="file" id="pick" multiple accept=".csv" hidden>

/* ============================================================ */
let DATA = {}, CUR = null, PROBS = [], OPEN = true, SAMPLE = false;
const $ = s => document.querySelector(s);
const norm = s => String(s||"").trim().toLowerCase().replace(/[^a-z0-9]/g,"");

function boot(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem("sturmball.v1")||"null"); }catch(e){}
  SAMPLE = !(saved && Object.keys(saved).length);
  DATA = SAMPLE ? JSON.parse(JSON.stringify(unseed())) : saved;
  CUR = Object.keys(DATA)[0] || null;
  paintRail(); paintTable(); check();
}
function unseed(){
  const out = {};
  for(const [f,v] of Object.entries(SEED)) out[f] = {headers:v.h.slice(), rows:v.r.map(r=>r.slice())};
  return out;
}
function save(){
  try{ localStorage.setItem("sturmball.v1", JSON.stringify(DATA)); }catch(e){}
}

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  text = text.replace(/\r\n?/g,"\n");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else if(c==='"') q=true;
    else if(c===","){ row.push(cell); cell=""; }
    else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.length && r.some(c=>c.trim()!==""));
}
function toCSV(f){
  const d=DATA[f]; const esc=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  return [d.headers.map(esc).join(",")].concat(d.rows.map(r=>{
    const out=[]; for(let i=0;i<d.headers.length;i++) out.push(esc(r[i]??""));
    return out.join(",");
  })).join("\n")+"\n";
}

/* ---------- rail ---------- */
function paintRail(){
  const host=$("#files"); host.innerHTML="";
  const names=Object.keys(DATA).sort();
  for(const f of names){
    const b=document.createElement("button");
    b.className="fitem"+(f===CUR?" on":"");
    const bad=PROBS.some(p=>p.file===f);
    b.innerHTML=`<span class="fn"></span><span class="fc">${DATA[f].rows.length}</span>`+(bad?'<span class="dot"></span>':'');
    b.querySelector(".fn").textContent=f.replace(/\.csv$/i,"");
    b.onclick=()=>{CUR=f;paintRail();paintTable();};
    host.appendChild(b);
  }
}

/* ---------- table ---------- */
function paintTable(){
  const wrap=$("#wrap");
  if(!CUR||!DATA[CUR]){
    $("#title").textContent="Nothing loaded";
    $("#what").textContent="";
    $("#help").hidden=true; $("#tools").innerHTML="";
    wrap.innerHTML=`<div class="empty"><h3>Load your data folder</h3>
      <p>Drop your <span class="kbd">.csv</span> files in, or press <b>Load CSVs</b> and pick everything in your project's <span class="kbd">data</span> folder at once.</p></div>`;
    return;
  }
  const d=DATA[CUR], sch=S[CUR]||{};
  $("#title").textContent=CUR.replace(/\.csv$/i,"");
  $("#what").textContent=sch.what||"A file the workbench does not have notes for. It still edits fine.";
  $("#help").hidden=!sch.help; if(sch.help) $("#help").innerHTML=sch.help;

  $("#tools").innerHTML="";
  const mk=(t,fn,cls)=>{const b=document.createElement("button");b.className="btn sm "+(cls||"");b.textContent=t;b.onclick=fn;$("#tools").appendChild(b);return b;};
  mk("+ New row",()=>{
    const r=d.headers.map(h=>(NEW[CUR]||{})[h]||"");
    d.rows.push(r); save(); paintTable(); check(); paintRail();
    const inputs=wrap.querySelectorAll("tbody tr:last-child input,tbody tr:last-child select");
    if(inputs[0]) inputs[0].focus();
  },"key");
  mk("+ Column",()=>{
    const n=prompt("New column name (write it the way a person would — \"Max Stamina\"):");
    if(!n) return; d.headers.push(n); d.rows.forEach(r=>r.push("")); save(); paintTable();
  });
  mk("Copy this file",()=>showExport(CUR));
  mk("Sort by first column",()=>{d.rows.sort((a,b)=>String(a[0]).localeCompare(String(b[0])));save();paintTable();});

  const tbl=document.createElement("table");
  const thead=document.createElement("thead"), hr=document.createElement("tr");
  hr.innerHTML='<th style="width:1px"></th><th style="width:1px">#</th>';
  d.headers.forEach(h=>{
    const th=document.createElement("th");
    th.textContent=h;
    if(/^(requires|effects|action|do|reward)$/i.test(h)) th.className="req";
    hr.appendChild(th);
  });
  thead.appendChild(hr); tbl.appendChild(thead);

  const tb=document.createElement("tbody");
  d.rows.forEach((row,ri)=>{
    const tr=document.createElement("tr");
    const tools=document.createElement("td"); tools.className="rowtools";
    tools.innerHTML='<button class="ico" title="Duplicate">⧉</button><button class="ico del" title="Delete">✕</button>';
    tools.children[0].onclick=()=>{d.rows.splice(ri+1,0,row.slice());save();paintTable();check();paintRail();};
    tools.children[1].onclick=()=>{if(confirm("Delete this row?")){d.rows.splice(ri,1);save();paintTable();check();paintRail();}};
    tr.appendChild(tools);
    const n=document.createElement("td"); n.className="rn"; n.textContent=ri+2; tr.appendChild(n);

    d.headers.forEach((h,ci)=>{
      const td=document.createElement("td");
      td.appendChild(cell(CUR,h,row,ci,ri));
      if(PROBS.some(p=>p.file===CUR&&p.row===ri&&p.col===h)) td.className="bad";
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  wrap.innerHTML=""; wrap.appendChild(tbl);
}

function cell(file,head,row,ci,ri){
  const sch=S[file]||{}, val=row[ci]??"";
  const set=v=>{row[ci]=v;save();};
  const opts=(sch.enums||{})[head];
  const ref=(REFS[file]||{})[head];

  if(opts||ref){
    const sel=document.createElement("select");
    let list=opts?opts.slice():[""];
    if(ref){
      const [rf,rc]=ref, src=DATA[rf];
      if(src){
        const at=src.headers.indexOf(rc);
        if(at>=0){ const seen=new Set();
          src.rows.forEach(r=>{const v=(r[at]||"").trim(); if(v&&!seen.has(v)){seen.add(v);list.push(v);} }); }
      }
      if(val&&!list.includes(val)) list.push(val);
    }
    list.forEach(o=>{const e=document.createElement("option");e.value=o;e.textContent=o===""?"—":o;sel.appendChild(e);});
    sel.value=val; sel.onchange=()=>{set(sel.value);check();paintRail();};
    sel.id=`c_${norm(file)}_${ri}_${ci}`;
    return sel;
  }
  if((sch.colour||[]).includes(head)){
    const box=document.createElement("div"); box.style.display="flex"; box.style.alignItems="center";
    const sw=document.createElement("input"); sw.type="color"; sw.value=/^#[0-9a-f]{6}$/i.test(val)?val:"#213a26";
    sw.style.cssText="width:26px;min-width:26px;height:24px;border:1px solid var(--line);padding:0;margin:5px 0 5px 7px;cursor:pointer;background:none";
    const tx=document.createElement("input"); tx.value=val;
    sw.oninput=()=>{tx.value=sw.value;set(sw.value);};
    tx.oninput=()=>{set(tx.value); if(/^#[0-9a-f]{6}$/i.test(tx.value)) sw.value=tx.value;};
    tx.id=`c_${norm(file)}_${ri}_${ci}`;
    box.appendChild(sw); box.appendChild(tx); return box;
  }
  if(LONG.includes(head)&&String(val).length>34){
    const ta=document.createElement("textarea"); ta.value=val; ta.rows=1;
    ta.oninput=()=>{set(ta.value);}; ta.onblur=()=>{check();paintRail();};
    ta.id=`c_${norm(file)}_${ri}_${ci}`; return ta;
  }
  const inp=document.createElement("input"); inp.value=val;
  inp.oninput=()=>set(inp.value);
  inp.onblur=()=>{check();paintRail();};
  inp.id=`c_${norm(file)}_${ri}_${ci}`;
  return inp;
}

/* ============================================================
   THE CHECKER — the same questions the game asks at startup.
   ============================================================ */
function check(){
  PROBS=[];
  const add=(file,row,col,msg,fix)=>PROBS.push({file,row,col,msg,fix});
  const at=(f,c)=>DATA[f]?DATA[f].headers.indexOf(c):-1;
  const col=(f,c)=>{const i=at(f,c);return i<0?[]:DATA[f].rows.map(r=>(r[i]||"").trim());};
  const ids=(f,c)=>new Set(col(f,c).filter(Boolean).map(norm));

  /* 1. duplicate keys */
  for(const f of Object.keys(DATA)){
    const k=(S[f]||{}).key; if(!k) continue;
    const i=at(f,k); if(i<0) continue;
    const seen={};
    DATA[f].rows.forEach((r,ri)=>{
      const v=norm(r[i]); if(!v) return;
      if(seen[v]!==undefined) add(f,ri,k,`Two rows share the id "${(r[i]||'').trim()}".`,`Row ${seen[v]+2} has it too. Ids must be unique inside a file.`);
      else seen[v]=ri;
    });
  }
  /* 2. references */
  for(const [f,map] of Object.entries(REFS)){
    if(!DATA[f]) continue;
    for(const [c,[rf,rc]] of Object.entries(map)){
      const i=at(f,c); if(i<0||!DATA[rf]) continue;
      const pool=ids(rf,rc);
      DATA[f].rows.forEach((r,ri)=>{
        const v=(r[i]||"").trim(); if(!v) return;
        if(!pool.has(norm(v))) add(f,ri,c,`"${v}" is not in ${rf}.`,`Add a row there with that id, or pick one from the list.`);
      });
    }
  }
  /* 3. `and` where a semicolon belongs */
  const CONDS=["Requires","Effects","Action","Do","Reward","On Win","On Loss","Use"];
  for(const f of Object.keys(DATA)) for(const c of CONDS){
    const i=at(f,c); if(i<0) continue;
    DATA[f].rows.forEach((r,ri)=>{
      const v=r[i]||"";
      if(/\s+and\s+/i.test(v)) add(f,ri,c,`"and" is not a word this understands.`,`Terms are joined with a semicolon: <code>unlocked:Brewery;count:coins>=50</code>`);
    });
  }
  /* 4. counters read but never written */
  const written=new Set(), read=new Map();
  col("Stats.csv","Counter").forEach(v=>v&&written.add(norm(v)));
  col("Items.csv","ID").forEach(v=>v&&written.add(norm(v)));
  const SEASON=["seasonwins","seasondraws","seasonlosses","seasongoalsfor","seasongoalsagainst","seasonpoints","seasonmatch","seasonnumber","talentpoints"];
  SEASON.forEach(v=>written.add(v));
  for(const f of Object.keys(DATA)) for(const c of CONDS){
    const i=at(f,c); if(i<0) continue;
    DATA[f].rows.forEach((r,ri)=>{
      const v=r[i]||"";
      for(const m of v.matchAll(/count:\s*([A-Za-z0-9_ ]+?)\s*[+\-=]/g)) written.add(norm(m[1]));
      if(/^requires$/i.test(c)) for(const m of v.matchAll(/count:\s*([A-Za-z0-9_ ]+?)\s*[><=!]/g))
        if(!read.has(norm(m[1]))) read.set(norm(m[1]),{f,ri,c,raw:m[1].trim()});
    });
  }
  for(const [k,w] of read) if(!written.has(k)&&!k.startsWith("cleared"))
    add(w.f,w.ri,w.c,`Nothing ever adds to "${w.raw}".`,`This condition can never be true. Add a Stats.csv row that counts it, or an Action/Effects that gives it.`);
  /* 5. unlocks required but never granted */
  const grant=new Set(), want=new Map();
  col("Talents.csv","ID").forEach(v=>v&&grant.add(norm(v)));
  for(const f of Object.keys(DATA)) for(const c of CONDS){
    const i=at(f,c); if(i<0) continue;
    DATA[f].rows.forEach((r,ri)=>{
      for(const m of (r[i]||"").matchAll(/unlock:\s*([^;]+)/g)) grant.add(norm(m[1]));
    });
  }
  for(const f of Object.keys(DATA)){
    const i=at(f,"Requires"); if(i<0) continue;
    DATA[f].rows.forEach((r,ri)=>{
      for(const m of (r[i]||"").matchAll(/unlocked:\s*([^;]+)/g))
        if(!want.has(norm(m[1]))) want.set(norm(m[1]),{f,ri,raw:m[1].trim()});
    });
  }
  for(const [k,w] of want) if(!grant.has(k))
    add(w.f,w.ri,"Requires",`Nothing ever unlocks "${w.raw}".`,`Give it to somebody: <code>unlock:${w.raw}</code> in a Season reward, a Bounty reward, a Building action or a Progression row.`);
  /* 6. the tier ladder */
  const rungs={};
  if(DATA["TierPowers.csv"]){
    const t=at("TierPowers.csv","Tier"), lo=at("TierPowers.csv","Min Attack"), hi=at("TierPowers.csv","Max Attack");
    if(t>=0&&lo>=0&&hi>=0) DATA["TierPowers.csv"].rows.forEach((r,ri)=>{
      const a=parseInt(r[lo]),b=parseInt(r[hi]);
      if(isNaN(a)||isNaN(b))return;
      const list=[]; for(let p=a;p<=b;p++) list.push(p);
      rungs[norm(r[t])]=list;
      if(list.length!==3) add("TierPowers.csv",ri,"Max Attack",`Tier ${r[t]} holds ${list.length} cards, not three.`,`The pitch has three slots per tier. Keep Min to Max three wide.`);
    });
  }
  for(const f of Object.keys(DATA)){
    const u=at(f,"Unit Type"), p=at(f,"Base Power Left"), t=at(f,"Tier"), n=at(f,"Name");
    if(u<0||p<0||t<0) continue;
    DATA[f].rows.forEach((r,ri)=>{
      const tier=norm(r[t]), pw=parseInt(r[p]);
      if(!rungs[tier]||isNaN(pw)) return;
      if(!rungs[tier].includes(pw))
        add(f,ri,"Base Power Left",`${r[n]||"This card"} is Tier ${r[t]} with ${pw} power.`,`Tier ${r[t]} holds ${rungs[tier].join(", ")}. Change the power or the tier.`);
    });
  }
  /* 7. enemy layers */
  if(DATA["AdventureEnemies.csv"]){
    const L=at("AdventureEnemies.csv","Layers"), A=at("AdventureEnemies.csv","Attack"), N=at("AdventureEnemies.csv","Name");
    DATA["AdventureEnemies.csv"].rows.forEach((r,ri)=>{
      if(A>=0&&!(parseInt(r[A])>0)) add("AdventureEnemies.csv",ri,"Attack",`${r[N]||"This enemy"} has no Attack.`,`It could never hurt anybody. Give it at least 1.`);
      if(L<0) return;
      (r[L]||"").split("|").forEach(pc=>{
        const b=pc.trim().split(":"); if(b.length<3) return;
        const soak=parseInt(b[2]);
        if(soak>=5) add("AdventureEnemies.csv",ri,"Layers",`The "${b[0]}" layer soaks ${soak}.`,`The biggest power gap possible is 5, so almost nothing would get through. 0 to 3 is the useful range.`);
      });
    });
  }
  /* 8. brew costs name real items */
  if(DATA["Brews.csv"]&&DATA["Items.csv"]){
    const C=at("Brews.csv","Cost"), pool=ids("Items.csv","ID");
    if(C>=0) DATA["Brews.csv"].rows.forEach((r,ri)=>{
      (r[C]||"").split("|").forEach(pc=>{
        const nm=pc.split(":")[0].trim(); if(!nm) return;
        if(!pool.has(norm(nm))) add("Brews.csv",ri,"Cost",`"${nm}" is not in Items.csv.`,`A cost has to name a real item.`);
      });
    });
  }
  paintProbs();
}

function paintProbs(){
  const tag=$("#probtag"), list=$("#problist");
  if(!PROBS.length){ tag.className="tag ok"; tag.textContent="all clear"; }
  else { tag.className="tag err"; tag.textContent=PROBS.length+(PROBS.length===1?" problem":" problems"); }
  list.innerHTML="";
  list.hidden=!OPEN; $("#probchev").textContent=OPEN?"▾":"▸";
  if(!OPEN) return;
  if(SAMPLE && PROBS.length){
    const s=document.createElement("div"); s.className="prob";
    s.innerHTML='<span class="tag ok">sample</span><div><span>Most of these are the example set\'s own fault.</span>'+
      '<span class="fix">It is only the first six rows of each of your real files, so plenty of ids point at rows that were trimmed off. '+
      'Press <b>Load CSVs</b> and choose everything in your <b>data</b> folder — then this list is about your game.</span></div>';
    list.appendChild(s);
  }
  if(!PROBS.length){
    const d=document.createElement("div"); d.className="prob";
    d.innerHTML='<span style="color:var(--dim)">Every id is unique, every reference resolves, every counter that is read is written somewhere, and every card sits on its proper rung.</span>';
    list.appendChild(d); return;
  }
  PROBS.slice(0,120).forEach(p=>{
    const d=document.createElement("div"); d.className="prob";
    const b=document.createElement("b"); b.textContent=`${p.file.replace(/\.csv$/,"")} ${p.row+2}`;
    const body=document.createElement("div");
    body.innerHTML=`<span>${p.msg}</span><span class="fix">${p.fix||""}</span>`;
    const j=document.createElement("button"); j.className="jump"; j.textContent="show";
    j.onclick=()=>{
      CUR=p.file; paintRail(); paintTable();
      const el=document.getElementById(`c_${norm(p.file)}_${p.row}_${DATA[p.file].headers.indexOf(p.col)}`);
      if(el){ el.scrollIntoView({block:"center",behavior:"smooth"}); el.focus(); }
    };
    d.appendChild(b); d.appendChild(body); d.appendChild(j);
    list.appendChild(d);
  });
}

/* ---------- loading ---------- */
function ingest(name, text){
  const rows=parseCSV(text);
  if(rows.length<2) return false;
  const headers=rows[0].map(h=>h.trim());
  const body=rows.slice(1).map(r=>{const o=[];for(let i=0;i<headers.length;i++)o.push(r[i]??"");return o;});
  DATA[name]={headers,rows:body};
  return true;
}
function loadFiles(list){
  let n=0, left=list.length;
  if(!left) return;
  [...list].forEach(f=>{
    if(!/\.csv$/i.test(f.name)){ if(--left===0) done(); return; }
    const rd=new FileReader();
    rd.onload=()=>{ if(ingest(f.name, rd.result)) n++; if(--left===0) done(); };
    rd.onerror=()=>{ if(--left===0) done(); };
    rd.readAsText(f);
  });
  function done(){
    if(n){ SAMPLE=false; CUR=CUR&&DATA[CUR]?CUR:Object.keys(DATA)[0]; save(); paintRail(); paintTable(); check(); }
    closeVeil();
    if(!n) alert("Nothing loaded — pick .csv files.");
  }
}

/* ---------- panels ---------- */
function veil(inner){
  const v=document.createElement("div"); v.id="veil";
  v.innerHTML=`<div class="panel">${inner}</div>`;
  v.onclick=e=>{ if(e.target===v) closeVeil(); };
  document.body.appendChild(v);
  return v;
}
function closeVeil(){ const v=$("#veil"); if(v) v.remove(); }

function showLoad(){
  const v=veil(`<header><h3>Load your CSVs</h3></header>
    <div class="in">
      <div class="drop" id="drop"><b>Drop .csv files here</b><br>or use the button below. Pick them all at once — the workbench needs to see them together to check that they line up.</div>
      <p class="note">Your project's files live in <span class="kbd">project_sb/data/</span>. Nothing is uploaded anywhere; this all happens in your browser, and your work is kept between visits.</p>
    </div>
    <footer><button class="btn key" id="bPickGo">Choose files</button>
      <button class="btn" id="bSeed">Start from the example set</button>
      <div class="grow"></div><button class="btn" id="bClose">Close</button></footer>`);
  v.querySelector("#bPickGo").onclick=()=>$("#pick").click();
  v.querySelector("#bClose").onclick=closeVeil;
  v.querySelector("#bSeed").onclick=()=>{
    if(!confirm("Replace everything currently loaded with the example set?")) return;
    DATA=JSON.parse(JSON.stringify(unseed())); CUR=Object.keys(DATA)[0]; SAMPLE=true;
    save(); paintRail(); paintTable(); check(); closeVeil();
  };
  const d=v.querySelector("#drop");
  ["dragenter","dragover"].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add("hot");}));
  ["dragleave","drop"].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove("hot");}));
  d.addEventListener("drop",ev=>loadFiles(ev.dataTransfer.files));
}

function showExport(only){
  const names = only?[only]:Object.keys(DATA).sort();
  const v=veil(`<header><h3>${only?only:"Export everything"}</h3></header>
    <div class="in">
      <select id="which" style="width:100%;padding:8px;background:var(--paper);border:1px solid var(--line);border-radius:3px;margin-bottom:10px"></select>
      <textarea class="csv" id="out" spellcheck="false"></textarea>
      <p class="note"><b>Copy</b> puts the file on your clipboard — paste it into the real <span class="kbd">.csv</span> and save. <b>Download</b> writes the file directly, and works when you have opened this workbench from your own computer.</p>
    </div>
    <footer><button class="btn key" id="bCopy">Copy</button>
      <button class="btn" id="bDown">Download</button>
      <span id="said" style="color:var(--pitch);font-size:13px"></span>
      <div class="grow"></div><button class="btn" id="bClose2">Close</button></footer>`);
  const sel=v.querySelector("#which"), out=v.querySelector("#out");
  (only?names:Object.keys(DATA).sort()).forEach(n=>{
    const o=document.createElement("option"); o.value=n; o.textContent=n; sel.appendChild(o);
  });
  const show=()=>{ out.value=toCSV(sel.value); };
  sel.onchange=show; show();
  v.querySelector("#bClose2").onclick=closeVeil;
  v.querySelector("#bCopy").onclick=async()=>{
    try{ await navigator.clipboard.writeText(out.value); }
    catch(e){ out.select(); document.execCommand("copy"); }
    v.querySelector("#said").textContent=`${sel.value} copied.`;
    setTimeout(()=>{const s=v.querySelector("#said"); if(s) s.textContent="";},2600);
  };
  v.querySelector("#bDown").onclick=()=>{
    const blob=new Blob([out.value],{type:"text/csv"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=sel.value;
    document.body.appendChild(a); a.click(); a.remove();
    v.querySelector("#said").textContent="If nothing happened, use Copy instead.";
  };
}

/* ---------- wiring ---------- */
$("#bLoad").onclick=showLoad;
$("#bExport").onclick=()=>showExport(null);
$("#bCheck").onclick=()=>{ OPEN=true; check(); $("#problist").scrollIntoView({behavior:"smooth"}); };
$("#probhead").onclick=()=>{ OPEN=!OPEN; paintProbs(); };
$("#pick").onchange=e=>loadFiles(e.target.files);
$("#bTheme").onclick=()=>{
  const now=document.documentElement.getAttribute("data-theme");
  const next = now==="dark" ? "light" : now==="light" ? "dark"
    : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme",next);
  try{ localStorage.setItem("sturmball.theme",next); }catch(e){}
};
try{ const t=localStorage.getItem("sturmball.theme"); if(t) document.documentElement.setAttribute("data-theme",t); }catch(e){}
["dragenter","dragover","drop"].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault()));
document.addEventListener("drop",ev=>{ if(ev.dataTransfer&&ev.dataTransfer.files.length) loadFiles(ev.dataTransfer.files); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeVeil(); });

boot();
</script>
