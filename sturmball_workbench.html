to the screen rather than written into the save; everything else is ordinary effects language. For a while <code>window</code> was missing from that list of four, so <code>window:brewery</code> was quietly handed to the effects language, which ignores what it does not recognise - and clicking a building showed its description and opened nothing, with no error anywhere. That is fixed, and so is the shape of it: any term whose kind is neither of those four nor real effects language is now named in Godot's Output panel every time it runs. <b>If a button you wrote does nothing, look in the Output panel first.</b>"},
"Visitors.csv":{what:"People who turn up at the base. Their X and Y are a PREFERENCE - they are moved to free space so they never overlap a building or each other.",
  key:"ID", enums:{Once:TF},
  help:"<b>A VISITOR IS SOMEBODY WITH A FACE OR A ONE-TIME VISIT.</b> The loader recognises this file by its <code>Portrait</code> or <code>Once</code> column, not by its name - and that matters: Seasons.csv also has ID, Name and Story, so before that rule every season in the game was being drawn on the base as a person standing in the yard.<br><b>X and Y are only a preference.</b> If where a visitor wants to stand is on top of a building or another visitor, they are moved to the nearest free place; if the yard is genuinely full they are not drawn at all, because a visitor you cannot read is worse than one who is not there.<br><b>Story</b> names a Dialogue.csv scene. <b>Once</b> = true means they are gone after you have talked to them."},
"StoryArt.csv":{what:"THE PICTURES OF THE CONVERSATIONS (round AN): every face beside the text box and every room behind it. Dialogue.csv names a row by its ID.",
  key:null, enums:{Kind:["portrait","background"],View:["","front","side"],Faces:["","right","left"],Front:["","yes"]},
  cols:{"ID":"text","Kind":["portrait","background"],"Speaker":"text","Mood":"text","View":["front","side"],"Image":"text","Faces":["right","left"],"Front":["","yes"],"Scale":"num","Notes":"long"},
  help:"<b>Scale</b> (round AN): how big a face is drawn, 1 = normal. A face drawn closer in than the others gets 0.8 or so; it shrinks towards the bottom edge. Koch's sad face is 0.8. <b>Swap a face for every line at once</b>: change the <code>Image</code> of its row. <b>Speaker</b>: a Dialogue line with this speaker and an empty Portrait cell gets this face, so you never type it on every line. <b>Mood / View</b>: one character can have many rows, one per face (happy, sad ... ; front = looking at the player, side = talking to someone). <b>Faces</b>: which way a side drawing looks; the game mirrors it on the other side so everybody looks into the room. <b>A room in layers</b>: several background rows with the same ID, stacked first-row-at-the-back; <b>Front</b> = yes draws a layer in front of the people."},
"Progression.csv":{what:"WHEN THINGS HAPPEN. Unlocks, story scenes and announcements, fired off any game event.",
  key:"ID", enums:{Once:TF},
  help:"Terms in Requires are joined with a semicolon. <code>and</code> is NOT a word this understands. This is where achievements and unlocks are wired without code."},
"Stats.csv":{what:"What the game counts. A new counter is a new row and nothing else.",
  key:null, enums:{Event:["goal_scored","goal_conceded","shot_taken","save_made","duel_won","duel_lost","brew_drunk","match_ended","enemy_killed","wave_cleared","player_turned","player_recruited","foul_given","free_kick_won"]},
  help:"<b>When</b> filters the event: <code>tier=I</code>, <code>star=yes</code>, <code>result=win</code>, <code>brew=fire</code>. Blank is always. A Counter containing <code>{card}</code> makes one counter per card."},

/* ---------- words and numbers ---------- */
"Dialogue.csv":{what:"The story. A node graph in a spreadsheet: scenes, lines, and choices that carry effects.", key:null,
  help:"A line with no choices runs on to <b>Next</b>. A line with choices stops and asks. A choice whose <b>Requires</b> fails is greyed out rather than hidden, so the player can see what they missed.<br><b>Mood</b> and <b>View</b> (round AN) pick which face the speaker shows: Mood = happy, sad, drunk, mad (whatever StoryArt.csv has); View = front (talking to the player, the default) or side (talking to someone in the scene).<br><b>Sound</b> (round AN) plays a one-off sound as the line shows: an Audio.csv ID such as <code>bld_pub</code> (a beer hall cheering).<br><b>The stage</b>: everybody who has spoken stays on screen; one person alone stands in the middle facing you. An optional <b>Leaves</b> column sends people off (Speaker names or Portrait IDs, separated by ;, or all)."},
"Language.csv":{what:"Every word the game shows, by key. Add a column for a new language and the game finds it.", key:"Key"},
"Keys.csv":{what:"Keyboard and controller bindings, rebindable in Settings.", key:"Action"},
"MenuConfig.csv":{what:"The main menu. Buttons, where they sit, and what they do.", key:"Button ID", enums:{"Label On Art":["yes","no"]},
  help:"<b>X and Y are the button's centre</b> on a 1920 x 1080 screen. <b>Round AI:</b> <b>Hover Sound</b> and <b>Press Sound</b> name a row of Audio.csv or a file in assets/audio/ - blank = <code>menu_hover</code> / <code>menu_click</code>. Start plays <code>menu_start</code>, Quit <code>menu_back</code>. <b>Round AL: Label On Art</b> yes = the Art Path picture is a blank plank and the Label is written on it (one plank for every button; hover brightens it). What the screen LOOKS like is MainMenu.csv."},
"MainMenu.csv":{key:null, what:"WHAT THE TITLE SCREEN LOOKS LIKE (round AI): the wallpaper, the title, and pictures standing on it (the hero).",
  cols:{"Part":["background","layer","title","picture"],"Image":"text","Text":"text","X":"number","Y":"number","Width":"number","Height":"number","Frames":"number","FPS":"number","Scale":"number","Flip":["yes",""],"Motion":["","drift","sway","swing","bird","follow"],"Motion Settings":"text","Notes":"long"},
  help:"<b>background</b>: the wallpaper (the first row wins). <b>title</b>: the big word - Text, and Height is the font size. <b>picture</b>: anything standing on the screen, as many rows as you like. X and Y are the CENTRE on a 1920 x 1080 screen (round AL LAYERS: rows are drawn top to bottom, back to front - the title in its own place; <b>Scale</b> 2 draws a picture at twice its pixels so all layers match; <b>Flip</b> yes mirrors it. The title uses X too, with Width = the box it is centred in; the Oktoberfest sign is a picture row behind it). A picture can be a STRIP of <b>Frames</b> pictures side by side, played at <b>FPS</b> - the hero is 8 frames. Keep Width/Height a whole multiple of the picture's pixels (x2, x3) so the pixel art stays sharp.<br>The two PixelLab wallpapers: <code>menu_chaos_a.png</code> (the riot) and <code>menu_chaos_b.png</code> (the beer tents at sunset); the beer hall is <code>background.png</code>.<br><b>Round AN - the moving title screen:</b> <b>layer</b> = a whole-screen picture drawn like the wallpaper, stacked in row order (sky, clouds, village, ribbons). <b>Motion</b> makes a row move, with its numbers in <b>Motion Settings</b> as <code>name=value; name=value</code>: <b>drift</b> (layer slides sideways for ever - <code>speed</code>), <b>sway</b> (layer waves like hanging cloth - <code>amount, speed, from=top/bottom, reach, wave, phase, curve</code>), <b>swing</b> (picture swings round its top-middle - <code>amount</code> degrees, <code>speed</code>), <b>bird</b> (a 3-pose strip flies in, sits at X/Y, flies off - <code>delay, fly, stay, leave, from=x,y, to=x,y, flap, arc</code>; <code>sync=music; land=5</code> ties it to the menu song - it lands 5 seconds into the song every time the song loops), <b>follow</b> (title row: written on the picture above it, moves with it)."},
"ArtStyle.csv":{key:"Key", what:"THE ART STYLE: the art_bible row (round AN) ends every PixelLab prompt; tools/art_prompt.gd builds prompts from the recipe_ rows. Older rows: the words every art prompt starts with, so every picture comes out Marcinelle school. Read with guides/ART_STYLE.md; your references are in art_source/style_refs/.",
  cols:{"Key":["style","ugliness","line","colour","avoid","pipeline","style_sheet","character_prompt","layer_prompt","house_style_name","stammtisch_prompt","stammtisch_eyes","stammtisch_nose","stammtisch_mouth","stammtisch_body","stammtisch_world","stammtisch_avoid"],"Text":"long","Notes":"long"},
  help:"<b>style</b> - which comics. <b>ugliness</b> - ugly by EXAGGERATION (noses, eyes, teeth, gangly or pot-bellied), never by animal parts. <b>line</b> - wobbly black brush ink. <b>colour</b> - flat, 2-3 tones. <b>avoid</b> - what went wrong before. <b>pipeline</b> - comic master in PixelLab first, then tools/pixelate.py. <b>style_sheet</b> - the small sheet of your references sent to PixelLab as the style image.<br>Change a row and every picture made from then on follows it."},
"Pixelate.csv":{key:"ID", what:"COMIC FIRST, PIXELS SECOND (round AJ): turns a Marcinelle-school comic master into the pixel art the game uses. Run python3 tools/pixelate.py.",
  cols:{"ID":"text","Source":"text","Output":"text","Height":"number","Colours":"number","Outline":["yes","no"],"Ink":"number","Crop":["yes","no"],"Smooth":"number","Aspect":"text","Widen":"number","Key Colour":"text","Neutral":"number","Flip":["yes",""],"Fill Holes":"text","Max Hole":"number","Notes":"long"},
  help:"<b>Source</b>: the comic drawing (from Ludo.ai, or your own) in art_source/. <b>Output</b>: where the pixel art goes. <b>Height</b>: pixels tall (the width follows) - the screen draws it 2x, 3x... so keep the size you show it at a whole multiple. <b>Colours</b>: fewer = more pixel-art. <b>Outline</b>: a 1-pixel black ink line round the outside. <b>Ink</b>: colours darker than this become pure black ink (0 = off). <b>Crop</b>: trim the empty space first. <b>Aspect</b> (round AL): e.g. 16:9 trims a full-screen background to shape first. <b>Widen</b>: 1.5 stretches only the middle (buttons, signs). <b>Key Colour</b> (round AM): e.g. #fdf3d0 cuts away a filled background where it touches the edge. <b>Neutral</b> 0-1: takes the yellow AI tint out. <b>Flip</b>: yes mirrors it (turn a character round). <b>Max Hole</b>: with Fill Holes, only fill holes smaller than this % (0.6 = ball panels, not arm gaps). <b>Smooth</b> (round AL): 0 off; 5/7/9 melt the hatching BEFORE shrinking, for clean flat pixel art (7 for an OpenAI master). <b>Fill Holes</b> (round AK, PixelLab masters only): a colour like <code>#f4f1ea</code> for see-through holes INSIDE the figure - PixelLab sometimes makes enclosed white see-through (a football's panels). About HALF the master's height keeps the ink lines.<br>Change a number, run <code>python3 tools/pixelate.py</code> (or <code>python3 tools/pixelate.py menu_hero</code> for one row), look in Godot."},
"ScreenLook.csv":{key:null, what:"WHAT A MENU SCREEN LOOKS AND SOUNDS LIKE (round AL): painted layers behind Settings and the save screen, a see-through shade, and every button as the oak plank with the menu sounds.",
  cols:{"Screen":"text","Part":["background","picture","shade","margin","button"],"Image":"text","X":"number","Y":"number","Width":"number","Height":"number","Scale":"number","Flip":["yes",""],"Colour":"text","Hover Sound":"text","Press Sound":"text","Back Sound":"text","Notes":"long"},
  help:"<b>Screen</b>: settings or slot. Rows are drawn top to bottom = back to front, all BEHIND the screen's own buttons. <b>background</b> fills the screen; <b>picture</b> is a layer (X/Y = centre, Scale 2 like every layer, Flip yes mirrors); <b>shade</b> = a dark see-through box, Colour #RRGGBBAA (AA = how solid); <b>margin</b> = Width from left/right, Height from top/bottom; <b>button</b> = the plank for every plain button, Colour = text colour, and its three sounds (Back Sound for Back / Close / Quit)."},
"SoundBuses.csv":{key:"Bus", what:"THE SOUND CHANNELS AND THEIR SLIDERS (round AN): one row per bus. The game makes each bus at start-up and Settings > Sound draws one slider per row.",
  cols:{"Bus":"text","Slider":"text","Setting":"text","Default":"number","Notes":"long"},
  help:"<b>Bus</b>: the name Audio.csv uses in its Bus column (Master, Music, Effects, UI, Voice). <b>Slider</b>: the words beside the slider. <b>Setting</b>: where settings.json keeps it (leave the old names alone, or players lose their volume). <b>Default</b>: 0 to 1 on a fresh install. Add a row and a new bus and slider appear; then point Audio.csv rows at it."},
"Rumble.csv":{key:null, what:"CONTROLLER RUMBLE (round AN): one row per moment the pad shakes. When and Match are the same moments Audio.csv uses.",
  cols:{"When":"text","Match":"text","Weak":"number","Strong":"number","Seconds":"number","Notes":"long"},
  help:"<b>When</b>/<b>Match</b>: the moment, as in Audio.csv (goal_scored, foul_shown + card=red card, save_made + power>=4). <b>Weak</b>: the small fast motor 0-1. <b>Strong</b>: the big slow motor 0-1. <b>Seconds</b>: how long. Two rows that fit: the stronger wins. Settings > Controller > Vibration turns it all off."},
"Songs.csv":{key:"Song", what:"MUSIC WRITTEN NOTE BY NOTE - NO AI (round AL): one row per song. Run python3 tools/make_song.py.",
  cols:{"Song":"text","Score":"text","Output":"text","Tempo":"number","Soundfont":"text","Reverb":"number","Loudness":"number","Humanize":"number","Notes":"long"},
  help:"<b>Score</b>: the notes, a CSV in data/songs/. <b>Output</b>: the looping .ogg - name it in Audio.csv. <b>Tempo</b>: beats a minute, 4 a bar. <b>Soundfont</b>: the recorded instruments (free GeneralUser GS). <b>Reverb</b>: 0-1 beer-tent room. <b>Loudness</b>: dB. <b>Humanize</b>: ms the players may drift (0 = robot).<br>Who plays is in <b>SongParts.csv</b>."},
"SongParts.csv":{key:null, what:"WHO PLAYS IN EACH SONG (round AL). One row per player.",
  cols:{"Song":"text","Part":"text","Plays":["melody","thirds","bass","chords","drum"],"Instrument":"number","Bank":"number","Volume":"number","Pan":"number","Octave":"number","Beats":"text","Length":"number","Notes":"long"},
  help:"<b>Plays</b>: melody = the tune; thirds = the tune a third lower (the Bavarian sound); bass = root then fifth on the Beats; chords = the short pah; drum = one drum. <b>Instrument</b>: General MIDI - 56 trumpet, 57 trombone, 58 tuba, 60 French horns, 71 clarinet, 21 accordion; drums 36 bass drum, 38 snare, 42 hi-hat, 49/57 crash. <b>Volume</b> 0-127, 0 = off. <b>Pan</b> -100..100. <b>Octave</b> +1/-1. <b>Beats</b> \"1 3\", \"2 4\", \"1& 3&\". <b>Length</b> in eighth-notes."},
"menu_blasmusik.csv":{key:"Bar", what:"THE MENU TUNE'S SCORE (round AL): one bar a row, written note by note.",
  cols:{"Bar":"number","Section":"text","Chord":"text","Melody":"text","Notes":"long"},
  help:"<b>Chord</b>: Bb, F7, Eb, Cm, Gm7 - the tuba and the pah follow it. <b>Melody</b>: 8 eighth-notes a bar - D5 is the D above middle C, Bb4 / Eb5 are flats, F#4 sharp; <code>-</code> holds the note before, <code>R</code> rests. The last bar should lead back into the first (it loops). Run <code>python3 tools/make_song.py</code>."},
"MusicLoops.csv":{key:"ID", what:"SEAMLESS MUSIC LOOPS (round AL): turns a Ludo.ai (or any) track into a loop the game plays round and round with no bump. Run python3 tools/make_loop.py.",
  cols:{"ID":"text","Source":"text","Output":"text","Start":"number","Length":"number","Bars":"number","Search From":"number","Search To":"number","Min Length":"number","Max Length":"number","Crossfade":"number","Fade Out":"number","Loudness":"text","Notes":"long"},
  help:"<b>Source</b>: the track as Ludo made it (art_source/ludo/music/). <b>Output</b>: the looping .ogg in assets/audio/ - name it in Audio.csv. <b>Start / Length</b>: leave BLANK and the script finds the cleanest loop and prints it; type seconds to force your own. <b>Bars</b> (round AL): loop exactly this many bars (8 or 16) so the beat never stumbles. <b>Search From / To</b>: only look between these seconds (the part you like). <b>Min / Max Length</b>: the old way, when Bars is blank. <b>Crossfade</b>: seconds blended at the join. <b>Fade Out</b> (round AL): seconds at the end that fade to silence before it starts again. <b>Loudness</b>: average level in dB (-16 for music), or <code>keep</code> = exactly as loud as the file.<br>Ludo tips (manual 16d): 40-second tracks, name every instrument, brass band not accordion (or it sounds like pirates)."},
"SoundRecipes.csv":{key:"Name", what:"SOUND EFFECTS FROM A SPREADSHEET (round AI, pyfxr). Each row becomes assets/audio/<Name>.wav when you run python3 tools/make_sfx.py.",
  cols:{"Name":"text","Wave":["square","saw","sine","noise"],"Base Freq":"number","Freq Ramp":"number","Duty":"number","Attack":"number","Sustain":"number","Punch":"number","Decay":"number","Arp Mod":"number","Arp Speed":"number","LPF Freq":"number","LPF Ramp":"number","HPF Freq":"number","Phaser Offset":"number","Phaser Ramp":"number","Repeat Speed":"number","Notes":"long"},
  help:"The classic <b>sfxr</b> dials, 0 to 1 (ramps -1 to 1). <b>Wave</b>: square for blips, noise for explosions and hits. <b>Base Freq</b>: how high (0.05 deep, 0.8 shrill). <b>Freq Ramp</b>: slide down (-) or up (+). <b>Sustain / Punch / Decay</b>: how long it stays loud, the kick at the start, the fade - lengths come out SQUARED, so 0.3 is about 0.1 s. <b>Arp Mod / Arp Speed</b>: the jump to a second note (the coin). <b>LPF Freq</b>: lower = muffled, bassy. <b>HPF Freq</b>: higher = thin, clicky.<br>Change a number, run <code>python3 tools/make_sfx.py</code> (it needs <code>pip install pyfxr</code> once), listen in Godot. Name the sound in Audio.csv's Sound column, or in MenuConfig.csv."},
"SimMatchups.csv":{key:null, what:"WHAT THE SIMULATION PLAYS (round AI): tests/sim_runner.gd plays 1,000 matches split between these rows.",
  cols:{"Matchup":"text","Home":"text","Away":"text","Home Picks":["random","strongest","weakest"],"Away Picks":["random","strongest","weakest"],"Share":"number","Notes":"long"},
  help:"<b>Home / Away</b>: a class, <code>Normal</code> for the Basic Team, or <code>random</code> (drawn from <code>sim_classes</code> in Tuning.csv). <b>Picks</b>: how a side chooses its card in each tier each round. <b>Share</b>: how much of the run this row gets (0 = off).<br>Run: <code>godot --headless --path . --script res://tests/sim_runner.gd</code> -> <code>data/combat_telemetry.json</code>, then <code>python3 tools/balance_analysis.py</code> -> <code>guides/BALANCE_ANALYSIS.md</code>. The simulation is the real combat without the pitch: no touches, mines, gravestones, fouls or Ultimates."},
"Tuning.csv":{what:"EVERY NUMBER IN THE GAME, in one place. A talent can edit any of these at runtime.", key:"Key",
  help:"Rows worth knowing: <code>juice_scale</code> 0 kills every shake and flash · <code>juice_slowmo_depth</code> 1.0 means no slow-motion at all · <code>adventure_trait_bar</code> false hides the row of icons · <code>adventure_enemy_combos</code> false and the enemies get no combos."},
"Achievements.csv":{what:"THE ROOT OF THE GAME. Nothing exists until an achievement hands it over - every room, Brewery section, brew, emblem and Stadium layer below is unlocked here first.",
  key:"ID", enums:{Hidden:YN},
  help:"<b>EVERYTHING NEEDS TO BE UNLOCKED HERE FIRST.</b> That is what makes this the root of the game: a room in the base is not there, a Brewery section cannot be worked in, a Stadium layer is off, until a row of this file says so.<br><b>Needs</b> is the ordinary condition language - <code>count:goals&gt;=10</code>, <code>flag:x</code>, <code>unlocked:y</code>, joined with semicolons. <b>Unlocks</b> is what it hands over, semicolons for more than one. <b>Reward</b> is anything else in the Do language: <code>give:coins+50</code>, <code>announce:Text</code>, <code>story:chapter2</code>.<br><b>A row needs either an Unlocks or a Reward.</b> One with neither is earned and then does nothing.<br><b>IT IS NOT A NEW VOCABULARY, AND THAT IS THE POINT.</b> The game already had one way to say \"you have this\": <code>unlock:Brewery</code> grants it and <code>unlocked:Brewery</code> tests it. A second, parallel system would mean two answers to \"is the Brewery open\", and one day they would disagree. So the Unlocks column is turned into exactly those words, and everything downstream never knows this file exists - which means you can move where something is granted from without touching the thing that is granted.<br><b>Unlock names are matched loosely</b> - lowercase, letters and digits only. <code>Master Brewer</code>, <code>master_brewer</code> and <code>master brewer</code> are ONE unlock. Your spreadsheets spell it all three ways and that is fine.<br><b>Hidden = yes</b> keeps it off the board until it is earned. For endings and surprises.<br><b>It is reviewed when a screen opens and at the final whistle</b>, and it is idempotent - an achievement already earned is skipped, so nothing is ever granted twice.<br><code>tools/achievement_check.gd</code> asks the two questions a spreadsheet cannot: is anything gated behind a counter nothing counts, and is anything tested that nobody grants."},
"Fouls.csv":{what:"THE REFEREE. (Round Y: every Foul Chance was doubled - about one card a match per side now.) The more a side set off in a round, the more likely it is to have given a foul away doing it. Yellows, reds, and a man sent off leaving nine.",
  key:"Triggers",
  help:"<b>IT PRICES THE THING THE REST OF THE GAME REWARDS WITHOUT LIMIT.</b> Firing everything you have every round used to be free. Now it costs, and what it costs is a man.<br><b>Triggers</b> is how many abilities and combos that side actually set off - one per ability that CHANGED A NUMBER, not one per ability a card owns. Every round the match prints <code>Triggers this round: you N, them N</code>, and that line is where the answer is when the cards feel too frequent or too rare, before you touch a row of this file.<br><b>Foul Chance</b> is the % it conceded a foul at that many. <b>Yellow</b> and <b>Red</b> are, IF a foul was given, what kind. Whatever is left of 100 is an ordinary free kick - which should be most fouls.<br><b>Rows are interpolated</b>, exactly like ShotOdds.csv, so five rows draw a smooth curve rather than five steps.<br><b>DO THE MULTIPLICATION.</b> 18% sounds small. It happens to BOTH SIDES, NINE TIMES A MATCH - eighteen rolls. <code>tools/foul_check.gd</code> simulates two thousand matches at each level and prints fouls, yellows, reds and how often a match ends ten against eleven.<br><b>AND THEN THE LADDER HAS A HOLE IN IT.</b> A tier holds one card of each power; send the 3 off and Tier III can only offer two cards. So a survivor of that tier is offered playing out of position: his name, the missing power, and NO abilities at all. A new copy is drawn every draft phase, so who covers the gap changes round to round. Both sides get them.<br><b>Tuning.csv:</b> <code>fouls</code> false turns the whole thing off · <code>foul_free_kick_power</code> is what a foul adds to the fouled side's shot · <code>foul_card_gives_possession</code> - a card stops the game, which is what makes it the moment a side gets the set piece · <code>foul_two_yellows_is_red</code> · <code>foul_stand_ins</code> false leaves the tier one card short instead · <code>foul_window_seconds</code> 0 shows no window."},
"BrewerySections.csv":{what:"THE SIX SECTIONS OF THE BREWERY, as numbers. Wheat becomes malt becomes mash becomes wort becomes brew becomes a barrel becomes six bottles.",
  key:"ID",
  help:"<b>THE CHAIN, BEFORE THE MAP.</b> A production chain is a thing you get wrong in the NUMBERS, not in the pictures. If six bottles from a barrel is the wrong number, no amount of drawing the Bottler fixes it - and you will have drawn him twice.<br><b>Order is the map</b>, and it is also a rule: a section may only be given something an EARLIER section makes, or something raw. Otherwise the chain cannot be started, and that is the one way a chain breaks that a spreadsheet cannot show you - every cell spelled correctly and the map impossible.<br><b>Needs</b> is the unlock condition, so every section has to be opened by an achievement. <b>Takes</b> is <code>wheat:1;water:1;germs:1</code>. <b>Makes</b> is one resource ID and <b>How Many</b> is how many of it - Bottling makes 6, and that number is the whole economy of the Pub.<br><b>Wait Min / Wait Max</b> is the lagering, in turns, and a turn is a fixture.<br><b>BATCHES is how many jobs a section can have running at once, and it is the shape of the whole Brewery:</b> the basic foundation is free and everything that makes it bigger is earned. The cellar starts with ONE vat - this column - and an achievement Reward of <code>count:batches_cooling+1</code> adds another. Any section, any source: an achievement, a talent, a building action. <code>tools/brewery_check.gd</code> plays the same season again with more vats unlocked and tells you what one is worth (one vat: 24 bottles; two: 48; three: 54, because by then hops are the limit and the Brewer is the answer).<br><b>Materials live in GameState counters named <code>res_&lt;id&gt;</code></b>, which is not a new store - so <code>count:res_malt&gt;=3</code> is already a condition an achievement, a talent or a dialogue line can read with no code written for it.<br><code>tools/brewery_check.gd</code> starts a new game, opens every section and works the chain until it runs dry: it prints what the starting stock is worth in bottles and WHAT RAN OUT FIRST. The bottleneck is almost never the one you expect.<br><b>X and Y ARE THE MAP.</b> A fraction of the yard - 0.5, 0.5 is the middle, 0 is the left or top edge. The same two columns Buildings.csv uses, so moving the Mill is a number you already know how to change, and nothing is positioned by hand in the code.<br><b>Art</b> is a file in assets/brewery/ (also searched: assets/base/, assets/). It is a nicety: a section with no art is a tile with its name on it and works perfectly.<br><b>A LOCKED SECTION NAMES ITS ACHIEVEMENT</b> on the map - not the unlock. \"Needs Mill\" tells a player nothing they can act on; \"Clean Sheet - win a match without conceding\" is a thing to go and do. That sign is found by asking Achievements.csv who hands out the name in Needs, so moving the grant changes the sign with no edit anywhere."},
"BreweryResources.csv":{what:"Everything the Brewery uses or makes. Raw things, made things, and the tools that are needed but not used up.",
  key:"ID", enums:{Kind:["","raw","made","tool"], Kept:YN},
  help:"<b>Counter</b> (round AN): the save counter it is kept in; blank = res_&lt;ID&gt;. The bottle's is <code>plain_beer</code>, so every bottle filled is a Plain Beer in the bag.<br><b>Kind</b> says where it comes from. <code>raw</code> arrives from outside the brewery - a match reward, the Traveling Brewer, an adventure. <code>made</code> is produced by one of the six sections. <code>tool</code> is equipment.<br><b>Kept = yes means it is NOT used up.</b> You need a Hammer to work the Mill and you still have it afterwards. That is the whole difference between equipment and an ingredient, and it is one cell.<br><b>Start</b> is what a new game begins with. A raw resource with Start 0 that nothing makes and something wants is a dead end, and the loader says so.<br><b>Each one is a GameState counter called <code>res_&lt;id&gt;</code></b>, so anything in the game can test how much of it you have."},
"ClassTree.csv":{what:"WHAT A CLASS TREE COSTS. Three nodes per class, one per emblem set; a Star in a node opens that set's nine units; all three filled lets you choose ONE emblem and forge the Team Spirit.",
  key:"Class",
  help:"<b>THE TREE ITSELF IS NOT WRITTEN DOWN ANYWHERE, AND THAT IS DELIBERATE.</b> Its nodes are your class's emblem sets, read straight off the unit spreadsheets - add a fourth set to a class tomorrow and its tree has four nodes this afternoon. A tree written twice is a tree that will disagree with itself, so this file holds only the part the sets cannot tell us.<br><b>Class = *</b> is the fallback row every class without one of its own uses. Keep it.<br><b>Node Cost / Emblem Cost / Spirit Cost</b> are talent points, out of the same pool the ordinary talent tree spends. One point per match once the Training Ground is open, so a full three-node class costs about eight matches.<br><b>Spirit Brew</b> is the ID of a row in Brews.csv. Forging unlocks the words <code>Team Spirit &lt;Class&gt;</code> and does NOTHING else - that brew row's Requires asks for exactly those words. So you can rewrite the drink completely, the element, both abilities, the price, whether it is permanent, without touching a line of code.<br><code>tools/class_tree_check.gd</code> checks all four files against each other and then WALKS the tree on a throwaway save, so it can tell you what the whole thing costs before a player finds out.<br><b>Tuning.csv:</b> <code>class_tree</code> false hides the screen · <code>class_tree_gates_units</code> is the subtractive half and is FALSE - turn it on and a set's nine units are not yours until its node has a Star in it."},
"Currencies.csv":{what:"WHAT MONEY THERE IS, which MODE pays it, and what a win, a draw and a loss are worth. This is the whole of “currency from wins with separate currencies per mode”.",
  key:"ID",
  help:"<b>Earned In IS THE SEPARATION.</b> It names a MatchModes.csv id, and only that mode pays this currency - so a Quick Match never pays league coins and a season match never pays marks. Leave it BLANK and it is paid in every mode.<br><b>Counter</b> is the GameState counter it lives in, and it defaults to the ID - so a currency called <code>coins</code> is the <code>coins</code> counter the game already had, and <code>count:coins&gt;=200</code> keeps working everywhere it already worked.<br><b>Win / Draw / Loss</b> are paid at the final whistle. A currency where all three are 0 is never paid by a match at all, and anything priced in it is unbuyable unless something else hands it out - <code>tools/shop_check.gd</code> says so.<br><b>A SECOND CURRENCY IS HOW A MODE EARNS ITS PLACE.</b> If the only thing a Quick Match gave you was the same coins a league match gives, there would be no reason to play one. Price something good in marks and there is."},
"Shop.csv":{what:"THE TRAVELING BREWER'S CART. What he has, what it costs, in which money, and how many he will ever sell you.",
  key:"ID",
  help:"<b>HE IS THE PRESSURE VALVE ON THE BREWERY.</b> <code>tools/brewery_check.gd</code> measures HOPS as the thing the chain runs dry of - they only arrive when you WIN - so he sells them, dear. He is there for the week you need them, not instead of the Brewery.<br><b>Sells</b> is <code>res:&lt;id&gt;</code> for a Brewery material (How Many of them) or <code>brew:&lt;id&gt;</code> for a RECIPE, which unlocks that row of Brews.csv by name exactly as a talent or an achievement would. Anything else is handed to the ordinary effects language, so <code>unlock:Something</code> works there too.<br><b>Stock is how many he has EVER</b>, not per visit. Buy the sack of hops three times and it is gone from his cart for good - which is what makes a shop a decision rather than a tap. Leave it blank for unlimited. A sold-out row STAYS on the screen and says SOLD OUT, because a thing that vanishes is a thing you think you imagined.<br><b>Requires</b> is the usual condition language, so a shelf can open late.<br><b>PRICE IT IN WINS, not in coins.</b> <code>tools/shop_check.gd</code> converts every price into wins for you - 45 coins is 1.1 wins when a season win pays 40 - and prints what a whole season's takings come to. That is the only number that makes a price mean anything."},
"Dorms.csv":{what:"BEDS. How many players you are allowed to keep at all. The first row is free; the rest are bought. Who is resting in the Dorms is Resting.csv (round AN).",
  key:"ID",
  help:"<b>BEDS IS THE TOTAL, not what this row adds.</b> Buying the Long House REPLACES the Lean-To rather than stacking on it, which is what makes the column readable - you can see your squad size at a glance instead of adding up.<br><b>The first row has to be free.</b> A new game cannot buy its first bed, and <code>tools/rooms_check.gd</code> says so if the cheapest dorm costs anything.<br><b>Price and Currency</b> use data/Currencies.csv, so a dorm can be bought with marks if you would rather it came from quick matches. <b>Requires</b> is the ordinary condition language.<br><b>PRICE IT IN SEASONS.</b> <code>tools/rooms_check.gd</code> converts every price for you against what a ten-fixture season actually pays: the Stone Wing is four seasons, which is a thing to aim at rather than a thing to buy."},
"Resting.csv":{what:"THE DORMS (round AN): what sends a player to bed, and for how long. One row per activity - every player rests in the Dorms.",
  key:"ID", enums:{On:["true","false"],"Wakes Others":["true","false"]},
  help:"<b>match</b> = everybody who played a match. <b>adventure</b> = everybody who set off on an Adventure (walked home, fled or fell). <b>adventure_down</b> is ON TOP of adventure for a player knocked out on the run; <b>brewer</b> = a brewer after a shift at a Brewery machine. <b>brew</b> is ON TOP of match for a player who played on a one-match brew from the Pub (switched off).<br><b>Turns</b> blank = by power from Recovery.csv; a number sets it outright. <b>Extra</b> is added on top. <b>Wakes Others</b> true = this counts as a fixture, so everybody already in bed is one fixture nearer fit.<br><code>rest_less</code> in Tuning.csv takes fixtures off every rest (never below one) - the Feather Beds upgrade raises it. <b>Nothing happens while <code>recovery</code> in Tuning.csv is false</b> (it is ON). The Dorms' Rest day button costs <code>rest_day_cost</code> coins."},
"Upgrades.csv":{what:"THE CLUB HOUSE (round AN): the keys and upgrades you can buy. An achievement only grants the RIGHT to buy one.",
  key:"ID", enums:{Kind:["upgrade","key"]},
  help:"<b>Achievement</b> is an ID from Achievements.csv: once it is earned the upgrade is on sale. Blank = on sale from the start. <b>Needs</b> is any extra condition (the usual language).<br><b>Cost and Currency</b> use data/Currencies.csv. <b>Effect</b> is the ordinary effects language: <code>count:batches_cooling+1</code> is a Brewery vat, <code>count:tune_&lt;any Tuning row&gt;+n</code> raises a number, <code>unlock:x</code> opens a thing. Each upgrade is bought once.<br><b>Kind = key</b>: a key to a building or a Brewery machine. Its Needs is <code>unlocked:&lt;name&gt;</code> (the achievement that opens the building puts the key on sale), its Effect gives the key item (Items.csv, Tab keys), and the building's Requires asks <code>count:&lt;key&gt;&gt;=1</code>.<br>The Achievements board says under each achievement which upgrade it puts on sale. To give an upgrade away FREE instead, put its Effect in the achievement's Reward."},
"BreweryGames.csv":{what:"THE BREWING MINI-GAMES (round AN): one little 5-15 second game per Brewery machine. Win = the batch is made, lose = spoiled.",
  key:"Section", enums:{Kind:["stir","rhythm","colour","fire","hold","conveyor","bar","mash"]},
  help:"<b>Section</b> is a BrewerySections.csv ID. <b>Kind</b>: <code>stir</code> move the mouse in circles, stop and it clumps (Speed = soak per turn); <code>rhythm</code> left, right, left, right, the same side twice jams (Hits = turns); <code>colour</code> hold the tap while the wort runs clear (Zone = share of time clear, Speed = fill a second); <code>fire</code> click to pump the bellows, keep the needle in the gold (Zone = gold width, Hits = seconds in it); <code>hold</code> hold to fill, let go in the gold (Zone, Speed); <code>conveyor</code> hold to pour, let go at each bottle's line (Zone = how close, Speed = pour a second, Hits = bottles). <code>bar</code> and <code>mash</code> are the first games, still working. <b>Seconds</b> = the time limit. The brewer's Brewers.csv Success % makes it harder the less trained he is. <b>Art</b> = a folder of PNGs (see the manual); a missing one is drawn plainly. No row = no game. Tuning.csv brewery_minigames false turns them off."},
"BottleSizes.csv":{what:"THE BASIC THREE BEERS (round AN): the sizes a Brewery machine can fill. One barrel = 6 Small Bottles, 3 Large Bottles or 1 Kleiner Faß.",
  key:"Item",
  help:"<b>Section</b> is the machine (bottling). <b>Item</b> is the Items.csv ID that goes in the bag; <b>Many</b> how many one batch fills. <b>Requires</b> is the condition language, blank = always offered. The machine asks which size before its mini-game; one size offered = no question. In the tutorial only the small bottle is offered (!flag:tut_brewery on the others)."},
"TutorialJumps.csv":{what:"TUTORIAL JUMPS (round AN): the Dev screen's buttons that go straight to one part of the tutorial.",
  key:"ID", enums:{Kind:["brewery","minigame"]},
  help:"<b>Kind</b> <code>brewery</code>: the tutorial Brewery TIME OUT on its own (Value = its flag, tut_brewery). <code>minigame</code>: one machine's brewing game (Value = the BrewerySections.csv ID). Your real save is never touched: the Brewery plays in a throwaway save."},
"Brewers.csv":{what:"THE BREWERS (round AN): a brewer's efficiency (his power) as his % of success at a Brewery machine.",
  key:"Efficiency",
  help:"A brewer is one of your players trained at the Training Ground (Training.csv Kind = brewer). He never plays again. <b>Efficiency</b> is his power, 0 to 5; <b>Success</b> is the % a batch comes out right. <b>none</b> is the chance when no brewer is free. A failed batch uses up what it took and makes nothing.<br>The machine always takes the fittest brewer with the highest efficiency; afterwards he rests in the Dorms (Resting.csv brewer). <code>brewery_brewers</code> in Tuning.csv false = every batch works."},
"DrunkLevels.csv":{what:"THE DRUNK METER (round AN): the levels a player reaches in the Pub, and what each one gives him.",
  key:"ID",
  help:"<b>From</b> is the % on the meter where the level starts; the highest level reached counts. <b>Effect</b> is a ; list: <code>brews</code> = elemental and inspirational brews take hold from here (below it they can still be drunk and fill the meter, but do nothing in the match and a turning beer does not count); <code>star</code> = he plays as a Star with the ability from StarAbilities.csv; <code>turn_drinks:-2</code> = two fewer turning beers. <b>Colour</b> is the bar's colour.<br>Every pour fills the meter by the brew's Inspiration (Brews.csv; a bottle's own in Items.csv). After every round he played it loses <code>drunk_lost_per_round</code> % of what he has (50 = half), and it is empty while he rests in the Dorms; <code>drunk_meter</code> false turns it all off."},
"StarAbilities.csv":{what:"THE STAR ABILITY BAKED IN (round AN): what a player made a Star by the drunk meter plays with, by Tier and Power.",
  key:"Ability", enums:{Tier:["any","I","II","III","IV"]},
  help:"<b>Tier</b> and <b>Power</b> pick the row - <code>any</code> matches everyone. The most exact row wins: Tier and Power beats Tier only beats any/any. <b>Ability</b> is an Abilities.csv ID, used on both his sides. A brew's own ability still beats it. Today every row is Koch's Beer Courage (TUT_KOCH_BEER)."},
"Trophies.csv":{what:"WHAT IS ON THE SHELF IN THE TROPHY ROOM. A trophy is a name and a condition - it does NOT have to come from a competition.",
  key:"ID",
  help:"<b>Won When is the ordinary condition language</b>, so <code>count:matches_won&gt;=3</code> is as good a trophy as <code>unlocked:The Cup</code>. That is the row to copy when you want something on the shelf early - an empty case is a room nobody goes back to.<br><b>Competition</b> is only a label. It names a Seasons.csv id so the case can say where the cup came from; leave it blank for a trophy that came from nowhere in particular.<br><b>A trophy with an empty Won When is on the shelf from the first minute</b>, which is almost never what you meant. The checker says so."},
"Training.csv":{what:"THE TRAINING GROUND. Ausbildung trains a number for the whole side; a mini-game automates one Brewery section.",
  key:"ID", enums:{Kind:["","ausbildung","minigame","brewer","match_player","adventure_player","retrain"]},
  help:"<b>Kind = match_player, adventure_player or brewer is a ROLE (round AN):</b> what one of your players is trained for at the Training Ground. A Match Player plays in your Match Teams, an Adventure Player in your Adventure Teams, a Brewer works the Brewery machines and never plays again. Cost is what training an untrained player costs. <b>A role is for good</b> (<code>role_lock</code>): once trained, a player keeps it until the row with <b>Kind = retrain</b> (Quereinsteiger) opens - its Needs is <code>unlocked:Quereinsteiger</code>, handed out by the Quereinsteiger achievement - and then any trained player, a Brewer too, can be retrained into any other role for THAT row's Cost. <code>player_roles</code> in Tuning.csv false = no roles.<br><b>Kind splits the screen in two.</b> <code>ausbildung</code> is a training the whole side takes. <code>minigame</code> is one of the five that automate a Brewery section, and its <b>Section</b> column names a row of BrewerySections.csv.<br><b>What a mini-game gives TODAY is a vat</b> - <code>count:batches_&lt;section&gt;+1</code> - which is the foundation the played game will sit on top of later. Nothing on that screen changes when the game itself arrives; it slots in between pressing the button and the work being done.<br><b>Effect is the ordinary effects language.</b> <code>count:tune_&lt;any Tuning row&gt;+n</code> trains a number, and a MINUS is allowed - Cold Nerve does <code>count:tune_shot_stamina_bite-0.05</code>. <code>unlock:x</code> works too.<br><b>Cost and Currency</b> use data/Currencies.csv. <code>tools/rooms_check.gd</code> prices every row in SEASONS and checks that every mini-game names a real section."},
"SeasonRules.csv":{what:"A COMPETITION'S OWN RULES. What is allowed, what is on the field, and what is different - per competition.",
  key:"Season", enums:{"No Brews":YN, "No Stars":YN},
  help:"<b>A COMPETITION'S RULES ARE LENT, NOT GIVEN.</b> Everything here is put back the moment you play something outside that competition - a friendly, a quick match - because a Winter Cup that quietly leaves the keeper tired for the rest of the game is a bug nobody will ever trace back to the Winter Cup. <code>tools/season_check.gd</code> applies every competition and then releases it, and says so if anything was left changed.<br><b>Only Classes</b> is pipe-separated and matched loosely; blank means anybody. <b>Per Tier</b> overrides the match mode's Squad Per Tier. <b>No Brews</b> shuts the Pub's taps for the competition; <b>No Stars</b> keeps Star Players off the pitch.<br><b>Tuning is key=value pairs separated by a pipe</b>, and every key has to be a REAL row of Tuning.csv - a misspelling there is a competition that looks like it bends the game and does not, which is the worst kind of wrong. The checker names it.<br><b>THE THREE NAMED COLUMNS ARE TUNING ROWS TOO.</b> No Brews, No Stars and Per Tier are written as their own columns because that is how you think about them, and folded into the same Tuning machinery underneath - so there is one way to lend a rule and one way to hand it back, not four.<br><b>Story Before</b> names a Dialogue.csv scene played before the competition. A FIXTURE'S own dialogue is the Story column of Season.csv instead.<br><b>Season = *</b> is the fallback every competition without a row of its own plays by. Keep it."},
"Pickups.csv":{what:"HOW MANY PICKUPS ARRIVE on the way to each wave and on the way to the boss. Per biome.",
  key:"Biome",
  help:"<b>THIS FILE EXISTS BECAUSE THE OLD ANSWER WAS A DICE ROLL.</b> Pickups arrived on a TIMER with a random gap, so a run gave you somewhere between one and six of them and nobody - not you, not a tool - could say which. A biome whose haul is a number you never see cannot be balanced.<br><b>Now the number is written down</b> and the pickups are spaced evenly over whatever distance the wave turns out to be, so a faster run is not a poorer one.<br><b>Biome = *</b> sets the pacing of every biome at once, which is the edit you actually want while tuning. A named biome overrides it.<br><b>Drops</b> names a Drops.csv table, or blank for the biome's own.<br><code>tools/season_check.gd</code> prints WHAT A WHOLE RUN IS WORTH for every biome - the ordinary stretches plus the boss stretch - which is the number to balance a biome against."},
"ICONS_WANTED.csv":{what:"The shopping list for art. Nothing loads it — it is for you and whoever is drawing.", key:null},
"SOUNDS_WANTED.csv":{what:"The shopping list for audio. Nothing loads it — it is for you and whoever is recording.", key:null},
"FileManifest.csv":{what:"Every file and the folder it belongs in. The title screen checks it and names anything missing, misplaced or duplicated.", key:null},
};

/* ============================================================
   SCHEMAS BY NAME PATTERN.
   "<Class> Emblems.csv" is a family, not a file: Lorelei Emblems.csv,
   Rauhnacht-Feuergeister Emblems.csv, and whatever you write next. One
   entry teaches the workbench about all of them.
   ============================================================ */
const S_PATTERNS = [
 [/ Emblems\.csv$/i, {
   what:"THE EMBLEMS OF ONE CLASS. An emblem is a TWO-SIDED card: a Basic Side it has from the moment you choose it, a Condition, and an Ultimate Side it turns over to. The Basic Side stays live.",
   key:"Name",

}

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  text = text.replace(/\r\n?/g,"\n");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else if(c==='"') q=true;
    else if(c===","){ row.push(cell); cell=""; }
    else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.length && r.some(c=>c.trim()!==""));
}
function toCSV(f){
  const d=DATA[f]; const esc=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  return [d.headers.map(esc).join(",")].concat(d.rows.map(r=>{
    const out=[]; for(let i=0;i<d.headers.length;i++) out.push(esc(r[i]??""));
    return out.join(",");
  })).join("\n")+"\n";
}

function cell(file,head,row,ci,ri){
  const scheme=sch(file), val=row[ci]??"";
  const set=v=>{row[ci]=v;save();};
  let opts=(scheme.enums||{})[head];
  const ref=(REFS[file]||{})[head];

  /* A unit file is recognised by its columns, so its enums are too — that
     way a set you add tomorrow gets the same dropdowns as the ones here. */
  if(!opts && at(file,"Unit Type")>=0 && at(file,"Base Power Left")>=0){
    if(head==="Tier") opts=TIERS;
    if(head==="Player Type") opts=["Normal","Star"];
  }

  if(opts||ref){
    const sel=document.createElement("select");
    let list=opts?opts.slice():[""];
    if(ref){
      const [rf,rc]=ref, src=DATA[rf];
      if(src){
        const at2=src.headers.indexOf(rc);
        if(at2>=0){ const seen=new Set();
          src.rows.forEach(r=>{const v=(r[at2]||"").trim(); if(v&&!seen.has(v)){seen.add(v);list.push(v);} }); }
      }
      if(val&&!list.includes(val)) list.push(val);
    }
    if(val&&!list.includes(val)) list.push(val);
    list.forEach(o=>{const e=document.createElement("option");e.value=o;e.textContent=o===""?"—":o;sel.appendChild(e);});
    sel.value=val; sel.onchange=()=>{set(sel.value);check();paintRail();};
    sel.id=`c_${norm(file)}_${ri}_${ci}`;
    return sel;
  }
  if((scheme.colour||[]).includes(head)){
    const box=document.createElement("div"); box.style.display="flex"; box.style.alignItems="center";
    const sw=document.createElement("input"); sw.type="color"; sw.value=/^#[0-9a-f]{6}$/i.test(val)?val:"#213a26";
    sw.style.cssText="width:26px;min-width:26px;height:24px;border:1px solid var(--line);padding:0;margin:5px 0 5px 7px;cursor:pointer;background:none";
    const tx=document.createElement("input"); tx.value=val;
    sw.oninput=()=>{tx.value=sw.value;set(sw.value);};
    tx.oninput=()=>{set(tx.value); if(/^#[0-9a-f]{6}$/i.test(tx.value)) sw.value=tx.value;};
    tx.id=`c_${norm(file)}_${ri}_${ci}`;
    box.appendChild(sw); box.appendChild(tx); return box;
  }
  if(LONG.includes(head)&&String(val).length>34){
    const ta=document.createElement("textarea"); ta.value=val; ta.rows=1;
    ta.oninput=()=>{set(ta.value);}; ta.onblur=()=>{check();paintRail();};
    ta.id=`c_${norm(file)}_${ri}_${ci}`; return ta;
  }
  const inp=document.createElement("input"); inp.value=val;
  inp.oninput=()=>set(inp.value);
  inp.onblur=()=>{check();paintRail();};
  inp.id=`c_${norm(file)}_${ri}_${ci}`;
  return inp;
}

/* Every file name the spreadsheets ask for, grouped by folder. */
function assetWants(){
  const out=[], seen=new Set();
  for(const [key,folder] of Object.entries(ASSET_COLUMNS)){
    const [file,c]=key.split("|");
    /* A unit file is recognised by its columns, so Artwork is collected from
       EVERY unit file, not only the one named in the map. */
    const files = (c==="Artwork" && at(file,"Unit Type")>=0) ? unitFiles() : [file];
    for(const f of files){
      const i=at(f,c); if(i<0) continue;
      const nameAt=at(f,"Name")>=0?at(f,"Name"):(at(f,"ID")>=0?at(f,"ID"):0);
      DATA[f].rows.forEach((r,ri)=>{
        let v=(r[i]||"").trim();
        if(!v) return;
        if(v.startsWith("res://")) return;      /* already a real path */
        const k=folder.dir+"|"+v.toLowerCase();
        if(seen.has(k)) return; seen.add(k);
        out.push({name:v, folder, file:f, row:ri, col:c, who:(r[nameAt]||"").trim()});
      });
    }
  }
  return out;
}

    const done=mine.filter(w=>HAVE[f.dir+w.name]).length;
    const box=document.createElement("div"); box.className="folder";
    const h=document.createElement("h4");
    h.innerHTML=`<span>res://${f.dir}</span><span class="cnt">${mine.length?`${done} of ${mine.length} ticked`:"nothing asks for anything here yet"}</span>`;
    box.appendChild(h);

    const bl=document.createElement("div"); bl.className="blurb";
    bl.innerHTML=`${f.what}<br><b>Format:</b> ${f.formats}<br><span style="color:var(--faint)">${f.also}</span>`;
    box.appendChild(bl);

    mine.sort((a,b)=>a.name.localeCompare(b.name)).forEach(w=>{
      const row=document.createElement("div");
      const key=f.dir+w.name;
      row.className="want"+(HAVE[key]?" done":"");
      const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!HAVE[key];
      cb.onchange=()=>{ if(cb.checked) HAVE[key]=true; else delete HAVE[key];
        saveHave(); row.className="want"+(cb.checked?" done":"");
        h.querySelector(".cnt").textContent=`${wants.filter(x=>x.folder===f&&HAVE[f.dir+x.name]).length} of ${mine.length} ticked`;
        paintRail(); };
      const body=document.createElement("div");
      body.innerHTML=`<span class="nm"></span><span class="why"></span>`;
      body.querySelector(".nm").textContent=w.name;
      body.querySelector(".why").textContent=(w.who?w.who+" — ":"")+w.col;
      const src=document.createElement("span"); src.className="src";
      src.textContent=w.file.replace(/\.csv$/i,"")+" "+(w.row+2);
      src.style.cursor="pointer";
      src.onclick=()=>{ CUR=w.file; paintRail(); paintTable();
        const el=document.getElementById(`c_${norm(w.file)}_${w.row}_${at(w.file,w.col)}`);
        if(el){ el.scrollIntoView({block:"center",behavior:"smooth"}); el.focus(); } };
      row.appendChild(cb); row.appendChild(body); row.appendChild(src);
      box.appendChild(row);
    });
    board.appendChild(box);
  });

  const last=document.createElement("div"); last.className="hint";
  last.innerHTML="<b>Two folders that are not on this list.</b> <code>res://data/</code> is where every spreadsheet lives — and <b>each .csv needs a .csv.import file beside it</b> containing <code>[remap]</code>, a blank line, then <code>importer=\"keep\"</code>. Without it Godot decides your spreadsheet is a translation table and litters the folder with .translation files. Copy an existing one and rename it. <code>res://src/</code> is the code and you never need to open it.";
  board.appendChild(last);

  wrap.appendChild(board);
}

/* ============================================================
   THE REFERENCE SHEET — the words the spreadsheets speak.
   ============================================================ */

/* ============================================================
   KEYWORDS — every word the game understands, in one place.

   Two files feed it: Keywords.csv (effects, targets, scopes,
   conditions, Adventure effects, item tags) and
   AbilityTriggers.csv (triggers, which the game reads as a list
   of its own). Both are ordinary editable files in the rail;
   this view is the readable version of the two together.
   ============================================================ */
function keywordRows(){
  const out = [];
  const kw = DATA["Keywords.csv"];
  if(kw){
    const k=at("Keywords.csv","Keyword"), f=at("Keywords.csv","Family"),
          st=at("Keywords.csv","Status"), w=at("Keywords.csv","What It Does"),
          ex=at("Keywords.csv","Example"), nt=at("Keywords.csv","Notes");
    kw.rows.forEach((r,ri)=>{
      if(k<0 || !(r[k]||"").trim()) return;
      out.push({file:"Keywords.csv", row:ri, word:r[k], family:(f>=0?r[f]:"")||"other",
        status:((st>=0?r[st]:"")||"live").toLowerCase(),
        what:(w>=0?r[w]:"")||"", example:(ex>=0?r[ex]:"")||"", notes:(nt>=0?r[nt]:"")||""});
    });
  }
  const tg = DATA["AbilityTriggers.csv"];
  if(tg){
    const k=at("AbilityTriggers.csv","ID"), st=at("AbilityTriggers.csv","Status"),
          w=at("AbilityTriggers.csv","Fires When"), nt=at("AbilityTriggers.csv","Notes");
    tg.rows.forEach((r,ri)=>{
      if(k<0 || !(r[k]||"").trim()) return;
      out.push({file:"AbilityTriggers.csv", row:ri, word:r[k], family:"ability trigger",
        status:((st>=0?r[st]:"")||"live").toLowerCase(),
        what:(w>=0?r[w]:"")||"", example:"", notes:(nt>=0?r[nt]:"")||""});
    });
  }
  return out;
}
function keywordCount(){ return keywordRows().filter(r=>r.status==="live").length; }

function paintWords(){
  const wrap=$("#wrap");
  $("#title").textContent="Keywords";
  $("#what").textContent="Every word the game understands, and what it does. Live means it is built; planned means it is designed and waiting.";
  $("#help").hidden=false;
  $("#help").innerHTML="<b>To ask for a new keyword</b>, press the button below or add a row to <b>Keywords.csv</b> in the rail: pick the family, leave Status on <code>planned</code>, and write <b>What It Does</b> as one clear sentence. That sentence is the specification \u2014 whoever builds it works from your words.<br><b>A card written against a planned word still loads.</b> It is not an error and it is not a typo; it simply does nothing until the word exists, and the game says so once in the Output panel.";

  $("#tools").innerHTML="";
  const mk=(t,fn,cls)=>{const b=document.createElement("button");b.className="btn sm "+(cls||"");b.textContent=t;b.onclick=fn;$("#tools").appendChild(b);return b;};
  mk("+ Ask for a keyword",()=>{
    if(!DATA["Keywords.csv"]){ alert("Load your data folder first — Keywords.csv is the file this writes to."); return; }
    const word=prompt("The word itself, as you would write it in a spreadsheet cell:");
    if(!word) return;
    const what=prompt("What should it do? One clear sentence — this is the specification.");
    const d=DATA["Keywords.csv"];
    const r=d.headers.map(h=>{
      if(h==="Keyword") return word;
      if(h==="Family") return "ability effect";
      if(h==="Status") return "planned";
      if(h==="What It Does") return what||"";
      return "";
    });
    d.rows.push(r); save(); paintWords(); paintRail(); check();
  },"key");
  mk("Copy the planned list",()=>{
    const want=keywordRows().filter(r=>r.status!=="live");
    const text=want.length
      ? want.map(r=>`${r.word}  [${r.family}]  ${r.what}`).join("\n")
      : "Nothing is planned — everything you have written is already built.";
    showText("Keywords still to build", text);
  });

  const board=document.createElement("div"); board.className="board";
  const rows=keywordRows();
  if(!rows.length){
    wrap.innerHTML='<div class="empty"><h3>No keyword files loaded</h3><p>Load your <span class="kbd">data</span> folder. Keywords.csv and AbilityTriggers.csv are what this page reads.</p></div>';
    return;
  }
  const families=[...new Set(rows.map(r=>r.family))];
  for(const family of families){
    const mine=rows.filter(r=>r.family===family);
    const c=document.createElement("div"); c.className="cheat";
    const live=mine.filter(r=>r.status==="live").length;
    c.innerHTML=`<h4>${family} &mdash; ${live} built, ${mine.length-live} planned</h4><div class="in"></div>`;
    const body=c.querySelector(".in");
    const tbl=document.createElement("table");
    for(const r of mine){
      const tr=document.createElement("tr");
      const a=document.createElement("td");
      a.innerHTML=`<code>${r.word}</code>`+(r.status==="live"?"":' <span style="color:var(--accent)">planned</span>');
      const b=document.createElement("td");
      b.textContent=r.what || "—";
      if(r.example) b.innerHTML += `<div style="color:var(--dim);font-size:12px">e.g. ${r.example}</div>`;
      tr.appendChild(a); tr.appendChild(b);
      tbl.appendChild(tr);
    }
    body.appendChild(tbl);
    board.appendChild(c);
  }
  wrap.innerHTML=""; wrap.appendChild(board);
}
