/* ============================================================
   THE CHECKER — the same questions the game asks at startup.
   ============================================================ */
function check(){
  PROBS=[];
  const add=(file,row,col,msg,fix)=>PROBS.push({file,row,col,msg,fix});

  /* 1. duplicate keys */
  for(const f of Object.keys(DATA)){
    const k=sch(f).key; if(!k) continue;
    const i=at(f,k); if(i<0) continue;
    // SOME FILES HAVE A TWO-PART KEY. Theme.csv is keyed by Element AND
    // State — `button` appears five times on purpose, once per state — so
    // checking the first column alone reported five duplicates that were
    // the whole design. `key2` in the schema names the second half.
    const k2=sch(f).key2;
    const i2=k2?at(f,k2):-1;
    const seen={};
    // An exclamation mark is kept here on purpose: "flag:brave" and
    // "!flag:brave" are two different words, and norm() would flatten them
    // into one and then complain that you wrote the same id twice.
    const idKey = s => String(s||"").trim().toLowerCase().replace(/[^a-z0-9!]/g,"");
    DATA[f].rows.forEach((r,ri)=>{
      let v=idKey(r[i]); if(!v) return;
      if(i2>=0) v += "|" + idKey(r[i2]);
      if(seen[v]!==undefined) add(f,ri,k,`Two rows share the id "${(r[i]||'').trim()}"${i2>=0?` in state "${(r[i2]||'').trim()}"`:""}.`,`Row ${seen[v]+2} has it too. Ids must be unique inside a file.`);
      else seen[v]=ri;
    });
  }
  /* 2. references */
  for(const [f,map] of Object.entries(REFS)){
    if(!DATA[f]) continue;
    for(const [c,[rf,rc]] of Object.entries(map)){
      const i=at(f,c); if(i<0||!DATA[rf]) continue;
      const pool=ids(rf,rc);
      if(!pool.size) continue;
      DATA[f].rows.forEach((r,ri)=>{
        const v=(r[i]||"").trim(); if(!v) return;
        if(!pool.has(norm(v))) add(f,ri,c,`"${v}" is not in ${rf}.`,`Add a row there with that id, or pick one from the list.`);
      });
    }
  }
  /* 2b. ONE NAME, ONE PLAYER (round X). A card is identified by its Name -
     saves, brews and turned players all hang off it - so two cards sharing
     one is a save bug waiting to happen. And "Unit Name" is a placeholder. */
  {
    const named={};
    for(const f of Object.keys(DATA)){
      const ni=at(f,"Name"), ti=at(f,"Tier");
      if(ni<0||ti<0||at(f,"Unit Type")<0) continue;
      DATA[f].rows.forEach((r,ri)=>{
        const v=(r[ni]||"").trim(); if(!v) return;
        if(/^unit name$/i.test(v)){ add(f,ri,"Name",`"Unit Name" is a placeholder, not a name.`,`Give him a name from Names.csv. A card is identified by its Name, so a placeholder shared by many cards is many cards that save as one.`); return; }
        const k=norm(v);
        if(named[k]) add(f,ri,"Name",`"${v}" is also the name of a card in ${named[k]}.`,`Every player needs a name of his own - saves, brews and turned players are all stored against it.`);
        else named[k]=f;
      });
    }
  }
  /* 2c. ABILITY CELLS ON CARDS (round Y). A card's Attack / Defend Ability
     cell may name SEVERAL rows, separated by semicolons, from Abilities.csv
     OR CardAbilities.csv. Each one has to exist. */
  {
    const known=new Set([...ids("Abilities.csv","Ability ID"), ...ids("CardAbilities.csv","Ability ID")]);
    if(known.size) for(const f of Object.keys(DATA)){
      if(at(f,"Unit Type")<0 && f!=="Star Players.csv") continue;
      for(const c of ["Attack Ability","Defend Ability"]){
        const i=at(f,c); if(i<0) continue;
        DATA[f].rows.forEach((r,ri)=>{
          for(const one of (r[i]||"").split(";")){
            const v=one.trim(); if(!v) continue;
            if(!known.has(norm(v))) add(f,ri,c,`"${v}" is not a row of Abilities.csv or CardAbilities.csv.`,`Write the row, or re-run <code>python3 tools/ability_rows.py</code> if it is one of the C_ rows made from the card text.`);
          }
        });
      }
    }
    /* ROUND Z: an Emblem's Basic Ability names Abilities rows the same way. */
    if(known.size) for(const f of Object.keys(DATA)){
      if(!/ Emblems\.csv$/i.test(f)) continue;
      const i=at(f,"Basic Ability"); if(i<0) continue;
      DATA[f].rows.forEach((r,ri)=>{
        for(const one of (r[i]||"").split(";")){
          const v=one.trim(); if(!v) continue;
          if(!known.has(norm(v))) add(f,ri,"Basic Ability",`"${v}" is not a row of Abilities.csv.`,`Write the EMB_ row in Abilities.csv - the EMB_ rows already there are worked examples.`);
        }
      });
    }
    /* ROUND Z: the Cost column - only ore:N is known. */
    for(const f of ["Abilities.csv","CardAbilities.csv"]){
      const i=at(f,"Cost"); if(i<0) continue;
      DATA[f].rows.forEach((r,ri)=>{
        const v=(r[i]||"").trim().toLowerCase();
        if(v && !/^ore:\d+$/.test(v)) add(f,ri,"Cost",`"${v}" is not a cost the game knows.`,`Today a Cost is <code>ore:N</code> - spend N Ore from your side's pool.`);
      });
    }
  }
  /* 3. `and` where a semicolon belongs */
  const CONDS=["Requires","Effects","Action","Do","Reward","On Win","On Loss","Use","Rewards","Rewards On Win"];
  for(const f of Object.keys(DATA)) for(const c of CONDS){
    const i=at(f,c); if(i<0) continue;
    DATA[f].rows.forEach((r,ri)=>{
      const v=r[i]||"";
      if(/\s+and\s+/i.test(v)) add(f,ri,c,`"and" is not a word this understands.`,`Terms are joined with a semicolon: <code>unlocked:Brewery;count:coins>=50</code>`);
    });
  }
  /* 4. counters read but never written */
  const written=new Set(), read=new Map();
  col("Stats.csv","Counter").forEach(v=>v&&written.add(norm(v)));
  col("Items.csv","ID").forEach(v=>v&&written.add(norm(v)));
  ["seasonwins","seasondraws","seasonlosses","seasongoalsfor","seasongoalsagainst",
   "seasonpoints","seasonmatch","seasonnumber","talentpoints","matcheswon","matchesplayed",
   "friendlywins"].forEach(v=>written.add(v));
  for(const f of Object.keys(DATA)) for(const c of CONDS){
    const i=at(f,c); if(i<0) continue;
    DATA[f].rows.forEach((r,ri)=>{
      const v=r[i]||"";
      for(const m of v.matchAll(/count:\s*([A-Za-z0-9_ ]+?)\s*[+\-=]/g)) written.add(norm(m[1]));
      if(/^requires$/i.test(c)) for(const m of v.matchAll(/count:\s*([A-Za-z0-9_ ]+?)\s*[><=!]/g))
        if(!read.has(norm(m[1]))) read.set(norm(m[1]),{f,ri,c,raw:m[1].trim()});
    });
  }
  for(const [k,w] of read) if(!written.has(k)&&!k.startsWith("cleared")&&!k.startsWith("tune"))
    add(w.f,w.ri,w.c,`Nothing ever adds to "${w.raw}".`,`This condition can never be true. Add a Stats.csv row that counts it, or an Action/Effects that gives it.`);
  /* 5. unlocks required but never granted */
  const grant=new Set(), want=new Map();
  col("Talents.csv","ID").forEach(v=>v&&grant.add(norm(v)));
  /* ACHIEVEMENTS ARE THE ROOT: everything is unlocked there first, and its
     Unlocks column is a bare list of names rather than "unlock:x" terms. It
     grants more than every other file in the project put together, so
     without this line the workbench reports every room in the base as
     unreachable. Semicolons for more than one. */
  col("Achievements.csv","Unlocks").forEach(v=>{
    (v||"").split(";").forEach(one=>{ const t=one.trim(); if(t) grant.add(norm(t)); });
  });
  /* A Brewery section is opened by an achievement and nothing else, so its
     own Needs column is a want, not a grant - it is picked up below with
     every other "unlocked:" in the project. */

  /* ============ WHAT THE CLASS TREE HANDS OUT ============
     The Star Hall is the one granter in the game that is NOT a spreadsheet
     cell: putting a Star into a node unlocks "<Class> <Set Name>", choosing
     an emblem unlocks "<Class> <Emblem> Emblem", and forging the Team Spirit
     unlocks "Team Spirit <Class>" - which is exactly what the Brews.csv row
     asks for. Without these three lines the workbench reports every one of
     them as unreachable, which is a tool crying wolf. */
  for(const f of Object.keys(DATA)){
    const ut=at(f,"Unit Type"), sn=at(f,"Set Name");
    if(ut>=0 && sn>=0) DATA[f].rows.forEach(r=>{
      const a=(r[ut]||"").trim(), b=(r[sn]||"").trim();
      if(a&&b) grant.add(norm(a+" "+b));
    });
    /* "<Class> Emblems.csv": Name is the emblem. */
    const nm=at(f,"Name"), bs=at(f,"Basic Side");
    if(ut>=0 && nm>=0 && bs>=0) DATA[f].rows.forEach(r=>{
      const a=(r[ut]||"").trim(), b=(r[nm]||"").trim();
      if(a&&b){ grant.add(norm(a+" "+b+" Emblem")); grant.add(norm(a+" "+b+" Ultimate")); }
    });
  }
  /* The Traveling Brewer's cart hands things out too: a Sells column of
     unlock:X grants X, exactly as a talent's Effects would. */
  {
    const i=at("Shop.csv","Sells");
    if(i>=0) (DATA["Shop.csv"]||{rows:[]}).rows.forEach(r=>{
      for(const m of (r[i]||"").matchAll(/unlock:\s*([^;]+)/g)) grant.add(norm(m[1]));
    });
  }
  col("ClassTree.csv","Class").forEach(v=>{
    const c=(v||"").trim();
    if(c && c!=="*") grant.add(norm("Team Spirit "+c));
  });
  for(const f of Object.keys(DATA)) for(const c of CONDS){
    const i=at(f,c); if(i<0) continue;
    DATA[f].rows.forEach((r,ri)=>{
      for(const m of (r[i]||"").matchAll(/unlock:\s*([^;]+)/g)) grant.add(norm(m[1]));
    });
  }
  for(const f of Object.keys(DATA)) for(const c of ["Requires","Needs"]){
    const i=at(f,c); if(i<0) continue;
    DATA[f].rows.forEach((r,ri)=>{
      for(const m of (r[i]||"").matchAll(/unlocked:\s*([^;]+)/g))
        if(!want.has(norm(m[1]))) want.set(norm(m[1]),{f,ri,c,raw:m[1].trim()});
    });
  }
  for(const [k,w] of want) if(!grant.has(k))
    add(w.f,w.ri,w.c||"Requires",`Nothing ever unlocks "${w.raw}".`,`Give it to somebody: <code>unlock:${w.raw}</code> in a Season reward, a Bounty reward, a Building action or a Progression row.`);
  /* 5b. a talent pointing at a Tuning row that does not exist */
  if(DATA["Tuning.csv"]){
    const keys=ids("Tuning.csv","Key");
    for(const f of Object.keys(DATA)) for(const c of CONDS){
      const i=at(f,c); if(i<0) continue;
      DATA[f].rows.forEach((r,ri)=>{
        for(const m of (r[i]||"").matchAll(/count:\s*tune_([A-Za-z0-9_]+)/g))
          if(!keys.has(norm(m[1])))
            add(f,ri,c,`There is no Tuning row called "${m[1]}".`,`count:tune_ has to name a real Key in Tuning.csv, or the talent changes nothing at all.`);
      });
    }
  }
  /* 5c. more icons free from the start than there are slots to carry them.
     A run carries adventure_trait_slots icons and no more. Every icon with a
     blank Requires is available from the very first run, so if there are more
     of those than there are slots, some of them can never be chosen — and
     nothing anywhere says which, because it depends on the order they load. */
  if(DATA["AdventureTraits.csv"]){
    let slots=8;
    if(DATA["Tuning.csv"]){
      const k=at("Tuning.csv","Key"), v=at("Tuning.csv","Value");
      if(k>=0&&v>=0) for(const r of DATA["Tuning.csv"].rows)
        if(norm(r[k])==="adventuretraitslots"){ const n=parseInt(r[v]); if(!isNaN(n)) slots=n; }
    }
    const req=at("AdventureTraits.csv","Requires");
    const free=[];
    DATA["AdventureTraits.csv"].rows.forEach((r,ri)=>{
      if(req<0||!(r[req]||"").trim()) free.push(ri);
    });
    if(free.length>slots) add("AdventureTraits.csv",free[slots],"Requires",
      `${free.length} icons are free from the first run, but only ${slots} are carried.`,
      `adventure_trait_slots is ${slots}. Either raise it, or put a <code>Requires</code> on the extra icons — <code>unlocked:Something</code> — so the player earns them instead of having ${free.length-slots} of them silently do nothing.`);
  }
  /* 5d. an item filed under Items that cannot be used.
     The Items tab is the only clickable one. A row that lands there with a
     blank Use is a tile the player can point at, can click, and which does
     nothing — which reads as a broken game rather than as a material. */
  if(DATA["Items.csv"]){
    const tabAt=at("Items.csv","Tab"), kindAt=at("Items.csv","Kind"), useAt=at("Items.csv","Use");
    if(useAt>=0) DATA["Items.csv"].rows.forEach((r,ri)=>{
      const said=(tabAt>=0?(r[tabAt]||""):"").trim().toLowerCase();
      const kind=(kindAt>=0?(r[kindAt]||""):"").trim().toLowerCase();
      const use=(r[useAt]||"").trim();
      let tab=said;
      if(!["items","resources","keys"].includes(tab)){
        if(["key","token","quest"].includes(kind)) tab="keys";
        else if(["material","currency"].includes(kind)) tab="resources";
        else tab=use?"items":"resources";
      }
      if(tab==="items" && !use)
        add("Items.csv",ri,"Use",`"${r[0]}" is on the Items tab but has nothing to use.`,
          `The Items tab is the only clickable one, so this is a tile that does nothing when pressed. Either give it a <code>Use</code>, or move it with the <code>Tab</code> column \u2014 <code>resources</code> for something you spend, <code>keys</code> for something you hold.`);
      if(tab==="keys" && use)
        add("Items.csv",ri,"Tab",`"${r[0]}" is on the Keys tab but has a Use.`,
          `Nothing on the Keys tab is clickable, so its <code>Use</code> can never happen. Move it to <code>items</code> if it is meant to be used.`);
    });
  }
  /* 5e. items and where they may be used.
     Three ways a row can be quietly dead, and each of them looks like a bug
     in the game rather than a blank cell in a spreadsheet. */
  if(DATA["Items.csv"]){
    const useAt=at("Items.csv","Use"), tagAt=at("Items.csv","Tags");
    const brewIds = DATA["Brews.csv"] ? ids("Brews.csv","ID") : null;
    DATA["Items.csv"].rows.forEach((r,ri)=>{
      const use=(useAt>=0?(r[useAt]||""):"").trim();
      const tags=(tagAt>=0?(r[tagAt]||""):"").trim().toLowerCase();
      const tagged=/adventure_consume|match_consume/.test(tags);

      if(tagged && !use)
        add("Items.csv",ri,"Use",`"${r[0]}" is tagged as usable but has no Use.`,
          `A tag says WHERE it may be used; <code>Use</code> says WHAT it does. Without one it is a tile that can be clicked and does nothing.`);

      if(/^brew:/i.test(use)){
        const want=use.slice(5).trim();
        if(brewIds && !brewIds.has(norm(want)))
          add("Items.csv",ri,"Use",`"${r[0]}" pours a brew called "${want}", which is not in Brews.csv.`,
            `<code>Use: brew:fire</code> names a row of Brews.csv by its <b>ID</b>. Add that row, or point it at one that exists.`);
        if(!/match_consume/.test(tags))
          add("Items.csv",ri,"Tags",`"${r[0]}" pours a brew but is not tagged match_consume.`,
            `A brew is used on a player during the match draft, so it needs <code>match_consume</code> in Tags or the flask on a card will never offer it.`);
      }
    });
  }
  /* 5f. an ability whose Trigger is not a trigger.
     The list is AbilityTriggers.csv, and a `planned` one is fine — it is a
     word nobody has heard of that is the problem, because the card silently
     never fires and nothing says why. */
  if(DATA["Abilities.csv"] && DATA["AbilityTriggers.csv"]){
    const known=ids("AbilityTriggers.csv","ID");
    const tAt=at("Abilities.csv","Trigger");
    if(tAt>=0) DATA["Abilities.csv"].rows.forEach((r,ri)=>{
      const t=(r[tAt]||"").trim();
      if(!t) return;
      if(!known.has(norm(t)))
        add("Abilities.csv",ri,"Trigger",`"${t}" is not a trigger.`,
          `Triggers are the ID column of <b>AbilityTriggers.csv</b>. Add a row there \u2014 marked <code>planned</code> if it is not built yet \u2014 or pick one that exists.`);
    });
  }
  /* 6. the tier ladder */
  const rungs={};
  if(DATA["TierPowers.csv"]){
    const t=at("TierPowers.csv","Tier"), lo=at("TierPowers.csv","Min Attack"), hi=at("TierPowers.csv","Max Attack");
    if(t>=0&&lo>=0&&hi>=0) DATA["TierPowers.csv"].rows.forEach((r,ri)=>{
      const a=parseInt(r[lo]),b=parseInt(r[hi]);
      if(isNaN(a)||isNaN(b))return;
      const list=[]; for(let p=a;p<=b;p++) list.push(p);
      rungs[norm(r[t])]=list;
      if(list.length!==3) add("TierPowers.csv",ri,"Max Attack",`Tier ${r[t]} holds ${list.length} cards, not three.`,`The pitch has three slots per tier. Keep Min to Max three wide.`);
    });
  }
  for(const f of unitFiles()){
    const p=at(f,"Base Power Left"), t=at(f,"Tier"), n=at(f,"Name");
    DATA[f].rows.forEach((r,ri)=>{
      const tier=norm(r[t]), pw=parseInt(r[p]);
      if(!rungs[tier]||isNaN(pw)) return;
      if(!rungs[tier].includes(pw))
        add(f,ri,"Base Power Left",`${r[n]||"This card"} is Tier ${r[t]} with ${pw} power.`,`Tier ${r[t]} holds ${rungs[tier].join(", ")}. Change the power or the tier.`);
    });
  }
  /* 6b. two cards of the same class on the same rung */
  for(const f of unitFiles()){
    const p=at(f,"Base Power Left"), t=at(f,"Tier"), n=at(f,"Name"), u=at(f,"Unit Type");
    const seen={};
    DATA[f].rows.forEach((r,ri)=>{
      const k=norm(r[u])+"|"+norm(r[t])+"|"+String(r[p]).trim();
      if(!norm(r[t])||String(r[p]).trim()==="") return;
      if(seen[k]!==undefined)
        add(f,ri,"Base Power Left",`${r[n]||"This card"} and ${DATA[f].rows[seen[k]][n]||"another card"} are both Tier ${r[t]} at ${r[p]} power.`,
          `A tier holds ONE card of each power. One of them has to move to a different rung.`);
      else seen[k]=ri;
    });
  }
  /* 7. enemy layers */
  if(DATA["AdventureEnemies.csv"]){
    const L=at("AdventureEnemies.csv","Layers"), A=at("AdventureEnemies.csv","Attack"), N=at("AdventureEnemies.csv","Name");
    DATA["AdventureEnemies.csv"].rows.forEach((r,ri)=>{
      if(A>=0&&!(parseInt(r[A])>0)) add("AdventureEnemies.csv",ri,"Attack",`${r[N]||"This enemy"} has no Attack.`,`It could never hurt anybody. Give it at least 1.`);
      if(L<0) return;
      (r[L]||"").split("|").forEach(pc=>{
        const b=pc.trim().split(":"); if(b.length<3) return;
        const soak=parseInt(b[2]);
        if(soak>=5) add("AdventureEnemies.csv",ri,"Layers",`The "${b[0]}" layer soaks ${soak}.`,`The biggest power gap possible is 5, so almost nothing would get through. 0 to 3 is the useful range.`);
      });
    });
  }
  /* 8. brew costs name real items */
  if(DATA["Brews.csv"]&&DATA["Items.csv"]){
    const C=at("Brews.csv","Cost"), pool=ids("Items.csv","ID");
    if(C>=0) DATA["Brews.csv"].rows.forEach((r,ri)=>{
      (r[C]||"").split("|").forEach(pc=>{
        const nm=pc.split(":")[0].trim(); if(!nm) return;
        if(!pool.has(norm(nm))) add("Brews.csv",ri,"Cost",`"${nm}" is not in Items.csv.`,`A cost has to name a real item.`);
      });
    });
  }

  /* ---------- 9. THE ADVENTURE PILE ---------- */
  if(DATA["AdventureCombos.csv"]){
    const F="AdventureCombos.csv";
    const E=at(F,"Effect"), T=at(F,"Target"), V=at(F,"Value"), A=at(F,"At"),
          L=at(F,"Lasts"), TR=at(F,"Trait"), NM=at(F,"Name");
    const spawns=ids("AdventureSpawns.csv","ID");
    DATA[F].rows.forEach((r,ri)=>{
      const eff=norm(r[E]), tgt=(r[T]||"").trim(), nm=(r[NM]||"a row");
      if(eff && !EFFECTS.includes(eff))
        add(F,ri,"Effect",`"${(r[E]||"").trim()}" is not an effect the game knows.`,
          `It must be one of: ${EFFECTS.join(", ")}. A row it cannot read is skipped, so this breakpoint would do nothing.`);
      if(A>=0 && !(parseInt(r[A])>0))
        add(F,ri,"At",`${nm} has no At.`,`At is how many of that icon it takes. 2 means two on the pile.`);
      if(eff==="spawn"){
        if(!tgt) add(F,ri,"Target",`${nm} spawns something, but does not say what.`,`Target names a row of AdventureSpawns.csv.`);
        else if(spawns.size && !spawns.has(norm(tgt)))
          add(F,ri,"Target",`"${tgt}" is not in AdventureSpawns.csv.`,`Add a row there, or point at one that exists.`);
      }
      if(eff==="strike" && tgt && !["all","focus"].includes(norm(tgt)))
        add(F,ri,"Target",`A strike goes at "all" or "focus", not "${tgt}".`,`Blank counts as all.`);
      if((eff==="heal"||eff==="stamina") && tgt && !["all","lowest","last"].includes(norm(tgt)))
        add(F,ri,"Target",`A heal goes to "lowest", "all" or "last", not "${tgt}".`,`Blank counts as lowest.`);
      if(eff==="revive" && tgt && isNaN(parseInt(tgt)))
        add(F,ri,"Target",`For a revive, Target is HOW MUCH STAMINA they get up with.`,`Put a number there, or leave it blank to use adventure_revive_stamina from Tuning.csv.`);
      if(V>=0 && eff && !(parseInt(r[V])>0))
        add(F,ri,"Value",`${nm} is worth nothing.`,`Value is the number the effect uses — the damage, the stamina, how many to bring on.`);
      /* held/once sanity */
      const lasts=norm(r[L]);
      if(lasts==="held" && ["revive","spawn","strike","heal","stamina"].includes(eff))
        add(F,ri,"Lasts",`A ${eff} marked "held" would try to happen continuously.`,
          `These are one-off things. Use <code>once</code>, or leave Lasts blank and the game picks it for you.`);
      if(lasts==="once" && ["attack","shield"].includes(eff))
        add(F,ri,"Lasts",`An ${eff} marked "once" does nothing at all.`,
          `It is a standing bonus — it applies while you hold the icons. Use <code>held</code>, or leave Lasts blank.`);
    });
    /* two breakpoints at the same At on one trait */
    const seen={};
    DATA[F].rows.forEach((r,ri)=>{
      const k=norm(r[TR])+"|"+String(r[A]).trim();
      if(!norm(r[TR])) return;
      if(seen[k]!==undefined) add(F,ri,"At",`Two breakpoints on ${(r[TR]||"").trim()} both fire at ${r[A]}.`,
        `Only the higher one would ever be the "best" — give them different numbers.`);
      else seen[k]=ri;
    });
  }
  if(DATA["AdventureTraits.csv"]){
    const F="AdventureTraits.csv";
    const ID=at(F,"ID"), FR=at(F,"From"), VA=at(F,"Value"), NM=at(F,"Name"), MX=at(F,"Max");
    /* every element and class the cards actually have */
    const elements=new Set(), classes=new Set();
    unitFiles().forEach(f=>{
      col(f,"Element").forEach(v=>v&&elements.add(norm(v)));
      col(f,"Unit Type").forEach(v=>v&&classes.add(norm(v)));
    });
    col("Brews.csv","Element").forEach(v=>v&&elements.add(norm(v)));
    col("Brews.csv","Becomes").forEach(v=>v&&classes.add(norm(v)));
    col("AdventureEnemies.csv","Element").forEach(v=>v&&elements.add(norm(v)));
    col("AdventureEnemies.csv","Pool").forEach(v=>v&&classes.add(norm(v)));
    col("AdventureSpawns.csv","Element").forEach(v=>v&&elements.add(norm(v)));
    col("AdventureSpawns.csv","Class").forEach(v=>v&&classes.add(norm(v)));

    const used=new Set(col("AdventureCombos.csv","Trait").map(norm));
    DATA[F].rows.forEach((r,ri)=>{
      const from=norm(r[FR]), val=norm(r[VA]), nm=(r[NM]||r[ID]||"this icon");
      if(from!=="star" && !val)
        add(F,ri,"Value",`${nm} has no Value.`,`Value is which Element or Unit Type counts as this icon. Only a "star" row may leave it blank.`);
      if(from==="element" && val && elements.size && !elements.has(val))
        add(F,ri,"Value",`No card, brew, enemy or spawn has the element "${(r[VA]||"").trim()}".`,
          `Nothing would ever put this icon on the pile. Check the spelling, or give a card that Element.`);
      if(from==="class" && val && classes.size && !classes.has(val))
        add(F,ri,"Value",`No card, brew, enemy or spawn has the class "${(r[VA]||"").trim()}".`,
          `Nothing would ever put this icon on the pile. Check the spelling against ClassInfo.csv and AdventureEnemies' Pool column.`);
      if(!used.has(norm(r[ID])) && DATA["AdventureCombos.csv"])
        add(F,ri,"ID",`Nothing happens when you collect ${nm}.`,
          `The bar will show it filling up and it will never do anything. Add a row to AdventureCombos.csv with Trait = ${(r[ID]||"").trim()}.`);
      if(MX>=0 && !(parseInt(r[MX])>0))
        add(F,ri,"Max",`${nm} has no Max.`,`Max is how far the bar counts. Usually your biggest breakpoint.`);
    });
  }
  if(DATA["AdventureSpawns.csv"]){
    const F="AdventureSpawns.csv";
    const P=at(F,"Power"), T=at(F,"Tier"), N=at(F,"Name");
    DATA[F].rows.forEach((r,ri)=>{
      const tier=norm(r[T]), pw=parseInt(r[P]);
      if(tier && rungs[tier] && !isNaN(pw) && !rungs[tier].includes(pw))
        add(F,ri,"Power",`${r[N]||"This stand-in"} is Tier ${r[T]} with ${pw} power.`,
          `The game will clamp it into ${rungs[tier].join(", ")} when it walks on, so it will not arrive as the number you wrote here.`);
    });
  }
  /* 10. Juice */
  if(DATA["Juice.csv"]){
    const F="Juice.csv";
    const W=at(F,"When"), WHO=at(F,"Who"), SD=at(F,"Sound"), SL=at(F,"Slowmo"), ID=at(F,"ID");
    const cues=ids("Audio.csv","ID");
    const dips={};
    DATA[F].rows.forEach((r,ri)=>{
      const when=norm(r[W]);
      if(when && !MOMENTS.map(norm).includes(when))
        add(F,ri,"When",`"${(r[W]||"").trim()}" is not a moment the game ever announces.`,
          `It must be one of: ${MOMENTS.join(", ")}. A row nobody fires does nothing.`);
      const who=norm(r[WHO]);
      if(who && !["player","enemy","screen","ball"].includes(who))
        add(F,ri,"Who",`"${(r[WHO]||"").trim()}" is not something the game can shake.`,`player, enemy, screen or ball.`);
      const snd=(r[SD]||"").trim();
      if(snd && cues.size && !cues.has(norm(snd)))
        add(F,ri,"Sound",`"${snd}" is not a row of Audio.csv.`,
          `It will be looked for as a FILE in assets/audio/ instead, which works — but a row gives it volume, a bus and the Sound slider.`);
      const dip=parseFloat(r[SL]);
      if(dip>0.4) add(F,ri,"Slowmo",`${dip} seconds is a long dip.`,
        `Slow-motion reads best under about a third of a second. Longer and it stops being a punch and starts being a wait.`);
      if(dip>0 && when){ dips[when]=(dips[when]||0)+1; }
    });
    for(const [w,n] of Object.entries(dips)) if(n>1){
      DATA[F].rows.forEach((r,ri)=>{
        if(norm(r[W])===w && parseFloat(r[SL])>0 && !PROBS.some(p=>p.file===F&&p.row===ri&&p.col==="Slowmo"))
          add(F,ri,"Slowmo",`${n} rows of "${(r[W]||"").trim()}" ask for slow-motion.`,
            `Harmless — the game takes the LONGEST and makes one dip out of it. But only one of them is doing anything, so you may as well zero the others.`);
      });
    }
  }
  /* 11. Seasons shelf */
  if(DATA["Seasons.csv"]){
    const F="Seasons.csv", R=at(F,"Row"), C=at(F,"Column"), N=at(F,"Name");
    const seen={};
    DATA[F].rows.forEach((r,ri)=>{
      const k=String(r[R]).trim()+"|"+String(r[C]).trim();
      if(!String(r[R]).trim()) return;
      if(seen[k]!==undefined) add(F,ri,"Column",`${r[N]||"This season"} sits on top of ${DATA[F].rows[seen[k]][N]||"another one"}.`,
        `Two tiles at Row ${r[R]}, Column ${r[C]} are drawn in the same place. Move one.`);
      else seen[k]=ri;
    });
  }
  /* 12. soft notes — things that are legal but usually not what you meant */
  {
    /* a class that has Stars, and so will appear on the class-select screen,
       but no ClassInfo row to describe it. Perfectly legal; it just turns up
       with no blurb and no banner. */
    const described=ids("ClassInfo.csv","Class");
    if(described.size){
      const starred=new Set(), where={};
      unitFiles().forEach(f=>{
        const u=at(f,"Unit Type"), pt=at(f,"Player Type");
        DATA[f].rows.forEach((r,ri)=>{
          if(pt>=0 && norm(r[pt])!=="star") return;
          const k=norm(r[u]); if(!k) return;
          if(!starred.has(k)){ starred.add(k); where[k]={f,ri,raw:(r[u]||"").trim()}; }
        });
      });
      for(const k of starred) if(!described.has(k)){
        const w=where[k];
        add(w.f,w.ri,"Unit Type",`"${w.raw}" has Star players but no row in ClassInfo.csv.`,
          `It will still be offered on the class-select screen — it just turns up with no description and no banner. Add a row to ClassInfo.csv to give it both.`);
      }
    }
    /* Music and Background columns naming something Audio/asset-wise unknown
       is not an error: the game looks for a FILE of that name. Say so once
       rather than flagging every row. */
    const cues=ids("Audio.csv","ID");
    const M=at("Biomes.csv","Music");
    if(M>=0 && cues.size) DATA["Biomes.csv"].rows.forEach((r,ri)=>{
      const v=(r[M]||"").trim(); if(!v) return;
      if(!cues.has(norm(v)))
        add("Biomes.csv",ri,"Music",`"${v}" has no row in Audio.csv.`,
          `The game will look for a file called that in assets/music/ instead, which works. A row would give it a volume, a fade and the Music slider.`);
    });
  }
  paintProbs();
}

function artRowCount(){
  let n=0; ART_GROUPS.forEach(g=>{ if(g.rows) n+=g.rows.length; }); return n;
}
function artDone(){
  let n=0; ART_GROUPS.forEach(g=>{ if(g.rows) g.rows.forEach(r=>{ if(HAVE["art:"+r.id]) n++; }); }); return n;
}

function paintArt(){
  $("#title").textContent="Art & sizes";
  $("#what").textContent="Every picture the game will ever ask you for, the box it is drawn into, and the canvas I would draw it on.";
  $("#help").hidden=false;
  $("#help").innerHTML="<b>Every number on this page was read out of the running game</b> — out of the code that draws the thing, out of Tuning.csv and out of Stadium.csv — rather than guessed. <b>Drawn at</b> is the box on a 1920 × 1080 screen. <b>Make it</b> is what I would open in the art program: usually 2× or 4× the box, because everything is drawn with nearest-neighbour filtering and an exact multiple stays sharp. The ticks are yours and are kept in this browser.";

  const mk=(t,fn,cls)=>{const b=document.createElement("button");b.className="btn sm "+(cls||"");b.textContent=t;b.onclick=fn;$("#tools").appendChild(b);return b;};
  mk("Copy as a work list",()=>{
    const out=["STURMBALL — ART TO MAKE",""];
    ART_GROUPS.forEach(g=>{
      if(!g.rows) return;
      out.push(g.title.toUpperCase()+(g.dir?"      "+g.dir:""));
      g.rows.forEach(r=>{
        out.push("  "+(HAVE["art:"+r.id]?"[x] ":"[ ] ")+r.what);
        out.push("        drawn at "+r.drawn+"   ·   make it "+r.make+"   ·   "+r.fit);
        out.push("        from "+String(r.from).replace(/<[^>]+>/g,""));
      });
      out.push("");
    });
    const text=out.join("\n");
    navigator.clipboard.writeText(text).then(()=>alert("The work list is on your clipboard."),()=>alert(text));
  },"key");
  mk("Untick everything",()=>{ if(confirm("Clear every art tick?")){
    Object.keys(HAVE).forEach(k=>{ if(k.indexOf("art:")===0) delete HAVE[k]; });
    saveHave(); paintTable(); paintRail(); } });

  const wrap=$("#wrap"); wrap.innerHTML="";
  const board=document.createElement("div"); board.className="board";

  const tally=document.createElement("div"); tally.className="hint";
  tally.innerHTML=`<b>${artDone()} of ${artRowCount()} kinds of art ticked off.</b> Nothing here is checked against your disk — the workbench is a web page and cannot see your project folder. Tick a row when you have drawn it. The <b>Where things go</b> page is the other half of this: it lists the individual <i>file names</i> your spreadsheets are currently asking for.`;
  board.appendChild(tally);

  ART_GROUPS.forEach(g=>{
    const box=document.createElement("div"); box.className="cheat";
    const head=document.createElement("h4");
    head.textContent=g.title;
    if(g.dir){
      const d=document.createElement("span");
      d.style.cssText="margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--faint);text-transform:none;letter-spacing:0";
      d.textContent="res://"+g.dir;
      head.style.display="flex"; head.style.alignItems="center"; head.appendChild(d);
    }
    box.appendChild(head);
    const inner=document.createElement("div"); inner.className="in";

    if(g.html) inner.innerHTML=g.html;
    if(g.intro2) inner.innerHTML=g.intro2;

    if(g.rows){
      const t=document.createElement("table"); t.className="spec";
      t.innerHTML="<thead><tr><th></th><th>What</th><th>Drawn at</th><th>Make it</th><th>Fit</th><th>Named by</th></tr></thead>";
      const body=document.createElement("tbody");
      g.rows.forEach(r=>{
        const tr=document.createElement("tr");
        const key="art:"+r.id;
        if(HAVE[key]) tr.className="done";
        const tick=document.createElement("td"); tick.className="tick";
        const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!HAVE[key];
        cb.onchange=()=>{ if(cb.checked) HAVE[key]=true; else delete HAVE[key];
          saveHave(); tr.className=cb.checked?"done":"";
          tally.innerHTML=tally.innerHTML.replace(/<b>\d+ of \d+ kinds/,`<b>${artDone()} of ${artRowCount()} kinds`);
          paintRail(); };
        tick.appendChild(cb); tr.appendChild(tick);

        const what=document.createElement("td"); what.className="what";
        what.innerHTML="<b></b>"+(r.why?"<span>"+r.why+"</span>":"");
        what.querySelector("b").textContent=r.what;
        tr.appendChild(what);

        const a=document.createElement("td"); a.className="px"; a.textContent=r.drawn; tr.appendChild(a);
        const b=document.createElement("td"); b.className="mk"; b.textContent=r.make; tr.appendChild(b);
        const c=document.createElement("td"); c.className="fit"; c.textContent=r.fit; tr.appendChild(c);
        const d=document.createElement("td"); d.className="fit"; d.innerHTML=r.from; tr.appendChild(d);
        body.appendChild(tr);

        if(r.note){
          const nr=document.createElement("tr");
          const nd=document.createElement("td"); nd.colSpan=6;
          nd.className="note";
          nd.style.cssText="padding-top:0;color:var(--dim);font-size:12.5px;padding-left:25px;white-space:normal";
          nd.innerHTML=r.note;
          nr.appendChild(nd); body.appendChild(nr);
        }
      });
      t.appendChild(body); inner.appendChild(t);
    }

    if(g.warn){
      const w=document.createElement("div"); w.className="warnbox"; w.innerHTML=g.warn;
      inner.appendChild(w);
    }
    box.appendChild(inner);
    board.appendChild(box);
  });

  wrap.appendChild(board);
}

/* ============================================================
   v4 — THE NEW CLASS WIZARD

   "When I want to create a new Class I could click New Class -> establish
    the Emblem ability -> establish the Ultimate -> establish the Star
    Player -> establish the 9 player units that have synergy with that Star
    -> Finish Class"

   That is the order, and it is the right order, because it is the order the
   DEPENDENCIES run in: the Emblem names the token, the token is what the
   nine units make and spend, and the Star carries the Emblem on. Do it the
   other way round and the nine units have nothing to be about.

   A class is 30 cards. THREE TIMES nine units, plus three Stars:

       3 Star Players          one whole tier between them
       3 sets of nine          the other three tiers, three cards each
       3 Emblems               one per Star, one per set

   So the wizard runs the Emblem-to-nine loop three times and then writes
   four files at once.
   ============================================================ */

/* The whole class, as it is being built. One object, so "Back" is free. */
let WIZ = null;

/* The four tiers, without the blank first entry the dropdowns use. The
   schema file already has a `TIERS` with an empty string at the front for
   "no tier chosen"; this is the ladder itself. */
const WIZ_TIERS = ["I","II","III","IV"];
/* THE LADDER, and the one rule nothing may break: a tier holds one card of
   each power in its span, never two the same. */
const WIZ_POWERS = {I:[0,1,2], II:[1,2,3], III:[2,3,4], IV:[3,4,5]};


function wizStart(){
  WIZ = {
    step: 0,
    cls: "", display: "", element: "WATER", starTier: "II", description: "",
    sets: [0,1,2].map(i => ({
      emblem: "", token: "", basic: "", condition: "", turnsOn: "", counter: "",
      need: 3 + i, ultimate: "", starFront: "", starPower: null, units: null,
    })),
  };
  wizDraw();
}


function wizElements(){
  const out = [];
  if(DATA["Elements.csv"]){
    const i = at("Elements.csv","Element");
    if(i>=0) DATA["Elements.csv"].rows.forEach(r=>{ const v=(r[i]||"").trim(); if(v) out.push(v); });
  }
  return out.length ? out : ["WATER","FIRE","EARTH","AIR"];
}

/* The three tiers a SET of nine covers — every tier except the Stars'. */
function wizSetTiers(){
  return WIZ_TIERS.filter(t => t !== WIZ.starTier);
}

/* Every row of UnitActions.csv that may be rolled for this set. */
function wizPhrases(kind, side, tier){
  const f = "UnitActions.csv";
  if(!DATA[f]) return [];
  const H = c => at(f,c);
  const out = [];
  DATA[f].rows.forEach(r=>{
    const g = c => { const i=H(c); return i<0 ? "*" : String(r[i]||"*").trim() || "*"; };
    if(norm(g("Kind")) !== norm(kind)) return;
    const el = g("Element"), cl = g("Class"), ti = g("Tier"), si = g("Side");
    if(el!=="*" && norm(el)!==norm(WIZ.element)) return;
    if(cl!=="*" && norm(cl)!==norm(WIZ.cls)) return;
    if(ti!=="*" && !ti.split("|").map(x=>x.trim()).includes(tier)) return;
    if(si!=="both" && si!=="*" && norm(si)!==norm(side)) return;
    const w = Math.max(1, parseInt(g("Weight"),10) || 1);
    const text = H("Text")>=0 ? String(r[H("Text")]||"") : "";
    if(!text) return;
    for(let i=0;i<w;i++) out.push(text);
  });
  return out;
}

/* Fill {tier} {element} {token} {n} {class}. */
function wizFill(text, set, tier){
  const others = WIZ_TIERS.filter(t=>t!==tier);
  return String(text)
    .replace(/\{tier\}/g, () => others[Math.floor(Math.random()*others.length)])
    .replace(/\{element\}/g, () => WIZ.element.toLowerCase())
    .replace(/\{class\}/g, () => WIZ.cls)
    .replace(/\{token\}/g, () => set.token || "token")
    .replace(/\{n\}/g, () => String(1 + Math.floor(Math.random()*2)));
}

function wizOne(set, side, tier){
  const trig = wizPhrases("trigger", side, tier);
  const eff  = wizPhrases("effect",  side, tier);
  if(!eff.length) return "";
  const e = wizFill(eff[Math.floor(Math.random()*eff.length)], set, tier);
  if(!trig.length) return e;
  const t = wizFill(trig[Math.floor(Math.random()*trig.length)], set, tier);
  return t + ": " + e;
}

/* A NAME OF HIS OWN (round X). A first name from Names.csv that no card in
   any loaded unit file has, and that this wizard has not already handed out.
   Falls back to "Unit Name" only if Names.csv is not loaded - and the
   checker then flags it. */
const WIZ_NAMES_GIVEN = new Set();
function wizName(){
  const taken = new Set(WIZ_NAMES_GIVEN);
  for(const f of Object.keys(DATA)){
    if(at(f,"Name")<0 || at(f,"Tier")<0) continue;
    col(f,"Name").forEach(v=>v && taken.add(norm(v)));
  }
  const free = col("Names.csv","First Name").filter(v=>v && !taken.has(norm(v)));
  if(!free.length) return "Unit Name";
  const pick = free[Math.floor(Math.random()*free.length)];
  WIZ_NAMES_GIVEN.add(norm(pick));
  return pick;
}

/* ROLL THE NINE. Three per tier, one of each power in that tier's span, so
   the ladder is obeyed by construction rather than checked afterwards. */
function wizRoll(set){
  const out = [];
  wizSetTiers().forEach(tier=>{
    WIZ_POWERS[tier].forEach(power=>{
      out.push({
        tier, power,
        name: wizName(),
        attack: wizOne(set, "attack", tier),
        defend: wizOne(set, "defend", tier),
      });
    });
  });
  return out;
}


/* ------------------------------------------------------------
   DRAWING
   ------------------------------------------------------------ */
function wizDraw(){
  let host = $("#wiz");
  if(!host){ host=document.createElement("div"); host.id="wiz"; document.body.appendChild(host); }

  const labels = ["The class","Emblem 1","Emblem 2","Emblem 3","Finish"];
  const crumbs = labels.map((t,i)=>
    `<div class="${i===WIZ.step?"on":(i<WIZ.step?"did":"")}">${i+1}. ${t}</div>`).join("");

  let body = "", title = "";
  if(WIZ.step===0){ title="New class"; body=wizStepClass(); }
  else if(WIZ.step<=3){ title="Emblem "+WIZ.step+" of 3"; body=wizStepSet(WIZ.step-1); }
  else { title="Finish the class"; body=wizStepFinish(); }

  const back = WIZ.step>0 ? `<button class="btn" id="wBack">Back</button>` : "";
  const next = WIZ.step<4
    ? `<button class="btn key" id="wNext">Next</button>`
    : `<button class="btn key" id="wDone">Write the four files</button>`;

  host.innerHTML = `<div class="sheet">
    <header><h3>${title}</h3><div class="grow" style="flex:1"></div>
      <button class="btn sm" id="wShut">Close</button></header>
    <div class="in"><div class="steps">${crumbs}</div>${body}</div>
    <footer>${back}<div style="flex:1"></div><span id="wSay" style="color:#e07a2c;font-size:12.6px"></span>${next}</footer>
  </div>`;

  $("#wShut").onclick = ()=>{ if(confirm("Close the wizard? Nothing is written until you press the last button.")) host.remove(); };
  if($("#wBack")) $("#wBack").onclick = ()=>{ wizRead(); WIZ.step--; wizDraw(); };
  if($("#wNext")) $("#wNext").onclick = ()=>{
    wizRead();
    const bad = wizComplain();
    if(bad){ $("#wSay").textContent = bad; return; }
    WIZ.step++; wizDraw();
  };
  if($("#wDone")) $("#wDone").onclick = wizWrite;

  // ---- CHANGING THE TOKEN RE-ROLLS THE NINE, on the spot ----
  //
  // Live rather than on Next, because the whole point of the token is that
  // you can see what it does to the nine units while you are choosing it.
  const tok = document.getElementById("sTok");
  if(tok) tok.onchange = ()=>{
    const s2 = WIZ.sets[WIZ.step-1];
    const was = s2.token;
    wizRead();
    if(norm(was) !== norm(s2.token)){ s2.units = wizRoll(s2); wizDraw(); }
  };

  // reroll buttons
  host.querySelectorAll("[data-roll]").forEach(b=>{
    b.onclick = ()=>{ wizRead(); const s=WIZ.sets[+b.dataset.roll]; s.units = wizRoll(s); wizDraw(); };
  });
  host.querySelectorAll("[data-rollone]").forEach(b=>{
    b.onclick = ()=>{
      wizRead();
      const [si,ui] = b.dataset.rollone.split(":").map(Number);
      const s = WIZ.sets[si], u = s.units[ui];
      u.attack = wizOne(s,"attack",u.tier);
      u.defend = wizOne(s,"defend",u.tier);
      wizDraw();
    };
  });
}


function wizStepClass(){
  const els = wizElements().map(e=>
    `<option value="${e}"${e===WIZ.element?" selected":""}>${e}</option>`).join("");
  const tiers = WIZ_TIERS.map(t=>
    `<option value="${t}"${t===WIZ.starTier?" selected":""}>Tier ${t}</option>`).join("");
  return `
  <div class="wizhint"><b>A class is 30 cards.</b> Three Star Players holding one whole tier between them,
  and three sets of nine covering the other three tiers, three cards each. This wizard walks the Emblem
  three times &mdash; Emblem &rarr; Ultimate &rarr; Star &rarr; nine units &mdash; and writes all four files at the end.</div>
  <div class="two">
    <div class="fld"><label>Class</label><input id="wCls" value="${wizEsc(WIZ.cls)}" placeholder="Lorelei">
      <p class="why">The name the CSVs use. It becomes the Unit Type column and the file names.</p></div>
    <div class="fld"><label>Display name</label><input id="wDisp" value="${wizEsc(WIZ.display)}" placeholder="Lorelei">
      <p class="why">What a player sees. Blank uses the class name.</p></div>
  </div>
  <div class="two">
    <div class="fld"><label>Element</label><select id="wEl">${els}</select>
      <p class="why"><b>The element is what this class shares with other classes.</b> An Emblem's Basic side is
      fed by any unit of the same element, whatever its class; only this class can complete the Condition.
      That is the whole reason a second water class is worth writing.</p></div>
    <div class="fld"><label>The Stars' tier</label><select id="wTier">${tiers}</select>
      <p class="why">All three Stars sit in this one tier, filling its three rungs. Each set of nine then
      covers the other three: <b>${wizSetTiers().map(t=>"Tier "+t).join(", ")}</b>.</p></div>
  </div>
  <div class="fld"><label>Description</label><textarea id="wDesc" placeholder="What this class does, in a sentence or two.">${wizEsc(WIZ.description)}</textarea></div>`;
}


function wizStepSet(i){
  const s = WIZ.sets[i];
  // ============ NOTHING IS ROLLED UNTIL THE TOKEN HAS A NAME ============
  //
  // It used to roll on the first draw, which was before you had typed the
  // token — so every {token} came out as the literal word "token" and nine
  // units arrived saying "If this has a token". Naming the token is what the
  // nine units are FOR; rolling before it is set is rolling nothing.
  if(s.token && !s.units) s.units = wizRoll(s);
  const rows = (s.units||[]).map((u,ui)=>`<tr>
      <td class="t">${u.tier}</td><td class="p">${u.power}</td>
      <td><input data-u="${i}:${ui}:name" value="${wizEsc(u.name)}"></td>
      <td><input data-u="${i}:${ui}:attack" value="${wizEsc(u.attack)}"></td>
      <td><input data-u="${i}:${ui}:defend" value="${wizEsc(u.defend)}"></td>
      <td><button class="btn sm" data-rollone="${i}:${ui}">↻</button></td>
    </tr>`).join("");

  return `
  <div class="wizhint"><b>The order matters.</b> The Emblem names the <b>token</b>; the token is what the nine
  units make and spend; the Star carries the Emblem onto the pitch. Written the other way round, the nine
  units have nothing to be about &mdash; which is why the wizard asks in this order and not a tidier one.</div>

  <div class="two">
    <div class="fld"><label>Emblem name</label><input id="sName" value="${wizEsc(s.emblem)}" placeholder="Gremory">
      <p class="why">A Goetia demon, to match the two classes already written. It is also the Star's name.</p></div>
    <div class="fld"><label>Token &mdash; the set's own word</label><input id="sTok" value="${wizEsc(s.token)}" placeholder="Rose Unit">
      <p class="why"><b>The single most important cell on this page.</b> Rose Unit, Swan, Song counter, burn
      counter, Teufel Mask. It is what the nine units make and spend, and it is what makes them read as a set
      that belongs together rather than nine cards that share a class. Every <code>{token}</code> below is filled with it.</p></div>
  </div>

  <div class="fld"><label>Basic side &mdash; what the Emblem does from kick-off</label>
    <textarea id="sBasic" placeholder="When two or more water units enter the exhaust after combat, gain a Rose Unit Token…">${wizEsc(s.basic)}</textarea></div>

  <div class="fld"><label>Condition &mdash; what a player reads</label>
    <textarea id="sCond" placeholder="If all three Tier I Units that were removed to create Rose Token Units were Lorelei: Transform this Emblem.">${wizEsc(s.condition)}</textarea>
    <p class="why">Prose, for the card. The game cannot read it &mdash; that is the next two boxes.</p></div>

  <div class="two">
    <div class="fld"><label>Counter it waits on</label><input id="sCount" value="${wizEsc(s.counter)}" placeholder="lorelei_tier_i_traded">
      <p class="why">A row of Stats.csv. The emblem bar reads the progress out of this.</p></div>
    <div class="fld"><label>How many</label><input id="sNeed" type="number" min="1" max="30" value="${s.need}">
      <p class="why"><b>Keep the three within one or two of each other.</b> Only the first Emblem to complete turns
      over, so one that needs eight when another needs three is an Ultimate no player will ever see.</p></div>
  </div>

  <div class="fld"><label>Ultimate side &mdash; the other face</label>
    <textarea id="sUlt" placeholder="Your Basic side is still active. Instead of only Tier I…">${wizEsc(s.ultimate)}</textarea>
    <p class="why">This goes on <b>both</b> the Emblem and the Star: when the Condition completes, the Emblem turns
    over and the Star turns to its Ultimate Side at the same moment. A player can read it on hover from the first minute.</p></div>

  <div class="two">
    <div class="fld"><label>The Star's one ability</label><textarea id="sFront" placeholder="If you control 4 tokens: Deal +2 damage during combat">${wizEsc(s.starFront)}</textarea>
      <p class="why">A Star has <b>one</b> ability, not an attack and a defend. That is the change.</p></div>
    <div class="fld"><label>The Star's power</label>
      <select id="sPow">${WIZ_POWERS[WIZ.starTier].map(p=>
        `<option value="${p}"${s.starPower===p?" selected":""}>${p}</option>`).join("")}</select>
      <p class="why">Tier ${WIZ.starTier} holds ${WIZ_POWERS[WIZ.starTier].join(", ")}. Give the three Stars one each.</p></div>
  </div>

  <div class="fld"><label>The nine units &mdash; rolled from UnitActions.csv</label>
    <p class="why">Three per tier, one of each power in that tier's span, so the ladder is obeyed by construction.
    Every ability is a <b>trigger and an effect</b> joined by a colon, drawn from the vocabulary in UnitActions.csv and
    filtered to this element and these tiers. <b>Edit any of them &mdash; a roll is a first draft, not a decision.</b>
    <button class="btn sm" data-roll="${i}">Roll all nine again</button></p>
    ${s.token ? `<table class="rolled">
      <thead><tr><th>tier</th><th>pow</th><th>name</th><th>attack</th><th>defend</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>` : `<div class="wizhint wizbad"><b>Name the token first.</b> The nine units are rolled around it —
      roll them before it has a name and every one of them says "if this has a token".</div>`}
  </div>`;
}


function wizStepFinish(){
  const cls = WIZ.cls;
  const files = [
    ["ClassInfo.csv", "1 row", "the class, its element and its Star tier"],
    ["Star Players.csv", "3 rows", "one per Star: front side, ultimate side, both artworks"],
    [`${cls} Emblems.csv`, "3 rows", "one per Emblem, each naming its Star, its set and its token"],
    [`Unit_Set_${cls.replace(/[^A-Za-z0-9]+/g,"_")}.csv`, "27 rows", "three sets of nine"],
  ];
  const rows = files.map(([f,n,w])=>`<tr><td class="t">${wizEsc(f)}</td><td class="p">${n}</td><td>${w}</td></tr>`).join("");

  const warn = [];
  const needs = WIZ.sets.map(s=>s.need);
  const spread = Math.max(...needs) - Math.min(...needs);
  if(spread >= 3) warn.push(`The three Conditions need ${needs.join(", ")} — a spread of ${spread}.
    Only the first to complete turns over, so the longest will almost never be the one a player sees.
    Bring them within one or two of each other.`);
  const tokens = WIZ.sets.map(s=>norm(s.token));
  if(new Set(tokens).size !== 3) warn.push("Two sets share a token. Each set wants its own word, or the nine units of one are indistinguishable from the nine of another.");

  return `
  <div class="wizhint"><b>${wizEsc(WIZ.display||cls)}</b> — ${wizEsc(WIZ.element)}, Stars in Tier ${WIZ.starTier},
  ${WIZ.sets.map(s=>wizEsc(s.emblem)).join(" · ")}. Thirty cards.</div>
  ${warn.map(w=>`<div class="wizhint wizbad"><b>Worth fixing first.</b> ${w}</div>`).join("")}
  <table class="rolled"><thead><tr><th>file</th><th>what it gets</th><th></th></tr></thead><tbody>${rows}</tbody></table>
  <p class="why" style="margin-top:12px">Rows are <b>added</b> to the files you already have and a file that does
  not exist yet is created. Nothing is overwritten. When this is done, open <b>Export</b> and copy each of the
  four into your <code>data</code> folder &mdash; and remember a new file needs a <code>.csv.import</code>
  beside it, which <b>Where things go</b> explains.</p>`;
}


/* ------------------------------------------------------------
   READING THE FORM BACK
   ------------------------------------------------------------ */
function wizRead(){
  const v = id => { const e=document.getElementById(id); return e ? e.value : undefined; };
  if(WIZ.step===0){
    if(v("wCls")!==undefined) WIZ.cls = v("wCls").trim();
    if(v("wDisp")!==undefined) WIZ.display = v("wDisp").trim();
    if(v("wEl")!==undefined) WIZ.element = v("wEl");
    if(v("wTier")!==undefined && v("wTier")!==WIZ.starTier){
      WIZ.starTier = v("wTier");
      // THE TIERS CHANGED, so nine units rolled for the old ones are wrong.
      WIZ.sets.forEach(s=>{ s.units=null; s.starPower=null; });
    }
    if(v("wDesc")!==undefined) WIZ.description = v("wDesc");
    return;
  }
  if(WIZ.step>=1 && WIZ.step<=3){
    const s = WIZ.sets[WIZ.step-1];
    if(v("sName")!==undefined) s.emblem = v("sName").trim();
    if(v("sTok")!==undefined) s.token = v("sTok").trim();
    if(v("sBasic")!==undefined) s.basic = v("sBasic");
    if(v("sCond")!==undefined) s.condition = v("sCond");
    if(v("sCount")!==undefined) s.counter = v("sCount").trim();
    if(v("sNeed")!==undefined) s.need = Math.max(1, parseInt(v("sNeed"),10)||1);
    if(v("sUlt")!==undefined) s.ultimate = v("sUlt");
    if(v("sFront")!==undefined) s.starFront = v("sFront");
    if(v("sPow")!==undefined) s.starPower = parseInt(v("sPow"),10);
    document.querySelectorAll("[data-u]").forEach(inp=>{
      const [si,ui,field] = inp.dataset.u.split(":");
      const set = WIZ.sets[+si];
      if(set && set.units && set.units[+ui]) set.units[+ui][field] = inp.value;
    });
  }
}

function wizComplain(){
  if(WIZ.step===0){
    if(!WIZ.cls) return "The class needs a name.";
    if(DATA["ClassInfo.csv"] && ids("ClassInfo.csv","Class").has(norm(WIZ.cls)))
      return `There is already a class called ${WIZ.cls}.`;
    return "";
  }
  if(WIZ.step>=1 && WIZ.step<=3){
    const s = WIZ.sets[WIZ.step-1];
    if(!s.emblem) return "The Emblem needs a name.";
    if(!s.token) return "The Emblem needs a token — it is what the nine units are about.";
    if(s.starPower===null || s.starPower===undefined) return "Give the Star a power.";
    if(!s.units || !s.units.length) return "The nine units have not been rolled yet — press \u201cRoll all nine again\u201d.";
    const others = WIZ.sets.filter((x,i)=>i!==WIZ.step-1);
    if(others.some(x=>x.emblem && norm(x.emblem)===norm(s.emblem)))
      return "Two Emblems share that name.";
    if(others.some(x=>x.starPower===s.starPower))
      return `Another Star already has power ${s.starPower}. Tier ${WIZ.starTier} holds ${WIZ_POWERS[WIZ.starTier].join(", ")} — one each.`;
    return "";
  }
  return "";
}


/* ------------------------------------------------------------
   WRITING THE FOUR FILES
   ------------------------------------------------------------ */
function wizAdd(file, headers, rows){
  if(!DATA[file]) DATA[file] = {headers: headers.slice(), rows: []};
  const d = DATA[file];
  headers.forEach(h=>{ if(d.headers.indexOf(h)<0){ d.headers.push(h); d.rows.forEach(r=>r.push("")); } });
  rows.forEach(obj=>{
    const r = d.headers.map(h => obj[h]!==undefined ? String(obj[h]) : "");
    d.rows.push(r);
  });
}

function wizWrite(){
  wizRead();
  const cls = WIZ.cls;
  const file = `Unit_Set_${cls.replace(/[^A-Za-z0-9]+/g,"_")}.csv`;
  const emb = `${cls} Emblems.csv`;

  wizAdd("ClassInfo.csv",
    ["Class","Display Name","Description","Banner Art","Formation Art","Element","Star Tier","Requires","Hidden","Notes"],
    [{ "Class":cls, "Display Name":WIZ.display||cls, "Description":WIZ.description,
       "Element":WIZ.element, "Star Tier":WIZ.starTier, "Hidden":"no",
       "Notes":"Written by the New Class wizard." }]);

  wizAdd(emb,
    ["Name","Unit Type","Emblem","Star","Set","Token","Basic Feeds","Order","Basic Side","Basic Ability","Condition","Turns On","Ultimate Side","For AI notes"],
    WIZ.sets.map((s,i)=>({
      "Name":s.emblem, "Unit Type":cls, "Emblem":`${s.emblem}_Emblem.png`,
      "Star":s.emblem, "Set":s.emblem, "Token":s.token,
      "Basic Feeds":"element", "Order":String(i+1),
      "Basic Side":s.basic, "Condition":s.condition,
      "Turns On": s.counter ? `count:${s.counter}>=${s.need}` : "",
      "Ultimate Side":s.ultimate,
      "For AI notes":"",
    })));

  let card = 1;
  wizAdd("Star Players.csv",
    ["Unit Type","Name","Front Side","Ultimate Side","Element","Base Power ","Tier","Card Number","Emblem","Set","Set Name","Artwork","Ultimate Artwork","Player Type","Notes"],
    WIZ.sets.map(s=>({
      "Unit Type":cls, "Name":s.emblem, "Front Side":s.starFront, "Ultimate Side":s.ultimate,
      "Element":WIZ.element, "Base Power ":String(s.starPower), "Tier":WIZ.starTier,
      "Card Number":String(card++), "Emblem":s.emblem, "Set":s.emblem, "Set Name":"Star",
      "Artwork":`Star_${cls}_${s.emblem}.png`, "Ultimate Artwork":`Star_${cls}_${s.emblem}_U.png`,
      "Player Type":"Star", "Notes":"",
    })));

  const units = [];
  WIZ.sets.forEach(s=>{
    (s.units||[]).forEach(u=>{
      units.push({
        "Unit Type":cls, "Name":u.name, "Attack":u.attack, "Defend":u.defend,
        "Element":WIZ.element, "Base Power ":String(u.power), "Tier":u.tier,
        "Card Number":String(card++), "Set Name":s.emblem,
        "Artwork":`${s.emblem}_${cls}.png`, "Player Type":"Normal",
      });
    });
  });
  wizAdd(file,
    ["Unit Type","Name","Attack","Defend","Element","Base Power ","Tier","Card Number","Set Name","Artwork","Player Type"],
    units);

  save(); check(); paintRail(); CUR = emb; paintTable();
  const host=$("#wiz"); if(host) host.remove();
  showText(`${cls} — written`,
    [`${cls} is in the workbench. Four files were touched:`,
     ``,
     `  ClassInfo.csv        + 1 row`,
     `  Star Players.csv     + 3 rows`,
     `  ${emb}${" ".repeat(Math.max(1,20-emb.length))}+ 3 rows`,
     `  ${file}${" ".repeat(Math.max(1,20-file.length))}+ ${units.length} rows`,
     ``,
     `NOTHING IS ON YOUR DISK YET. Open Export, pick each of those four and`,
     `copy or download it into your project's data folder.`,
     ``,
     `A FILE YOU HAVE JUST CREATED ALSO NEEDS A .csv.import BESIDE IT —`,
     `three lines, and "Where things go" has them. Without it Godot reads`,
     `your spreadsheet as a translation table and litters the folder.`,
     ``,
     `STILL TO DO, and none of it is code:`,
     `  · ${WIZ.sets.map(s=>s.counter).filter(Boolean).join(", ") || "(no counters named)"} — add them to Stats.csv`,
     `    and wire the Event column, or the Conditions can never fill.`,
     `  · draw the art: ${WIZ.sets.length} emblems, ${WIZ.sets.length} Star fronts,`,
     `    ${WIZ.sets.length} Star ultimates, ${WIZ.sets.length} set sheets. Sizes are on "Art & sizes".`,
     `  · run tools/emblem_check.gd — it prices the race in duels and will`,
     `    tell you which of your three Ultimates a player will actually see.`,
    ].join("\n"));
}


function wizEsc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function paintProbs(){
  const tag=$("#probtag"), list=$("#problist");
  if(!PROBS.length){ tag.className="tag ok"; tag.textContent="all clear"; }
  else { tag.className="tag err"; tag.textContent=PROBS.length+(PROBS.length===1?" problem":" problems"); }
  list.innerHTML="";
  list.hidden=!OPEN; $("#probchev").textContent=OPEN?"▾":"▸";
  if(!OPEN) return;
  if(SAMPLE && PROBS.length){
    const s=document.createElement("div"); s.className="prob";
    s.innerHTML='<span class="tag ok">sample</span><div><span>Most of these are the example set\'s own fault.</span>'+
      '<span class="fix">It is only the first four rows of each of your real files, so plenty of ids point at rows that were trimmed off. '+
      'Press <b>Load CSVs</b> and choose everything in your <b>data</b> folder — then this list is about your game.</span></div>';
    list.appendChild(s);
  }
  if(!PROBS.length){
    const d=document.createElement("div"); d.className="prob";
    d.innerHTML='<span style="color:var(--dim)">Every id is unique, every reference resolves, every counter that is read is written somewhere, '+
      'every card sits on its proper rung, every trait has something that fires it, and every breakpoint does something the game knows how to do.</span>';
    list.appendChild(d); return;
  }
  PROBS.slice(0,160).forEach(p=>{
    const d=document.createElement("div"); d.className="prob";
    const b=document.createElement("b"); b.textContent=`${p.file.replace(/\.csv$/,"")} ${p.row+2}`;
    const body=document.createElement("div");
    body.innerHTML=`<span></span><span class="fix">${p.fix||""}</span>`;
    body.children[0].textContent=p.msg;
    const j=document.createElement("button"); j.className="jump"; j.textContent="show";
    j.onclick=()=>{
      CUR=p.file; paintRail(); paintTable();
      const el=document.getElementById(`c_${norm(p.file)}_${p.row}_${DATA[p.file].headers.indexOf(p.col)}`);
      if(el){ el.scrollIntoView({block:"center",behavior:"smooth"}); el.focus(); }
    };
    d.appendChild(b); d.appendChild(body); d.appendChild(j);
    list.appendChild(d);
  });
  if(PROBS.length>160){
    const d=document.createElement("div"); d.className="prob";
    d.innerHTML=`<span style="color:var(--dim)">…and ${PROBS.length-160} more. Fix a few and press Check again.</span>`;
    list.appendChild(d);
  }
}

/* ---------- loading ---------- */
function ingest(name, text){
  const rows=parseCSV(text);
  if(rows.length<2) return false;
  const headers=rows[0].map(h=>h.trim());
  const body=rows.slice(1).map(r=>{const o=[];for(let i=0;i<headers.length;i++)o.push(r[i]??"");return o;});
  DATA[name]={headers,rows:body};
  return true;
}
function loadFiles(list){
  let n=0, left=list.length;
  if(!left) return;
  [...list].forEach(f=>{
    if(!/\.csv$/i.test(f.name)){ if(--left===0) done(); return; }
    const rd=new FileReader();
    rd.onload=()=>{ if(ingest(f.name, rd.result)) n++; if(--left===0) done(); };
    rd.onerror=()=>{ if(--left===0) done(); };
    rd.readAsText(f);
  });
  function done(){
    if(n){ SAMPLE=false; CUR=(CUR&&(DATA[CUR]||VIEWS[CUR]))?CUR:Object.keys(DATA)[0]; save(); paintRail(); paintTable(); check(); }
    closeVeil();
    if(!n) alert("Nothing loaded — pick .csv files.");
  }
}

/* ---------- panels ---------- */
function veil(inner){
  const v=document.createElement("div"); v.id="veil";
  v.innerHTML=`<div class="panel">${inner}</div>`;
  v.onclick=e=>{ if(e.target===v) closeVeil(); };
  document.body.appendChild(v);
  return v;
}
function closeVeil(){ const v=$("#veil"); if(v) v.remove(); }

/* A plain readable panel with a Copy button. The Keywords page uses it for
   "everything still to build"; anything else that wants to hand you a block
   of text you can paste into a message may use it too. */
function showText(title, text){
  const safe = String(text||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const v=veil(`<header><h3>${title}</h3></header>
    <div class="in"><textarea class="csv" id="txtout" spellcheck="false">${safe}</textarea>
    <p class="note"><b>Copy</b> puts this on your clipboard. Paste it straight into a message and it is a finished request &mdash; every word in it came out of your own CSVs.</p></div>
    <footer><button class="btn key" id="bTxtCopy">Copy</button>
      <span id="txtsaid" style="color:var(--pitch);font-size:13px"></span>
      <div class="grow"></div><button class="btn" id="bTxtClose">Close</button></footer>`);
  const out=v.querySelector("#txtout");
  v.querySelector("#bTxtClose").onclick=closeVeil;
  v.querySelector("#bTxtCopy").onclick=async()=>{
    try{ await navigator.clipboard.writeText(out.value); }
    catch(e){ out.select(); document.execCommand("copy"); }
    v.querySelector("#txtsaid").textContent="Copied.";
    setTimeout(()=>{const s=v.querySelector("#txtsaid"); if(s) s.textContent="";},2600);
  };
}

function showLoad(){
  const v=veil(`<header><h3>Load your CSVs</h3></header>
    <div class="in">
      <div class="drop" id="drop"><b>Drop .csv files here</b><br>or use the button below. Pick them all at once — the workbench needs to see them together to check that they line up.</div>
      <p class="note">Your project's files live in <span class="kbd">project_sb/data/</span>. Take the tutorial folder too if you want it checked. Nothing is uploaded anywhere; this all happens in your browser, and your work is kept between visits.</p>
    </div>
    <footer><button class="btn key" id="bPickGo">Choose files</button>
      <button class="btn" id="bSeed">Start from the example set</button>
      <div class="grow"></div><button class="btn" id="bClose">Close</button></footer>`);
  v.querySelector("#bPickGo").onclick=()=>$("#pick").click();
  v.querySelector("#bClose").onclick=closeVeil;
  v.querySelector("#bSeed").onclick=()=>{
    if(!confirm("Replace everything currently loaded with the example set?")) return;
    DATA=JSON.parse(JSON.stringify(unseed())); CUR=Object.keys(DATA)[0]; SAMPLE=true;
    save(); paintRail(); paintTable(); check(); closeVeil();
  };
  const d=v.querySelector("#drop");
  ["dragenter","dragover"].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add("hot");}));
  ["dragleave","drop"].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove("hot");}));
  d.addEventListener("drop",ev=>loadFiles(ev.dataTransfer.files));
}

function showExport(only){
  const names = only?[only]:Object.keys(DATA).sort();
  const v=veil(`<header><h3>${only?only:"Export everything"}</h3></header>
    <div class="in">
      <select id="which" style="width:100%;padding:8px;background:var(--paper);border:1px solid var(--line);border-radius:3px;margin-bottom:10px"></select>
      <textarea class="csv" id="out" spellcheck="false"></textarea>
      <p class="note"><b>Copy</b> puts the file on your clipboard — paste it into the real <span class="kbd">.csv</span> and save.
      <b>Download</b> writes the file directly. <b>Download all</b> gives you every file one after another, which your browser may ask about once.
      <br>A file you have just created also needs a <span class="kbd">.csv.import</span> beside it — see <b>Where things go</b>.</p>
    </div>
    <footer><button class="btn key" id="bCopy">Copy</button>
      <button class="btn" id="bDown">Download</button>
      <button class="btn" id="bAll">Download all</button>
      <span id="said" style="color:var(--pitch);font-size:13px"></span>
      <div class="grow"></div><button class="btn" id="bClose2">Close</button></footer>`);
  const sel=v.querySelector("#which"), out=v.querySelector("#out");
  names.forEach(n=>{
    const o=document.createElement("option"); o.value=n; o.textContent=n; sel.appendChild(o);
  });
  const show=()=>{ out.value=toCSV(sel.value); };
  sel.onchange=show; show();
  v.querySelector("#bClose2").onclick=closeVeil;
  v.querySelector("#bCopy").onclick=async()=>{
    try{ await navigator.clipboard.writeText(out.value); }
    catch(e){ out.select(); document.execCommand("copy"); }
    v.querySelector("#said").textContent=`${sel.value} copied.`;
    setTimeout(()=>{const s=v.querySelector("#said"); if(s) s.textContent="";},2600);
  };
  const drop=(name,text)=>{
    const blob=new Blob([text],{type:"text/csv"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
  };
  v.querySelector("#bDown").onclick=()=>{
    drop(sel.value, out.value);
    v.querySelector("#said").textContent="If nothing happened, use Copy instead.";
  };
  v.querySelector("#bAll").onclick=()=>{
    const all=Object.keys(DATA).sort();
    all.forEach((n,i)=>setTimeout(()=>drop(n,toCSV(n)), i*180));
    v.querySelector("#said").textContent=`${all.length} files on their way.`;
  };
}

$("#bNewClass").onclick = wizStart;

$("#bCheck").onclick=()=>{ OPEN=true; check(); $("#problist").scrollIntoView({behavior:"smooth"}); };
$("#probhead").onclick=()=>{ OPEN=!OPEN; paintProbs(); };
$("#pick").onchange=e=>loadFiles(e.target.files);
$("#bTheme").onclick=()=>{
  const now=document.documentElement.getAttribute("data-theme");
  const next = now==="dark" ? "light" : now==="light" ? "dark"
    : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme",next);
  try{ localStorage.setItem("sturmball.theme",next); }catch(e){}
};
try{ const t=localStorage.getItem("sturmball.theme"); if(t) document.documentElement.setAttribute("data-theme",t); }catch(e){}
["dragenter","dragover","drop"].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault()));
document.addEventListener("drop",ev=>{ if(ev.dataTransfer&&ev.dataTransfer.files.length) loadFiles(ev.dataTransfer.files); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeVeil(); });

boot();
</script>
