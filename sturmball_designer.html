/* ============================================================
   CSV - the same quoting the game's files use (quote only when needed,
   \n line ends), so an unchanged file exports byte-for-byte the same.
   ============================================================ */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[]; let row=[], f='', q=false, i=0;
  while(i<text.length){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){f+='"';i+=2;continue;} q=false; i++; continue; }
      f+=c; i++; continue;
    }
    if(c==='"'){q=true;i++;continue;}
    if(c===','){row.push(f);f='';i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f='';i++;continue;}
    f+=c;i++;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
function csvCell(v){ v=v==null?'':String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function toCSV(rows){ return rows.map(r=>r.map(csvCell).join(',')).join('\n')+'\n'; }
function table(name){
  const t=FILES[name]; if(!t) return {header:[],rows:[]};
  const all=parseCSV(t); const header=all.shift()||[];
  const rows=all.filter(r=>r.some(c=>c.trim()!=='')).map(r=>{const o={};header.forEach((h,i)=>o[h]=r[i]??'');return o;});
  return {header,rows};
}
function tableToCSV(header,rows){ return toCSV([header,...rows.map(r=>header.map(h=>r[h]??''))]); }

function slug(s){ return String(s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'step'; }
function norm(s){ return String(s).toLowerCase().replace(/[\s_-]+/g,' ').trim(); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function uid(base,taken){ let id=base,n=2; while(taken.has(id)) id=base+'_'+(n++); return id; }

/* ---------- the catalogue of names an achievement can hand over ---------- */
function buildCatalogue(){
  const map=new Map(); // norm(name) -> {name, cat, label}
  const add=(name,cat,label)=>{ name=name.trim(); if(!name||name.length<2) return; const k=norm(name); if(!map.has(k)) map.set(k,{name,cat,label:label||''}); };
  // Building names first, so "Dorms" is a building rather than whatever mentions it first.
  table('Buildings').rows.forEach(r=>{ const m=/unlocked:([^;|]+)/.exec(r.Requires||''); add(m?m[1]:r.Name,'Buildings',r.Name); });
  BASE_BANNERS.forEach(([n,l])=>add(n,'Base banners',l));
  table('BrewerySections').rows.forEach(r=>{ const m=/unlocked:([^;|]+)/.exec(r.Needs||''); if(m) add(m[1],'Brewery machines',r.Name); });
  table('Brews').rows.forEach(r=>{ const m=/unlocked:([^;|]+)/.exec(r.Requires||''); if(m) add(m[1],'Drinks',r.Name); });
  const skip=new Set(['Notes','Description','Text','Line','What it does','Example','Keyword']);
  CATS.forEach(([file,cat])=>{
    if(file==='BaseBanners') return;
    const t=table(file);
    t.rows.forEach(r=>{ for(const h of t.header){ if(skip.has(h)) continue; const v=r[h]||''; for(const m of v.matchAll(/unlocked:([^;|\n]+)/g)) add(m[1],cat,r.Name||r.ID||r.Layer||''); } });
  });
  // Every other file that tests an unlock.
  for(const file of Object.keys(FILES)){
    if(CATS.some(c=>c[0]===file)||['Achievements','Upgrades','Keywords','Tuning','Dialogue'].includes(file)) continue;
    const t=table(file);
    t.rows.forEach(r=>{ for(const h of t.header){ if(skip.has(h)) continue; for(const m of (r[h]||'').matchAll(/unlocked:([^;|\n]+)/g)) add(m[1],'Other',file); } });
  }
  // Whatever Achievements.csv already hands over.
  table('Achievements').rows.forEach(r=>splitList(r.Unlocks).forEach(u=>add(u,'Other','')));
  return map;
}
function catOf(name){ const e=CAT.get(norm(name)); return e?e.cat:'New (not in the game yet)'; }
function splitList(s){ return String(s||'').split(';').map(x=>x.trim()).filter(Boolean); }

/* ---------- conditions ---------- */
let STATS=[];
function statLabel(counter){ const s=STATS.find(x=>x.Counter===counter); return s&&s.Label?s.Label:counter.replace(/_/g,' '); }
function humanCond(tok){
  let m=/^count:([\w{}]+)\s*(>=|<=|==|>|<|=)\s*(-?\d+)$/.exec(tok);
  if(m){ const op={'>=':'≥','<=':'≤','==':'=','=':'=','>':'>','<':'<'}[m[2]]; return statLabel(m[1])+' '+op+' '+m[3]; }
  if((m=/^(!?)flag:(.+)$/.exec(tok))) return (m[1]?'not ':'')+'flag '+m[2];
  if((m=/^(!?)unlocked:(.+)$/.exec(tok))) return (m[1]?'not yet ':'has ')+m[2];
  return tok;
}

/* ============================================================
   IMPORT: game CSVs -> design
   ============================================================ */
function designFromGame(){
  STATS=table('Stats').rows;
  CAT=buildCatalogue();
  const ach=table('Achievements');
  const ids=new Set(ach.rows.map(r=>r.ID));
  const trees=[]; const tree=(name)=>{ let t=trees.find(x=>x.name===name); if(!t){ t={id:uid(slug(name),new Set(trees.map(x=>x.id))),name}; trees.push(t);} return t.id; };
  const nodes=ach.rows.map(r=>{
    const toks=splitList(r.Needs), parents=[], cond=[];
    toks.forEach(t=>{ const m=/^flag:earned_(.+)$/.exec(t); if(m&&ids.has(m[1])) parents.push(m[1]); else cond.push(t); });
    const x=parseFloat(r['Map X']), y=parseFloat(r['Map Y']);
    return {id:r.ID,name:r.Name,desc:r.Description,cond,parents,unlocks:splitList(r.Unlocks),reward:r.Reward||'',
      art:r.Art||'',hidden:r.Hidden||'',notes:r.Notes||'',tree:tree(r.Tree||'Main Game'),
      x:isNaN(x)?null:x,y:isNaN(y)?null:y,row:r};
  });
  if(!trees.length) tree('Main Game');
  // The start of the game: an achievement with nothing to wait for.
  const main=trees[0].id;
  if(!nodes.some(n=>!n.cond.length&&!n.parents.length&&n.tree===main)){
    nodes.unshift({id:uid('main_game',ids),name:'Main Game',desc:'Open from the very first moment of a new save.',cond:[],parents:[],unlocks:[],
      reward:'',art:'',hidden:'',notes:'',tree:main,x:null,y:null,row:null,start:true});
  }
  nodes.forEach(n=>{ if(!n.cond.length&&!n.parents.length) n.start=true; });
  const up=table('Upgrades'), br=table('Brews');
  S={version:1,trees,curTree:main,nodes,
     achHeader:ach.header, upHeader:up.header, upgrades:up.rows,
     brewHeader:br.header, brews:br.rows, brewPos:{}, ingPos:{}, extraIngs:[], view:{u:{},b:null}};
  trees.forEach(t=>arrangeTree(t.id,true));
  arrangeBrews();
}

/* ============================================================
   EXPORT: design -> game CSVs
   ============================================================ */
function needsOf(n){ return [...n.parents.map(p=>'flag:earned_'+p),...n.cond].join(';'); }
function exportedNodes(){ return S.nodes.filter(n=>!(n.start&&!n.row&&!n.unlocks.length&&!n.reward)); }
function buildAchievements(){
  let header=[...S.achHeader];
  if(!header.length) header=['ID','Name','Description','Needs','Unlocks','Reward','Art','Hidden','Notes'];
  // Where each step sits on the board, so the tree comes back the same.
  const ni=header.indexOf('Notes'); const extra=['Tree','Map X','Map Y'].filter(h=>!header.includes(h));
  if(extra.length){ if(ni<0) header.push(...extra); else header.splice(ni,0,...extra); }
  const rows=exportedNodes().map(n=>{
    const r={...(n.row||{})};
    r.ID=n.id; r.Name=n.name; r.Description=n.desc; r.Needs=needsOf(n); r.Unlocks=n.unlocks.join(';');
    r.Reward=n.reward; r.Art=n.art; r.Hidden=n.hidden; r.Notes=n.notes;
    r.Tree=(S.trees.find(t=>t.id===n.tree)||{}).name||''; r['Map X']=Math.round(n.x); r['Map Y']=Math.round(n.y);
    return r;
  });
  return tableToCSV(header,rows);
}
function buildUpgrades(){ return tableToCSV(S.upHeader.length?S.upHeader:['ID','Name','Kind','Description','Achievement','Needs','Cost','Currency','Effect','Notes'],S.upgrades); }
function buildBrews(){ return tableToCSV(S.brewHeader,S.brews); }
function exportFiles(){
  return [
    {name:'Achievements.csv',key:'Achievements',text:buildAchievements(),what:'the unlock trees'},
    {name:'Upgrades.csv',key:'Upgrades',text:buildUpgrades(),what:'keys and upgrades sold at the Club House'},
    {name:'Brews.csv',key:'Brews',text:buildBrews(),what:'the brewery recipes'},
  ].map(f=>({...f,changed:f.text!==FILES[f.key]}));
}

   ============================================================ */
function snap(){ return JSON.stringify(S); }
function changed(){ // call after every edit
  const s=snap(); if(s===lastSnap) return;
  if(lastSnap) { UNDO.push(lastSnap); if(UNDO.length>80) UNDO.shift(); }
  lastSnap=s;
  try{ localStorage.setItem(STORE,JSON.stringify({savedAt:Date.now(),source:SOURCE,files:FILES,design:S})); }catch(e){}
  pushCloud();
}
function undo(){ if(!UNDO.length){toast('Nothing to undo');return;} S=JSON.parse(UNDO.pop()); lastSnap=snap(); persistOnly(); renderAll(); }
function persistOnly(){ try{ localStorage.setItem(STORE,JSON.stringify({savedAt:Date.now(),source:SOURCE,files:FILES,design:S})); }catch(e){} pushCloud(); }

/* ONLINE SAVE. Opened from its claude.ai link, the Designer also keeps the
   design in the page's own online store, so every computer that opens the
   link shows the same drawing. Whichever copy was changed last wins.
   designs/main holds the design; designs/files holds the game data only when
   it was loaded from a folder (the built-in copy ships with the page). */
let DB=null, cloudT=null, cloudAt=0;
function cloudLabel(t,on){ const c=document.getElementById('cloud'); c.hidden=false; c.textContent=t; c.classList.toggle('on',!!on); }
function pushCloud(){
  if(!DB) return; clearTimeout(cloudT); cloudLabel('Saving online…',true);
  cloudT=setTimeout(async()=>{
    const at=Date.now(), own=FILES!==GAME_DATA.files;
    try{
      if(own){ const fj=JSON.stringify(FILES); if(fj.length<240000) await DB.doc('designs/files').set({json:fj,savedAt:at}); }
      await DB.doc('designs/main').set({design:JSON.stringify(S),source:SOURCE,ownFiles:own,savedAt:at});
      cloudAt=at; cloudLabel('Saved online',true);
    }catch(e){ cloudLabel('Not saved online: '+(e.code||e.message||e),false); }
  },1200);
}
async function startCloud(localAt){
  try{ DB=window.claude&&window.claude.use?await window.claude.use('db'):null; }catch(e){ DB=null; }
  if(!DB) return;
  try{
    const d=(await DB.doc('designs/main').get()).data();
    if(d&&d.design&&d.savedAt>(localAt||0)){
      let files=GAME_DATA.files;
      if(d.ownFiles){ const f=(await DB.doc('designs/files').get()).data(); if(f&&f.json) files=JSON.parse(f.json); }
      FILES=files; SOURCE=d.source||'online save'; S=JSON.parse(d.design); STATS=table('Stats').rows; CAT=buildCatalogue();
      UNDO.length=0; lastSnap=snap(); uSel=null; bSel=null; cloudAt=d.savedAt;
      try{ localStorage.setItem(STORE,JSON.stringify({savedAt:d.savedAt,source:SOURCE,files:FILES,design:S})); }catch(e){}
      renderAll(); fitU(); cloudLabel('Saved online',true); toast('Opened your online design');
    } else if(localAt){ pushCloud(); }
    else cloudLabel('Saved online',true);
  }catch(e){ cloudLabel('Online save is off: '+(e.code||e.message||e),false); DB=null; }
}

// In-page questions. Browser pop-ups (prompt/confirm/alert) are switched off on
// claude.ai link pages, so the Designer asks in its own little window instead.
function _askBox(msg,def,withInput,okText,noText){
  return new Promise(res=>{
    const bg=document.createElement('div'); bg.className='modal-bg'; bg.style.zIndex=80;
    bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" style="max-width:460px"><p style="margin:0;white-space:pre-wrap"></p>
      ${withInput?'<input id="askIn" type="text" style="width:100%;margin-top:10px;padding:7px 9px;font:inherit">':''}
      <div class="btns"><button class="primary" id="askOk"></button>${noText?'<button id="askNo"></button>':''}</div></div>`;
    bg.querySelector('p').textContent=msg; bg.querySelector('#askOk').textContent=okText;
    if(noText) bg.querySelector('#askNo').textContent=noText;
    const inp=bg.querySelector('#askIn'); if(inp) inp.value=def||'';
    const done=v=>{ bg.remove(); res(v); };
    bg.querySelector('#askOk').onclick=()=>done(withInput?inp.value:true);
    if(noText) bg.querySelector('#askNo').onclick=()=>done(withInput?null:false);
    bg.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Enter') bg.querySelector('#askOk').click(); if(e.key==='Escape') done(withInput?null:false); });
    document.body.appendChild(bg); (inp||bg.querySelector('#askOk')).focus(); if(inp) inp.select();
  });
}
const ask=(msg,def)=>_askBox(msg,def,true,'OK','Cancel');
const yes=msg=>_askBox(msg,'',false,'Yes','No');
const say=msg=>_askBox(msg,'',false,'OK',null);
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),2200); }
// On a claude.ai link page plain download links are blocked, so ask the page's
// "downloads" helper first; opened as a file on the computer, the old link works.
let _dl; try{ _dl=window.claude&&window.claude.use?window.claude.use('downloads').catch(()=>null):null; }catch(e){ _dl=null; }
async function download(name,text,type){ const d=_dl?await _dl:null; if(d){ try{ await d.save({filename:name,data:new Blob([text],{type:type||'text/csv'})}); }catch(e){ toast('Not saved: '+name); } return; } plainDownload(name,text,type); }
function plainDownload(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:type||'text/csv'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }

/* ============================================================
   CANVAS - shared pan / zoom
   ============================================================ */
function makeCanvas(el,layer,getView,setView){
  const apply=()=>{ const v=getView(); layer.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.k})`; };
  let pan=null;
  el.addEventListener('pointerdown',e=>{
    if(e.target!==el&&e.target!==layer&&!e.target.closest('svg.edges')) return;
    if(e.target.closest('path.hit')) return;
    pan={sx:e.clientX,sy:e.clientY,v:{...getView()},moved:false}; el.setPointerCapture(e.pointerId); el.classList.add('panning');
  });
  el.addEventListener('pointermove',e=>{ if(!pan) return; const dx=e.clientX-pan.sx, dy=e.clientY-pan.sy; if(Math.abs(dx)+Math.abs(dy)>3) pan.moved=true; setView({...pan.v,x:pan.v.x+dx,y:pan.v.y+dy}); apply(); });
  el.addEventListener('pointerup',e=>{ if(!pan) return; el.classList.remove('panning'); if(!pan.moved) el.dispatchEvent(new CustomEvent('bgclick')); pan=null; });
  el.addEventListener('wheel',e=>{ e.preventDefault(); const v=getView(); const r=el.getBoundingClientRect(); const mx=e.clientX-r.left,my=e.clientY-r.top;
    const k=Math.min(2.2,Math.max(0.25,v.k*(e.deltaY<0?1.1:1/1.1))); setView({k,x:mx-(mx-v.x)*k/v.k,y:my-(my-v.y)*k/v.k}); apply(); },{passive:false});
  return {apply,
    zoom(f){ const v=getView(); const r=el.getBoundingClientRect(); const mx=r.width/2,my=r.height/2; const k=Math.min(2.2,Math.max(0.25,v.k*f)); setView({k,x:mx-(mx-v.x)*k/v.k,y:my-(my-v.y)*k/v.k}); apply(); },
    toLocal(cx,cy){ const v=getView(); const r=el.getBoundingClientRect(); return {x:(cx-r.left-v.x)/v.k,y:(cy-r.top-v.y)/v.k}; },
    fit(boxes){ if(!boxes.length){ setView({x:40,y:40,k:1}); apply(); return; }
      const r=el.getBoundingClientRect(); const minX=Math.min(...boxes.map(b=>b.x)),minY=Math.min(...boxes.map(b=>b.y)),maxX=Math.max(...boxes.map(b=>b.x+b.w)),maxY=Math.max(...boxes.map(b=>b.y+b.h));
      const k=Math.min(1.2,Math.max(0.25,Math.min((r.width-80)/(maxX-minX||1),(r.height-80)/(maxY-minY||1))));
      setView({k,x:(r.width-(maxX-minX)*k)/2-minX*k,y:Math.max(30,(r.height-(maxY-minY)*k)/2)-minY*k}); apply(); }};
}
/* Drag a card; a click without movement selects it. */
function dragCard(el,e,getPos,setPos,canvas,onClick,onEnd){
  if(e.button!==undefined&&e.button!==0) return;
  e.stopPropagation();
  // p0 is a COPY: getPos() may hand back the live position object, and
  // adding the drag to a start point that moves with it flings the card away.
  const start=canvas.toLocal(e.clientX,e.clientY), p0={...getPos()}; let moved=false;
  el.setPointerCapture(e.pointerId);
  const mv=ev=>{ const p=canvas.toLocal(ev.clientX,ev.clientY); const dx=p.x-start.x,dy=p.y-start.y; if(!moved&&Math.abs(dx)+Math.abs(dy)<4) return; moved=true;
    setPos(Math.round((p0.x+dx)/8)*8,Math.round((p0.y+dy)/8)*8); };
  const up=()=>{ el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up); if(moved) onEnd(); else onClick(); };
  el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
}
/* Drag a line out of a handle and drop it on a card. */
function dragLink(e,canvas,svg,from,findTarget,onDrop){
  e.stopPropagation(); e.preventDefault();
  const tmp=document.createElementNS('http://www.w3.org/2000/svg','path'); tmp.setAttribute('class','temp'); svg.appendChild(tmp);
  let over=null; const h=e.target; h.setPointerCapture(e.pointerId);
  const mv=ev=>{ const p=canvas.toLocal(ev.clientX,ev.clientY); tmp.setAttribute('d',`M${from.x},${from.y} L${p.x},${p.y}`);
    const t=findTarget(ev.clientX,ev.clientY); if(over&&over!==t) over.el.classList.remove('drop'); over=t; if(t) t.el.classList.add('drop'); };
  const up=()=>{ h.removeEventListener('pointermove',mv); h.removeEventListener('pointerup',up); tmp.remove(); if(over){ over.el.classList.remove('drop'); onDrop(over.id); } };
  h.addEventListener('pointermove',mv); h.addEventListener('pointerup',up);
}
function cardUnder(cx,cy,selector,attr){
  const els=document.elementsFromPoint(cx,cy); for(const el of els){ const c=el.closest&&el.closest(selector); if(c) return {el:c,id:c.dataset[attr]}; } return null;
}

/* ============================================================
   UNLOCK TREE VIEW
   ============================================================ */
const NODE_W=220, GAP_X=250, GAP_Y=190;
let uSel=null; // {kind:'node',id} | {kind:'edge',from,to}
let UC;
function treeNodes(tid){ return S.nodes.filter(n=>n.tree===tid); }
function node(id){ return S.nodes.find(n=>n.id===id); }
function children(id){ return S.nodes.filter(n=>n.parents.includes(id)); }
function wouldLoop(child,parent){ // is child an ancestor of parent?
  const seen=new Set(); const walk=id=>{ if(id===child) return true; if(seen.has(id)) return false; seen.add(id); const n=node(id); return !!n&&n.parents.some(walk); };
  return walk(parent);
}
function counterKey(n){ const t=n.cond.find(c=>c.startsWith('count:')); if(!t) return n.cond[0]?n.cond[0].split(':')[0]:'~'; return t.replace(/^count:([\w{}]+).*$/,'$1'); }
function threshold(n){ const m=/(-?\d+)\s*$/.exec(n.cond.find(c=>c.startsWith('count:'))||''); return m?+m[1]:0; }

/* Lay a tree out: linked steps in rows by depth; loose steps in columns,
   one per counter (wins, goals, ...) sorted by how many you need. */
function arrangeTree(tid,onlyMissing){
  const ns=treeNodes(tid); const inTree=new Set(ns.map(n=>n.id));
  const linked=ns.filter(n=>n.parents.some(p=>inTree.has(p))||ns.some(c=>c.parents.includes(n.id)));
  const loose=ns.filter(n=>!linked.includes(n));
  const depth={}; const d=n=>{ if(depth[n.id]!=null) return depth[n.id]; depth[n.id]=0; const ps=n.parents.filter(p=>inTree.has(p)).map(node); depth[n.id]=ps.length?1+Math.max(...ps.map(d)):0; return depth[n.id]; };
  linked.forEach(d);
  // start steps go on top of everything
  const layers=[]; linked.forEach(n=>{ (layers[depth[n.id]]=layers[depth[n.id]]||[]).push(n); });
  const pos={};
  layers.forEach((layer,li)=>{
    if(li>0) layer.sort((a,b)=>avgX(a)-avgX(b));
    function avgX(n){ const ps=n.parents.filter(p=>pos[p]); return ps.length?ps.reduce((s,p)=>s+pos[p].x,0)/ps.length:0; }
    layer.forEach((n,i)=>pos[n.id]={x:i*GAP_X,y:li*GAP_Y});
    // centre each layer under its parents
    if(li>0){ const want=layer.reduce((s,n)=>s+avgX(n),0)/layer.length, have=layer.reduce((s,n)=>s+pos[n.id].x,0)/layer.length; layer.forEach(n=>pos[n.id].x+=Math.round(want-have)); }
  });
  let x0=linked.length?Math.max(...linked.map(n=>pos[n.id].x))+GAP_X+40:0;
  const starts=loose.filter(n=>n.start); const rest=loose.filter(n=>!n.start);
  starts.forEach((n,i)=>pos[n.id]={x:x0+i*GAP_X,y:0}); if(starts.length) x0+=starts.length*GAP_X;
  const groups={}; rest.forEach(n=>(groups[counterKey(n)]=groups[counterKey(n)]||[]).push(n));
  Object.keys(groups).sort().forEach((k,gi)=>{ groups[k].sort((a,b)=>threshold(a)-threshold(b)).forEach((n,i)=>pos[n.id]={x:x0+gi*GAP_X,y:(starts.length?GAP_Y:0)+i*150}); });
  ns.forEach(n=>{ if(!onlyMissing||n.x==null||n.y==null){ n.x=pos[n.id].x; n.y=pos[n.id].y; n.fresh=true; } });
}
/* Cards differ in height, so after a Tidy up push any card that sits on the
   one above it further down (only the cards the tidy-up just placed). */
function unstack(tid){
  const els={}; document.querySelectorAll('#ulayer .node').forEach(e=>els[e.dataset.nid]=e);
  const cols={}; treeNodes(tid).forEach(n=>(cols[n.x]=cols[n.x]||[]).push(n));
  let moved=false;
  Object.values(cols).forEach(col=>{ col.sort((a,b)=>a.y-b.y); for(let i=1;i<col.length;i++){ const a=col[i-1],b=col[i]; const h=els[a.id]?els[a.id].offsetHeight:140; if(b.fresh&&b.y<a.y+h+28){ b.y=a.y+h+28; moved=true; } } });
  S.nodes.forEach(n=>delete n.fresh);
  return moved;
}

function renderTreeTabs(){
  const box=document.getElementById('treeTabs'); box.innerHTML='';
  S.trees.forEach(t=>{
    const b=document.createElement('button'); b.className='treetab'+(t.id===S.curTree?' on':''); b.textContent=t.name+' · '+treeNodes(t.id).length;
    b.onclick=()=>{ S.curTree=t.id; uSel=null; changed(); renderUnlocks(); fitU(); };
    b.ondblclick=()=>renameTree(t);
    b.title='Double-click to rename';
    box.appendChild(b);
  });
}
async function renameTree(t){ const n=await ask('Name of this tree',t.name); if(n&&n.trim()){ t.name=n.trim(); changed(); renderUnlocks(); } }

function nodeCard(n){
  const el=document.createElement('div'); el.className='node'+(n.start?' start':'')+(uSel&&uSel.kind==='node'&&uSel.id===n.id?' sel':'');
  el.dataset.nid=n.id; el.style.left=n.x+'px'; el.style.top=n.y+'px';
  const dups=n.unlocks.filter(u=>S.nodes.some(o=>o!==n&&o.unlocks.some(x=>norm(x)===norm(u))));
  const xp=n.parents.map(node).filter(p=>p&&p.tree!==n.tree);
  const keys=n.unlocks.map(keyFor).filter(Boolean); const sales=S.upgrades.filter(u=>u.Achievement===n.id);
  el.innerHTML=`<div class="hd"><span class="ico">${n.start?'⚑':n.hidden==='yes'?'◌':'★'}</span><span>${esc(n.name)}</span></div>
    ${xp.length?`<div class="xparent">after ${xp.map(p=>esc(p.name)+' ('+esc((S.trees.find(t=>t.id===p.tree)||{}).name)+')').join(', ')}</div>`:''}
    <div class="when">${n.start&&!n.parents.length?'From the start of the game':n.cond.length?'When: '+n.cond.map(c=>esc(humanCond(c))).join(' and '):'As soon as the step above is done'}</div>
    <div class="chips">${n.unlocks.map(u=>{const c=catOf(u);return `<span class="chip${c.startsWith('New')?' new':''}${dups.includes(u)?' dup':''}" title="${esc(c)}${dups.includes(u)?' - also unlocked by another step':''}"><i style="background:${CAT_COLOR[c]||'#999'}"></i>${esc(u)}</span>`;}).join('')}</div>
    ${n.reward?`<div class="price" style="color:var(--pitch)">Reward: ${esc(rewardText(n.reward))}</div>`:''}
    ${keys.length||sales.length?`<div class="price">${keys.map(k=>'🔑 '+esc(k.Name)+' '+esc(k.Cost)+' '+esc(k.Currency)).concat(sales.map(s=>'🛒 '+esc(s.Name)+' '+esc(s.Cost)+' '+esc(s.Currency))).join('<br>')}</div>`:''}
    ${!n.unlocks.length&&!n.reward&&!sales.length?'<div class="warn">Hands nothing over yet</div>':''}
    <div class="foot"><button data-act="child">+ next step</button></div><div class="handle" title="Drag onto another step to make it come after this one"></div>`;
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')) return;
    if(e.target.classList.contains('handle')){
      dragLink(e,UC,document.getElementById('uedges'),{x:n.x+NODE_W/2,y:n.y+el.offsetHeight},
        (cx,cy)=>{ const t=cardUnder(cx,cy,'.node','nid'); return t&&t.id!==n.id?t:null; },
        id=>{ const c=node(id); if(c.parents.includes(n.id)) return; if(wouldLoop(c.id,n.id)){ toast('That would make a loop'); return; } c.parents.push(n.id); c.start=false; changed(); renderUnlocks(); });
      return;
    }
    dragCard(el,e,()=>({x:n.x,y:n.y}),(x,y)=>{ n.x=x;n.y=y; el.style.left=x+'px'; el.style.top=y+'px'; drawEdges(); },UC,
      ()=>{ uSel={kind:'node',id:n.id}; renderUnlocks(); },()=>changed());
  });
  el.querySelector('[data-act=child]').onclick=e=>{ e.stopPropagation(); addNode(n); };
  return el;
}
function rewardText(r){ return splitList(r).map(t=>{ let m=/^count:(\w+)\+(\d+)$/.exec(t); if(m) return '+'+m[2]+' '+m[1]; if((m=/^announce:(.*)$/.exec(t))) return '“'+m[1]+'”'; return t; }).join(', '); }
function keyFor(name){ return S.upgrades.find(u=>u.Kind==='key'&&splitList(u.Needs).some(t=>norm(t)===norm('unlocked:'+name))); }

function drawEdges(){
  const svg=document.getElementById('uedges'); svg.innerHTML='';
  const ns=treeNodes(S.curTree); const els={}; document.querySelectorAll('#ulayer .node').forEach(e=>els[e.dataset.nid]=e);
  ns.forEach(c=>c.parents.forEach(pid=>{
    const p=node(pid); if(!p||p.tree!==S.curTree||!els[pid]) return;
    const x1=p.x+NODE_W/2,y1=p.y+els[pid].offsetHeight,x2=c.x+NODE_W/2,y2=c.y; const dy=Math.max(40,Math.abs(y2-y1)/2);
    const d=`M${x1},${y1} C${x1},${y1+dy} ${x2},${y2-dy} ${x2},${y2}`;

  svg.querySelectorAll('path.hit').forEach(h=>h.addEventListener('pointerdown',e=>{ e.stopPropagation(); uSel={kind:'edge',from:h.dataset.from,to:h.dataset.to}; renderUnlocks(); }));
}
function renderUnlocks(){

function renderLegend(){

function fitU(){ const els=[...document.querySelectorAll('#ulayer .node')]; UC.fit(treeNodes(S.curTree).map(n=>{ const e=els.find(x=>x.dataset.nid===n.id); return {x:n.x,y:n.y,w:NODE_W,h:e?e.offsetHeight:120}; })); }

async function addNode(parent){
  const name=await ask(parent?'Name of the step that comes after “'+parent.name+'”':'Name of the new unlock step','New step'); if(!name||!name.trim()) return;
  const id=uid(slug(name),new Set(S.nodes.map(n=>n.id)));

  const n={id,name:name.trim(),desc:'',cond:[],parents:parent?[parent.id]:[],unlocks:[],reward:'',art:'',hidden:'',notes:'',tree:S.curTree,row:null,
    x:parent?parent.x+kids.length*GAP_X- (kids.length?0:0):0,y:parent?parent.y+GAP_Y:0};
  if(!parent){ const ns=treeNodes(S.curTree); n.start=true; n.x=ns.length?Math.max(...ns.map(m=>m.x))+GAP_X:0; n.y=0; }

}
async function deleteNode(n){

  S.nodes.forEach(o=>o.parents=o.parents.filter(p=>p!==n.id));
  S.nodes=S.nodes.filter(o=>o!==n); uSel=null; changed(); renderUnlocks();
}

    else d.querySelector('[data-addkey]').onclick=()=>{ const s=slug(u)+'_key'; S.upgrades.push(blankRow(S.upHeader,{ID:uid(s,new Set(S.upgrades.map(r=>r.ID))),Name:u+' Key',Kind:'key',Description:'Opens the '+u+'.',Needs:'unlocked:'+u,Cost:'50',Currency:'coins',Effect:'count:'+s+'+1',Notes:'NEW from the Designer - the thing it opens still has to test count:'+s+'>=1.'})); changed(); renderUnlocks(); };

  });

  $('#fReward').onchange=e=>{ n.reward=e.target.value.trim(); changed(); renderUnlocks(); };
  // upgrades for sale
  const sl=$('#fSales'); const sales=S.upgrades.filter(u=>u.Achievement===n.id);

      <div class="row" style="margin-top:5px"><input type="number" min="0" data-f="Cost" value="${esc(s.Cost)}"><select data-f="Currency">${currencyOptions(s.Currency)}</select></div>
      <input style="margin-top:5px" data-f="Effect" value="${esc(s.Effect)}" placeholder="what it does, e.g. count:tune_rest_less+1" title="Effect column">
      <input style="margin-top:5px" data-f="Description" value="${esc(s.Description)}" placeholder="description">`;
    d.querySelectorAll('[data-f]').forEach(i=>i.onchange=e=>{ s[i.dataset.f]=e.target.value; changed(); renderUnlocks(); });
    d.querySelector('[data-rm]').onclick=()=>{ S.upgrades=S.upgrades.filter(x=>x!==s); changed(); renderUnlocks(); };
    sl.appendChild(d); });
  $('#fAddSale').onclick=()=>{ const id=uid(slug(n.name)+'_upgrade',new Set(S.upgrades.map(r=>r.ID))); S.upgrades.push(blankRow(S.upHeader,{ID:id,Name:'New upgrade',Kind:'upgrade',Description:'',Achievement:n.id,Cost:'100',Currency:'coins',Effect:''})); changed(); renderUnlocks(); };
  $('#fHidden').onchange=e=>{ n.hidden=e.target.value; changed(); renderUnlocks(); };
  $('#fNotes').onchange=e=>{ n.notes=e.target.value; changed(); };
  $('#fId').onchange=e=>{ const v=slug(e.target.value); if(!v||v===n.id) return; if(S.nodes.some(o=>o.id===v)){ toast('That ID is taken'); e.target.value=n.id; return; }
    S.nodes.forEach(o=>o.parents=o.parents.map(p=>p===n.id?v:p)); S.upgrades.forEach(u=>{ if(u.Achievement===n.id) u.Achievement=v; }); n.id=v; uSel.id=v; changed(); renderUnlocks(); };
  $('#fDel').onclick=()=>deleteNode(n);
}
function blankRow(header,vals){ const r={}; header.forEach(h=>r[h]=''); return Object.assign(r,vals); }
function currencyOptions(cur){ const cs=table('Currencies').rows.map(r=>r.ID); if(!cs.length) cs.push('coins'); if(cur&&!cs.includes(cur)) cs.push(cur); return cs.map(c=>`<option${c===cur?' selected':''}>${esc(c)}</option>`).join(''); }

/* One condition: a counter and a number, or any other condition as text. */
function condEditor(n,i){
  const tok=n.cond[i]; const d=document.createElement('div'); d.className='row';
  const m=/^count:([\w{}]+)\s*(>=|<=|==|>|<|=)\s*(-?\d+)$/.exec(tok);
  const counters=[...new Set(STATS.map(s=>s.Counter).filter(Boolean))];
  if(m){
    if(!counters.includes(m[1])) counters.push(m[1]);
    d.innerHTML=`<select data-c>${counters.map(c=>`<option value="${esc(c)}"${c===m[1]?' selected':''}>${esc(statLabel(c))}</option>`).join('')}<option value="__text">other (type it)…</option></select>
      <select class="fixed" data-op style="width:56px">${['>=','<=','==','>','<'].map(o=>`<option${o===m[2]?' selected':''}>${o}</option>`).join('')}</select>
      <input class="fixed" data-n type="number" style="width:70px" value="${m[3]}"><button class="fixed small" data-rm>✕</button>`;
    const upd=()=>{ const c=d.querySelector('[data-c]').value; if(c==='__text'){ n.cond[i]='flag:'; } else n.cond[i]=`count:${c}${d.querySelector('[data-op]').value}${d.querySelector('[data-n]').value||0}`; changed(); renderUnlocks(); };
    d.querySelectorAll('select,input').forEach(x=>x.onchange=upd);
  } else {
    d.innerHTML=`<input data-t value="${esc(tok)}" title="Any condition: flag:x, unlocked:y, count:z>=3"><button class="fixed small" data-counter title="Use a counter instead">#</button><button class="fixed small" data-rm>✕</button>`;
    d.querySelector('[data-t]').onchange=e=>{ n.cond[i]=e.target.value.trim(); if(!n.cond[i]) n.cond.splice(i,1); changed(); renderUnlocks(); };
    d.querySelector('[data-counter]').onclick=()=>{ n.cond[i]='count:matches_won>=1'; changed(); renderUnlocks(); };
  }
  d.querySelector('[data-rm]').onclick=()=>{ n.cond.splice(i,1); changed(); renderUnlocks(); };
  return d;
}

/* The "what does it unlock" picker: every name the game tests, grouped. */
function openPicker(anchor,n){
  closePicker();
  const pk=document.createElement('div'); pk.className='picker'; pk.id='picker';
  const r=anchor.getBoundingClientRect(); pk.style.left=Math.max(8,Math.min(window.innerWidth-390,r.left-30))+'px'; pk.style.top=Math.max(8,Math.min(window.innerHeight*0.3,r.top-200))+'px';
  pk.innerHTML=`<div class="pk-head"><input id="pkQ" placeholder="Search, or type a new name…"></div><div class="pk-body" id="pkB"></div>
    <div class="pk-foot"><button id="pkNew" class="small">Add as a new name</button><button id="pkDone" class="primary small">Done</button></div>`;
  document.body.appendChild(pk);
  const sel=new Set(n.unlocks.map(norm));
  const draw=()=>{
    const q=norm(pk.querySelector('#pkQ').value); const groups={};
    for(const e of CAT.values()){ if(q&&!norm(e.name+' '+e.label).includes(q)) continue; (groups[e.cat]=groups[e.cat]||[]).push(e); }
    const order=[...new Set(CATS.map(c=>c[1])),'Other'];
    pk.querySelector('#pkB').innerHTML=order.filter(g=>groups[g]).map(g=>`<h4><i style="background:${CAT_COLOR[g]}"></i>${esc(g)}</h4>`+
      groups[g].sort((a,b)=>a.name.localeCompare(b.name)).map(e=>{ const by=S.nodes.filter(o=>o!==n&&o.unlocks.some(x=>norm(x)===norm(e.name)));
        return `<label class="opt"><input type="checkbox" data-n="${esc(e.name)}"${sel.has(norm(e.name))?' checked':''}><span>${esc(e.name)} ${e.label&&norm(e.label)!==norm(e.name)?'<small>('+esc(e.label)+')</small>':''}${by.length?' <small style="color:var(--warn)">· now from '+esc(by.map(o=>o.name).join(', '))+'</small>':''}</span></label>`; }).join('')).join('')
      ||'<p class="hint">No match. “Add as a new name” adds it anyway - the export tells Claude it still has to be built.</p>';
    pk.querySelectorAll('[data-n]').forEach(cb=>cb.onchange=()=>{ const v=cb.dataset.n; if(cb.checked){ if(!n.unlocks.some(x=>norm(x)===norm(v))) n.unlocks.push(v); sel.add(norm(v)); } else { n.unlocks=n.unlocks.filter(x=>norm(x)!==norm(v)); sel.delete(norm(v)); } changed(); renderUnlocks(); });
  };
  pk.querySelector('#pkQ').oninput=draw;
  pk.querySelector('#pkNew').onclick=()=>{ const v=pk.querySelector('#pkQ').value.trim(); if(!v){ toast('Type the name first'); return; } if(!n.unlocks.some(x=>norm(x)===norm(v))) n.unlocks.push(v); changed(); renderUnlocks(); closePicker(); };
  pk.querySelector('#pkDone').onclick=closePicker;
  pk.querySelector('#pkQ').onkeydown=e=>{ if(e.key==='Escape') closePicker(); };
  draw(); pk.querySelector('#pkQ').focus();
}
function closePicker(){ const p=document.getElementById('picker'); if(p) p.remove(); }
function removeSelEdge(){ const c=node(uSel.to); c.parents=c.parents.filter(p=>p!==uSel.from); if(!c.parents.length&&!c.cond.length) c.start=true; uSel=null; changed(); renderUnlocks(); }

/* ============================================================
   BREWERY RECIPES VIEW
   ============================================================ */
let bSel=null; let BC;
const ING_W=150, DRINK_W=220;
function costOf(b){ return String(b.Cost||'').split('|').map(s=>s.trim()).filter(Boolean).map(s=>{ const [id,n]=s.split(':'); return {id:id.trim(),n:+(n||1)}; }); }
function setCost(b,list){ b.Cost=list.filter(x=>x.n>0).map(x=>x.id+':'+x.n).join('|'); }
function items(){ return table('Items').rows; }
function itemName(id){ const it=items().find(r=>r.ID===id); return it?it.Name:id; }
function ingredientIds(){
  const ids=[]; const add=id=>{ if(id&&!ids.includes(id)) ids.push(id); };
  items().filter(r=>r.Kind==='material').forEach(r=>add(r.ID));
  S.brews.forEach(b=>costOf(b).forEach(c=>add(c.id)));
  (S.extraIngs||[]).forEach(add);
  return ids;
}
function unlockerOf(name){ return S.nodes.filter(n=>n.unlocks.some(u=>norm(u)===norm(name))); }
function brewUnlockName(b){ const m=/(?:^|;)\s*unlocked:([^;|]+)/.exec(b.Requires||''); return m?m[1].trim():''; }
function arrangeBrews(){
  ingredientIds().forEach((id,i)=>S.ingPos[id]={x:0,y:i*90});
  const cols=3; S.brews.forEach((b,i)=>S.brewPos[b.ID]={x:260+(i%cols)*250,y:Math.floor(i/cols)*200});
}
function renderChain(){
  const secs=table('BrewerySections').rows.sort((a,b)=>+a.Order-+b.Order);
  const res=id=>{ const r=table('BreweryResources').rows.find(x=>x.ID===id); return r?r.Name:id; };
  document.getElementById('chain').innerHTML='<span style="color:var(--dim)">The machines (BrewerySections.csv, read only):</span> '+secs.map(s=>
    `<span>${s.Takes.split(';').map(t=>esc(res(t.split(':')[0]))).join(' + ')} <span class="arrow">→</span> <b>${esc(s.Name)}</b> <span class="arrow">→</span> ${esc(res(s.Makes))}${s['How Many']>1?' ×'+s['How Many']:''}</span>`).join('<span class="arrow"> │ </span>');
}
function renderBrews(){
  const layer=document.getElementById('blayer'); layer.querySelectorAll('.node,.ing').forEach(e=>e.remove());
  ingredientIds().forEach((id,i)=>{
    const p=S.ingPos[id]||(S.ingPos[id]={x:0,y:i*90});
    const el=document.createElement('div'); el.className='ing'+(bSel&&bSel.kind==='ing'&&bSel.id===id?' sel':''); el.dataset.iid=id; el.style.left=p.x+'px'; el.style.top=p.y+'px';
    const uses=S.brews.filter(b=>costOf(b).some(c=>c.id===id)).length;
    el.innerHTML=`${esc(itemName(id))}<small>${esc(id)} · in ${uses} drink${uses===1?'':'s'}</small><div class="handle" title="Drag onto a drink"></div>`;
    el.addEventListener('pointerdown',e=>{
      if(e.target.classList.contains('handle')){
        dragLink(e,BC,document.getElementById('bedges'),{x:p.x+ING_W,y:p.y+el.offsetHeight/2},(cx,cy)=>cardUnder(cx,cy,'.node','bid'),

    const el=document.createElement('div'); el.className='node drink'+(bSel&&bSel.kind==='brew'&&bSel.id===b.ID?' sel':''); el.dataset.bid=b.ID; el.style.left=p.x+'px'; el.style.top=p.y+'px';

    el.innerHTML=`<div class="hd"><span class="ico">🍺</span><span>${esc(b.Name)}</span></div>
      <div class="class">${turn}${b.Element?' · '+esc(b.Element):''}</div>
      <div class="when">${un?'🔒 '+esc(un)+(by.length?' - from '+by.map(n=>esc(n.name)).join(', '):' - <span style="color:var(--warn)">no unlock step gives it yet</span>'):esc(b.Requires?'Needs '+b.Requires:'Always available')}</div>
      <div class="chips">${costOf(b).map(c=>`<span class="chip"><i style="background:var(--pitch)"></i>${esc(itemName(c.id))} ×${c.n}</span>`).join('')||'<span class="hint" style="font-size:12px">No ingredients</span>'}</div>
      ${b.Inspiration?`<div class="price">Inspiration ${esc(b.Inspiration)}${b.Drinks?' · '+esc(b.Drinks)+' drinks':''}${b.Permanent==='true'?' · permanent':''}</div>`:''}`;
    el.addEventListener('pointerdown',e=>dragCard(el,e,()=>p,(x,y)=>{ p.x=x;p.y=y; el.style.left=x+'px'; el.style.top=y+'px'; drawBEdges(); },BC,()=>{ bSel={kind:'brew',id:b.ID}; renderBrews(); },()=>changed()));
    layer.appendChild(el);
  });
  drawBEdges(); renderBSide();
}
function drawBEdges(){
  const svg=document.getElementById('bedges'); svg.innerHTML='';
  const ingEls={}; document.querySelectorAll('#blayer .ing').forEach(e=>ingEls[e.dataset.iid]=e);
  S.brews.forEach(b=>{ const bp=S.brewPos[b.ID]; if(!bp) return; costOf(b).forEach(c=>{
    const ip=S.ingPos[c.id], ie=ingEls[c.id]; if(!ip||!ie) return;
    const x1=ip.x+ING_W,y1=ip.y+ie.offsetHeight/2,x2=bp.x,y2=bp.y+22; const dx=Math.max(50,(x2-x1)/2);
    const sel=bSel&&((bSel.kind==='brew'&&bSel.id===b.ID)||(bSel.kind==='ing'&&bSel.id===c.id));
    svg.insertAdjacentHTML('beforeend',`<path class="e${sel?' sel':''}" d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}"/>${sel?`<text x="${x2-34}" y="${y2-6}">×${c.n}</text>`:''}`);
  }); });
}
function classOptions(cur){ const cs=['',...table('ClassInfo').rows.map(r=>r.Class)]; if(cur&&!cs.includes(cur)) cs.push(cur); return cs.map(c=>`<option value="${esc(c)}"${c===cur?' selected':''}>${c?esc(c):'—'}</option>`).join(''); }
function elementOptions(cur){ const es=['',...table('Elements').rows.map(r=>r['Display Name']||r.Element)]; if(cur&&!es.includes(cur)) es.push(cur); return es.map(c=>`<option value="${esc(c)}"${c===cur?' selected':''}>${c?esc(c):'—'}</option>`).join(''); }

  const go=side.querySelector('#bGoTree'); if(go) go.onclick=()=>{ const n=uSel&&uSel.kind==='node'&&node(uSel.id); if(!n){ toast('First click a step in the Unlock Tree, then come back'); return; } n.unlocks.push(un); changed(); renderBrews(); toast('“'+un+'” added to '+n.name); };
  side.querySelector('#bId').onchange=e=>{ const v=slug(e.target.value); if(!v||v===b.ID) return; if(S.brews.some(x=>x.ID===v)){ toast('That ID is taken'); return; } S.brewPos[v]=S.brewPos[b.ID]; delete S.brewPos[b.ID]; b.ID=v; bSel.id=v; changed(); renderBrews(); };
  side.querySelector('#bDup').onclick=()=>{ const id=uid(b.ID+'_copy',new Set(S.brews.map(x=>x.ID))); const c={...b,ID:id,Name:b.Name+' (copy)'}; S.brews.splice(S.brews.indexOf(b)+1,0,c); const p=S.brewPos[b.ID]; S.brewPos[id]={x:p.x+30,y:p.y+30}; bSel={kind:'brew',id}; changed(); renderBrews(); };
  side.querySelector('#bDel').onclick=async()=>{ if(!await yes('Remove '+b.Name+'?')) return; S.brews=S.brews.filter(x=>x!==b); bSel=null; changed(); renderBrews(); };
}
function fitB(){ const boxes=[]; document.querySelectorAll('#blayer .ing,#blayer .node').forEach(e=>boxes.push({x:e.offsetLeft,y:e.offsetTop,w:e.offsetWidth,h:e.offsetHeight})); BC.fit(boxes); }

/* ============================================================
   LOAD GAME DATA / DESIGN FILES / EXPORT
   ============================================================ */
async function loadFolder(){
  if(window.showDirectoryPicker){
    try{
      const h=await window.showDirectoryPicker({id:'sturmball-data',mode:'readwrite'});
      let dir=h; try{ dir=await h.getDirectoryHandle('data'); }catch(e){} // they picked project_sb itself
      const files={}; for await (const [name,f] of dir.entries()){ if(f.kind==='file'&&name.endsWith('.csv')) files[name.slice(0,-4)]=await (await f.getFile()).text(); }
      if(!files.Achievements){ say('No Achievements.csv in that folder. Pick project_sb or project_sb/data.'); return; }
      dirHandle=dir; useFiles(files,'your data folder ('+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+')'); return;
    }catch(e){ if(e.name==='AbortError') return; }
  }
  document.getElementById('dirInput').click();
}
document.getElementById('dirInput').onchange=async e=>{
  const files={}; for(const f of e.target.files){ const p=f.webkitRelativePath||f.name; if(!f.name.endsWith('.csv')) continue; if(/\/data\/[^/]+\.csv$/.test(p)||p.split('/').length<=2) files[f.name.slice(0,-4)]=await f.text(); }
  e.target.value='';
  if(!files.Achievements){ say('No Achievements.csv found. Pick the project_sb/data folder.'); return; }
  dirHandle=null; useFiles(files,'your data folder ('+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+')');
};
async function useFiles(files,source){
  if(UNDO.length&&!await yes('Start again from these game files? Your current drawing is replaced (Save design first if you want to keep it).')) return;
  // Keep only what the Designer uses (the same list as build.py), so the
  // browser's memory of your last design stays small.
  const always=['Achievements','Upgrades','Brews','Items','Stats','Currencies','Buildings','BrewerySections','BreweryResources','ClassInfo','Elements'];
  const keep={}; for(const [k,v] of Object.entries(files)){ if(always.includes(k)||(!['Dialogue','Tuning','Keywords','Questions'].includes(k)&&v.includes('unlocked:'))) keep[k]=v; }
  FILES=keep; SOURCE=source; designFromGame(); UNDO.length=0; lastSnap=''; uSel=null; bSel=null; renderAll(); S.trees.forEach(t=>{ const c=S.curTree; S.curTree=t.id; renderUnlocks(); unstack(t.id); S.curTree=c; }); changed(); renderUnlocks(); fitU(); toast('Loaded '+Object.keys(files).length+' CSV files');
}
function saveDesign(){
  const d=new Date(); const stamp=d.toISOString().slice(0,16).replace(/[:T]/g,'-');
  download('sturmball_design_'+stamp+'.json',JSON.stringify({format:'sturmball-designer',version:1,savedAt:d.toISOString(),source:SOURCE,files:FILES,design:S},null,1),'application/json');
  toast('Design saved to your Downloads');
}
document.getElementById('designInput').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const j=JSON.parse(await f.text()); if(j.format!=='sturmball-designer') throw new Error('not a design file');
    FILES=j.files||FILES; SOURCE=(j.source||'')+' · design '+f.name; S=j.design; STATS=table('Stats').rows; CAT=buildCatalogue(); UNDO.length=0; lastSnap=''; changed(); uSel=null; bSel=null; renderAll(); fitU(); toast('Opened '+f.name);
  }catch(err){ say('Could not open that file: '+err.message); }
};
function summaryForClaude(files){
  const L=[]; const d=new Date();
  L.push('# Sturmball Designer export - '+d.toLocaleString(),'Game data it started from: '+SOURCE,'');
  L.push('Changed files: '+(files.filter(f=>f.changed).map(f=>f.name).join(', ')||'none'),'');
  S.trees.forEach(t=>{
    L.push('## Unlock tree: '+t.name);
    const ns=treeNodes(t.id); const depth=n=>n.parents.length?1+Math.max(...n.parents.map(p=>{const o=node(p);return o&&o.tree===t.id?depth(o):0;})):0;
    ns.slice().sort((a,b)=>depth(a)-depth(b)||a.x-b.x).forEach(n=>{
      const sales=S.upgrades.filter(u=>u.Achievement===n.id);
      L.push(`- **${n.name}** (\`${n.id}\`)`+(n.parents.length?' - after '+n.parents.map(p=>(node(p)||{}).name||p).join(' + '):n.cond.length?'':' - open from the start')+
        (n.cond.length?'; earned when '+n.cond.map(humanCond).join(' and '):'')+
        (n.unlocks.length?'; unlocks '+n.unlocks.map(u=>{const k=keyFor(u);return u+(k?' (key '+k.Cost+' '+k.Currency+')':'');}).join(', '):'')+
        (n.reward?'; reward '+rewardText(n.reward):'')+(sales.length?'; then sells '+sales.map(s=>s.Name+' '+s.Cost+' '+s.Currency).join(', '):''));
    });
    L.push('');
  });
  const fresh=[...new Set(S.nodes.flatMap(n=>n.unlocks).filter(u=>catOf(u).startsWith('New')))];
  const banners=[...new Set(S.nodes.flatMap(n=>n.unlocks).filter(u=>catOf(u)==='Base banners'))];
  if(fresh.length||banners.length){ L.push('## Needs wiring in the game');
    if(fresh.length) L.push('New unlock names nothing in the game tests yet: '+fresh.join(', '));
    if(banners.length) L.push('Base banners that are not locked in the game today: '+banners.join(', '));
    L.push(''); }
  L.push('## Brewery recipes');
  S.brews.forEach(b=>L.push(`- **${b.Name}** (\`${b.ID}\`): `+(costOf(b).map(c=>itemName(c.id)+' ×'+c.n).join(', ')||'no ingredients')+
    (b['For Class']||b.Becomes?'; '+(b['For Class']||'anyone')+(b.Becomes?' becomes '+b.Becomes:''):'')+(brewUnlockName(b)?'; unlocked by "'+brewUnlockName(b)+'"':'')));
  return L.join('\n')+'\n';
}
function openExport(){
  const files=exportFiles(); const sum=summaryForClaude(files);
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><h2>Export</h2>
    <p class="hint">These are the game's own files, ready to drop into <code>project_sb/data</code> - or send them (with the summary) to Claude in the project chat.</p>
    <div class="files">${files.map((f,i)=>`<div class="file"><span class="nm">${f.name}</span><span class="st">${f.what} · ${f.changed?'<b style="color:var(--accent)">changed</b>':'no changes'}</span><button class="small" data-dl="${i}">Download</button></div>`).join('')}
      <div class="file"><span class="nm">designer_summary.md</span><span class="st">what you drew, in words, for Claude</span><button class="small" id="dlSum">Download</button></div></div>
    <div class="btns">
      <button class="primary" id="dlAll">Download changed files + summary</button>
      ${dirHandle?'<button id="writeDir">Write changed files into the data folder</button>':''}
      <button id="copySum">Copy summary</button>
      <button id="closeEx">Close</button>
    </div>
    ${dirHandle?'':'<p class="hint" style="margin-top:10px">Tip: in Chrome or Edge, “Load game data…” can also write the files straight back into the data folder.</p>'}</div>`;
  document.body.appendChild(bg);
  const q=s=>bg.querySelector(s);
  bg.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>download(files[+b.dataset.dl].name,files[+b.dataset.dl].text));
  q('#dlSum').onclick=()=>download('designer_summary.md',sum,'text/markdown');
  q('#dlAll').onclick=async()=>{ const ch=files.filter(f=>f.changed); toast((ch.length+1)+' files to your Downloads'); for(const f of ch){ await download(f.name,f.text); await new Promise(r=>setTimeout(r,350)); } await download('designer_summary.md',sum,'text/markdown'); };
  q('#copySum').onclick=async()=>{ try{ await navigator.clipboard.writeText(sum); toast('Summary copied'); }catch(e){ const t=document.createElement('textarea'); t.value=sum; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); toast('Summary copied'); } };
  q('#closeEx').onclick=()=>bg.remove(); bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
  if(dirHandle) q('#writeDir').onclick=async()=>{
    const ch=files.filter(f=>f.changed); if(!ch.length){ toast('Nothing has changed'); return; }
    if(!await yes('Overwrite '+ch.map(f=>f.name).join(', ')+' in the data folder?')) return;
    try{ for(const f of ch){ const fh=await dirHandle.getFileHandle(f.name,{create:true}); const w=await fh.createWritable(); await w.write(f.text); await w.close(); FILES[f.key]=f.text; }
      persistOnly(); toast('Wrote '+ch.length+' file'+(ch.length>1?'s':'')+' into data'); bg.remove(); }
    catch(e){ say('Could not write: '+e.message); }
  };
}

/* ============================================================
   BOOT
   ============================================================ */
/* A card that ended up somewhere absurd (an older version could fling
   cards away on a click) is put back in its column. */
function rescueLost(){
  const bad=p=>!p||!Number.isFinite(p.x)||!Number.isFinite(p.y)||Math.abs(p.x)>20000||Math.abs(p.y)>20000;
  let fixed=0;
  S.nodes.forEach(n=>{ if(bad(n)){ n.x=null; n.y=null; fixed++; } });
  if(fixed) S.trees.forEach(t=>arrangeTree(t.id,true));
  const ings=ingredientIds(); let bf=0;
  ings.forEach((id,i)=>{ if(bad(S.ingPos[id])){ S.ingPos[id]={x:0,y:i*90}; bf++; } });
  S.brews.forEach((b,i)=>{ if(bad(S.brewPos[b.ID])){ S.brewPos[b.ID]={x:260+(i%3)*250,y:Math.floor(i/3)*200}; bf++; } });
  if(bf) S.view.bFitted=0;
  return fixed+bf;
}
function renderAll(){
  if(rescueLost()) setTimeout(()=>toast('Brought back cards that had flown off the board'),400);
  document.getElementById('source').textContent='Game data: '+SOURCE;
  renderUnlocks(); renderChain(); renderBrews();
}
function boot(){
  const ui=document.getElementById('ucanvas'), bi=document.getElementById('bcanvas');
  UC=makeCanvas(ui,document.getElementById('ulayer'),()=>S.view.u[S.curTree]||(S.view.u[S.curTree]={x:40,y:40,k:1}),v=>S.view.u[S.curTree]=v);
  BC=makeCanvas(bi,document.getElementById('blayer'),()=>S.view.b||(S.view.b={x:40,y:40,k:1}),v=>S.view.b=v);
  ui.addEventListener('bgclick',()=>{ uSel=null; closePicker(); renderUnlocks(); });
  bi.addEventListener('bgclick',()=>{ bSel=null; renderBrews(); });
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
    document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='view-'+b.dataset.view));
    closePicker(); if(b.dataset.view==='brews'){ renderBrews(); if(!S.view.bFitted){ S.view.bFitted=1; fitB(); } else BC.apply(); } else { renderUnlocks(); UC.apply(); }
  });
  const on=(id,f)=>document.getElementById(id).onclick=f;
  on('btnLoad',loadFolder); on('btnOpen',()=>document.getElementById('designInput').click()); on('btnSave',saveDesign); on('btnExport',openExport); on('btnUndo',undo);
  on('btnAddTree',async()=>{ const n=await ask('Name of the new tree (e.g. Brewery, Adventure, Training)'); if(!n||!n.trim()) return; const id=uid(slug(n),new Set(S.trees.map(t=>t.id))); S.trees.push({id,name:n.trim()}); S.curTree=id; uSel=null; changed(); renderUnlocks(); UC.apply(); });
  on('btnAddNode',()=>addNode(null));
  on('btnArrange',()=>{ arrangeTree(S.curTree,false); renderUnlocks(); unstack(S.curTree); changed(); renderUnlocks(); fitU(); });
  on('btnFit',fitU); on('btnZoomIn',()=>UC.zoom(1.2)); on('btnZoomOut',()=>UC.zoom(1/1.2));
  on('btnBArrange',()=>{ arrangeBrews(); changed(); renderBrews(); fitB(); }); on('btnBFit',fitB);
  on('btnAddBrew',async()=>{ const n=await ask('Name of the new drink'); if(!n||!n.trim()) return; const id=uid(slug(n),new Set(S.brews.map(b=>b.ID)));
    S.brews.push(blankRow(S.brewHeader,{ID:id,Name:n.trim(),Inspiration:'15'})); const ps=Object.values(S.brewPos); S.brewPos[id]={x:260,y:ps.length?Math.max(...ps.map(p=>p.y))+200:0}; bSel={kind:'brew',id}; changed(); renderBrews(); });
  on('btnAddIng',async()=>{ const have=ingredientIds(); const opts=items().filter(r=>!have.includes(r.ID)).map(r=>r.ID+'  ('+r.Name+')');
    const v=await ask('Items.csv ID of the ingredient to add to the board:\n'+opts.slice(0,30).join('\n')); if(!v) return; const id=v.split(/\s/)[0].trim(); if(!id) return;
    S.extraIngs=S.extraIngs||[]; if(!have.includes(id)) S.extraIngs.push(id); const ys=Object.values(S.ingPos).map(p=>p.y); S.ingPos[id]={x:0,y:ys.length?Math.max(...ys)+90:0}; changed(); renderBrews(); });
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); undo(); return; }
    if((e.key==='Delete'||e.key==='Backspace')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
      if(document.getElementById('view-unlocks').classList.contains('on')&&uSel){ e.preventDefault(); if(uSel.kind==='edge') removeSelEdge(); else deleteNode(node(uSel.id)); }
    }
    if(e.key==='Escape') closePicker();
  });
  // Pick up where you left off, when the browser kept it.
  let saved=null; try{ saved=JSON.parse(localStorage.getItem(STORE)||'null'); }catch(e){}
  if(saved&&saved.design&&saved.files){ FILES=saved.files; SOURCE=saved.source||'earlier session'; S=saved.design; STATS=table('Stats').rows; CAT=buildCatalogue();
    lastSnap=snap(); setTimeout(()=>toast('Picked up your last design. “Load game data…” starts fresh.'),300); }
  else { FILES=GAME_DATA.files; SOURCE='built-in copy, '+GAME_DATA.stamp; designFromGame(); lastSnap=snap(); }
  renderAll();
  // First open: cards placed by the automatic layout may sit on each other.
  if(S.nodes.some(n=>n.fresh)){ S.trees.forEach(t=>{ const c=S.curTree; S.curTree=t.id; renderUnlocks(); unstack(t.id); S.curTree=c; }); lastSnap=snap(); renderUnlocks(); }
  requestAnimationFrame(fitU);
  startCloud(saved&&saved.design&&saved.files?saved.savedAt:0);
}
boot();
</script>
