<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sturmball Designer</title>
<!--
  STURMBALL DESIGNER - draw the unlock trees and the brewery recipes, then
  export them as the game's own CSV files.

  DO NOT EDIT sturmball_designer.html IN THE PROJECT ROOT. It is built from
  this file by tools/designer_src/build.py, which pastes a copy of the game's
  CSVs in at GAME_DATA below so the page works with a plain double-click.
-->
<style>
:root{
  --paper:#f4f1e8; --card:#fffdf7; --raise:#faf7ee;
  --ink:#1b2027; --dim:#6d7684; --faint:#9aa2ae;
  --line:#ddd5c4; --hair:#e8e2d5;
  --accent:#a95c14; --accent-soft:#f0e2cf;
  --pitch:#3d6a45; --pitch-soft:#e0eade; --warn:#a33a23; --warn-soft:#f4ddd6;
  --grid:#e9e3d4; --edge:#8d7a5c;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12151a; --card:#191d24; --raise:#1f242d;
  --ink:#e4e8ef; --dim:#8a93a2; --faint:#646d7b;
  --line:#2b323d; --hair:#232932;
  --accent:#e0a04a; --accent-soft:#3a2d18;
  --pitch:#6aa374; --pitch-soft:#1d2c21; --warn:#e0765c; --warn-soft:#331d17;
  --grid:#1a1e25; --edge:#b59a6e;
}}
:root[data-theme="dark"]{
  --paper:#12151a; --card:#191d24; --raise:#1f242d;
  --ink:#e4e8ef; --dim:#8a93a2; --faint:#646d7b;
  --line:#2b323d; --hair:#232932;
  --accent:#e0a04a; --accent-soft:#3a2d18;
  --pitch:#6aa374; --pitch-soft:#1d2c21; --warn:#e0765c; --warn-soft:#331d17;
  --grid:#1a1e25; --edge:#b59a6e;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.small{padding:2px 7px;font-size:12px}
button.danger{color:var(--warn)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:4px 6px;width:100%}
textarea{resize:vertical;min-height:52px}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 3px}
header.top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--raise);flex-wrap:wrap}
header.top > button{padding:4px 9px;font-size:13px}
header.top h1{font-size:17px;margin:0 8px 0 0;letter-spacing:.3px}
.tabs{display:flex;gap:4px}
.tabs button{border-radius:6px 6px 0 0;border-bottom:none;background:transparent}
.tabs button.on{background:var(--card);border-color:var(--line);font-weight:600}
.spacer{flex:1}
.source{font-size:12px;color:var(--dim);min-width:0;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:1100px){.source{display:none}}
.cloud{font-size:12px;color:var(--dim);white-space:nowrap;border:1px solid var(--line);border-radius:10px;padding:2px 8px}
.cloud.on{color:var(--pitch);border-color:var(--pitch)}
.subbar{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.treetab{border-radius:14px;padding:3px 12px}
.treetab.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
main{flex:1;display:flex;min-height:0}
.view{flex:1;display:none;min-width:0}
.view.on{display:flex;flex-direction:column}
.work{flex:1;display:flex;min-height:0}
.canvas{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;
  background-color:var(--paper);
  background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:24px 24px}
.canvas.panning{cursor:grabbing}
.layer{position:absolute;left:0;top:0;transform-origin:0 0}
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.edges path.e{fill:none;stroke:var(--edge);stroke-width:2.2;pointer-events:stroke;cursor:pointer}
svg.edges path.hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
svg.edges path.e.sel{stroke:var(--accent);stroke-width:3.5}
svg.edges path.temp{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 5}
svg.edges text{font-size:12px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px}
.node{position:absolute;width:220px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;user-select:none}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.node.drop{border-color:var(--pitch);box-shadow:0 0 0 3px var(--pitch-soft)}
.node .hd{padding:7px 10px 4px;font-weight:650;display:flex;gap:6px;align-items:flex-start}
.node .hd .ico{font-size:15px;line-height:1.2}
.node .when{padding:0 10px 6px;font-size:12px;color:var(--dim)}
.node .chips{padding:0 8px 8px;display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:1px 7px;font-size:12px;background:var(--raise);max-width:100%}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.chip.new{border-style:dashed}
.chip.dup{border-color:var(--warn)}
.node .price{padding:0 10px 7px;font-size:12px;color:var(--accent)}
.node .foot{display:flex;justify-content:center;border-top:1px solid var(--hair);padding:3px}
.node .foot button{border:none;background:transparent;font-size:12px;color:var(--dim);padding:2px 8px}
.node .foot button:hover{color:var(--accent)}
.node .handle{position:absolute;left:50%;bottom:-9px;width:16px;height:16px;margin-left:-8px;border-radius:50%;
  background:var(--accent);border:2px solid var(--card);cursor:crosshair;display:none}
.node:hover .handle,.node.sel .handle{display:block}
.node.start{border-color:var(--pitch)}
.node.start .hd{color:var(--pitch)}
.node .warn{padding:0 10px 6px;font-size:11.5px;color:var(--warn)}
.node .xparent{padding:0 10px 4px;font-size:11.5px;color:var(--dim);font-style:italic}
.ing{position:absolute;width:150px;background:var(--pitch-soft);border:1.5px solid var(--pitch);border-radius:20px;padding:6px 12px;cursor:pointer;user-select:none;font-weight:600}
.ing small{display:block;font-weight:400;color:var(--dim);font-size:11.5px}
.ing.sel{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
.ing .handle{position:absolute;right:-9px;top:50%;margin-top:-8px;width:16px;height:16px;border-radius:50%;background:var(--pitch);border:2px solid var(--card);cursor:crosshair}
.drink .class{padding:0 10px 6px;font-size:12px}
.side{width:360px;flex:none;border-left:1px solid var(--line);background:var(--card);overflow:auto;padding:12px 14px 40px}
.side h2{font-size:15px;margin:0 0 4px}
.side .hint{font-size:12px;color:var(--dim)}
.side .row{display:flex;gap:6px;align-items:center}
.side .row > *{flex:1}
.side .row > .fixed{flex:none}
.side .box{border:1px solid var(--hair);border-radius:8px;padding:8px;margin-top:6px;background:var(--raise)}
.side hr{border:none;border-top:1px solid var(--hair);margin:14px 0}
.list{display:flex;flex-direction:column;gap:5px}
.picker{position:fixed;z-index:50;width:380px;max-height:70vh;display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.picker .pk-head{padding:10px;border-bottom:1px solid var(--hair)}
.picker .pk-body{overflow:auto;padding:4px 10px 10px}
.picker h4{margin:10px 0 4px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.picker h4 i{width:9px;height:9px;border-radius:50%}
.picker .opt{display:flex;gap:8px;align-items:center;padding:3px 4px;border-radius:5px;cursor:pointer}
.picker .opt:hover{background:var(--raise)}
.picker .opt input{width:auto}
.picker .opt small{color:var(--dim)}
.picker .pk-foot{padding:8px 10px;border-top:1px solid var(--hair);display:flex;gap:6px;justify-content:flex-end}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:12px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:18px 20px;border:1px solid var(--line)}
.modal h2{margin:0 0 8px;font-size:18px}
.modal .files{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.modal .file{display:flex;align-items:center;gap:8px;border:1px solid var(--hair);border-radius:8px;padding:7px 10px}
.modal .file .nm{font-family:var(--mono);font-weight:600}
.modal .file .st{flex:1;color:var(--dim);font-size:12.5px}
.modal .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;z-index:80;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.chain{display:flex;gap:6px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--raise);overflow-x:auto;font-size:12px;white-space:nowrap}
.chain b{color:var(--accent)}
.chain .arrow{color:var(--faint)}
.empty{color:var(--dim);font-size:13px;margin-top:20px}
.legend{position:absolute;left:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap;max-width:70%}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:50%}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--raise)}
@media (max-width:760px){.side{width:100%;position:absolute;right:0;top:auto;bottom:0;height:45%;border-left:none;border-top:1px solid var(--line)} .work{position:relative}}
</style>
</head>
<body>
<header class="top">
  <h1>Sturmball Designer</h1>
  <div class="tabs">
    <button data-view="unlocks" class="on">Unlock Tree</button>
    <button data-view="brews">Brewery Recipes</button>
  </div>
  <div class="spacer"></div>
  <span class="cloud" id="cloud" hidden></span>
  <span class="source" id="source"></span>
  <button id="btnLoad" title="Read the CSVs from your project_sb/data folder">Load game data…</button>
  <button id="btnOpen" title="Open a design you saved earlier">Open design…</button>
  <button id="btnSave" title="Save this design as a file you can open again">Save design</button>
  <button id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
  <button id="btnExport" class="primary">Export…</button>
  <input type="file" id="dirInput" webkitdirectory multiple hidden>
  <input type="file" id="designInput" accept=".json,application/json" hidden>
</header>
<main>
  <!-- =========================== UNLOCK TREE =========================== -->
  <section class="view on" id="view-unlocks">
    <div class="subbar">
      <span id="treeTabs" style="display:flex;gap:6px;flex-wrap:wrap"></span>
      <button class="small" id="btnAddTree">+ New tree</button>
      <div class="spacer"></div>
      <button class="small" id="btnAddNode">+ Add unlock step</button>
      <button class="small" id="btnArrange" title="Lay this tree out neatly">Tidy up</button>
      <button class="small" id="btnFit">Fit</button>
      <button class="small" id="btnZoomOut">−</button>
      <button class="small" id="btnZoomIn">+</button>
    </div>
    <div class="work">
      <div class="canvas" id="ucanvas">
        <div class="layer" id="ulayer"><svg class="edges" id="uedges"></svg></div>
        <div class="legend" id="ulegend"></div>
      </div>
      <aside class="side" id="uside"></aside>
    </div>
  </section>
  <!-- ========================= BREWERY RECIPES ========================= -->
  <section class="view" id="view-brews">
    <div class="chain" id="chain"></div>
    <div class="subbar">
      <span class="hint" style="font-size:12px;color:var(--dim)">Drag from an ingredient's dot onto a drink to put it in the recipe.</span>
      <div class="spacer"></div>
      <button class="small" id="btnAddBrew">+ New drink</button>
      <button class="small" id="btnAddIng">+ Ingredient</button>
      <button class="small" id="btnBArrange">Tidy up</button>
      <button class="small" id="btnBFit">Fit</button>
    </div>
    <div class="work">
      <div class="canvas" id="bcanvas">
        <div class="layer" id="blayer"><svg class="edges" id="bedges"></svg></div>
      </div>
      <aside class="side" id="bside"></aside>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
/* The game's CSVs, pasted in by tools/designer_src/build.py. */
const GAME_DATA = /*GAME_DATA*/{"stamp": "12 Oct 2026 (09a880a6)", "files": {"Achievements": "ID,Name,Description,Needs,Unlocks,Reward,Art,Hidden,Notes\nfirst_whistle,First Whistle,Play a match to the final whistle.,count:matches_played>=1,Club House,,,,\"THE ROOT OF EVERYTHING. Read the note at the top of achievement_book.gd: nothing in this game is available until an achievement hands it over. `Unlocks` is what this one hands over - a semicolon-separated list, in the same words the rest of the game uses. `Needs` is the ordinary condition language: count:x>=n, flag:y, unlocked:z, joined with semicolons.\"\nfirst_win,First Win,Win a match.,count:matches_won>=1,Dorms,count:coins+25,,,\"`Reward` is anything else that should happen, in the same words a Progression row's Do column uses. Coins, a flag, a story scene. THIS ROW SAID `give:coins+25` AND DID NOTHING FOR MONTHS - there is no `give` verb; it is `count:`. The loud-unknown-action guard added last round is what found it, on the first soak after it went in.\"\nthree_wins,Treble,Win three matches.,count:matches_won>=3,Trophy Room,count:coins+50,,,\ngoal_machine,Goal Machine,Score ten goals.,count:goals>=10,Training Ground,,,,\nsharp_shooter,Sharp Shooter,Score five goals with a Star Player.,count:goals_by_star>=5,Pub,,,,\"goals_by_star is a row of Stats.csv. If you point a Needs at a counter nothing counts, tools/achievement_check.gd says so and names it.\"\nbrewer,The First Brew,Score three times with a fire-brewed player.,count:goals_with_brew_fire>=3,Brewery;Malthouse,announce:The Brewery is open,,,Two unlocks from one achievement. The Brewery is the map; the Malthouse is its first section - a section has to be unlocked before you can work in it.\nkeeper_killer,Wall Breaker,Empty an opposing keeper's stamina five times.,count:keeper_emptied>=5,Traveling Tavern,,,,\nclean_sheet,Clean Sheet,Win a match without conceding.,count:clean_sheets>=1,Mill,,,,The Brewery's second section.\nten_matches,Regular,Play ten matches.,count:matches_played>=10,Lautering,,,,The third section.\nstar_collector,Star Collector,Own three Star Players of the same class.,flag:three_of_a_kind,Emblems,,,,\"THE GATE ON THE TALENT TREE. Three Stars of one class opens the Emblem section - but the Emblems have to be unlocked HERE first, which is what this row does. It waits on a FLAG rather than a counter because owning three of a kind is a fact about your squad, not a thing that happens; the team builder sets that flag when the tree lands. Until then this one is unearnable on purpose.\"\nseason_winner,Champions,Win a season.,flag:season_won,Trophy Case;Boiling,,,yes,Hidden = yes keeps it off the board until you earn it. Use it for endings and for anything that would spoil a surprise.\nnight_game,Under the Lights,Play five matches.,count:matches_played>=5,Floodlights,,,,\"Grants a Stadium.csv layer. Stadium layers test unlocked: like everything else, so an achievement is all it takes to switch one on.\"\nfull_house,Full House,Win five matches.,count:matches_won>=5,Full House,,,,Another Stadium layer - the crowd.\nthe_crown,The Crown,Win eight matches.,count:matches_won>=8,The Crown,,,,A competition on the season shelf. Seasons.csv has been waiting for somebody to hand this out since round F.\nscout_the_rivals,Know Your Rivals,Play three matches.,count:matches_played>=3,Rival Scouting,,,,Opens the Rivals class on the team-builder screen.\nmaster_brewer,Master Brewer,Score eight times with brewed players.,count:goals_with_brew_fire>=8,Master Brewer,,,,\"Your spreadsheets spell this three ways - Master Brewer, master_brewer and master brewer. That is FINE: unlock names are matched loosely (lowercase, letters and digits only), so all three are the same unlock. See section 4 of the manual.\"\nfirst_pour,First Pour,Pour a brew on a player at the Pub.,count:brews_poured>=1,Fire Brew;Water Brew,,,,\"The two starting recipes. A brew is a Brews.csv row and it tests unlocked: like everything else, so an achievement is the whole of what opens one.\"\nthe_cup,The Cup,Win six matches.,count:matches_won>=6,The Cup,,,,Another competition on the season shelf.\nice_house,Ice House,Keep three clean sheets.,count:clean_sheets>=3,Cooling,,,,The Brewery's fifth section - the cellar where a brew becomes a barrel.\nbottle_it,Bottle It,Win ten matches.,count:matches_won>=10,Bottling,,,,\"The sixth and last section. After this one the bottles go to the Pub, which is where the chain was always going.\"\nhard_man,Hard Man,Have a player sent off.,count:red_cards>=1,,announce:One way to be remembered.,,,\"A REWARD WITH NO UNLOCK. Perfectly legal - `Reward` on its own is enough, and this is the row to copy when you want an achievement that is only a moment. red_cards is a Stats.csv counter fed by the foul system.\"\nsecond_vat,A Second Vat,Keep five clean sheets.,count:clean_sheets>=5,,announce:A second vat is for sale at the Club House.,,,\"ROUND AN (Anthony): AN ACHIEVEMENT ONLY GRANTS THE RIGHT TO BUY AN UPGRADE. This row used to hand the vat over for free (count:batches_cooling+1); now it puts the vat on sale at the Club House - the row with Achievement = second_vat in data/Upgrades.csv. To hand an upgrade out FREE again, put its Effect back in Reward. THE SHAPE FOR THE WHOLE BREWERY: the basic foundation is free and everything that makes it bigger is earned. The Cooling cellar starts with ONE vat - its Batches column - and this Reward adds another. Copy this row for a third, or for batches_boiling, batches_malthouse, any section you like. No code and no new column, and the Brewery screen counts the vats for you.\"\nthird_vat,A Third Vat,Win fifteen matches.,count:matches_won>=15,,announce:A third vat is for sale at the Club House.,,,\"ROUND AN: puts the third vat on sale at the Club House (data/Upgrades.csv) instead of giving it. The same row again. tools/brewery_check.gd measures what each one is worth: one vat is 24 bottles a season, two is 48, three is 54 - because by then hops are the limit and the Traveling Brewer is the answer rather than a fourth vat.\"\nquereinsteiger,Quereinsteiger,Play twenty matches.,count:matches_played>=20,Quereinsteiger,announce:Quereinsteiger: the Training Ground can now retrain a player for a new role.,,,\"ROUND AN (Anthony, 8 Oct). Opens retraining at the Training Ground (Training.csv row quereinsteiger, Kind retrain). Twenty matches is a placeholder - move Needs to whatever should earn it.\"\n", "Audio": "ID,When,Match,Sound,Bus,Loop,Volume,Fade,Requires,Notes\nmenu_theme,screen_opened,screen=main,menu_suno,Music,true,-9,1.5,,\"The main menu. ROUND AN (7 Oct): your Suno song Sturm Ball with four crowd cheers between the 'Sturm! Ball!' shouts - the whole 29.4 s song, looped by tools/make_loop.py (data/MusicLoops.csv suno_menu). Spares: menu_suno_untitled (the old Untitled song with its cheers), menu_oktoberfest_ludo (Ludo), menu_oktoberfest (hand-written). The old menu_theme.ogg still plays on the season shelf, team shelf and builder rows below.\"\nsettings_theme,screen_opened,screen=settings,menu_suno,Music,true,-17,0.8,,\"ROUND AL. Settings keeps the menu music going - same Sound as menu_theme, so it does NOT restart, it only glides down to this quieter Volume (8 dB under the menu). Back on the title screen it glides up again.\"\nslot_theme,screen_opened,screen=slot,menu_suno,Music,true,-17,0.8,,\"ROUND AL. The save screen (Start -> choose a save) keeps the menu music going too, quieter - see settings_theme.\"\nbase_theme,screen_opened,screen=base,base_suno,Music,true,-10,2,,\"The base. ROUND AL: your Suno track Sonniger Nachmittag, 16 bars (38.6 s) looped by tools/make_loop.py (MusicLoops.csv suno_base). Spares: base_ludo_1 / _2 / _3. Walking to the Pub and back does NOT restart it - the same track on the same bus is left alone.\"\nbase_theme_brewing,screen_opened,screen=base,base_suno,Music,true,-10,2,unlocked:Brewery,\"ROUND AL: the same Suno base track once the Brewery is open, so the base keeps its one tune. Put a different track here (e.g. base_ludo_3) if you want the base to change when the Brewery opens - the LAST matching row wins, so this row sits below base_theme.\"\nbrewery_music,window_opened,screen=brewery;over=base,suno_brewery_music | -,Music,true,-11,1.5,,ROUND AN (10 Oct): the Brewery window over the base gets its own music. Waits for suno_brewery_music.mp3; until then the base music carries on. Closing the window gives the base its music back. Not over a match (over=base).\nbrewery_music_full,screen_opened,screen=brewery,suno_brewery_music | -,Music,true,-11,1.5,,\"ROUND AN (10 Oct): the same, for the Brewery opened as a whole screen.\"\ndorms_music,window_opened,screen=dorms;over=base,suno_dorms_music | -,Music,true,-13,1.5,,ROUND AN (10 Oct): the Dorms (the beds) - quiet sleepy music. Waits for suno_dorms_music.mp3; until then the base music carries on.\ndorms_music_full,screen_opened,screen=dorms,suno_dorms_music | -,Music,true,-13,1.5,,\"ROUND AN (10 Oct): the same, for the Dorms opened as a whole screen.\"\npub_theme,screen_opened,screen=pub,dialogue_suno,Music,true,-11,1.5,,\"The Pub is where you talk to people, so it plays the dialogue music (Leiser Oom-Pah) until it has a track of its own.\"\nseason_theme,screen_opened,screen=season,menu_theme,Music,true,-12,1.0,,The season shelf is a menu and sounds like one. Give it a track of its own and change this row.\nmatch_theme,screen_opened,screen=match,match_suno,Music,true,-12,2,,\"During every match. ROUND AL: your Suno track Fussball im Bierzelt, 16 bars (35.1 s) looped by tools/make_loop.py (MusicLoops.csv suno_match). It replaced the crowd loop (match_theme.ogg, still in assets/audio/) - put match_theme back here for the crowd only. Hangs on screen_opened, not match_started (match_started fires while the scene is still assembling).\"\nplay_maker_music,play_maker,,suno_play_maker_music | -,Music,true,-12,1.5,,\"ROUND AN (10 Oct): music while you pick your players at every PLAY MAKER. Waits for suno_play_maker_music.mp3; until then the match music just carries on. play_resumed (below) brings the match music back when the ball is live again. SMOOTHER (Anthony, 11 Oct): Fade 1.5 s, and the match music now carries on where it stopped (Tuning music_resume_seconds).\"\ngoal_attempt_music,goal_attempt,,suno_goal_attempt_music | -,Music,true,-11,1.0,,\"ROUND AN (10 Oct): music under the shot cut-away (shooter against keeper), either side. `side` is you or them if you want two tracks. Waits for suno_goal_attempt_music.mp3. SMOOTHER (Anthony, 11 Oct): Fade 1.0 s, and the match music now carries on where it stopped (Tuning music_resume_seconds).\"\nmatch_music_back,play_resumed,,match_suno,Music,true,-12,2.0,,\"ROUND AN (10 Oct): the ball is live again, so the match music comes back after the Play Maker or goal attempt music. Keep its Sound the same as match_theme. When nothing else took over, the same track is left alone - no restart. SMOOTHER (Anthony, 11 Oct): Fade 2.0 s, and the match music now carries on where it stopped (Tuning music_resume_seconds).\"\nmatch_music_back_shot,goal_attempt_over,,match_suno,Music,true,-12,2.0,,\"ROUND AN (10 Oct): the shot cut-away closed, so the match music comes back. Same Sound as match_theme. SMOOTHER (Anthony, 11 Oct): Fade 2.0 s, and the match music now carries on where it stopped (Tuning music_resume_seconds).\"\nkickoff_whistle,kick_off,,suno_kickoff_whistle | bav_kickoff,Effects,,-8,,,\"SUNO SLOT (10 Oct): drop suno_kickoff_whistle.mp3 (or .wav/.ogg) into assets/audio/ and it plays instead - prompt in guides/SUNO_PROMPTS.md. BAVARIAN (Round AN, 8 Oct): bav_kickoff.ogg, made by tools/make_bavarian_sfx.py (your pick on the sound board, 8 Oct) - see data/SoundCredits.csv for what you hear. The old sound was 'kickoff_whistle' (still in assets/audio/; put it back in Sound to undo). AFTER THE COUNTDOWN, as play begins. It used to hang on match_started, which fires while the match is still loading - so the referee blew up over the loading screen several seconds before anybody could kick anything.\"\nplay_maker_whistle,play_maker,,suno_play_maker_whistle | bav_play_maker,Effects,,-9,,,\"SUNO SLOT (10 Oct): drop suno_play_maker_whistle.mp3 (or .wav/.ogg) into assets/audio/ and it plays instead - prompt in guides/SUNO_PROMPTS.md. BAVARIAN (Round AN, 8 Oct): bav_play_maker.ogg, made by tools/make_bavarian_sfx.py (your pick on the sound board, 8 Oct) - see data/SoundCredits.csv for what you hear. The old sound was 'kickoff_whistle' (still in assets/audio/; put it back in Sound to undo). Every PLAY MAKER. STAND-IN: this is not the sound it should be, it is a file you already have so the moment is audible. Put the real one in assets/audio/ under the name in SOUNDS_WANTED.csv and this row picks it up with no edit.\"\nhold_up_whistle,hold_up,,suno_hold_up_whistle | bav_star_switch,Effects,,-9,,,\"SUNO SLOT (10 Oct): drop suno_hold_up_whistle.mp3 (or .wav/.ogg) into assets/audio/ and it plays instead - prompt in guides/SUNO_PROMPTS.md. BAVARIAN (Round AN, 8 Oct): bav_star_switch.ogg, made by tools/make_bavarian_sfx.py (your pick on the sound board, 8 Oct) - see data/SoundCredits.csv for what you hear. The old sound was 'kickoff_whistle' (still in assets/audio/; put it back in Sound to undo). Every STAR PLAYER SWITCH. STAND-IN: this is not the sound it should be, it is a file you already have so the moment is audible. Put the real one in assets/audio/ under the name in SOUNDS_WANTED.csv and this row picks it up with no edit.\"\ngoal_horn,goal_scored,,suno_goal_horn | bav_goal,Effects,,-11,,,\"SUNO SLOT (10 Oct): drop suno_goal_horn.mp3 (or .wav/.ogg) into assets/audio/ and it plays instead - prompt in guides/SUNO_PROMPTS.md. QUIETER (Anthony, 10 Oct: the goal cheering was too loud): -5 -> -11 dB. BAVARIAN (Round AN, 8 Oct): bav_goal.ogg, made by tools/make_bavarian_sfx.py (your pick on the sound board, 8 Oct) - see data/SoundCredits.csv for what you hear. The old sound was 'crowd_goal' (still in assets/audio/ WANTED.csv and this row picks it up with no edit.\"\npass_kick,ball_passed,,suno_pass_kick | bav_ball_kick,Effects,,-13,,,\"ROUND AN (Anthony, 11 Oct: \"\"during match sound of kicking the ball is missing\"\"): every pass on the pitch - the ball going round in open play, the Play Maker relay and goal kicks. Before, only shots and restarts made a sound. `kind` is pass, hoof (a hurried ball under pressure) or relay, so you can give each its own row through Match. Plays the same leather thump as ball_kick (bav_ball_kick.ogg). SUNO SLOT: drop suno_pass_kick.mp3 (or .wav/.ogg) into assets/audio/ and it plays instead - prompt in guides/SUNO_PROMPTS.md.\"\nkeeper_save,save_made,,suno_keeper_save | bav_save,Effects,,-9,,,\"SUNO SLOT (10 Oct): drop suno_keeper_save.mp3 (or .wav/.ogg) into assets/audio/ and it plays instead - prompt in guides/SUNO_PROMPTS.md. BAVARIAN (Round AN, 8 Oct): bav_save.ogg, made by tools/make_bavarian_sfx.py (your pick on the sound board, 8 Oct) - see data/SoundCredits.csv for what you hear. The old sound was 'glove_catch' (still in assets/audio/; put it back in Sound to undo).\"\nkeeper_big_save,save_made,power>=4,suno_keeper_big_save | bav_save_big,Effects,,-7,,,\"SUNO SLOT (10 Oct): drop suno_keeper_big_save.mp3 (or .wav/.ogg) into assets/audio/ and it plays instead - prompt in guides/SUNO_PROMPTS.md. BAVARIAN (Round AN, 8 Oct): bav_save_big.ogg, made by tools/make_bavarian_sfx.py (your pick on the sound board, 8 Oct) - see data/SoundCredits.csv for what you hear. The old sound was 'glove_catch_big' (still in assets/audio/; put it back in Sound to undo). A save against a shot of 4 power or more.\"\nduel_ability_success,duel_ability_success,,suno_duel_ability_success | bav_ability_success,Effects,,-8,,,\"SUNO SLOT (10 Oct): drop suno_duel_ability_success.mp3 (or .wav/.ogg) into assets/audio/ and it plays instead - prompt in guides/SUNO_PROMPTS.md. BAVARIAN (Round AN, 8 Oct): bav_ability_success.ogg, made by tools/make_bavarian_sfx.py (your pick on ct) - see data/SoundCredits.csv for what you hear. The old sound was 'pour' (still in assets/audio/; put it back in Sound to undo).\"\ndrink_pitch,brew_drunk,where=pitch,suno_drink_pitch | suno_drink_big | bav_drink,Effects,,-9,,,\"ROUND AN (Anthony, 10 Oct: drinking sound): a player drinks from the bag during a match - the gulps while he lifts the stein on the pitch. Uses your Suno drink sound (suno_drink_big) once it is there; suno_drink_pitch if you want a different one for the pitch.\"\ncard_hover,card_hovered,,suno_card_hover | bav_card_hover,UI,,-20,,,\"SUNO SLOT (10 Oct): drop suno_card_hover.mp3 (or .wav/.ogg) into assets/audio/ and it plays instead - prompt in guides/SUNO_PROMPTS.md. BAVARIAN (Round AN, 8 Oct): bav_card_hover.ogg, made by tools/make_bavarian_sfx.py (your pick on the sound board, 8 Oct) - see data/SoundCredits.csv for what you hear. The old sound was 'ui_tick' (still in assets/audio/; put it back in Sound to undo). Quiet on purpose - it fires every time the mouse crosses a card.\"\ncard_lock,card_picked,,suno_card_lock | bav_card_pick,UI,,-12,,,\"SUNO SLOT (10 Oct): drop suno_card_lock.mp3 (or .wav/.ogg) into assets/audio/ and it plays instead - prompt in guides/SUNO_PROMPTS.md. BAVARIAN (Round AN, 8 Oct): bav_card_pick.ogg, made by tools/make_bavarian_sfx.py (your pick on the sound board, 8 Oct) - see data/SoundCredits.csv for what you hear. The old sound was 'ui_confirm' (still in assets/audio/; put it back in Sound to undo).\"\nfull_time_win,match_ended,result=win,suno_full_time_win | bav_full_time_win,Music,,-5,,,\"SUNO SLOT (10 Oct): drop suno_full_time_win.mp3 (or .wav/.ogg) into assets/audio/ and it plays instead - prompt in guides/SUNO_PROMPTS.md. BAVARIAN (Round AN, 8 Oct): bav_full_time_win.ogg, made by tools/make_bavarian_sfx.py (your pick on the sound board, 8 Oct) - see data/SoundCredits.csv for what you hear. The old sound was 'crowd_goal' (still in assets/audio/; put it back in Sound to undo). The final whistle when you have w
