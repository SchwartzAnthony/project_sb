in a Sound column.\"\ndrink_burp,drink_burp,,suno_drink_burp | bav_burp,Effects,,-6,,,\"FIXED (10 Oct): When was blank, so the burp in the drinking window was silent. SUNO SLOT (10 Oct): drop suno_drink_burp.mp3 (or .wav/.ogg) into assets/audio/ and it plays instead - prompt in guides/SUNO_PROMPTS.md. ROUND AN - the tutorial drinking window (src/ui/drink_window.gd): the big burp after the arm wipe. bav_burp.ogg, made by tools/make_bavarian_sfx.py: one long, rumbling, comic burp, warm not shrill.\"\n", "Biomes": "ID,Name,Order,Requires,Waves,Enemy Pool,Background,Parallax,Sky,Grass,Grass Stripe,Edge,Music,Drops,Difficulty,Description,Ground Alpha\nmarshlands,The Marshlands,1,,4,marsh,res://assets/backgrounds/marsh_iso.png,0,#12181c,#213a26,#1b2f1f,#3a5c3f,marsh_theme,marsh_ground,1,Wet and green. Reed grows thick here and something is always moving in it.,0.35\ncinderwastes,The Cinder Wastes,2,unlocked:Marsh King,5,cinder,bg_cinder,0.3,#1c1310,#4a3320,#3d2a1a,#7a5530,cinder_theme,cinder_ground,2,Ash underfoot and heat in the air. Nothing grows but the fires do.,\nhollowdeep,The Hollowdeep,3,unlocked:Ash Tyrant,6,hollow,bg_hollow,0.2,#0d0c14,#2a2438,#221d2e,#463c5c,hollow_theme,hollow_ground,3,Below the old works. The dark down here has weight to it.,\nfrostreach,The Frostreach,4,unlocked:Hollow Mother,6,frost,bg_frost,0.35,#101822,#28455e,#20384d,#4d7a9e,frost_theme,frost_ground,4,\"White over blue, and the wind never stops. An example of how a biome changes with four colours.\",\n", "Bounties": "ID,Name,Biome,Boss,Reward,Requires,Repeatable,Waves,Recommended Power,Art,Description,Kind,Quest Text,Pin X,Pin Y\nmarsh_king,The Marsh King,marshlands,marsh_king,unlock:Marsh King;count:coins+120,,no,,2,bounty_king,Something is holding the reed beds. Go and take them back.,Match,The Marsh King has taken the reed beds and he will not give them back for asking. Beat his side in his own mud and the marsh is ours again.,0.82,0.5\nreed_clearing,Clear the Reeds,marshlands,reed_warden,count:coins+40;count:reed+20,,yes,2,1,bounty_reed,A short run. Good for a first haul and a full basket of reed.,Training,One wave through the shallows, then the Reed Warden at the end. Bring back a full basket for the Brewer.,0.18,0.5\nash_tyrant,The Ash Tyrant,cinderwastes,ash_tyrant,unlock:Ash Tyrant;count:coins+220,unlocked:Marsh King,no,,4,bounty_tyrant,It sits at the centre of the burn and it has been there a long time.,Match,At the centre of the burn the Ash Tyrant has never lost a match. Somebody has to be first.,,\nslag_run,The Slag Run,cinderwastes,slag_walker,count:coins+90;count:bog_iron+15,unlocked:Marsh King,yes,3,3,bounty_slag,\"Iron for the taking, if you can get past what is guarding it.\",Training,\"Iron for the forge, if you can get past what is guarding it. Two waves of it, then the Slag Walker.\",,\nthe_hollow_mother,The Hollow Mother,hollowdeep,hollow_mother,unlock:Hollow Mother;count:coins+400,unlocked:Ash Tyrant,no,,5,bounty_mother,Nobody who has gone this deep has come back with a straight story.,Match,\"Down in the old works, below everything. Nobody who went this deep came back with a straight story.\",,\ntut_brewers_errand,The Brewer's Errand,marshlands,reed_warden,count:reed+10,flag:tut_morning,yes,2,1,bounty_reed,\"ROUND AN - THE TUTORIAL'S BOUNTY. Koch drank the Brewery dry, so the Brewer needs reed. One wave, then the Reed Warden. Only on the board in the Tutorial (flag:tut_morning).\",Training,\"Koch drank the Brewery dry. The Brewer needs reed: one wave through the marsh, then the Reed Warden. Bring back ten bundles.\",0.5,0.5\n", "BreweryResources": "ID,Name,Kind,Kept,Start,Icon,Counter,Notes\nwheat,Wheat,raw,no,10,res_wheat.png,,\"KIND says where it comes from. `raw` arrives from outside the brewery - a match reward, the Traveling Brewer, an adventure. `made` is produced by one of the six sections. `tool` is a piece of equipment.\"\nwater,Water,raw,no,20,res_water.png,,The one thing three different sections all want. Keep the Start high.\ngerms,Germs,raw,no,5,res_germs.png,,\nhops,Hops,raw,no,6,res_hops.png,,\nyeast,Yeast,raw,no,4,res_yeast.png,,\nhammer,Hammer,tool,yes,1,res_hammer.png,,\"KEPT = yes means it is NOT used up. You need to own one to work the Mill, and you still own it afterwards. That is the difference between equipment and an ingredient, and it is one cell.\"\nfilter,Filter,tool,yes,1,res_filter.png,,\nboiler,Boiler,tool,yes,1,res_boiler.png,,\nelement,Element,tool,yes,1,res_element.png,,\"The heat source. Kept, like the boiler - the Talent Tree is where a better one comes from.\"\nmalt,Malt,made,no,0,res_malt.png,,Made by the Malthouse.\nmash,Mash,made,no,0,res_mash.png,,Made by the Mill.\nwort,Wort,made,no,0,res_wort.png,,Made by Lautering.\nbrew,Brew,made,no,0,res_brew.png,,Made by Boiling & Hopping. This is the point of the whole map - everything before it is preparation and everything after it is storage.\nbarrel,Barrel,made,no,0,res_barrel.png,,Made by Cooling & Fermenting - and only after it has lagered.\nbottle,Bottle,made,no,0,res_bottle.png,small_bottle,\"ROUND AN: COUNTER = small_bottle, so a bottle is a Small Bottle in the bag (Items.csv). The Bottling Machine asks which size to fill (BottleSizes.csv); this is only used if that file has no rows for it. COUNTER blank = the resource is kept in res_<ID>, as before. Made by Bottling & Filling, several from one barrel. A bottle is what the Pub pours.\"\n", "BrewerySections": "Order,ID,Name,Worker,Needs,Takes,Makes,How Many,Batches,Wait Min,Wait Max,X,Y,Art,Size,Shift X,Shift Y,Notes\n1,malthouse,Steeping Tank,Maltster,unlocked:Malthouse;count:malthouse_key>=1,wheat:1;water:1;germs:1,malt,1,1,0,0,0.5,0.24,brewery_malthouse.png,288,,,\"ROUND AN: needs its KEY too (malthouse_key, bought at the Club House). ROUND AN (your sketch): a pyramid on the courtyard - one machine at the back, two in the middle, three at the front, each on its round wooden pallet (Tuning.csv brewery_pallet). SIZE is how big this machine is drawn in pixels (blank = Tuning.csv brewery_machine_size): 320 at the back, 384 in the middle, 448 at the front, so the yard has depth (384 = exactly 3x the 128-pixel picture, the crispest). ROUND AN (your picks): drawn as its machine, which IS the button (assets/brewery/brewery_malthouse.png, PixelLab; layered in art_source/aseprite/brewery/). Was called Malthouse; the unlock name in Needs is unchanged. THE ORDER COLUMN IS THE MAP. Section 1 is the first building you walk to. It also decides what may feed what: a section can only be given something an EARLIER section makes, or something raw - otherwise the chain cannot be started and tools/brewery_check.gd says so.\"\n2,mill,Grain Mill,Miller,unlocked:Mill;count:mill_key>=1,malt:1;water:1;hammer:1,mash,1,1,0,0,0.3,0.47,brewery_mill.png,320,,,\"ROUND AN: needs its KEY too (mill_key, bought at the Club House). ROUND AN (your picks): drawn as its machine, which IS the button (assets/brewery/brewery_mill.png, PixelLab; layered in art_source/aseprite/brewery/). Was called Mill; the unlock name in Needs is unchanged. The hammer is a tool, so it is needed but not spent. See the Kept column of BreweryResources.csv.\"\n3,lautering,Lauter Tun,Lauterer,unlocked:Lautering;count:lautering_key>=1,mash:1;filter:1,wort,1,1,0,0,0.7,0.47,brewery_lautering.png,320,,,\"ROUND AN: needs its KEY too (lautering_key, bought at the Club House). ROUND AN (your picks): drawn as its machine, which IS the button (assets/brewery/brewery_lautering.png, PixelLab; layered in art_source/aseprite/brewery/). Was called Lautering; the unlock name in Needs is unchanged. \"\n4,boiling,Brew Kettle,Brewer,unlocked:Boiling;count:boiling_key>=1,wort:1;hops:1;boiler:1;element:1,brew,1,1,0,0,0.84,0.72,brewery_boiling.png,384,-9,,\"ROUND AN: needs its KEY too (boiling_key, bought at the Club House). ROUND AN (your picks): drawn as its machine, which IS the button (assets/brewery/brewery_boiling.png, PixelLab; layered in art_source/aseprite/brewery/). Was called Boiling & Hopping; the unlock name in Needs is unchanged. Four things at once, which is why this is the section that runs you out of something. The mini-game you described - the circles that must all turn the same way round - goes on top of this row later and changes nothing underneath it.\"\n5,cooling,Fermenting Vat,Cellarman,unlocked:Cooling;count:cooling_key>=1,brew:1;yeast:1,barrel,1,1,1,3,0.5,0.74,brewery_cooling.png,384,,,\"ROUND AN: needs its KEY too (cooling_key, bought at the Club House). ROUND AN (your picks): drawn as its machine, which IS the button (assets/brewery/brewery_cooling.png, PixelLab; layered in art_source/aseprite/brewery/). Was called Cooling & Fermenting; the unlock name in Needs is unchanged. WAIT MIN and WAIT MAX are the lagering. The barrel is not yours the moment you press the button - it sits in the cellar for one to three turns, and a turn is a fixture. Set both to 0 and it is instant. BATCHES is how many vats the cellar has: ONE for free, and every one after that is unlocked. An achievement Reward of count:batches_cooling+1 adds a vat - see ice_house_two in Achievements.csv. That is the shape for the whole Brewery: the basic foundation is free and everything that makes it easier or bigger is earned.\"\n6,bottling,Bottling Machine,Bottler,unlocked:Bottling;count:bottling_key>=1,barrel:1,bottle,6,1,0,0,0.16,0.72,brewery_bottling.png,384,4,10,\"ROUND AN: needs its KEY too (bottling_key, bought at the Club House). ROUND AN (your picks): drawn as its machine, which IS the button (assets/brewery/brewery_bottling.png, PixelLab; layered in art_source/aseprite/brewery/). Was called Bottling & Filling; the unlock name in Needs is unchanged. HOW MANY is why this section exists: one barrel becomes six bottles. That number is the whole economy of the Pub - raise it and drinks are cheap, lower it and every bottle is a decision.\"\n", "Brews": "ID,Name,Description,Requires,For Class,Becomes,Element,Artwork,Attack Ability,Defend Ability,Cost,Permanent,Drinks,Inspiration,Pool,Notes\nfire,Fire Brew,Ash on the tongue. A river-singer learns to burn.,unlocked:Fire Brew,Lorelei,Brandteufel,Fire,,BRAND_SCORCH,BRAND_MASK_ATK,reed:6,true,,25,,YOUR EXAMPLE. A Lorelei counts as a Brandteufel for the match and gains two abilities. Feeds goals_with_brew_fire.\nwater,Water Brew,Cold and deep. The fire goes quiet and learns to listen.,unlocked:Water Brew,Brandteufel,Lorelei,Water,,LORE_SURGE,LORE_VEIL,reed:4|bog_iron:2,true,,25,,The mirror of the Fire Brew. Needs the Water Craft talent.\nkeeper,Keeper's Tonic,\"Thick, bitter, and it makes you very hard to move.\",,,,,,,KEEP_BULWARK,ash_glass:5|reed:3,,,20,,\"No Becomes and no For Class - anyone may drink it, nobody changes class, they just gain a defend ability. Permanent is blank so it always wears off.\"\nspirit_lorelei,Lorelei Team Spirit,\"Everyone drinks from the same cup. Whatever was in it, they are one side now.\",unlocked:Team Spirit Lorelei,Lorelei,,Water,,LORE_SURGE,LORE_VEIL,reed:10,true,,30,,\"THE TEAM SPIRIT, forged in the class tree when all three Lorelei nodes hold a Star. Note what it is: AN ORDINARY ROW OF THIS FILE. The tree unlocks the name in Requires and does nothing else, so you can rewrite the drink completely - the element, both abilities, the price, whether it is permanent - without touching a line of code.\"\nspirit_rauhnacht,Feuergeister Team Spirit,Ash in the cup and ash on the tongue. Nobody flinches.,unlocked:Team Spirit Rauhnacht-Feuergeister,Rauhnacht-Feuergeister,,Fire,,BRAND_SCORCH,BRAND_MASK_ATK,reed:10,true,,30,,The same for the other class. Its Requires is the name the tree unlocks - spelled exactly as ClassTree.spirit_unlock() builds it: the words Team Spirit and then the class name.\nturn_water,Rhine Water Lager,Cold from the river. Three of these and he hears her singing.,,Normal,Lorelei,Water,,,,reed:2,,3,15,,\"A TURNING BREW (round X). Drinks 3: three pours on a plain card and he becomes a Lorelei at his own tier and power, keeping his name. On the third the Pub asks which card he becomes - one per set. A different element in between starts the count again.\"\nturn_fire,Rauhnacht Smoke Beer,\"Smoked over the twelve nights. Three, and something answers.\",,Normal,Rauhnacht-Feuergeister,Fire,,,,ash_glass:2,,3,15,,Turning brew - fire. Same rules as turn_water.\nturn_earth,Miner's Dunkel,Black as the seam and twice as heavy.,,Normal,Bergmännlein,Earth,,,,bog_iron:2,,3,15,,Turning brew - earth. Same rules as turn_water.\nturn_air,Unken Weisse,\"Cloudy, cold, and it croaks a little.\",,Normal,Unkengeister,Air,,,,deep_salt:2,,3,15,,Turning brew - air. Same rules as turn_water.\nhelles,Helles,\"A clean, golden Mass. Nobody becomes anybody, they just start to sing.\",,,,,,,,,,,20,,\"ROUND AN - THE DRUNK METER. INSPIRATION is how much of the meter (DrunkLevels.csv) one of these fills, in %. Blank = 0. A row with no Becomes and no abilities is a PLAIN BEER: it only fills the meter, and it is the only thing a sober player can be given. Free, so a team can always start drinking. DRAFT.\"\nfestbier,Festbier,Stronger than it looks. Two of these and the Tuba sounds like the Rhine.,,,,,,,,reed:1,,,35,,\"A stronger plain beer, made from your own Brewery materials. DRAFT.\"\nplain_goalie,Plain Beer,Hits the back of the net. Or yours.,,,,,,PLAIN_GOALIE_ATK,PLAIN_GOALIE_DEF,,,,10,plain,\"ROUND AN - PLAIN BEER (Anthony, 8 Oct: plain beer gives random abilities that have one positive and then the opposite being negative). POOL = plain: these rows are never poured at the Pub; a basic beer from the bag (Items.csv small_bottle, large_bottle, keg: Use brew:pool:plain) picks ONE of them at random, among the rows whose Requires pass. Every row: a good ATTACK side and its opposite, bad, DEFEND side. This one is the tutorial's: 1 off the enemy keeper when he attacks, 1 off your own when he defends. It is the only one with a blank Requires, so it is the only one in the tutorial (the others need !flag:in_tutorial). POOL can name several pools, plain|keg: the keg (Kleiner Faß) draws from pool keg, so the tutorial can give it its own row (Pool keg, Requires flag:in_tutorial) while the bottles keep this one. keg_goalie is this pair for the keg outside the tutorial. Add a row to add a pair.\"\nplain_power,Plain Beer,\"Brave going forward, wobbly at the back.\",!flag:in_tutorial,,,,,PLAIN_POWER_ATK,PLAIN_POWER_DEF,,,,10,plain|keg,\"Plain beer pair: +1 power when he attacks, -1 when he defends.\"\nplain_keeper,Plain Beer,A round for your keeper. And one for theirs.,!flag:in_tutorial,,,,,PLAIN_KEEPER_ATK,PLAIN_KEEPER_DEF,,,,10,plain|keg,\"Plain beer pair: 1 stamina back to your keeper when he attacks, 1 back to theirs when he defends.\"\nkeg_goalie,Plain Beer,Hits the back of the net. Or yours.,!flag:in_tutorial,,,,,PLAIN_GOALIE_ATK,PLAIN_GOALIE_DEF,,,,10,keg,\"The goalie pair for the Kleiner Faß outside the tutorial (in the tutorial the keg is the Tutorial thread's kleiner_fass row, Pool keg).\"\nkleiner_fass,Kleiner Faß,\"A little barrel. Down it in one, spill half.\",flag:in_tutorial,,,,,TUT_FASS_COURAGE,TUT_FASS_COURAGE,,,,10,keg,\"ROUND AN - THE TUTORIAL (Anthony, 8 Oct): the Kleiner Faß (Items.csv keg, Use brew:pool:keg) the Head Coach hands a 0 Power player in cycle 2. Anyone may drink it; no class change. Drunk in a match it takes hold at once (Tuning.csv match_drink_takes_hold_at) and lasts the cycle (match_drink_lasts_cycle). POOL keg + REQUIRES flag:in_tutorial: in the tutorial this is the only keg row whose Requires pass, so the keg always gives it; outside the tutorial the keg is a plain beer gamble again.\"\nanstoss_helles,Anstoß Helles,The kick-off beer. Pass it on.,,,,,,COMBO_HELLES_ATK,COMBO_HELLES_DEF,,,,10,anstoss_helles,\"ROUND AN - THE TUTORIAL COMBO BEERS (Anthony, 8 Oct): one good side and one bad side. POOL is its own ID, so it is never poured at the Pub; Items.csv anstoss_helles (Use brew:pool:anstoss_helles) is the bottle. The tutorial gives three in cycle 2 round 3 (MatchTalk.csv tut_combo).\"\ndoppelpass_weisse,Doppelpass Weiße,Give and go. Mostly go.,,,,,,COMBO_WEISSE_ATK,COMBO_WEISSE_DEF,,,,10,doppelpass_weisse,\"ROUND AN - THE TUTORIAL COMBO BEERS (Anthony, 8 Oct): one good side and one bad side. POOL is its own ID, so it is never poured at the Pub; Items.csv doppelpass_weisse (Use brew:pool:doppelpass_weisse) is the bottle. The tutorial gives three in cycle 2 round 3 (MatchTalk.csv tut_combo).\"\nabstauber_dunkel,Abstauber Dunkel,For the one who just stands near the goal.,,,,,,COMBO_DUNKEL_ATK,COMBO_DUNKEL_DEF,,,,10,abstauber_dunkel,\"ROUND AN - THE TUTORIAL COMBO BEERS (Anthony, 8 Oct): one good side and one bad side. POOL is its own ID, so it is never poured at the Pub; Items.csv abstauber_dunkel (Use brew:pool:abstauber_dunkel) is the bottle. The tutorial gives three in cycle 2 round 3 (MatchTalk.csv tut_combo).\"\n", "Buildings": "ID,Name,Description,Requires,Art,X,Y,Action,Map Art,Map Size,Name Offset,Sound,Door Sound,Notes\ntrophy_room,Trophy Room,\"Glass cases. Season trophies, and anything else you have been told to be proud of.\",unlocked:Trophy Room;count:trophy_room_key>=1,trophy,0.677,0.600,window:trophies,trophy,192x160,,bld_trophy,door_open,\"ROUND AN: needs its KEY too (trophy_room_key, bought at the Club House - data/Upgrades.csv). data/Trophies.csv. A trophy is a NAME AND A CONDITION - it does not have to come from a competition, so `three wins` is as good a trophy as a cup final.\"\nclub_house,Club House,\"Upgrades for the club, and the recruitment board. An achievement gives you the right to buy an upgrade; this is where you pay for it.\",unlocked:Club House,clubhouse,0.86,0.20,window:clubhouse,clubhouse,640x512,,bld_club_house,door_open,ROUND AN (Anthony): THE UPGRADE SHOP - data/Upgrades.csv. Resting moved to the Dorms. THE RECRUITMENT BOARD (round AH) is still here: data/RecruitBoard.csv.\ndorms,Dorms,\"Where every player rests - after a match, an Adventure or a brew - and how many players you may keep.\",unlocked:Dorms;count:dorms_key>=1,dorms,0.517,0.262,window:dorms,dorms,320x192,,bld_dorms,door_open,\"ROUND AN: needs its KEY too (dorms_key, bought at the Club House - data/Upgrades.csv). ROUND AN (Anthony): THE RESTING AREA FOR ALL PLAYERS - data/Resting.csv says what sends a player to bed and for how long, data/Recovery.csv how long by power. Beds are data/Dorms.csv: the first row is FREE and the rest are bought.\"\ntraining_ground,Training Ground,Ausbildung for the whole side — or one of the five games that automate a Brewery section.,unlocked:Training Ground;count:training_ground_key>=1,training,0.167,0.659,window:training,training,640x512,,bld_training,door_open,\"ROUND AN: needs its KEY too (training_ground_key, bought at the Club House - data/Upgrades.csv). data/Training.csv, and the Kind column splits it: `ausbildung` trains a number, `minigame` automates a Brewery section. A mini-game buys that section another vat today; the played game goes on top of it later.\"\npub,Pub,\"Ten seats, ten drinks, and a cheer. Whoever is not in the room plays as a basic unit.\",unlocked:Pub;count:pub_key>=1,pub,0.200,0.237,window:pub,pub,640x512,,bld_pub,door_open,\"ROUND AN: needs its KEY too (pub_key, bought at the Club House - data/Upgrades.csv). TONIGHT'S TEN. `pub_ten` in Tuning.csv turns the ten-seat room on; while it is off, everybody may drink.\"\nbrewery,Brewery,\"Six sections and a yard. Barley in at one end, bottles out at the other.\",unlocked:Brewery;count:brewery_key>=1,brewery,0.80,0.76,window:brewery,brewery,640x512,,bld_brewery,door_open,\"ROUND AN: needs its KEY too (brewery_key, bought at the Club House - data/Upgrades.csv). OPENS ITS OWN MAP inside the window. Each of the six sections is unlocked separately, and a section with player units in it will one day produce on its own after every match - the Batches column is where that foundation already sits.\"\ntraveling_brewer,The Traveling Tavern,\"A wagon, a horse and a man who knows exactly what you have run out of.\",unlocked:Traveling Tavern;count:tavern_key>=1,brewer,0.552,0.912,window:brewer,tavern,256x192,,bld_tavern,wagon_creak,\"ROUND AN: needs its KEY too (tavern_key, bought at the Club House - data/Upgrades.csv). ROUND AN: RENAMED from The Traveling Brewer (Anthony). Only the Name changed - the ID and the unlock it waits on (Traveling Brewer) are the same, so saves are untouched. HE IS THE PRESSURE VALVE ON THE BREWERY, and he sells one thing at a time at a premium. The money is data/Currencies.csv and every match mode has its own - a season match pays coins, a quick match pays marks, a cup tie pays silver.\"\n", "ClassInfo": "Class,Display Name,Description,Banner Art,Formation Art,Element,Star Tier,Requires,Hidden,Notes\nNormal,The Club,\"Your own side before anyone specialised. No element, no tricks — eleven people who turn up. They stack the Journeyman icon in Adventure.\",res://assets/team/banner_normal_team.png,res://assets/team/formation_normal_team.png,,IV,,no,\"ADDED BECAUSE BasicTeam.csv HAS STARS. A class with Star players is offered on the class-select screen whether or not it has a row here - without one it turns up with no description and no banner. Change these words to whatever you like. STAR TIER IV, read off BasicTeam.csv rather than guessed - the new emblem_check tool compares this column against the cards and complains when they disagree, which is how the II that was here first was caught.\"\nRivals,The Rivals,A scratch side of journeymen. Everybody has played against them at some point.,,,,,unlocked:Rival Scouting,,\"A LOCKED CLASS. Requires uses the same words as everywhere else in the game - unlocked:X, flag:y, count:z>=3, joined with a semicolon. Until that unlock is earned the class is not on the screen at all. Put Hidden = yes in the column beside it to remove a class outright without deleting its cards\"\nLorelei,Lorelei,\"Rhine-maidens. They trade units away, turn them into swans and mark the enemy with songs - a class that changes what is on the pitch rather than hitting harder.\",,,WATER,II,,no,\"ADDED THIS ROUND, AND IT CLOSES AN OLD COMPLAINT. The class was fully written in its unit files and had no row here, so it turned up on the class-select screen with no description and no banner and the checker said so every run. Star Tier is the tier the three Stars hold between them - Lorelei Stars are Tier II, so a Lorelei set of nine covers I, III and IV.\"\nRauhnacht-Feuergeister,Rauhnacht-Feuergeister,\"Fire spirits of the twelve nights. Burn counters, fusing and victory counters - a class that builds up over a match and then spends it.\",,,FIRE,IV,,no,\"Star Tier IV, so a set of nine covers I, II and III. The Star tier is READ from the Star Players file as well; this column is what a screen shows before anything is loaded, and the checker complains if the two disagree.\"\nBergmännlein,Bergmännlein,\"Mountain folk. They open mines, carry Ore and spend it - a class that builds a stockpile and then cashes it in.\",,,EARTH,III,,no,\"ADDED THIS ROUND, read off your own files: Star Tier III because Star Players.csv puts Belial, Valefor and Haures there, and the three sets of nine cover I, II and IV.\"\nUnkengeister,Unkengeister,\"Toad spirits of the marsh. They swap places, lay a cold touch on the ball and raise gravestones.\",,,AIR,II,,no,\"Star Tier II, from Star Players.csv. The three sets of nine cover I, III and IV.\"\n", "Currencies": "ID,Name,Counter,Earned In,Win,Draw,Loss,Icon,Notes\ncoins,Coins,coins,season,40,15,5,coin.png,\"LEAGUE MONEY. `Earned In` is the MatchModes.csv id this currency is paid for - so a Quick Match never pays coins and a season match never pays marks. That separation is the whole point: \"\"currency from wins with separate currencies per mode\"\". Leave Earned In blank and it is paid in EVERY mode.\"\nmarks,Marsh Marks,marks,quick,25,10,3,mark.png,\"QUICK-MATCH MONEY. Earned nowhere else, so a shelf of things priced in marks can only be bought by playing quick matches - which is how a mode gets its own reason to exist.\"\ncup_silver,Cup Silver,cup_silver,cup,80,30,10,coin.png,\"A THIRD PURSE, and the row to copy. MatchModes.csv has five ids - season, friendly, quick, cup, adventure - and a currency names ONE of them. A friendly deliberately pays no money at all: it is played for materials, and giving it a purse would make the league pointless. Nothing is priced in cup silver yet; write a Shop.csv row and it is.\"\nreed,Reed,reed,adventure,0,0,0,reed,\"ROUND AN (your note: the Traveling Merchant trades beer for the resources you have). Reed carried home from an Adventure, spent as money at his shop. No match pays it - Win/Draw/Loss 0.\"\nbog_iron,Bog Iron,bog_iron,adventure,0,0,0,bog_iron,ROUND AN. The same for Bog Iron.\n", "Dorms": "ID,Name,Price,Currency,Requires,Beds Included,Notes\nroom_1,Room 1,0,,,10,\"ROUND AN (Anthony, 10 Oct: the Dorms screen - 10 beds a room, buy single beds and extra rooms). ONE ROW PER ROOM, in the order they are bought; each room is a tab (1, 2, 3 ...) on the Dorms screen. Price 0 = yours from the first minute. BEDS INCLUDED = beds that come with the room; the rest of its places are bought one at a time (dorm_bed_price in Tuning.csv). A room holds dorm_beds_per_room beds (10), and there are at most dorm_max_rooms rooms (10), however many rows you write.\"\nroom_2,Room 2,100,coins,unlocked:Dorms,0,\"ROUND AN (Anthony, 10 Oct, Q264): a new game starts with ONE room of 10 beds, so Room 2 is bought like the rest. Give it a Price of 0 and Beds Included to hand it out free again.\"\nroom_3,Room 3,150,coins,unlocked:Dorms,0,\"Price and Currency use data/Currencies.csv. Requires is the ordinary condition language.\"\nroom_4,Room 4,250,coins,unlocked:Dorms,0,\nroom_5,Room 5,400,coins,count:matches_won>=8,0,\"Requires can wait on anything - here 8 matches won, as the old Long House did.\"\nroom_6,Room 6,600,coins,count:matches_won>=8,0,\nroom_7,Room 7,900,coins,unlocked:The Cup,0,\"As the old Stone Wing: after the Cup.\"\nroom_8,Room 8,1200,coins,unlocked:The Cup,0,\nroom_9,Room 9,1600,coins,unlocked:The Cup,0,\nroom_10,Room 10,2000,coins,unlocked:The Cup,0,\"The tenth and last (dorm_max_rooms). A row past the tenth is ignored until dorm_max_rooms is raised.\"\n", "Drops": "Table,Item,Amount,Chance,Requires,Notes\nmarsh_ground,reed,1,1.0,,Picked up off the ground while the party runs.\nmarsh_ground,coins,2,0.5,,\ncinder_ground,ash_glass,1,1.0,,\ncinder_ground,coins,4,0.5,,\nhollow_ground,deep_salt,1,1.0,,\nhollow_ground,coins,6,0.5,,\ngrub_drops,reed,2,1.0,,Always two reed.\ngrub_drops,bog_iron,1,0.2,,One in five.\nbiter_drops,reed,3,1.0,,\nlurker_drops,bog_iron,2,0.6,,\nwarden_drops,reed,10,1.0,,\nwarden_drops,coins,25,1.0,,\nking_drops,recipe_marsh_ale,1,1.0,unlocked:Brewery,Only drops once you can actually brew.\nking_drops,bog_iron,12,1.0,,\nking_drops,coins,80,1.0,,\npup_drops,ash_glass,1,1.0,,\nhound_drops,ash_glass,2,0.7,,\nhusk_drops,bog_iron,3,0.5,,\nwalker_drops,bog_iron,10,1.0,,\nwalker_drops,coins,40,1.0,,\ntyrant_drops,recipe_cinder_stout,1,1.0,unlocked:Brewery,\ntyrant_drops,ash_glass,15,1.0,,\ntyrant_drops,coins,150,1.0,,\ncrawler_drops,deep_salt,1,1.0,,\ndwarden_drops,deep_salt,3,0.6,,\nmother_drops,recipe_hollow_porter,1,1.0,unlocked:Brewery,\nmother_drops,deep_salt,20,1.0,,\nmother_drops,coins,300,1.0,,\nfrost_ground,deep_salt,1,1.0,,Ground pickups in the Frostreach.\nfrost_ground,coins,5,0.5,,\nfrost_ground,smelling_salts,1,0.08,,A rare find. Brings somebody back on.\ngrub_drops,field_bandage,1,0.06,,\"The odd bandage, so the item menu is not empty on a first run.\"\nwarden_drops,smelling_salts,1,1.0,,The first boss always leaves one.\nking_drops,team_orange,2,1.0,,\ntyrant_drops,smelling_salts,2,1.0,,\nmother_drops,smelling_salts,3,1.0,,\n", "Elements": "Element,Display Name,Colour,Icon,Order,Opposes,Notes\nWATER,Water,#5f96cc,element_water,1,FIRE,\"THE FOUR ELEMENTS, AND WHY THIS FILE EXISTS. An Element is the thing a class shares with OTHER classes. A Lorelei is water; so is every water class you write later. That matters because of one rule: AN EMBLEM'S BASIC SIDE IS FED BY ELEMENT, AND ITS CONDITION IS FULFILLED BY CLASS. Any water unit, whatever its class, counts toward Gremory's Basic side; only a Lorelei can complete the Condition that turns it over. So a mixed water team gets a broader engine and gives up the Ultimate, and a mono-Lorelei team gets the Ultimate and a narrower engine. That is a real choice and it costs no code - the rule is the `Basic Feeds` column of an Emblems file, and `element` is its default.\"\nFIRE,Fire,#e07a2c,element_fire,2,WATER,Rauhnacht-Feuergeister today. Opposes is not used by any rule yet; it is here so that when you want a weakness chart there is already one place for it to live.\nEARTH,Earth,#5a7a44,element_earth,3,AIR,NO CLASS YET. Write one and it works: the New Class wizard in the workbench asks for an element and this is the list it offers. Colour is used for the emblem bar and anywhere a screen tints something by element - it is a Theme.csv colour written here so the four stay side by side.\nAIR,Air,#b9a583,element_air,4,EARTH,\"NO CLASS YET. Four elements is the whole set - the plan is one class per element first, then more classes inside each element.\"\n", "Items": "ID,Name,Kind,Tab,Stack,Art,Use,Tags,Target,Requires,Inspiration,Description,Ground Art\nreed,Reed,material,resources,99,reed,,,,,,Cut from the marsh. The Brewery takes it by the armful.,res://assets/adventure/drops/reed.png\nbog_iron,Bog Iron,material,resources,99,bog_iron,,,,,,\"Heavy, rusted, and worth melting down.\",\nash_glass,Ash Glass,material,resources,99,ash_glass,,,,,,Fused in the burn. Sharp and light.,\ndeep_salt,Deep Salt,material,resources,99,deep_salt,,,,,,Scraped off the walls of the Hollowdeep.,\ncoins,Coins,currency,resources,999,coins,,,,,,What everyone takes.,res://assets/adventure/drops/coins.png\nsmelling_salts,Smelling Salts,kit,items,5,salts,revive,adventure_consume,downed,,,\"Brings one knocked-out player back on, at half stamina.\",\nfield_bandage,Field Bandage,kit,items,9,bandage,heal:6,adventure_consume,ally,,,Six stamina back to one player still standing.,\nteam_orange,Half-Time Orange,kit,items,5,orange,heal:3;all,,ally,,,Three stamina back to everyone still on their feet.,\nthrowing_stone,Throwing Stone,kit,items,9,stone,hit:4,adventure_consume,enemy,,,Four damage straight into whatever you are focusing.,\nrecipe_marsh_ale,Marsh Ale Recipe,recipe,keys,1,scroll,,,,,,Teaches the Brewery to pour Marsh Ale.,\nrecipe_cinder_stout,Cinder Stout Recipe,recipe,keys,1,scroll,,,,,,Teaches the Brewery to pour Cinder Stout.,\nrecipe_hollow_porter,Hollow Porter Recipe,recipe,keys,1,scroll,,,,,,Teaches the Brewery to pour Hollow Porter.,\nmarsh_key,Warden’s Key,key,keys,1,key,,,,,,\"Taken off the Reed Warden. The gate at the end of the marsh knows it. YOUR EXAMPLE OF A KEY - Kind is key, so it lands in the Keys tab (hidden since round AN - Tuning.csv inventory_tabs), it has no Use and it is never spent. Give one out with an On Win or a Drops row\",\nbrew_fire,Bottled Fire Brew,brew,items,9,brew_fire,brew:fire,match_consume,card,,15,\"Ash on the tongue. Used on one player during the draft: they count as a Brandteufel until the final whistle. YOUR EXAMPLE OF A MADE ITEM - the Brewery bottles it (see Buildings.csv), the bag carries it, and Use brew:fire names the row of Brews.csv it pours\",\nbrew_water,Bottled Water Brew,brew,items,9,brew_water,brew:water,match_consume,card,,15,Cold and deep. Used on one player during the draft: they count as a Lorelei until the final whistle. Bottled at the Cold Cellar,\nbrew_keeper,Bottled Keeper's Tonic,brew,items,9,brew_keeper,brew:keeper,match_consume,card,,10,\"Thick and bitter. Anyone may drink it - no class changes, they simply gain a defend ability for the match\",\ndorms_key,Dorms Key,key,keys,1,key,,,,,,\"ROUND AN (Anthony: you buy the keys for the buildings and the machines). Opens the building - Dorms. Bought at the Club House (data/Upgrades.csv, row dorms_key) once an achievement has unlocked Dorms. Never spent.\",\ntrophy_room_key,Trophy Room Key,key,keys,1,key,,,,,,\"ROUND AN (Anthony: you buy the keys for the buildings and the machines). Opens the building - Trophy Room. Bought at the Club House (data/Upgrades.csv, row trophy_room_key) once an achievement has unlocked Trophy Room. Never spent.\",\ntraining_ground_key,Training Ground Key,key,keys,1,key,,,,,,\"ROUND AN (Anthony: you buy the keys for the buildings and the machines). Opens the building - Training Ground. Bought at the Club House (data/Upgrades.csv, row training_ground_key) once an achievement has unlocked Training Ground. Never spent.\",\npub_key,Pub Key,key,keys,1,key,,,,,,\"ROUND AN (Anthony: you buy the keys for the buildings and the machines). Opens the building - Pub. Bought at the Club House (data/Upgrades.csv, row pub_key) once an achievement has unlocked Pub. Never spent.\",\nbrewery_key,Brewery Key,key,keys,1,key,,,,,,\"ROUND AN (Anthony: you buy the keys for the buildings and the machines). Opens the building - Brewery. Bought at the Club House (data/Upgrades.csv, row brewery_key) once an achievement has unlocked Brewery. Never spent.\",\ntavern_key,Traveling Tavern Key,key,keys,1,key,,,,,,\"ROUND AN (Anthony: you buy the keys for the buildings and the machines). Opens the building - Traveling Tavern. Bought at the Club House (data/Upgrades.csv, row tavern_key) once an achievement has unlocked Traveling Tavern. Never spent.\",\nmalthouse_key,Steeping Tank Key,key,keys,1,key,,,,,,\"ROUND AN (Anthony: you buy the keys for the buildings and the machines). Opens the machine in the Brewery - Malthouse. Bought at the Club House (data/Upgrades.csv, row malthouse_key) once an achievement has unlocked Malthouse. Never spent.\",\nmill_key,Grain Mill Key,key,keys,1,key,,,,,,\"ROUND AN (Anthony: you buy the keys for the buildings and the machines). Opens the machine in the Brewery - Mill. Bought at the Club House (data/Upgrades.csv, row mill_key) once an achievement has unlocked Mill. Never spent.\",\nlautering_key,Lauter Tun Key,key,keys,1,key,,,,,,\"ROUND AN (Anthony: you buy the keys for the buildings and the machines). Opens the machine in the Brewery - Lautering. Bought at the Club House (data/Upgrades.csv, row lautering_key) once an achievement has unlocked Lautering. Never spent.\",\nboiling_key,Brew Kettle Key,key,keys,1,key,,,,,,\"ROUND AN (Anthony: you buy the keys for the buildings and the machines). Opens the machine in the Brewery - Boiling. Bought at the Club House (data/Upgrades.csv, row boiling_key) once an achievement has unlocked Boiling. Never spent.\",\ncooling_key,Fermenting Vat Key,key,keys,1,key,,,,,,\"ROUND AN (Anthony: you buy the keys for the buildings and the machines). Opens the machine in the Brewery - Cooling. Bought at the Club House (data/Upgrades.csv, row cooling_key) once an achievement has unlocked Cooling. Never spent.\",\nbottling_key,Bottling Machine Key,key,keys,1,key,,,,,,\"ROUND AN (Anthony: you buy the keys for the buildings and the machines). Opens the machine in the Brewery - Bottling. Bought at the Club House (data/Upgrades.csv, row bottling_key) once an achievement has unlocked Bottling. Never spent.\",\nsmall_bottle,Small Bottle,brew,items,99,brew_keeper,brew:pool:plain,match_consume,card,,10,\"ROUND AN - ONE OF THE BASIC THREE BEERS (Anthony, 8 Oct). Plain beer from your own Brewery: one random ability with a good side when he attacks and a bad side when he defends (Brews.csv rows with Pool plain). Small, so it fills the drunk meter only a little (INSPIRATION 10%). Wears off at the final whistle. The Bottling Machine fills 6 from a barrel (BottleSizes.csv).\",\nlarge_bottle,Large Bottle,brew,items,99,brew_keeper,brew:pool:plain,match_consume,card,,20,\"ROUND AN - basic beer: the same plain beer gamble, more of it (20% of the meter). 3 from a barrel.\",\nkeg,Kleiner Faß,brew,items,99,brew_keeper,brew:pool:keg,match_consume,card,,35,\"ROUND AN - basic beer: a small keg, the same plain beer gamble and 35% of the meter. 1 from a barrel. USE brew:pool:keg: the Brews.csv rows whose Pool includes keg. In the tutorial that is the Kleiner Faß lesson's own row (cycle 2 round 1).\",\nanstoss_helles,Anstoß Helles,brew,items,99,brew_keeper,brew:pool:anstoss_helles,match_consume,card,,10,\"ROUND AN - A COMBO BEER (Anthony, 8 Oct). A small beer with one good side and one bad side: attacking, +1 power to your next player; defending, -1 power. Brews.csv anstoss_helles. The tutorial gives one of each in cycle 2 round 3.\",\ndoppelpass_weisse,Doppelpass Weiße,brew,items,99,brew_keeper,brew:pool:doppelpass_weisse,match_consume,card,,10,\"ROUND AN - A COMBO BEER (Anthony, 8 Oct). A small beer with one good side and one bad side: defending, +1 power to your next player; attacking, -1 power. Brews.csv doppelpass_weisse. The tutorial gives one of each in cycle 2 round 3.\",\nabstauber_dunkel,Abstauber Dunkel,brew,items,99,brew_keeper,brew:pool:abstauber_dunkel,match_consume,card,,10,\"ROUND AN - A COMBO BEER (Anthony, 8 Oct). A small beer with one good side and one bad side: attacking, +1 power; defending, 1 stamina off your own keeper. Brews.csv abstauber_dunkel. The tutorial gives one of each in cycle 2 round 3.\",\n", "MatchModes": "ID,Name,Records Season,Timer,Cycles,Rounds,Star Rotation,Opponent,Squad Per Tier,Scene,Requires,Rewards,Rewards On Win,Description,Replaces,Squad,Enemy Squad\nseason,Season Match,yes,90,3,3,yes,team,3,match,,,,\"The league. Ninety minutes against another side, three Stars rotating at STAR PLAYER SWITCH, and the result goes in the table.\",,,\nfriendly,Friendly,no,90,3,3,yes,scratch,3,match,,count:scrap+2,count:scrap+3;count:friendly_wins+1,\"PLAY A MATCH from the base. Not a fixture - a side put together on the spot at roughly your own level. Opponent = scratch is what does that; see scratch_team.gd and team_level.gd. You still collect, from the two Rewards columns.\",,,\nfriendly_test,Test Match,no,60,2,3,yes,scratch,3,match,,count:scrap+1,count:scrap+2;count:friendly_wins+1,\"ROUND AN - THE MATCH MAKER's Test Match (data/MatchMaker.csv; Anthony: matches are counted in cycles). Two Play Maker cycles, 30 minutes on the clock for each (60), so one Star swap at STAR PLAYER SWITCH. The Play Makers fit the shorter clock by themselves (main_scene.gd). Pays a little less than a Normal Match.\",,,\nfriendly_cycle,Quick Match,no,30,1,3,no,scratch,3,match,,count:scrap+1,count:scrap+1;count:friendly_wins+1,\"ROUND AN - THE MATCH MAKER's Quick Match (data/MatchMaker.csv). One Play Maker cycle: three rounds, one Star, 30 minutes on the clock. Not the old `quick` row above, which has no clock and is not on the Match Maker.\",,,\nquick,Quick Match,no,0,1,3,no,scratch,3,match,,count:scrap+1,count:scrap+2,\"A short one. No clock, one Star, a scratch opponent, nothing written to the season table.\",,,\ncup,Cup Tie,no,90,3,3,yes,team,3,match,unlocked:The Cup,,count:cup_wins+1,A full match that does not count towards the league. Unlocked with The Cup.,,,\nadventure,Adventure,no,0,1,4,no,biome,1,adventure,,,,\"A run into a biome. No clock, one Star, four tiers per encounter, and nothing is banked until you carry it home.\",,,\nintro,First Match,no,90,3,3,yes,squad,3,match,flag:tutorial_match,,,\"ROUND AN - YOUR FIRST MATCH. Plays while flag:tutorial_match is set (Progression.csv sets it on a new game and clears it at the final whistle). REPLACES: pressing Play a match (friendly) or starting a season, quick match or cup tie plays THIS instead. SQUAD: your side is data/IntroSquad.csv - Koch and eleven plain players with random names, no Stars, nobody has to be owned. Star Rotation yes swaps the other two of Koch's Tier in at the STAR PLAYER SWITCH. The prologue starts it on its own (Progression.csv kick_off_first_match, Do match:intro). ENEMY SQUAD (your note): the opposition is a squad CSV too - all plain players, no Stars, no brew. Opponent squad = take the side from that column.\",friendly;season;quick;cup,IntroSquad.csv,EnemyIntroSquad.csv\nintro2,Second Match,no,90,3,3,yes,squad,3,match,flag:tutorial_match_2,,,\"ROUND AN - YOUR SECOND MATCH, straight after the star-intro scene: the same first team (IntroSquad2.csv: same IDs as IntroSquad.csv = same players), Koch, and the three Bergmännlein Stars. Plays while flag:tutorial_match_2 is set (Progression.csv). Replaces the same buttons as intro. ENEMY SQUAD (your note): the opposition is a squad CSV too - plain players and three plain Stars that only give +1 to the next normal, non-elemental player. Opponent squad = take the side from that column.\",friendly;season;quick;cup,IntroSquad2.csv,EnemyIntroSquad2.csv\nintro_adventure,First Adventure,no,0,1,4,no,biome,1,adventure,flag:intro_adventure;count:adventures_home<1,,,\"ROUND AN - YOUR FIRST ADVENTURE (your note). While the Head Coach is sending you on your first run, the only team is your first team: data/IntroSquad2.csv (the same players as the second match, Koch and the three Bergmännlein Stars). No team to pick - pick a biome and a bounty on the board and you are off. Ends after one run carried home (count:adventures_home).\",adventure,IntroSquad2.csv,\ntutorial,Tutorial Match,no,90,3,3,yes,squad,3,match,,,,\"ROUND AN - THE TUTORIAL MATCH (Anthony, 7 Oct). Started by the Tutorial (the main menu button, or YES on a new save) straight after Pub Dialogue 1 - see tutorial.gd and Tuning.csv tutorial_first_scene / tutorial_match_mode. The Head Coach stops it again and again: every stop is a MatchTalk.csv row with Mode = tutorial. SQUAD: data/TutorialSquad.csv (Koch, a plain player and the Star, at Tier IV, and eleven plain players). FOUR CYCLES (8 Oct): Koch stays on as the Star for cycles 1-3 (TIME OUTs after 1 and 2, Do keep_star) and is swapped out at the switch after cycle 3. ENEMY SQUAD: all plain players. At full time the tutorial ends: the base (locked, Tuning.csv starting_team) or, from the main menu, the title screen. Nothing is written to the season table.\",,TutorialSquad.csv,EnemyIntroSquad.csv\ntutorial_adventure,The Brewer's Errand,no,0,1,4,no,biome,1,adventure,flag:tut_morning;count:adventures_played<1,,,\"ROUND AN - THE TUTORIAL'S FIRST ADVENTURE (\"\"the morning after\"\", Anthony 8 Oct). While the morning is on, any Adventure plays as this: your party is data/TutorialAdventureSquad.csv, four Adventure Players, one per Tier. Koch stops the run at its firsts: the MatchTalk.csv rows with Mode tutorial_adventure (adventure_talk.gd). count:adventures_played goes up when any run ends (home, fled or fallen), which ends it.\",adventure,TutorialAdventureSquad.csv,\n", "Progression": "ID,When,Requires,Do,Once,Notes\nwelcome_at_base,base_opened,flag:old_introduction,story:prologue,true,\"RETIRED ROUND AN (Anthony, 7 Oct: the introduction is now the Tutorial - see tutorial.gd, MatchTalk.csv). flag:old_introduction is never set, so this row never fires; delete that word to bring it back. Plays the prologue the FIRST time you open the base, not when the game launches. Delete this row if you want no story at all.\"\nfirst_win,match_ended,count:matches_won>=1,flag:first_win;announce:First win!,true,Sets a flag other content can test with  flag:first_win\nunlock_brewery,match_ended,count:goals_with_brew_fire>=3,unlock:Brewery;announce:The Brewery is open,true,YOUR EXAMPLE: score three times with fire-brewed players and the Brewery unlocks.\nunlock_pub,match_ended,unlocked:Brewery;count:matches_played>=5,unlock:Pub;announce:The Pub is open,true,Needs the Brewery first AND five matches. Chains one unlock off another.\nunlock_talents,match_ended,count:matches_played>=5,unlock:Talent Tree;announce:Talents unlocked,true,\"The talent tree is itself a building, unlocked later on\"\nveteran_badge,match_ended,count:matches_played>=10,flag:veteran,true,An achievement is just a flag. Nothing else needed.\ntalent_point,match_ended,unlocked:Talent Tree,count:talent_points+1,,One talent point after every match once the Training Ground is open. Delete this row and nothing earns points.\nseason_opening,match_started,count:season_match<=1,announce:Matchday 1. Eleven to go.,,Fires as the first fixture of a season kicks off. season_match is kept by Season.csv.\nfinal_day,match_started,count:season_match>=11,announce:THE FINAL,,Fires at kick-off of the last fixture.\nchampions,match_ended,flag:season_champion,announce:Champions. The season is yours.,true,season_champion is set by the season when you win the final. An achievement is still just a flag.\nsign_your_first_three,new_game,flag:old_introduction,sign:Hoffmann;sign:Schäfer;sign:Koch;flag:tutorial_match,true,\"RETIRED ROUND AN (Anthony, 7 Oct: the introduction is now the Tutorial - see tutorial.gd, MatchTalk.csv). flag:old_introduction is never set, so this row never fires; delete that word to bring it back. THE THREE YOU START WITH. Runs once, the first time a save is made. sign: adds a card to your squad by NAME - see squad_book.gd. NOTHING READS THE SQUAD until squad_ownership in Tuning.csv is TRUE, so this row is harmless today and becomes the opening of the game the day you turn that row on. flag:tutorial_match is what makes the first match the scripted one - see EnemyPlay.csv\"\nkick_off_first_match,base_opened,flag:old_introduction;flag:prologue_done;flag:tutorial_match,match:intro,true,\"RETIRED ROUND AN (Anthony, 7 Oct: the introduction is now the Tutorial - see tutorial.gd, MatchTalk.csv). flag:old_introduction is never set, so this row never fires; delete that word to bring it back. ROUND AN (your note). The prologue ends with Auf the Field! and comes back to the base: this row walks you straight onto the pitch for your first match. match:intro starts the intro row of MatchModes.csv, whose side is data/IntroSquad.csv. Once only - if you leave that match early, Play a match still gives you the same first match until it is played.\"\nsecond_match_is_over,match_ended,flag:old_introduction;flag:tutorial_match_2,flag:tutorial_match_2=false,true,\"RETIRED ROUND AN (Anthony, 7 Oct: the introduction is now the Tutorial - see tutorial.gd, MatchTalk.csv). flag:old_introduction is never set, so this row never fires; delete that word to bring it back. ROUND AN. The second intro match is done; from here Play a match is an ordinary friendly with your own team. It sits ABOVE first_match_is_over on purpose: rows run top to bottom, and below it would clear the flag the moment the first match set it. Put the next scene here (story:...) when it is written.\"\nfirst_match_is_over,match_ended,flag:old_introduction;flag:tutorial_match,flag:tutorial_match=false;flag:tutorial_match_2;story:star-intro,true,\"RETIRED ROUND AN (Anthony, 7 Oct: the introduction is now the Tutorial - see tutorial.gd, MatchTalk.csv). flag:old_introduction is never set, so this row never fires; delete that word to bring it back. ROUND AN (your note): after the first match you are sent back to the bar and meet the three Bergmännlein Stars - the star-intro scene in Dialogue.csv. The story comes back to the base, and flag:tutorial_match_2 sends you on to the second match (kick_off_second_match). The old after_first_match scene is still in Dialogue.csv, unused. The scripted match is done: clear the flag so the opposition goes back to its ordinary rules, and play the scene where you are taken to the base. Write that scene in Dialogue.csv - the row below is a skeleton\"\nkick_off_second_match,base_opened,flag:old_introduction;flag:tutorial_match_2,match:intro2,true,\"RETIRED ROUND AN (Anthony, 7 Oct: the introduction is now the Tutorial - see tutorial.gd, MatchTalk.csv). flag:old_introduction is never set, so this row never fires; delete that word to bring it back. ROUND AN (your note). star-intro ends with Another game! and comes back to the base: this row walks you straight into the second match - your first team, Koch and the three Bergmännlein Stars (MatchModes.csv intro2, data/IntroSquad2.csv).\"\nlearn_to_brew,match_ended,!flag:tutorial_match;!flag:tutorial_match_2;count:matches_played>=2,unlock:Brewery;unlock:Malthouse;flag:brewery_tour;announce:The Brewery is open;story:brewery-intro,true,\"ROUND AN (your note): also opens the Malthouse, so the first brew button works, and sets flag:brewery_tour, which opens the Brewery window when the scene comes back to the base (open_the_brewery). ROUND AN: plays the Brewer's scene (Dialogue.csv brewery-intro, in the brewery) as the Brewery opens; it comes back to the base. ROUND AN FIX: this never fired. Requires said flag:tutorial_match=false, which the condition language reads as a flag literally called 'tutorial_match=false' (write !flag:x for NOT), and When said story_ended, a moment nothing in the game reports. Now: at the final whistle of the SECOND intro match (both intro flags gone, two matches played) the Brewery opens. It sits below second_match_is_over on purpose, so that row clears the flag first. AND THE STORY MOVES ON. You have seen them pour a brew on a card, so now you may build the place that makes them. From here it is the ordinary chain: you need players, ingredients and money before the next thing opens\"\nopen_the_brewery,base_opened,flag:brewery_tour,window:brewery,true,\"ROUND AN (your note). After the Brewer's scene you are back at the base and the Brewery window opens by itself. What the Head Coach says in there, and which button lights up, is data/Guide.csv.\"\nmeet_the_merchant,base_opened,flag:intro_adventure;count:adventures_home>=1,unlock:Traveling Tavern;flag:met_merchant;window:brewer,true,ROUND AN (your note). Home from your first Adventure: the Traveling Merchant's wagon is open and his shop opens by itself. count:adventures_home goes up by one every time a run is carried home. His intro lines are data/Guide.csv shop_intro.\nharvest,match_ended,unlocked:Brewery,count:res_wheat+3;count:res_water+6;count:res_germs+3,,\"WHERE RAW MATERIALS COME FROM. A fixture pays the Brewery. The three numbers are BALANCED AGAINST EACH OTHER, not picked: a malt costs one wheat and one germ, so three of each is three malt a fixture and neither piles up uselessly. Water is doubled because three different sections want it. tools/brewery_check.gd plays ten fixtures through these exact rows and prints what is left over - if something is piling up, this row is why.\"\nharvest_win,match_ended,unlocked:Brewery;flag:won_last_match,count:res_hops+2;count:res_yeast+1,,\"AND WINNING PAYS BETTER. Hops and yeast are the two the chain runs out of last, so this is the row that makes a good season taste different. flag:won_last_match is set by the match.\"\n", "Season": "ID,Season,Match,Opponent,Team,Class,Difficulty,Final,Requires,On Win,On Loss,Story,Description,Notes\nmd01,county_league,1,Reedbank Wanderers,reedbank,Lorelei,0,,,,,season_opening,A gentle opening. Nobody expects much of you yet.,\"A DIALOGUE BEFORE A FIXTURE. Story names a Dialogue.csv scene and it plays on the way to the team sheet, before you pick anybody - which is the only moment a scene can change your mind about who to field. Leave it blank and the fixture goes straight there. A fixture's Story plays every time it is played; use flag:x in the scene if it should only happen once.\"\nmd02,county_league,2,Cinderworks Colts,cinderworks,Brandteufel,0,,,,,,The furnace apprentices. All pace and no patience.,\nmd03,county_league,3,Mistmarsh Athletic,mistmarsh,Lorelei,1,,,,,,\"They sing you to sleep, then score.\",Difficulty 1 gives every one of their cards +1 attack and +1 defence.\nmd04,county_league,4,Emberfall United,emberfall,Brandteufel,1,,,count:coins+25,,,Fourth of eleven. The table starts to matter.,\"On Win runs the same words as Progression.csv - unlock:x, count:x+n, flag:x, announce:Text\"\nmd05,county_league,5,Silverbeck Rovers,silverbeck,Lorelei,1,,,,,,Halfway. They have not lost at home in two years.,\nmd06,county_league,6,Ashford Ironworks,ashford,Brandteufel,2,,,,,,\"Big, slow, and very hard to move.\",\nmd07,county_league,7,Nixenhafen Harbour,nixenhafen,Lorelei,2,,,,,,The harbour side. They play the whole match in your half.,\nmd08,county_league,8,Glutstadt Rangers,glutstadt,Brandteufel,2,,,,,,Four straight wins behind them.,\nmd09,county_league,9,Wellenberg Academy,wellenberg,Lorelei,2,,,,,,Young and quick and completely fearless.,\nmd10,county_league,10,Hollowforge City,hollowforge,Brandteufel,3,,,announce:Into the final.,,,The last league game. Win it and you go in confident.,Difficulty 3 is as high as you should go - cards are 0-5 power.\nfinal,county_league,11,The Kesselgrund Cup Final,kesselgrund,,3,true,,unlock:The Cup;announce:The cup is yours.,announce:So close. There is always next season.,,One match. Everything on it.,\"Final=true ends the season. Class is BLANK here, so the opponent is a surprise.\"\nmd12,county_league,12,Tap Room XI,tap_room_xi,Lorelei,3,true,unlocked:Marsh King,unlock:The Cup;count:coins+250,,,The season decider. Only reachable once you have beaten the Marsh King in Adventure.,WORKED EXAMPLE - THE SEASON READS ADVENTURE. Requires gates a fixture the same way it gates anything else.\n", "Seasons": "ID,Name,Art,Colour,Requires,Row,Column,After,Matches,Story,Description,Notes\ncounty_league,The County League,season_county,#5aa0c8,,0,1,,,season_opening,Eleven fixtures and a final. Where everybody starts.,ROW and COLUMN are where the tile sits on the shelf - this is the talent-tree part. Leave Requires blank and it is always open\nwinter_cup,The Winter Cup,season_winter,#8fb8d8,unlocked:The Cup,1,0,county_league,6,,\"Short, cold and knockout. Lose once and it is over.\",AFTER draws the joining line back to the county league. REQUIRES is what actually locks it\ncoast_division,The Coast Division,season_coast,#5ec48f,count:season_wins>=6,1,2,county_league,11,,\"Up the coast, where the pitches are hard and the crowds are worse.\",\ninland_shield,The Inland Shield,season_inland,#c8a24a,count:season_wins>=12,2,1,coast_division,11,,\"The middle of the country. Older clubs, longer memories.\",\nthe_crown,The Crown,season_crown,#c86a8a,unlocked:The Crown,3,1,inland_shield,14,,What all of it was for.,The last tile. Add as many rows as you like below this one - the shelf grows to fit\n", "Shop": "ID,Name,Sells,How Many,Price,Currency,Stock,Requires,Art,Notes\nhops_sack,A sack of hops,res:hops,6,45,coins,3,unlocked:Traveling Tavern,shop_hops.png,\"HE IS THE PRESSURE VALVE, and this is the row that proves it. tools/brewery_check.gd measures hops as the thing the Brewery runs out of - they only arrive when you WIN - so the Brewer sells them, dear. `Sells` is res:<id> for a Brewery material or brew:<id> for a recipe.\"\nyeast_jar,A jar of live yeast,res:yeast,4,50,coins,2,unlocked:Traveling Tavern,shop_yeast.png,The other thing the cellar runs dry of.\ngerm_tray,A tray of germs,res:germs,5,35,coins,3,unlocked:Traveling Tavern,shop_germs.png,The top of the chain. Cheapest of the three because it is the one you get most of from a fixture.\nspare_hammer,A spare hammer,res:hammer,1,120,coins,1,unlocked:Mill,shop_hammer.png,\"A TOOL, SO IT IS KEPT. You need one to work the Mill and you never need a second - which makes this row the one to look at if you ever lose one. Stock 1: he has exactly one.\"\nfire_recipe,The fire recipe,brew:fire,1,150,coins,1,unlocked:Brewery,shop_fire.png,\"SELLING A RECIPE rather than a material. brew:<id> unlocks that row of Brews.csv by name, exactly as a talent or an achievement would - the Pub can pour it from then on. Premium, because a talent point would have bought it for nothing.\"\nwater_recipe,The water recipe,brew:water,1,180,coins,1,unlocked:Brewery,shop_water.png,The same again for the cold side.\nmarsh_hops,Marsh-grown hops,res:hops,10,40,marks,2,unlocked:Traveling Tavern,shop_hops.png,\"PRICED IN MARKS, so only quick matches buy it - and it is the best hops deal in the game. That is what a second currency is FOR: it makes a mode worth playing rather than just available.\"\niron_boots,A pair of iron-shod boots,unlock:Iron Boots,1,260,coins,1,unlocked:Brewery,shop_boots.png,\"THE FORGE MOVED HERE. The base used to have four one-click recipe buildings - the Forge, the Still, the Reed Press and the Cold Cellar - and they were worked examples rather than rooms you asked for. The recipe pattern is not lost: a Buildings.csv row with a Requires that is a price check and an Action that is the trade still works exactly as it did, and the Notes on the old rows are quoted in the Designer Manual. This is where Iron Boots comes from now, so the Iron Shod talent still has a door.\"\ntrade_fire_brew,A bottle of Fire Brew,count:brew_fire+1,1,3,reed,3,unlocked:Traveling Tavern,brew_fire,\"ROUND AN (your note): the Traveling Merchant TRADES BEER for what you carried home. Sells count:brew_fire+1 = one Bottled Fire Brew (Items.csv) into your bag, used on a player in the draft. Price 3 Reed.\"\ntrade_water_brew,A bottle of Water Brew,count:brew_water+1,1,2,bog_iron,3,unlocked:Traveling Tavern,brew_water,ROUND AN. One Bottled Water Brew for 2 Bog Iron.\n", "Stadium": "Layer,Image,Width,Height,Offset X,Offset Y,Parallax,Tint,Requires,Notes\nbackground,stadium_back,2560,1440,0,0,0,,,\"ROUND AN - THE VILLAGE GROUND (Anthony, 6 Oct): the town, the church, the farm, the beer tent, the clubhouse, trees and a few locals round the pitch. Built from data/VillageGround.csv by tools/make_village.py out of PixelLab parts in art_source/pixellab/village/; every part is its own layer in art_source/aseprite/stadium.aseprite. SAME SIZE AS THE PITCH (2560 x 1440) AND PARALLAX 0, so the houses stay put next to the grass when the camera moves. The wide shot shows all of it (camera_wide_ground in Tuning.csv). The round AN top-down stadium it replaced is in art_source/legacy/field/. Leave Image blank for no background\"\npitch,soccerfield,2560,1440,0,0,0,,,\"THE PLAYING SURFACE, made by tools/make_pitch.py: PixelLab grass, the lines drawn by ruler. ROUND AN: THE WHITE LINES ARE THE EDGE OF THE PLAYER ZONES - at 2560 x 1440 they run x 436-2124 and y 288-1152. That is the first camera view (1920 x 1080, centred) pulled in by pitch_inset_x and pitch_inset_y in Tuning.csv. Change either row and run make_pitch.py again so the lines follow. Only a strip of run-off grass goes round the lines; the rest of the picture is see-through so the village shows. Draw it 2560 x 1440 (16:9). The old pitch is in art_source/legacy/field/\"\nlights,,3840,2160,0,0,0.1,#ffe9b0,unlocked:Floodlights,\"AN OVERLAY ON TOP OF EVERYTHING, for the Stadium screen to unlock later. Tint is multiplied over the layer, so a warm colour here is floodlights and a cold one is a night game. Requires works the same way it does everywhere else - blank means always on, and a row whose Requires fails is simply not drawn. No Image means this row does nothing yet\"\ncrowd,stadium_crowd,2560,1440,0,0,0,,unlocked:Full House,\"ROUND AN - THE FULL HOUSE FANS: packed terraces along both touchlines (PixelLab, art_source/pixellab/village/fans.png, rows with Layer crowd in data/VillageGround.csv). Shown once Full House is unlocked. Drawn between the village and the grass. Same size as the pitch, parallax 0\"\n", "Stats": "Counter,Event,When,Amount,Group,Label,Notes\ngoals,goal_scored,,,Goals,Goals scored,Every goal you score\ngoals_by_{card},goal_scored,,,Goals,,\"WHO SCORED. One row, one counter per card name, so the post-match screen can list your scorers.\"\ngoals_as_{class},goal_scored,,,Goals,,\"Split by which class you were playing. One row, a counter per class.\"\ngoals_by_tier_{tier},goal_scored,,,Goals,,Split by the Tier of whoever scored\ngoals_with_brew_{brew},goal_scored,,,Goals,,Goals by a player who had drunk a brew. THIS is what the Brewery requirement tests.\ngoals_by_star,goal_scored,star=yes,,Goals,Goals by a Star,Goals scored by a Star Player\nshots,shot_taken,,,Goals,Shots taken,Every shot you had at their goal\nshots_by_tier_{tier},shot_taken,,,Goals,,Which tiers actually get a shot away\nduels_won,duel_won,,,Duels,Duels won,\nduels_lost,duel_lost,,,Duels,Duels lost,\nduels_won_by_{card},duel_won,,,Duels,,WHO WINS THEIR FIGHTS. One counter per card name.\nduels_won_tier_{tier},duel_won,,,Duels,,Which tiers you actually win\nduels_won_with_brew_{brew},duel_won,,,Duels,,\ngoals_conceded,goal_conceded,,,Keeper,Goals conceded,\nsaves,save_made,,,Keeper,Saves,Your keeper stopped a shot. Only YOUR keeper is ever counted.\nsaves_by_{card},save_made,,,Keeper,,\"One counter per keeper. \"\"The fire keeper has blocked 40 times\"\" is this row.\"\nsaves_as_{class},save_made,,,Keeper,,Saves split by the class you were playing\nkeeper_stamina_spent,save_made,,{stamina},Keeper,Keeper stamina spent,\"AMOUNT IS A {fact}: it adds however much stamina that save actually cost, not 1.\"\nbig_saves,save_made,power>=4,,Keeper,Big saves,A save against a shot of 4 power or more\nmatches_played,match_ended,,,Match,Matches played,\nmatches_won,match_ended,result=win,,Match,Wins,\nmatches_lost,match_ended,result=loss,,Match,Losses,\nmatches_drawn,match_ended,result=draw,,Match,Draws,\nmatches_won_as_{class},match_ended,result=win,,Match,,Wins split by class\nbig_wins,match_ended,margin>=3,,Match,Wins by three or more,Won by three goals or more\nclean_sheets,match_ended,conceded=0,,Match,Clean sheets,Finished a match without conceding\nbrews_drunk,brew_drunk,,,Brews,Brews drunk,\nbrews_drunk_{brew},brew_drunk,,,Brews,,\ngoals_with_brew_fire,goal_scored,brew=fire,1,Brews,Goals with a Fire Brew,\"Feeds the Brewery unlock in Progression.csv. The match reports `brew` on every goal, so this needs no code.\"\nmatches_played,match_ended,,1,Match,Matches played,\"Feeds the Pub unlock. Every match, league or otherwise.\"\nkeeper_emptied,keeper_emptied,,,Goals,Keepers broken,\"EVERY TIME YOU EMPTY AN OPPOSING KEEPER'S STAMINA. Reported by the match the moment their bar reaches zero - which is also the moment the next shot becomes a certainty, so it is worth counting\"\nbrews_poured,brew_drunk,,,Match,Brews poured,\"Every brew poured on a player at the Pub. brew_drunk is the event BrewDB already reports - no new event was needed, which is the right answer whenever one already exists\"\nfouls_given,foul_given,,,Match,Fouls given away,\"EVERY FOUL YOUR SIDE CONCEDES. The foul chance is set by how many triggers you fired in the round, so this number is really a measure of how hard you played\"\nfree_kicks_won,free_kick_won,,,Match,Free kicks won,\"ROUND AG (P2). Every free kick YOUR side was given (data/FreeKicks.csv)\"\nfree_kicks_won_{range},free_kick_won,,,Match,,\"ROUND AG (P2). One counter per Range of data/FreeKicks.csv: free_kicks_won_close, _edge, _far\"\nyellow_cards,card_yellow,,,Match,Yellow cards,Bookings against your side\nred_cards,card_red,,,Match,Red cards,Sendings-off against your side. Each one costs you a man for the rest of the match and leaves a hole in a tier that a survivor has to cover\nduels_won_as_{class},duel_won,,,Duels,,\"ONE COUNTER PER CLASS. duels_won_as_Lorelei, duels_won_as_Rauhnacht-Feuergeister, and so on - the game makes them as it meets them. Written for the emblems: the Belphegor emblem turns over at count:duels_won_as_Rauhnacht-Feuergeister>=4, which is your card text made testable.\"\nlorelei_tier_i_traded,token_made,kind=rose;class=Lorelei;tier=I,,Emblems,Lorelei Tier I traded,\"GREMORY'S CONDITION. Wired in round Z: every Rose Unit token that replaces a Lorelei Tier I unit. Event token_made has the facts kind, class, tier, card (the card it REPLACED) and by.\"\nlorelei_swans_made,swan_made,class=Lorelei,,Emblems,Lorelei turned into Swans,ZEPAR'S CONDITION. Wired in round Z: every Lorelei turned into a Swan (Zepar's Emblem does it on reveal).\nlorelei_songs_marked,counter_placed,kind=song;class=Lorelei,,Emblems,Enemies marked with Song,\"SALLOS'S CONDITION. Wired in round Z: every Song counter a Lorelei puts on an enemy. Event counter_placed has kind, class (who placed it), on, on_class.\"\nrauhnacht_fusions,fused,class=Rauhnacht-Feuergeister,,Emblems,Rauhnacht fusions,\"FLAUROS'S CONDITION ('four Rauhnacht-Feuergeister units have fused'). Wired in round AD (C6): every fusion with a bench card. Event fused has the facts class, tier, card and with (the bench card).\"\nrauhnacht_units_active,card_played,class=Rauhnacht-Feuergeister;first=yes,,Emblems,Rauhnacht units fielded,\"BUER'S CONDITION, wired in round AA: 'Eight Rauhnacht-Feuergeister have been active at some point' = eight DIFFERENT Rauhnacht cards have played a duel this match. card_played has the facts class, tier, card and first (yes the first time that card plays).\"\nbergmann_mines_worked,mine_worked,class=Bergmännlein,,Emblems,Mines worked,\"BELIAL'S CONDITION ('four Bergmännlein have collected Ore Counters during a PLAY MAKER'). Wired in round AD (C6): once per PLAY MAKER at which your mines were worked, and once per Tobias 'choose 1 mine'. Event mine_worked has amount (how many mines).\"\nbergmann_tier_iv_ore,ore_gained,class=Bergmännlein;tier=IV,,Emblems,Tier IV Bergmännlein ore,\"HAURES'S CONDITION, wired in round AA: 'If your Tier IV Bergmännlein have collected 4 Ore Counters' = every time a Tier IV Bergmännlein gains Ore. (It was bergmann_goalie_saves on the 'every duel won' placeholder - which turned Haures over in a test match by accident.)\"\nunken_in_exhaust,exhaust_peak,class=Unkengeister,{amount},Emblems,Unkengeister in exhaust,VASSAGO'S CONDITION ('4 Unkengeister in the exhaust zone at once'). Wired in round AE (C7): the most Unkengeister ever in your exhaust at once - event exhaust_peak reports each new high (amount = how much it went up).\nunken_cold_touches,cold_touch,class=Unkengeister,,Emblems,Cold touches,GLASYA-LABOLAS'S CONDITION ('four Unkengeister have used cold touch'). Wired in round AD (C6): every cold touch an Unkengeister card puts on the ball.\nunken_gravestones,gravestone,class=Unkengeister,,Emblems,Gravestones raised,CAIM'S CONDITION ('four Unkengeister have summoned gravestones'). Wired in round AD (C6): every gravestone an Unkengeister card summons.\nplayers_turned,player_turned,,,Brews,Players turned,\"ROUND X. A plain player who had his third beer and became a class. Fired once, when you choose which card he becomes.\"\nplayers_turned_{class},player_turned,,,Brews,,One counter per class: players_turned_lorelei and so on. Good for an achievement - turn five into Lorelei.\nplayers_recruited,player_recruited,,,Squad,Players recruited,\"ROUND X. Every recruit:I0 that signed somebody. Counted even while named_recruits is off, because the save remembers him either way.\"\nrauhnacht_victories,counter_placed,kind=victory;class=Rauhnacht-Feuergeister,,Emblems,Belphegor victory counters,\"BELPHEGOR'S CONDITION (round Z - it was count:duels_won_as_Rauhnacht-Feuergeister, which ignored the 'only two per cycle'). Every victory counter a Rauhnacht-Feuergeister puts on the Emblem.\"\nbergmann_ore_collected,ore_gained,class=Bergmännlein,,Emblems,Bergmännlein ore collections,\"VALEFOR'S CONDITION (round Z, was bergmann_ore_spent - your text says COLLECTED). One per time a Bergmännlein gains Ore, however much.\"\nore_collected,ore_gained,,{amount},Abilities,Ore collected,ROUND Z. All the Ore your side gained.\nore_spent_total,ore_spent,,{amount},Abilities,Ore spent,ROUND Z. All the Ore your side paid for abilities.\ntokens_made,token_made,,,Abilities,Tokens made,ROUND Z. Rose / Swan Unit tokens.\nswans_made,swan_made,,,Abilities,Swans made,ROUND Z.\ncounters_placed_{kind},counter_placed,,,Abilities,Counters placed,\"ROUND Z. One counter per kind: counters_placed_burn, counters_placed_song...\"\n", "Talents": "ID,Name,Tree,Tier,Parent,Requires,Cost,Effects,Description,Art,Notes\nhigh_press,High Press,Tactics,1,,,1,count:tune_press_speed+12,Your players charge the ball carrier faster.,,tune_press_speed adds 12 to the press_speed row of Tuning.csv. Any Tuning row works this way.\nswarm,Swarm,Tactics,2,high_press,,1,count:tune_press_helpers+1,One more player comes across from another quarter to help press.,,\nwide_play,Wide Play,Tactics,2,high_press,,1,count:tune_open_spread+40,Your players break further off their markers to show for a pass.,,\nrelentless,Relentless,Tactics,3,swarm,count:matches_won>=3,2,count:tune_unit_chase_speed+10,Everyone runs at a loose ball harder.,,Needs a Parent AND three wins. Both must be true.\nbrewing_basics,Brewing Basics,Brewing,1,,,1,unlock:Fire Brew,The Pub can pour a Fire Brew.,,Unlocks a brew by name. Brews.csv in step 4 will read this.\nwater_craft,Water Craft,Brewing,2,brewing_basics,,1,unlock:Water Brew,The Pub can pour a Water Brew.,,\nsteady_pour,Steady Pour,Brewing,2,brewing_basics,,1,count:tune_mark_distance+10,Your defenders stand off a little and read the play instead of diving in.,,\nmaster_brewer,Master Brewer,Brewing,3,water_craft,count:brews_drunk>=5,2,unlock:Permanent Brews,\"A brew can be made permanent, and removed again later.\",,Needs five brews drunk. brews_drunk is filled by Stats.csv already.\nmarsh_legs,Marsh Legs,Tactics,2,high_press,count:cleared_marshlands>=1,1,count:tune_adventure_stamina_base+2,Every player starts an Adventure run with 2 more stamina.,,WORKED EXAMPLE - A TALENT THAT READS ADVENTURE. cleared_marshlands is written by beating the Marsh King. tune_ in front of any Tuning.csv key edits that number.\niron_shod,Iron Shod,Tactics,3,marsh_legs,unlocked:Iron Boots,2,count:tune_adventure_damage_minimum+1,\"Every won tier takes at least 2 off, not 1.\",,Gated on the Forge recipe above - so the chain is: Adventure -> bog iron -> the Forge -> this talent.\ndeep_pockets,Deep Pockets,Trade,1,,count:coins>=200,1,count:tune_adventure_flee_keep+0,Fleeing costs you nothing you were not going to lose anyway.,,\"Costs coins to TAKE rather than to unlock - Cost 1 is the talent point, Requires is the money.\"\nhop_garden,Hop Garden,Brewing,2,brewing_basics,,1,count:res_hops+6;count:res_germs+4,Six hops and four germs go into the store.,,\"RESOURCES ARE A TALENT AND ALWAYS WERE. res_<id> is where the Brewery keeps a material - see brewery_book.gd - so count:res_hops+6 is the whole of what a resource node is. No new column, no new code.\"\ngood_water,Good Water,Brewing,3,hop_garden,,1,count:res_water+20,Twenty water. The Malthouse and the Mill both want it.,,Water is the one thing three sections ask for. This is the node that stops you running dry.\nset_depth,Depth of Squad,Tactics,2,high_press,,1,count:class_set_limit+1,One more card from any single emblem set may be in a team.,,\"UNIT-TYPE LIMITS. class_set_limit is the Tuning.csv row, so this talent raises the cap for every set at once. Use count:limit_lorelei_sitri+1 instead to raise it for ONE set.\"\nmarsh_map,The Marsh Map,Trade,1,,count:matches_played>=3,1,unlock:Marshlands,The Marshlands appear on the bounty board.,,\"ADVENTURE MAPS ARE A TALENT. A Biomes.csv row tests Requires like everything else, so unlock:<biome> is the whole of a map node.\"\nstar_scout,Star Scout,Trade,2,marsh_map,,2,count:talent_points+1,Gives the point back. Go and spend it in the Star Hall.,,\"A SIGNPOST NODE. It costs 2 and returns 1, so it is a real price for being told where to go. The Star Hall is the class tree - the Stars and the Emblems live there, not here.\"\n", "Teams": "ID,Name,Class,Cards,Power,Requires,Keeper,Play Style,Description,Notes\nreedbank,Reedbank Wanderers,Lorelei,Silver-Rhine Lorelei|Rose Water Lorelei|Lorelei of the Deep River|Twilight Lorelei of the Rocks,1,,,,A gentle opening. Nobody expects much of you yet.,\"The four cards it fields, one per tier, separated by a pipe. Power is what you INTEND it to be; the startup report tells you if the cards disagree by 2 or more.\"\ncinderworks,Cinderworks Colts,Brandteufel,Smokestorm Brandteufel|Cinderworks Brandteufel|Heatwave Brandteufel|Blacksmoke Brandteufel,1,,,,The furnace apprentices. All pace and no patience.,\nmistmarsh,Mistmarsh Athletic,Lorelei,Moonlit River Lorelei|Mist-Born Lorelei|Whispering Rhine Lorelei|Golden River Lorelei,2,,,,\"They sing you to sleep, then score.\",The middle card of each tier - a genuinely even fight.\nemberfall,Emberfall United,Brandteufel,Furnacebreak Brandteufel|Ironflare Brandteufel|Coalblaze Brandteufel|Hexflame Brandteufel,2,,,,Fourth of eleven. The table starts to matter.,\nsilverbeck,Silverbeck Rovers,Lorelei,Echo of the Cliff Lorelei|Sapphire Current Lorelei|Songbound Shore Lorelei|Heart-Luring Wave Lorelei,3,,,,They have not lost at home in two years.,The strongest of each tier.\nashford,Ashford Ironworks,Brandteufel,Boilerblast Brandteufel|Foundryburn Brandteufel|Fireline Brandteufel|Sigilburn Brandteufel,3,,,,\"Big, slow, and very hard to move.\",\nnixenhafen,Nixenhafen Harbour,Lorelei,,4,,,,The harbour side. They play the whole match in your half.,\"BLANK Cards = any cards of that class, which is what the game did before Teams.csv existed. Still perfectly valid.\"\nglutstadt,Glutstadt Rangers,Brandteufel,,4,,,,Four straight wins behind them.,\nwellenberg,Wellenberg Academy,Lorelei,,4,,,,Young and quick and completely fearless.,\nhollowforge,Hollowforge City,Brandteufel,,5,,,,The last league game. Win it and you go in confident.,\nkesselgrund,The Kesselgrund Cup Final,,,5,,,,One match. Everything on it.,\"Class BLANK as well, so the final is a surprise.\"\ntap_room_xi,The Tap Room XI,Lorelei,Heart-Luring Wave Lorelei|Songbound Shore Lorelei|Sapphire Current Lorelei|Echo of the Cliff Lorelei,5,unlocked:Master Brewer,,,A side that only turns up once you know your way around a barrel.,PROOF that Requires works here too: this team cannot be drawn until you take the Master Brewer talent.\n", "Training": "ID,Name,Kind,Section,Needs,Cost,Currency,Effect,Notes\nausbildung_keeper,Keeper's Ausbildung,ausbildung,,unlocked:Training Ground,120,coins,count:tune_keeper_stamina_base+3,\"AUSBILDUNG IS A TRAINING A PLAYER TAKES. Kind = ausbildung. Effect is the ordinary effects language, so count:tune_<any Tuning row>+n trains a number and unlock:x trains a thing.\"\nausbildung_legs,Long Legs,ausbildung,,unlocked:Training Ground,90,coins,count:tune_unit_chase_speed+8,Everyone runs at a loose ball harder. The same dial the Relentless talent moves - two doors to one room is fine.\nausbildung_nerve,Cold Nerve,ausbildung,,count:matches_played>=10,140,coins,count:tune_shot_stamina_bite-0.05,A shot takes less off your keeper. NOTE the minus: an Effect may take away as well as give.\nmini_malthouse,The Turning Floor,minigame,malthouse,unlocked:Malthouse,200,coins,count:batches_malthouse+1,A MINI-GAME AUTOMATES A BREWERY SECTION. Kind = minigame and Section names a row of BrewerySections.csv. What it gives today is a VAT - count:batches_<section>+1 - which is the foundation the played mini-game will sit on top of later.\nmini_mill,The Hammer Rhythm,minigame,mill,unlocked:Mill,200,coins,count:batches_mill+1,The second of the five.\nmini_lautering,The Slow Run-Off,minigame,lautering,unlocked:Lautering,220,coins,count:batches_lautering+1,The third.\nmini_boiling,The Turning Circles,minigame,boiling,unlocked:Boiling,260,coins,count:batches_boiling+1,\"The fourth, and the one you described: circles that all have to turn the same way round. Today it buys a copper; the game goes on top.\"\nmini_cellar,The Cellar Watch,minigame,cooling,unlocked:Cooling,300,coins,count:batches_cooling+1,\"The fifth. tools/brewery_check.gd measures this one as worth the most - one vat is 24 bottles a season, two is 48.\"\nbrewer_apprentice,The Brewer's Apprenticeship,brewer,,unlocked:Training Ground,40,coins,,\"ROUND AN (Anthony: Brew Players are trained here to be ONLY brewers). Kind = brewer. One of your own players (a recruit) is trained as a brewer for Cost: from then on he works the Brewery machines and never plays a match or an Adventure again. His POWER becomes his EFFICIENCY - his % of success at a machine, data/Brewers.csv. Effect stays blank; the training IS the effect\"\nrole_match,Match Player,match_player,,unlocked:Training Ground,20,coins,,\"ROUND AN (Anthony, 8 Oct: new player units are trained as Adventure Player, Match Player or Brewer Player, with a separate Adventure Team and Match Team). Kind = match_player. One of your players is trained to play MATCHES: from then on only your Match Teams take him. Cost is what the training costs, every time you switch a player. See src/core/player_roles.gd\"\nrole_adventure,Adventure Player,adventure_player,,unlocked:Training Ground,20,coins,,Kind = adventure_player. One of your players is trained for ADVENTURES: from then on only your Adventure Teams take him. Delete this row and nobody can be an Adventure Player\nquereinsteiger,Quereinsteiger,retrain,,unlocked:Quereinsteiger,200,coins,,\"ROUND AN (Anthony, 8 Oct: once you pick someone for a role that is stuck, until the player unlocks Quereinsteiger, which then lets you put in a player unit and retrain him for a high fee). Kind = retrain. A player who has a role (Match, Adventure or Brewer) keeps it for good. Once Needs is met (the Quereinsteiger achievement, Achievements.csv) the Training Ground retrains any of them into any other role for THIS Cost instead of the role's own price - a Brewer can take his apron off again. Delete this row and a role is never changed. Untrained players still pay only the role's own price. Tuning.csv role_lock = false lets everybody switch freely at the role's price, as before\"\n", "Trophies": "ID,Name,Competition,Won When,Art,Notes\ncounty_cup,The Kesselgrund Cup,county_league,unlocked:The Cup,trophy_cup.png,\"WON WHEN is the ordinary condition language. The Cup is handed out by the last row of Season.csv - see its On Win column - so nothing here had to know how a season ends.\"\nthe_crown,The Crown,,unlocked:The Crown,trophy_crown.png,A competition on the season shelf. Granted by the the_crown achievement at eight wins.\ntreble,The Treble,,count:matches_won>=3,trophy_treble.png,\"A trophy does NOT have to come from a competition. This one is three wins, which makes it the row to copy for anything you want on the shelf early.\"\nclean_season,The Clean Sheet Shield,,count:clean_sheets>=5,trophy_shield.png,Five clean sheets. Shares its condition with the second_vat achievement on purpose - one act can be worth two things.\nchampions,The Championship,county_league,flag:season_won,trophy_league.png,The season itself. flag:season_won is set when a season is finished as a winner.\n", "Upgrades": "ID,Name,Kind,Description,Achievement,Needs,Cost,Currency,Effect,Notes\nsecond_vat,A Second Vat,upgrade,A second lagering vat for the Cooling cellar.,second_vat,,250,coins,count:batches_cooling+1,\"ROUND AN (Anthony: an achievement only grants the RIGHT to buy an upgrade; you buy it at the Club House). ONE ROW PER UPGRADE. Achievement = the ID of a row of data/Achievements.csv - once that achievement is earned the upgrade is for sale. Blank = for sale from the start. Needs = any extra condition in the usual language (unlocked:x, count:x>=n). Cost and Currency use data/Currencies.csv. Effect is the ordinary effects language: count:batches_<section>+1 is a Brewery vat, count:tune_<any Tuning row>+n raises a number, unlock:x opens a thing. Each upgrade is bought once. WAS a free Reward on the A Second Vat achievement KIND (round AN): upgrade or key - the Club House lists the keys first, under KEYS.\"\nthird_vat,A Third Vat,upgrade,A third lagering vat for the Cooling cellar.,third_vat,,450,coins,count:batches_cooling+1,WAS a free Reward on the A Third Vat achievement.\nfeather_beds,Feather Beds,upgrade,Proper beds in the Dorms. Every player rests one fixture less (never less than one).,ten_matches,,300,coins,count:tune_rest_less+1,Raises rest_less in Tuning.csv by 1. Copy this row (with another Achievement) for a second step.\nphysio_table,The Physio's Table,upgrade,Every player starts an Adventure with one more stamina.,hard_man,,180,coins,count:tune_adventure_stamina_base+1,Raises adventure_stamina_base in Tuning.csv by 1.
